<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: #1a1e2b; min-height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; font-family: system-ui, 'Segoe UI', sans-serif;
            padding: clamp(0.5rem, 3vw, 1.5rem);
        }
        .top-bar {
            width: 100%; max-width: 1000px; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 1rem; padding: 0 0.5rem;
        }
        .back-btn { color: #aab3cd; text-decoration: none; font-size: 0.95rem; }
        .back-btn:hover { color: #fff; }
        .category-title { color: #fff; font-weight: 600; font-size: 1.1rem; }

        .slider-container {
            width: 100%; max-width: 1000px; background: #0f1219; border-radius: clamp(1rem, 3vw, 2rem);
            padding: clamp(0.75rem, 2.5vw, 1.5rem); box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column;
        }

        .slider-viewport {
            overflow: hidden; border-radius: clamp(0.75rem, 2vw, 1.25rem);
            background: #1e2330; width: 100%; position: relative;
        }

        .slider-track {
            display: flex; transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); will-change: transform;
        }

        .slide {
            flex: 0 0 100%; display: flex; align-items: center; justify-content: center;
            padding: clamp(0.4rem, 1.5vw, 0.75rem);
        }

        .slide img {
            display: block; width: 100%; height: auto; max-height: min(460px, 60vh);
            object-fit: cover; border-radius: clamp(0.5rem, 1.5vw, 1rem);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5); background: #151a24;
            user-select: none; -webkit-user-drag: none;
        }

        .slider-nav {
            display: flex; justify-content: center; align-items: center;
            gap: clamp(0.75rem, 3vw, 1.5rem); margin-top: clamp(0.75rem, 2vw, 1.25rem); margin-bottom: 0.5rem;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
            color: #eef2f8; width: clamp(2.4rem, 6vw, 3rem); height: clamp(2.4rem, 6vw, 3rem);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: clamp(1.2rem, 4vw, 1.8rem); cursor: pointer; transition: all 0.2s ease; flex-shrink: 0;
        }
        .nav-btn:hover { background: #4f7cff; border-color: #4f7cff; color: white; }

        .page-indicator {
            color: #aab3cd; font-size: clamp(0.9rem, 2.8vw, 1.1rem); font-weight: 500;
            background: rgba(0, 0, 0, 0.35); padding: 0.4em 1em; border-radius: 3rem; min-width: 4.5em; text-align: center;
        }

        .dots { display: flex; justify-content: center; gap: clamp(0.5rem, 2vw, 0.8rem); margin-top: 0.5rem; flex-wrap: wrap; }
        .dot {
            width: clamp(8px, 2vw, 10px); height: clamp(8px, 2vw, 10px); border-radius: 50%;
            background: rgba(255, 255, 255, 0.2); border: none; cursor: pointer; transition: all 0.25s ease;
        }
        .dot.active { background: #4f7cff; transform: scale(1.4); box-shadow: 0 0 12px #4f7cff; }

        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #aab3cd; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../index.html" class="back-btn">← 返回目录</a>
        <div class="category-title" id="categoryTitle">加载中...</div>
        <div style="width: 70px;"></div>
    </div>

    <div class="slider-container">
        <div class="slider-viewport" id="sliderViewport">
            <div class="loading" id="loadingText">正在读取图片...</div>
            <div class="slider-track" id="sliderTrack"></div>
        </div>

        <div class="slider-nav">
            <button class="nav-btn" id="prevBtn">←</button>
            <span class="page-indicator" id="pageIndicator">0 / 0</span>
            <button class="nav-btn" id="nextBtn">→</button>
        </div>

        <div class="dots" id="dotsContainer"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getStorage, ref, listAll, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // 🚨 你的 Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyBCkb5eDLElnQZ8Pt3Ud5euOmdkCo4QxqM",
            authDomain: "my-gallery-43e8a.firebaseapp.com",
            projectId: "my-gallery-43e8a",
            storageBucket: "my-gallery-43e8a.firebasestorage.app",
            messagingSenderId: "616009345293",
            appId: "1:616009345293:web:a61335e41cd7158014a844",
            measurementId: "G-47Q10H9FM3"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);

        // DOM 元素
        const track = document.getElementById('sliderTrack');
        const viewport = document.getElementById('sliderViewport');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageIndicator = document.getElementById('pageIndicator');
        const dotsContainer = document.getElementById('dotsContainer');
        const categoryTitle = document.getElementById('categoryTitle');
        const loadingText = document.getElementById('loadingText');

        // 获取网址参数
        const urlParams = new URLSearchParams(window.location.search);
        const currentCategory = urlParams.get('category') || '1';

        // 标题映射
        const categoryTitles = {
            "1": "第一目录", "2": "第二目录", "3": "第三目录", "4": "第四目录", "5": "第五目录"
        };
        categoryTitle.textContent = categoryTitles[currentCategory] || `目录 ${currentCategory}`;

        let currentIndex = 0;
        let slideWidth = 0;
        let totalSlides = 0;

        // 从 Firebase 抓取
        async function fetchImages() {
            try {
                const folderRef = ref(storage, currentCategory); 
                const result = await listAll(folderRef);
                
                // 按文件名排序，保证顺序稳定
                const sortedItems = result.items.sort((a, b) => a.name.localeCompare(b.name));

                const urls = await Promise.all(sortedItems.map(item => getDownloadURL(item)));
                
                loadingText.style.display = 'none';
                if (urls.length === 0) {
                    loadingText.textContent = "该目录下暂无图片";
                    loadingText.style.display = 'block';
                    return;
                }
                renderImages(urls);
            } catch (error) {
                console.error(error);
                loadingText.textContent = "加载失败，请检查网络或规则";
            }
        }

        function renderImages(urls) {
            track.innerHTML = '';
            totalSlides = urls.length;
            urls.forEach((src, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                const img = document.createElement('img');
                img.src = src; 
                img.loading = 'lazy';
                img.onload = () => requestAnimationFrame(measureAndUpdate);
                slide.appendChild(img);
                track.appendChild(slide);
            });
            createDots();
            measureAndUpdate();
        }

        function createDots() {
            dotsContainer.innerHTML = '';
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('button');
                dot.className = `dot ${i === currentIndex ? 'active' : ''}`;
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            }
        }

        function updateSlider() {
            if (totalSlides === 0) return;
            const offset = -currentIndex * slideWidth;
            track.style.transform = `translateX(${offset}px)`;
            pageIndicator.textContent = `${currentIndex + 1} / ${totalSlides}`;
            const dots = dotsContainer.querySelectorAll('.dot');
            dots.forEach((dot, idx) => dot.classList.toggle('active', idx === currentIndex));
            prevBtn.style.display = totalSlides > 1 ? 'flex' : 'none';
            nextBtn.style.display = totalSlides > 1 ? 'flex' : 'none';
        }

        function measureAndUpdate() {
            if (viewport) slideWidth = viewport.clientWidth;
            updateSlider();
        }

        function goToSlide(index) {
            if (index < 0) currentIndex = totalSlides - 1;
            else if (index >= totalSlides) currentIndex = 0;
            else currentIndex = index;
            updateSlider();
        }

        // 初始化
        fetchImages();
        prevBtn.addEventListener('click', () => goToSlide(currentIndex - 1));
        nextBtn.addEventListener('click', () => goToSlide(currentIndex + 1));
        window.addEventListener('resize', () => requestAnimationFrame(measureAndUpdate));
        if (window.ResizeObserver) {
            new ResizeObserver(() => requestAnimationFrame(measureAndUpdate)).observe(viewport);
        }
    </script>
</body>
</html>
