<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/jpeg" href="logo.png">
    <title>gallery</title>
    <style>
        /* 全局重置与基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background: #1a1e2b;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            padding: clamp(0.5rem, 3vw, 1.5rem);
        }

        /* 主布局：左侧图片 + 右侧目录 */
        .main-layout {
            width: 100%;
            max-width: 1200px; /* 稍微放宽以适应右侧目录 */
            display: flex;
            gap: 1.5rem;
            align-items: stretch;
        }

        /* 卡片式容器 —— 宽度自适应 */
        .slider-container {
            flex: 1; /* 占据左侧剩余空间 */
            background: #0f1219;
            border-radius: clamp(1rem, 3vw, 2rem);
            padding: clamp(0.75rem, 2.5vw, 1.5rem) clamp(0.75rem, 2.5vw, 1.5rem) clamp(0.5rem, 1.5vw, 1rem);
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
        }

        /* 右侧目录栏 */
        .sidebar-catalog {
            width: 220px;
            flex-shrink: 0;
            background: #0f1219;
            border-radius: clamp(1rem, 3vw, 2rem);
            padding: 1.25rem 1rem;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .sidebar-title {
            color: #aab3cd;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            padding-left: 0.5rem;
        }

        /* 目录格子 */
        .catalog-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1rem;
            padding: 1rem;
            color: #c0caf5;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .catalog-item:hover {
            background: rgba(79, 124, 255, 0.15);
            border-color: rgba(79, 124, 255, 0.3);
            color: #fff;
            transform: translateX(4px);
        }

        .catalog-item.active {
            background: #4f7cff;
            border-color: #4f7cff;
            color: white;
            box-shadow: 0 8px 18px -6px #4f7cff;
        }

        /* 目录内的序号 */
        .catalog-num {
            font-family: monospace;
            font-size: 0.85rem;
            background: rgba(0, 0, 0, 0.25);
            padding: 0.2rem 0.5rem;
            border-radius: 0.5rem;
            margin-right: 0.75rem;
            color: #aab3cd;
            transition: all 0.25s;
        }

        .catalog-item.active .catalog-num {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* 滑动视口 */
        .slider-viewport {
            overflow: hidden;
            border-radius: clamp(0.75rem, 2vw, 1.25rem);
            background: #1e2330;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
            width: 100%;
        }

        /* 滑动轨道 */
        .slider-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        /* 每一张幻灯片 */
        .slide {
            flex: 0 0 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(0.4rem, 1.5vw, 0.75rem);
        }

        /* 图片自适应 */
        .slide img {
            display: block;
            width: 100%;
            height: auto;
            max-height: min(460px, 60vh);
            object-fit: cover;
            border-radius: clamp(0.5rem, 1.5vw, 1rem);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5);
            user-select: none;
            -webkit-user-drag: none;
        }

        /* 导航按钮容器 */
        .slider-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(0.75rem, 3vw, 1.5rem);
            margin-top: clamp(0.75rem, 2vw, 1.25rem);
            margin-bottom: clamp(0.25rem, 1vw, 0.5rem);
        }

        /* 按钮样式 */
        .nav-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #eef2f8;
            width: clamp(2.4rem, 6vw, 3rem);
            height: clamp(2.4rem, 6vw, 3rem);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 300;
            line-height: 1;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            flex-shrink: 0;
        }

        .nav-btn:hover {
            background: #4f7cff;
            border-color: #4f7cff;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 8px 18px -6px #4f7cff;
        }

        /* 页码指示器 */
        .page-indicator {
            color: #aab3cd;
            font-size: clamp(0.9rem, 2.8vw, 1.1rem);
            font-weight: 500;
            background: rgba(0, 0, 0, 0.35);
            padding: 0.4em 1em;
            border-radius: 3rem;
            min-width: 4.5em;
            text-align: center;
        }

        /* 底部圆点 */
        .dots {
            display: flex;
            justify-content: center;
            gap: clamp(0.5rem, 2vw, 0.8rem);
            margin-top: 0.5rem;
            padding: 0.5rem 0 0.2rem;
            flex-wrap: wrap;
        }

        .dot {
            width: clamp(8px, 2vw, 10px);
            height: clamp(8px, 2vw, 10px);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .dot.active {
            background: #4f7cff;
            transform: scale(1.4);
            box-shadow: 0 0 12px #4f7cff;
        }

        /* 提示文字 */
        .hint {
            margin-top: 0.75rem;
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            color: #6b7a9c;
            text-align: center;
        }

        /* 针对移动端的响应式调整 */
        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column; /* 窄屏下改为上下结构 */
                gap: 1rem;
            }
            .sidebar-catalog {
                width: 100%;
                flex-direction: row; /* 目录横排 */
                overflow-x: auto;    /* 可以横向滑动 */
                padding: 0.8rem;
                gap: 0.6rem;
                border-radius: 1.25rem;
            }
            .sidebar-title {
                display: none; /* 移动端隐藏标题节省空间 */
            }
            .catalog-item {
                padding: 0.6rem 1rem;
                white-space: nowrap; /* 确保文字不换行 */
                font-size: 0.85rem;
            }
            .catalog-item:hover {
                transform: translateY(-2px); /* 移动端悬停改成向上小浮动 */
            }
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <!-- 左侧：轮播主容器 -->
        <div class="slider-container">
            <div class="slider-viewport" id="sliderViewport">
                <div class="slider-track" id="sliderTrack">
                    <div class="slide">
                        <img src="https://picsum.photos/id/1015/1000/600" alt="山间河流" loading="lazy">
                    </div>
                    <div class="slide">
                        <img src="https://picsum.photos/id/1043/1000/600" alt="森林小径" loading="lazy">
                    </div>
                    <div class="slide">
                        <img src="https://picsum.photos/id/1074/1000/600" alt="雾中湖泊" loading="lazy">
                    </div>
                    <div class="slide">
                        <img src="https://picsum.photos/id/1067/1000/600" alt="金色田野" loading="lazy">
                    </div>
                    <!-- 补充第5张，因为你说需要5格对应 -->
                    <div class="slide">
                        <img src="https://picsum.photos/id/1039/1000/600" alt="瀑布流水" loading="lazy">
                    </div>
                </div>
            </div>

            <div class="slider-nav">
                <button class="nav-btn" id="prevBtn" aria-label="上一张">←</button>
                <span class="page-indicator" id="pageIndicator">1 / 5</span>
                <button class="nav-btn" id="nextBtn" aria-label="下一张">→</button>
            </div>

            <div class="dots" id="dotsContainer"></div>
            <div class="hint">Gallery Viewer</div>
        </div>

        <!-- 右侧：目录菜单（5格） -->
        <div class="sidebar-catalog">
            <div class="sidebar-title">目录导航</div>
            <!-- 这里的内容由JS动态生成，以自动对应图片 -->
            <div id="catalogContainer" style="display: flex; flex-direction: column; gap: 0.8rem; width: 100%;"></div>
        </div>
    </div>

    <script>
        (function() {
            const track = document.getElementById('sliderTrack');
            const slides = track.querySelectorAll('.slide');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pageIndicator = document.getElementById('pageIndicator');
            const dotsContainer = document.getElementById('dotsContainer');
            const viewport = document.getElementById('sliderViewport');
            const catalogContainer = document.getElementById('catalogContainer');

            // 预定义的目录名称，与你的5张图片一一对应
            const catalogNames = ["山间河流", "森林小径", "雾中湖泊", "金色田野", "瀑布流水"];

            const totalSlides = slides.length;
            let currentIndex = 0;
            let slideWidth = 0;

            // 更新位移和UI
            function updateSlider() {
                const offset = -currentIndex * slideWidth;
                track.style.transform = `translateX(${offset}px)`;
                pageIndicator.textContent = `${currentIndex + 1} / ${totalSlides}`;

                // 更新圆点状态
                const dots = dotsContainer.querySelectorAll('.dot');
                dots.forEach((dot, idx) => {
                    dot.classList.toggle('active', idx === currentIndex);
                });

                // 更新右侧目录的高亮状态
                const catalogItems = catalogContainer.querySelectorAll('.catalog-item');
                catalogItems.forEach((item, idx) => {
                    item.classList.toggle('active', idx === currentIndex);
                });
            }

            // 测量视口宽度并更新
            function measureAndUpdate() {
                if (viewport) {
                    slideWidth = viewport.clientWidth;
                }
                if (slideWidth === 0 && slides[0]) {
                    slideWidth = slides[0].clientWidth;
                }
                updateSlider();
            }

            // 跳转到指定索引（循环）
            function goToSlide(index) {
                if (index < 0) {
                    currentIndex = totalSlides - 1;
                } else if (index >= totalSlides) {
                    currentIndex = 0;
                } else {
                    currentIndex = index;
                }
                updateSlider();
            }

            function prevSlide() { goToSlide(currentIndex - 1); }
            function nextSlide() { goToSlide(currentIndex + 1); }

            // 创建底部圆点
            function createDots() {
                dotsContainer.innerHTML = '';
                for (let i = 0; i < totalSlides; i++) {
                    const dot = document.createElement('button');
                    dot.classList.add('dot');
                    if (i === currentIndex) dot.classList.add('active');
                    dot.addEventListener('click', () => goToSlide(i));
                    dotsContainer.appendChild(dot);
                }
            }

            // 创建右侧目录列表
            function createCatalog() {
                catalogContainer.innerHTML = '';
                // 遍历幻灯片，根据数量生成对应的目录格子
                for (let i = 0; i < totalSlides; i++) {
                    const item = document.createElement('div');
                    item.classList.add('catalog-item');
                    if (i === currentIndex) item.classList.add('active');

                    // 获取名称（防越界处理）
                    const imgName = catalogNames[i] || `图片 ${i + 1}`;

                    // 组装内部结构
                    item.innerHTML = `
                        <span class="catalog-num">0${i + 1}</span>
                        <span>${imgName}</span>
                    `;

                    // 点击目录切换到对应图片
                    item.addEventListener('click', () => goToSlide(i));
                    catalogContainer.appendChild(item);
                }
            }

            // 初始化
            function init() {
                createDots();
                createCatalog(); // 初始化右侧目录
                measureAndUpdate();

                prevBtn.addEventListener('click', prevSlide);
                nextBtn.addEventListener('click', nextSlide);

                window.addEventListener('resize', () => {
                    requestAnimationFrame(() => measureAndUpdate());
                });

                if (window.ResizeObserver) {
                    const resizeObserver = new ResizeObserver(() => {
                        requestAnimationFrame(() => measureAndUpdate());
                    });
                    resizeObserver.observe(viewport);
                }

                window.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') {
                        prevSlide();
                        e.preventDefault();
                    } else if (e.key === 'ArrowRight') {
                        nextSlide();
                        e.preventDefault();
                    }
                });

                const images = track.querySelectorAll('img');
                images.forEach(img => {
                    if (img.complete) {
                        requestAnimationFrame(() => measureAndUpdate());
                    } else {
                        img.addEventListener('load', () => {
                            requestAnimationFrame(() => measureAndUpdate());
                        });
                        img.addEventListener('error', () => {
                            requestAnimationFrame(() => measureAndUpdate());
                        });
                    }
                });

                window.addEventListener('load', () => {
                    measureAndUpdate();
                });
            }

            init();
        })();
    </script>
</body>
</html>
