<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gallery Viewer</title>
    <style>
        /* 全局重置与基础样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; } /* 锁定页面高度，禁止外层滚动 */
        body {
            background-color: #0d1117; /* 极其深邃的底色 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航栏 - 玻璃拟态 */
        .top-nav {
            width: 100%;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
            flex-shrink: 0;
        }

        .nav-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
        }

        /* 顶部目录切换按钮 */
        .cat-tabs {
            display: flex;
            gap: 0.5rem;
        }

        .cat-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #8b949e;
            padding: 0.4rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .cat-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .cat-btn.active {
            color: #58a6ff; /* 科技蓝 */
            background: rgba(88, 166, 255, 0.1);
            border-color: rgba(88, 166, 255, 0.2);
        }

        /* 主体展示区 */
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            min-height: 0; /* 关键，防止子元素撑破 flex 容器 */
        }

        /* 图片轮播框 */
        .slider-viewport {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            background: #161b22;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .slider-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        .slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* 核心图片样式：保证完整显示 */
        .slide img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 0.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            user-select: none;
            -webkit-user-drag: none;
        }

        /* 左右切换按钮 */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(13, 17, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            color: #ffffff;
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 10;
        }

        .nav-btn:hover {
            background: rgba(88, 166, 255, 0.2);
            border-color: rgba(88, 166, 255, 0.5);
            color: #58a6ff;
        }

        .prev-btn { left: 2rem; }
        .next-btn { right: 2rem; }

        /* 底部信息栏 */
        .bottom-bar {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 10;
        }

        .page-indicator {
            font-size: 0.9rem;
            font-family: monospace;
            color: #8b949e;
            min-width: 3.5em;
            text-align: center;
        }

        .dots { display: flex; gap: 0.5rem; align-items: center; }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            padding: 0;
        }
        .dot.active {
            background: #58a6ff;
            box-shadow: 0 0 8px rgba(88, 166, 255, 0.6);
            transform: scale(1.3);
        }

        .loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #8b949e;
            font-size: 0.9rem;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .top-nav { padding: 0.8rem; flex-direction: column; gap: 0.8rem; }
            .cat-tabs { width: 100%; overflow-x: auto; justify-content: flex-start; padding-bottom: 0.2rem; }
            .cat-tabs::-webkit-scrollbar { display: none; }
            .cat-btn { white-space: nowrap; }
            .slide { padding: 0.5rem; }
            .prev-btn { left: 0.5rem; width: 2.4rem; height: 2.4rem; }
            .next-btn { right: 0.5rem; width: 2.4rem; height: 2.4rem; }
            .bottom-bar { bottom: 1rem; padding: 0.4rem 1rem; gap: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <div class="top-nav">
        <div class="nav-title">GALLERY</div>
        <div class="cat-tabs" id="topBar">
            <button class="cat-btn active" data-cat="1">目录 01</button>
            <button class="cat-btn" data-cat="2">目录 02</button>
            <button class="cat-btn" data-cat="3">目录 03</button>
            <button class="cat-btn" data-cat="4">目录 04</button>
            <button class="cat-btn" data-cat="5">目录 05</button>
        </div>
    </div>

    <!-- 主体轮播区 -->
    <div class="main-container">
        <div class="slider-viewport" id="sliderViewport">
            <div class="loading" id="loadingText">READING DATA...</div>
            <div class="slider-track" id="sliderTrack"></div>
            
            <button class="nav-btn prev-btn" id="prevBtn">←</button>
            <button class="nav-btn next-btn" id="nextBtn">→</button>

            <div class="bottom-bar">
                <span class="page-indicator" id="pageIndicator">0 / 0</span>
                <div class="dots" id="dotsContainer"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getStorage, ref, listAll, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCkb5eDLElnQZ8Pt3Ud5euOmdkCo4QxqM",
            authDomain: "my-gallery-43e8a.firebaseapp.com",
            projectId: "my-gallery-43e8a",
            storageBucket: "my-gallery-43e8a.firebasestorage.app",
            messagingSenderId: "616009345293",
            appId: "1:616009345293:web:a61335e41cd7158014a844",
            measurementId: "G-47Q10H9FM3"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);

        const track = document.getElementById('sliderTrack');
        const viewport = document.getElementById('sliderViewport');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageIndicator = document.getElementById('pageIndicator');
        const dotsContainer = document.getElementById('dotsContainer');
        const loadingText = document.getElementById('loadingText');
        const topBar = document.getElementById('topBar');

        let currentIndex = 0;
        let slideWidth = 0;
        let totalSlides = 0;
        let currentCategory = '1';

        topBar.addEventListener('click', (e) => {
            if (e.target.classList.contains('cat-btn')) {
                document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                
                currentCategory = e.target.dataset.cat;
                currentIndex = 0;
                track.innerHTML = ''; 
                loadingText.style.display = 'block';
                fetchImages();
            }
        });

        async function fetchImages() {
            try {
                const folderRef = ref(storage, currentCategory); 
                const result = await listAll(folderRef);
                const sortedItems = result.items.sort((a, b) => a.name.localeCompare(b.name));
                const urls = await Promise.all(sortedItems.map(item => getDownloadURL(item)));
                
                loadingText.style.display = 'none';
                if (urls.length === 0) {
                    loadingText.textContent = "暂无图片";
                    loadingText.style.display = 'block';
                    totalSlides = 0;
                    updateSlider();
                    dotsContainer.innerHTML = '';
                    return;
                }
                renderImages(urls);
            } catch (error) {
                console.error(error);
                loadingText.textContent = "加载失败";
            }
        }

        function renderImages(urls) {
            track.innerHTML = '';
            totalSlides = urls.length;
            urls.forEach((src) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                const img = document.createElement('img');
                img.src = src; 
                img.loading = 'lazy';
                img.onload = () => requestAnimationFrame(measureAndUpdate);
                slide.appendChild(img);
                track.appendChild(slide);
            });
            createDots();
            measureAndUpdate();
        }

        function createDots() {
            dotsContainer.innerHTML = '';
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('button');
                dot.className = `dot ${i === currentIndex ? 'active' : ''}`;
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            }
        }

        function updateSlider() {
            if (totalSlides === 0) {
                pageIndicator.textContent = `0 / 0`;
                track.style.transform = `translateX(0px)`;
                return;
            }
            const offset = -currentIndex * slideWidth;
            track.style.transform = `translateX(${offset}px)`;
            pageIndicator.textContent = `${currentIndex + 1} / ${totalSlides}`;
            const dots = dotsContainer.querySelectorAll('.dot');
            dots.forEach((dot, idx) => dot.classList.toggle('active', idx === currentIndex));
            
            // 只有一张图时隐藏按钮
            const showNav = totalSlides > 1;
            prevBtn.style.display = showNav ? 'flex' : 'none';
            nextBtn.style.display = showNav ? 'flex' : 'none';
        }

        function measureAndUpdate() {
            if (viewport) slideWidth = viewport.clientWidth;
            updateSlider();
        }

        function goToSlide(index) {
            if (totalSlides === 0) return;
            if (index < 0) currentIndex = totalSlides - 1;
            else if (index >= totalSlides) currentIndex = 0;
            else currentIndex = index;
            updateSlider();
        }

        fetchImages();
        prevBtn.addEventListener('click', () => goToSlide(currentIndex - 1));
        nextBtn.addEventListener('click', () => goToSlide(currentIndex + 1));
        window.addEventListener('resize', () => requestAnimationFrame(measureAndUpdate));
        if (window.ResizeObserver) {
            new ResizeObserver(() => requestAnimationFrame(measureAndUpdate)).observe(viewport);
        }
    </script>
</body>
</html>
