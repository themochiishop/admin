<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" href="logo.png">
  <title>Gallery Viewer</title>
  <!-- 🔐 权限检查：没登录或没有「图库 › 查看前台」权限会跳回控制台 -->
  <script type="module">import { guard } from "/js/admin-guard.js"; guard("gallery.view");</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; overflow: hidden; background: #0d1117; color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .app { display: flex; flex-direction: column; height: 100%; }
    .top { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: rgba(13,17,23,.85); border-bottom: 1px solid rgba(255,255,255,.06); flex: none; }
    .title { font-size: 1.05rem; font-weight: 600; color: #fff; letter-spacing: 1px; white-space: nowrap; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { background: transparent; border: 1px solid transparent; color: #8b949e; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: .9rem; white-space: nowrap; font-family: inherit; }
    .tab:hover { color: #fff; background: rgba(255,255,255,.05); }
    .tab.on { color: #58a6ff; background: rgba(88,166,255,.1); border-color: rgba(88,166,255,.25); }
    .tab small { opacity: .6; margin-left: 4px; }
    .live-btn { background: #da3633; color: #fff; border: 0; border-radius: 8px; padding: 7px 12px; font-size: .85rem; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: inherit; }
    .live-btn:hover { background: #f85149; }

    .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 14px 14px 10px; gap: 10px; }
    .viewport { position: relative; width: 100%; max-width: 1200px; flex: 1; min-height: 0; background: #161b22; border-radius: 14px; overflow: hidden; touch-action: pan-y; user-select: none; }
    .track { display: flex; height: 100%; transition: transform .35s ease; will-change: transform; }
    .track.dragging { transition: none; }
    .slide { flex: 0 0 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 10px; }
    .slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; -webkit-user-drag: none; }
    .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.12);
      background: rgba(13,17,23,.6); color: #fff; font-size: 1.3rem; cursor: pointer; z-index: 3; display: flex; align-items: center; justify-content: center; }
    .nav:hover { background: rgba(88,166,255,.35); }
    .nav.prev { left: 12px; } .nav.next { right: 12px; }
    .idx { position: absolute; top: 10px; right: 12px; background: rgba(13,17,23,.7); color: #fff; font-size: .8rem; padding: 3px 10px; border-radius: 999px; z-index: 3; }
    .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8b949e; font-size: .95rem; text-align: center; padding: 20px; line-height: 1.7; }
    .cap { min-height: 1.5em; font-size: 1rem; color: #e6edf3; text-align: center; max-width: 1200px; }
    .strip { display: flex; gap: 6px; overflow-x: auto; max-width: 1200px; width: 100%; padding: 2px 2px 6px; scrollbar-width: thin; flex: none; }
    .strip button { flex: none; width: 54px; height: 54px; border-radius: 8px; overflow: hidden; border: 2px solid transparent; padding: 0; background: #21262d; cursor: pointer; opacity: .55; }
    .strip button.on { border-color: #58a6ff; opacity: 1; }
    .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* 🎥 直播模式：全屏，只剩图片 */
    body.live .top, body.live .strip { display: none; }
    body.live .stage { padding: 0; gap: 0; background: #000; }
    body.live .viewport { max-width: none; border-radius: 0; background: #000; }
    body.live .slide { padding: 0; }
    body.live .slide img { border-radius: 0; }
    body.live .nav { opacity: 0; }
    body.live .nav:hover { opacity: 1; }
    body.live .cap { position: fixed; left: 0; right: 0; bottom: 18px; max-width: none; text-shadow: 0 2px 8px rgba(0,0,0,.9); font-size: 1.3rem; z-index: 4; pointer-events: none; }
    .live-exit { display: none; position: fixed; top: 12px; left: 12px; z-index: 5; background: rgba(0,0,0,.5); color: #fff; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 6px 12px; font-size: .8rem; cursor: pointer; opacity: .35; font-family: inherit; }
    .live-exit:hover { opacity: 1; }
    body.live .live-exit { display: block; }
    /* 直播模式：点画面左边三分之一 = 上一张，右边 = 下一张 */
    .tapzone { display: none; position: absolute; top: 0; bottom: 0; width: 33%; z-index: 2; cursor: pointer; }
    body.live .tapzone { display: block; }
    .tapzone.l { left: 0; } .tapzone.r { right: 0; }

    @media (max-width: 640px) {
      .top { padding: 10px 12px; gap: 8px; }
      .title { display: none; }
      .nav { width: 36px; height: 36px; font-size: 1.1rem; }
      .strip button { width: 44px; height: 44px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="title">GALLERY</div>
      <div class="tabs" id="tabs"></div>
      <button class="live-btn" id="liveBtn" title="全屏，只显示图片；左右键或点画面两边翻页">🎥 直播模式</button>
    </div>
    <div class="stage" id="stage">
      <div class="viewport" id="vp">
        <div class="track" id="track"></div>
        <button class="nav prev" id="prev" aria-label="上一张">‹</button>
        <button class="nav next" id="next" aria-label="下一张">›</button>
        <div class="tapzone l" id="tapL"></div>
        <div class="tapzone r" id="tapR"></div>
        <div class="idx" id="idx">0 / 0</div>
        <div class="msg" id="msg">载入中…</div>
      </div>
      <div class="cap" id="cap"></div>
      <div class="strip" id="strip"></div>
    </div>
  </div>
  <button class="live-exit" id="liveExit">✕ 离开直播模式（Esc）</button>

  <script type="module">
    import { gdb, esc, byOrder } from "./gal.js";
    import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const $ = id => document.getElementById(id);
    const LAST = "mochiiGalleryAlbum";
    let albums = [], list = [], cur = null, idx = 0, unsubPhotos = null, counts = {};

    // ---------- 相册 ----------
    onSnapshot(collection(gdb, "albums"), s => {
      albums = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byOrder);
      if (!albums.length) { showMsg("还没有相册。<br>请到「图库管理」新增相册，或按「📦 整理旧图片」。"); $("tabs").innerHTML = ""; return; }
      let want = cur;
      if (!want) { try { want = localStorage.getItem(LAST); } catch (e) {} }
      if (!albums.some(a => a.id === want)) want = albums[0].id;
      renderTabs();
      if (want !== cur) pick(want);
    }, e => showMsg("读取失败：" + esc(e.message)));

    function renderTabs() {
      $("tabs").innerHTML = albums.map(a => `<button class="tab${a.id === cur ? " on" : ""}" data-id="${esc(a.id)}">${esc(a.name || "未命名")}${counts[a.id] != null ? `<small>${counts[a.id]}</small>` : ""}</button>`).join("");
    }
    $("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b && b.dataset.id !== cur) pick(b.dataset.id); });

    // ---------- 图片（即时更新：后台改了，前台马上跟着变） ----------
    function pick(id) {
      cur = id; idx = 0;
      try { localStorage.setItem(LAST, id); } catch (e) {}
      renderTabs();
      showMsg("载入中…");
      if (unsubPhotos) unsubPhotos();
      unsubPhotos = onSnapshot(query(collection(gdb, "photos"), where("album", "==", id)), s => {
        const keepId = list[idx] && list[idx].id;
        list = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.album === id && !p.hidden).sort(byOrder);
        counts[id] = list.length; renderTabs();
        const k = list.findIndex(p => p.id === keepId);
        idx = k >= 0 ? k : Math.min(idx, Math.max(0, list.length - 1));
        renderSlides();
      }, e => showMsg("读取失败：" + esc(e.message)));
    }

    function showMsg(html) { $("msg").innerHTML = html; $("msg").hidden = !html; }
    function renderSlides() {
      if (!list.length) {
        $("track").innerHTML = ""; $("strip").innerHTML = ""; $("cap").textContent = "";
        showMsg("这本相册暂无图片"); update(); return;
      }
      showMsg("");
      $("track").innerHTML = list.map((p, i) => `<div class="slide"><img data-src="${esc(p.url)}" alt="" draggable="false"${Math.abs(i - idx) <= 1 ? ` src="${esc(p.url)}"` : ""}></div>`).join("");
      $("strip").innerHTML = list.map((p, i) => `<button data-i="${i}"><img src="${esc(p.thumb || p.url)}" alt="" loading="lazy"></button>`).join("");
      update();
    }
    // 只载入目前这张和前后各一张（加快速度、省流量）
    function loadNear() {
      $("track").querySelectorAll("img").forEach((im, i) => { if (Math.abs(i - idx) <= 1 && !im.getAttribute("src")) im.src = im.dataset.src; });
    }
    function update() {
      const n = list.length;
      $("track").style.transform = `translateX(${-idx * 100}%)`;
      $("idx").textContent = n ? `${idx + 1} / ${n}` : "0 / 0";
      $("prev").hidden = $("next").hidden = n < 2;
      $("cap").textContent = n ? (list[idx].caption || "") : "";
      $("strip").querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === idx));
      const on = $("strip").querySelector("button.on");
      if (on) on.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
      loadNear();
    }
    const go = i => { if (!list.length) return; idx = (i + list.length) % list.length; update(); };
    $("prev").onclick = () => go(idx - 1);
    $("next").onclick = () => go(idx + 1);
    // 刚刚是滑动的话，不要再算一次点击
    let swiped = false;
    $("tapL").onclick = () => { if (!swiped) go(idx - 1); };
    $("tapR").onclick = () => { if (!swiped) go(idx + 1); };
    $("strip").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) go(+b.dataset.i); });
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") go(idx - 1);
      else if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(idx + 1); }
      else if (e.key === "Escape" && document.body.classList.contains("live")) setLive(false);
    });

    // 手指 / 滑鼠左右滑
    let sx = null, dx = 0;
    const vp = $("vp");
    vp.addEventListener("pointerdown", e => { if (e.target.closest(".nav")) return; sx = e.clientX; dx = 0; swiped = false; $("track").classList.add("dragging"); });
    window.addEventListener("pointermove", e => {
      if (sx === null) return;
      dx = e.clientX - sx;
      $("track").style.transform = `translateX(calc(${-idx * 100}% + ${dx}px))`;
    });
    window.addEventListener("pointerup", () => {
      if (sx === null) return;
      $("track").classList.remove("dragging");
      const w = vp.clientWidth || 1;
      sx = null;
      swiped = Math.abs(dx) > 10;
      if (dx > w * 0.15) go(idx - 1); else if (dx < -w * 0.15) go(idx + 1); else update();
    });

    // ---------- 🎥 直播模式 ----------
    function setLive(on) {
      document.body.classList.toggle("live", on);
      const el = document.documentElement;
      try {
        if (on && el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(() => {});
        if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
      } catch (e) {}
    }
    $("liveBtn").onclick = () => setLive(true);
    $("liveExit").onclick = () => setLive(false);
    document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) document.body.classList.remove("live"); });
  </script>
</body>
</html>
