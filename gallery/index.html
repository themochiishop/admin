<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的图片目录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1e2b; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: system-ui, 'Segoe UI', sans-serif; padding: 2rem;
        }
        h1 { color: #fff; margin-bottom: 1rem; font-weight: 500; letter-spacing: 2px; }
        
        /* 上传入口按钮 */
        .upload-entry {
            display: inline-block; margin-bottom: 2.5rem; padding: 0.8rem 2rem;
            background: #4f7cff; color: white; text-decoration: none; border-radius: 2rem;
            font-weight: 600; transition: all 0.2s; box-shadow: 0 5px 15px rgba(79, 124, 255, 0.3);
        }
        .upload-entry:hover { background: #3b62cc; transform: translateY(-2px); }

        .catalog-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem; width: 100%; max-width: 900px;
        }

        .catalog-card {
            background: #0f1219; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 1.5rem; padding: 3rem 1rem; text-align: center;
            color: #c0caf5; text-decoration: none; font-size: 1.2rem; font-weight: 600;
            transition: all 0.3s ease; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
        }
        .catalog-card:hover {
            transform: translateY(-5px); background: #4f7cff; color: white;
            border-color: #4f7cff; box-shadow: 0 15px 30px -10px #4f7cff;
        }
        .catalog-num {
            display: block; font-size: 2.5rem; font-weight: 800;
            color: rgba(255,255,255,0.1); margin-bottom: 1rem; transition: color 0.3s;
        }
        .catalog-card:hover .catalog-num { color: rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <h1>图片展示目录</h1>
    
    <!-- 上传入口 -->
    <a href="gallery/upload.html" class="upload-entry">+ 上传新图片</a>

    <div class="catalog-grid">
        <!-- 跳转到 gallery 文件夹下的 viewer.html -->
        <a href="gallery/viewer.html?category=1" class="catalog-card">
            <span class="catalog-num">01</span>第一目录
        </a>
        <a href="gallery/viewer.html?category=2" class="catalog-card">
            <span class="catalog-num">02</span>第二目录
        </a>
        <a href="gallery/viewer.html?category=3" class="catalog-card">
            <span class="catalog-num">03</span>第三目录
        </a>
        <a href="gallery/viewer.html?category=4" class="catalog-card">
            <span class="catalog-num">04</span>第四目录
        </a>
        <a href="gallery/viewer.html?category=5" class="catalog-card">
            <span class="catalog-num">05</span>第五目录
        </a>
    </div>

</body>
</html>
