<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传图片 - Gallery Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1e2b; min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: system-ui, 'Segoe UI', sans-serif; padding: 2rem;
        }
        
        .upload-container {
            width: 100%; max-width: 600px;
            background: #0f1219; border-radius: 2rem; padding: 2rem;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h2 { color: #fff; margin-bottom: 1.5rem; font-weight: 500; text-align: center; }

        .form-group { margin-bottom: 1.5rem; }
        label { display: block; color: #aab3cd; margin-bottom: 0.5rem; font-size: 0.9rem; }
        
        select {
            width: 100%; padding: 1rem; border-radius: 0.75rem;
            background: #1e2330; color: #fff; border: 1px solid rgba(255,255,255,0.1);
            font-size: 1rem; outline: none; cursor: pointer;
        }
        select:focus { border-color: #4f7cff; }

        /* 拖拽上传区域 */
        .drop-zone {
            border: 2px dashed rgba(255,255,255,0.2); border-radius: 1rem;
            padding: 3rem 1rem; text-align: center; color: #aab3cd;
            cursor: pointer; transition: all 0.3s ease; background: #1e2330;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #4f7cff; background: rgba(79, 124, 255, 0.1); color: #fff;
        }
        .drop-zone input[type="file"] { display: none; }

        /* 上传按钮 */
        .btn-submit {
            width: 100%; padding: 1rem; border-radius: 0.75rem;
            background: #4f7cff; color: white; border: none;
            font-size: 1.1rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s; margin-top: 1rem;
        }
        .btn-submit:hover:not(:disabled) { background: #3b62cc; transform: translateY(-2px); }
        .btn-submit:disabled { background: #333; color: #888; cursor: not-allowed; }

        /* 进度条 */
        .progress-bar {
            width: 100%; height: 8px; background: #1e2330;
            border-radius: 4px; margin-top: 1rem; overflow: hidden; display: none;
        }
        .progress-fill {
            height: 100%; width: 0%; background: #4f7cff; transition: width 0.2s;
        }

        .status-msg { margin-top: 1rem; text-align: center; font-size: 0.9rem; color: #aab3cd; }
        .status-msg.success { color: #4ffb7a; }
        .status-msg.error { color: #ff4f4f; }

        .link-back { display: block; text-align: center; margin-top: 1.5rem; color: #6b7a9c; text-decoration: none; }
        .link-back:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="upload-container">
        <h2>上传新图片</h2>

        <!-- 选择目录 -->
        <div class="form-group">
            <label for="categorySelect">选择保存的目录：</label>
            <select id="categorySelect">
                <option value="nature">自然风光 (nature)</option>
                <option value="city">城市建筑 (city)</option>
                <option value="animal">可爱动物 (animal)</option>
                <option value="food">美食记录 (food)</option>
                <option value="art">艺术设计 (art)</option>
            </select>
        </div>

        <!-- 拖拽区域 -->
        <div class="drop-zone" id="dropZone">
            <input type="file" id="fileInput" accept="image/*" multiple>
            <p>点击选择图片，或将图片拖拽到此处</p>
            <p style="font-size:0.8rem; margin-top:0.5rem; color:#555;">(支持多选)</p>
        </div>

        <!-- 进度条 -->
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- 提交按钮 -->
        <button class="btn-submit" id="uploadBtn" disabled>开始上传</button>

        <!-- 状态提示 -->
        <div class="status-msg" id="statusMsg"></div>

        <a href="index.html" class="link-back">← 返回首页</a>
    </div>

    <!-- 引入 Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ==========================================
        // 🚨 填入你的 Firebase 配置信息
        // ==========================================
        const firebaseConfig = {
            apiKey: "你的_API_KEY",
            authDomain: "你的_PROJECT.firebaseapp.com",
            projectId: "你的_PROJECT_ID",
            storageBucket: "你的_PROJECT.appspot.com",
            messagingSenderId: "你的_SENDER_ID",
            appId: "你的_APP_ID"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);

        // 获取 DOM 元素
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const categorySelect = document.getElementById('categorySelect');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const statusMsg = document.getElementById('statusMsg');

        let selectedFiles = [];

        // ==========================================
        // 1. 交互逻辑：拖拽与选择文件
        // ==========================================
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            // 过滤只允许图片
            const imageFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
            if (imageFiles.length === 0) return;
            
            selectedFiles = imageFiles;
            
            // UI 提示
            dropZone.innerHTML = `<p style="color:#4ffb7a; font-weight:bold;">已选择 ${selectedFiles.length} 张图片</p>
                                  <p style="font-size:0.8rem; margin-top:0.5rem;">点击重新选择</p>`;
            uploadBtn.disabled = false;
            statusMsg.textContent = "";
            statusMsg.className = "status-msg";
        }

        // ==========================================
        // 2. 核心逻辑：上传到 Firebase Storage
        // ==========================================
        uploadBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;

            const category = categorySelect.value; // 目标目录
            uploadBtn.disabled = true;
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';
            statusMsg.textContent = "正在上传...";
            statusMsg.className = "status-msg";

            let uploadedCount = 0;
            let totalFiles = selectedFiles.length;

            for (const file of selectedFiles) {
                try {
                    // 生成一个唯一文件名 (时间戳_原文件名)
                    const fileName = `${Date.now()}_${file.name}`;
                    // 构建 Storage 路径: 例如 nature/1698765432_image.jpg
                    const storageRef = ref(storage, `${category}/${fileName}`);
                    
                    // 上传任务
                    const uploadTask = uploadBytesResumable(storageRef, file);

                    // 监听上传进度
                    await new Promise((resolve, reject) => {
                        uploadTask.on('state_changed', 
                            (snapshot) => {
                                // 计算当前总进度 (已完成的文件 + 当前文件的进度)
                                const currentFileProgress = snapshot.bytesTransferred / snapshot.totalBytes;
                                const overallProgress = ((uploadedCount + currentFileProgress) / totalFiles) * 100;
                                progressFill.style.width = overallProgress + '%';
                            }, 
                            (error) => reject(error), 
                            () => resolve()
                        );
                    });

                    uploadedCount++;
                } catch (error) {
                    console.error("上传失败:", error);
                    statusMsg.textContent = `上传失败: ${error.message}`;
                    statusMsg.className = "status-msg error";
                    uploadBtn.disabled = false;
                    return; // 遇到错误停止
                }
            }

            // 全部完成
            progressFill.style.width = '100%';
            statusMsg.textContent = `🎉 成功上传 ${uploadedCount} 张图片到 ${category} 目录！`;
            statusMsg.className = "status-msg success";
            
            // 恢复初始状态
            setTimeout(() => {
                dropZone.innerHTML = `
                    <input type="file" id="fileInput" accept="image/*" multiple>
                    <p>点击选择图片，或将图片拖拽到此处</p>
                    <p style="font-size:0.8rem; margin-top:0.5rem; color:#555;">(支持多选)</p>
                `;
                // 重新绑定 input 事件
                document.getElementById('fileInput').addEventListener('change', (e) => handleFiles(e.target.files));
                selectedFiles = [];
                uploadBtn.disabled = true;
                progressBar.style.display = 'none';
            }, 3000);
        });
    </script>
</body>
</html>
