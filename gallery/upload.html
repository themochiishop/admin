<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传 - Gallery Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d1117; min-height: 100vh; display: flex;
            justify-content: center; align-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #c9d1d9; padding: 1.5rem;
        }
        
        .card {
            width: 100%; max-width: 520px; background: #161b22; 
            border-radius: 1rem; padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        h2 { color: #ffffff; margin-bottom: 2rem; font-weight: 500; font-size: 1.4rem; letter-spacing: 0.5px; }
        
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; color: #8b949e; margin-bottom: 0.5rem; font-size: 0.85rem; font-weight: 500; }
        
        input[type="email"], input[type="password"], select {
            width: 100%; padding: 0.8rem 1rem; border-radius: 0.5rem;
            background: #0d1117; color: #ffffff; border: 1px solid #30363d;
            font-size: 0.95rem; outline: none; transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: #58a6ff; }

        .category-row {
            display: flex; gap: 0.5rem;
        }
        .category-row select { flex: 1; }
        .edit-btn {
            background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
            border-radius: 0.5rem; padding: 0 1rem; cursor: pointer;
            font-size: 1rem; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .edit-btn:hover { background: #30363d; color: #fff; }

        .drop-zone {
            border: 1px dashed #30363d; border-radius: 0.75rem; padding: 3rem 1rem;
            text-align: center; color: #8b949e; cursor: pointer; 
            transition: all 0.2s ease; background: #0d1117;
            margin-bottom: 1.5rem;
        }
        .drop-zone:hover, .drop-zone.dragover { 
            border-color: #58a6ff; background: rgba(88, 166, 255, 0.05); color: #58a6ff; 
        }
        .drop-zone input[type="file"] { display: none; }

        .btn {
            width: 100%; padding: 0.8rem; border-radius: 0.5rem; 
            font-size: 1rem; font-weight: 500; cursor: pointer; transition: all 0.2s;
            border: 1px solid transparent;
        }
        .btn-primary { background: #238636; color: white; border-color: rgba(240,246,252,0.1); }
        .btn-primary:hover:not(:disabled) { background: #2ea043; }
        .btn-primary:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; border-color: transparent; }
        
        .status-msg { margin-top: 1rem; text-align: center; font-size: 0.85rem; color: #8b949e; }
        .status-msg.success { color: #3fb950; }
        .status-msg.error { color: #f85149; }

        .logout-btn { 
            position: absolute; top: 1.5rem; right: 1.5rem; background: transparent; 
            border: none; color: #8b949e; cursor: pointer; font-size: 0.85rem; 
        }
        .logout-btn:hover { color: #f85149; }

        .progress-bar { width: 100%; height: 6px; background: #0d1117; border-radius: 3px; margin: 1.5rem 0; overflow: hidden; display: none; border: 1px solid #30363d; }
        .progress-fill { height: 100%; width: 0%; background: #58a6ff; transition: width 0.2s; }
    </style>
</head>
<body>

    <div class="card" id="loginSection">
        <h2>Admin Login</h2>
        <div class="form-group">
            <label>邮箱</label>
            <input type="email" id="emailInput" placeholder="admin@example.com">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="passwordInput" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" id="loginBtn">登录系统</button>
        <div class="status-msg" id="loginMsg"></div>
    </div>

    <div class="card" id="uploadSection" style="display: none;">
        <button class="logout-btn" id="logoutBtn">退出</button>
        <h2>上传资源</h2>

        <div class="form-group">
            <label>目标目录</label>
            <div class="category-row">
                <select id="categorySelect"></select>
                <button class="edit-btn" id="editCategoryBtn" title="修改目录名称">✎</button>
            </div>
        </div>

        <div class="drop-zone" id="dropZone">
            <input type="file" id="fileInput" accept="image/*" multiple>
            <p>点击选择，或将文件拖拽至此</p>
            <p style="font-size:0.75rem; margin-top:0.5rem; opacity:0.5;">支持多选，不限大小</p>
        </div>

        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <button class="btn btn-primary" id="uploadBtn" disabled>开始上传</button>
        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getStorage, ref, uploadBytesResumable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCkb5eDLElnQZ8Pt3Ud5euOmdkCo4QxqM",
            authDomain: "my-gallery-43e8a.firebaseapp.com",
            projectId: "my-gallery-43e8a",
            storageBucket: "my-gallery-43e8a.firebasestorage.app",
            messagingSenderId: "616009345293",
            appId: "1:616009345293:web:a61335e41cd7158014a844",
            measurementId: "G-47Q10H9FM3"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);
        const auth = getAuth(app);
        const db = getFirestore(app); // 初始化 Firestore

        const loginSection = document.getElementById('loginSection');
        const uploadSection = document.getElementById('uploadSection');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginMsg = document.getElementById('loginMsg');
        
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const categorySelect = document.getElementById('categorySelect');
        const editCategoryBtn = document.getElementById('editCategoryBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const statusMsg = document.getElementById('statusMsg');

        let selectedFiles = [];
        let categories = {}; // 存放从云端抓取的目录名字

        // ==========================================
        // 1. 目录名称管理 (从 Firebase 数据库读写)
        // ==========================================
        const defaultCategories = { "1": "目录 01", "2": "目录 02", "3": "目录 03", "4": "目录 04", "5": "目录 05" };

        // 从云端抓取目录名字
        async function fetchCategoriesFromCloud() {
            try {
                const docRef = doc(db, "settings", "gallery_categories");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    categories = docSnap.data();
                } else {
                    // 如果云端还没数据，就先用默认的，并上传一次到云端
                    categories = { ...defaultCategories };
                    await setDoc(docRef, categories);
                }
            } catch (error) {
                console.error("获取目录失败:", error);
                categories = { ...defaultCategories }; // 失败则用默认兜底
            }
            renderCategoryOptions();
        }

        function renderCategoryOptions() {
            categorySelect.innerHTML = '';
            for (const [key, name] of Object.entries(categories)) {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = name;
                categorySelect.appendChild(option);
            }
        }

        // 修改目录名称，并保存到云端
        editCategoryBtn.addEventListener('click', async () => {
            const currentKey = categorySelect.value;
            const oldName = categories[currentKey];
            
            const newName = prompt(`修改目录 [${currentKey}] 的名称：`, oldName);
            
            if (newName !== null && newName.trim() !== "") {
                categories[currentKey] = newName.trim();
                
                // 保存到 Firestore
                try {
                    const docRef = doc(db, "settings", "gallery_categories");
                    await setDoc(docRef, categories);
                    
                    renderCategoryOptions();
                    categorySelect.value = currentKey; 
                    statusMsg.textContent = "目录名称已保存到云端！";
                    statusMsg.className = "status-msg success";
                    setTimeout(() => { statusMsg.textContent = ""; }, 2000);
                } catch (error) {
                    statusMsg.textContent = "保存失败，请确保已登录";
                    statusMsg.className = "status-msg error";
                }
            }
        });

        // ==========================================
        // 2. 认证与上传逻辑
        // ==========================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.style.display = 'none';
                uploadSection.style.display = 'block';
                fetchCategoriesFromCloud(); // 登录成功后拉取云端名称
            } else {
                loginSection.style.display = 'block';
                uploadSection.style.display = 'none';
            }
        });

        loginBtn.addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            loginMsg.textContent = "验证中...";
            loginMsg.className = "status-msg";
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                loginMsg.textContent = "认证失败，请检查账号密码";
                loginMsg.className = "status-msg error";
            }
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            const imageFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
            if (imageFiles.length === 0) return;
            selectedFiles = imageFiles;
            dropZone.innerHTML = `<p style="color:#58a6ff; font-weight:500;">已选择 ${selectedFiles.length} 张图片</p><p style="font-size:0.75rem; margin-top:0.5rem;">点击重新选择</p>`;
            uploadBtn.disabled = false;
            statusMsg.textContent = "";
        }

        uploadBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;
            const category = categorySelect.value;
            const categoryName = categories[category];

            uploadBtn.disabled = true;
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';
            statusMsg.textContent = "正在传输...";
            statusMsg.className = "status-msg";

            let uploadedCount = 0;
            let totalFiles = selectedFiles.length;

            for (const file of selectedFiles) {
                try {
                    const fileName = `${Date.now()}_${file.name}`;
                    const storageRef = ref(storage, `${category}/${fileName}`);
                    const uploadTask = uploadBytesResumable(storageRef, file);

                    await new Promise((resolve, reject) => {
                        uploadTask.on('state_changed', 
                            (snapshot) => {
                                const currentFileProgress = snapshot.bytesTransferred / snapshot.totalBytes;
                                const overallProgress = ((uploadedCount + currentFileProgress) / totalFiles) * 100;
                                progressFill.style.width = overallProgress + '%';
                            }, 
                            (error) => reject(error), 
                            () => resolve()
                        );
                    });
                    uploadedCount++;
                } catch (error) {
                    statusMsg.textContent = `传输失败: ${error.message}`;
                    statusMsg.className = "status-msg error";
                    uploadBtn.disabled = false;
                    return;
                }
            }

            progressFill.style.width = '100%';
            statusMsg.textContent = `成功传输 ${uploadedCount} 个文件到 [${categoryName}]`;
            statusMsg.className = "status-msg success";
            
            setTimeout(() => {
                dropZone.innerHTML = `<input type="file" id="fileInput" accept="image/*" multiple><p>点击选择，或将文件拖拽至此</p><p style="font-size:0.75rem; margin-top:0.5rem; opacity:0.5;">支持多选，不限大小</p>`;
                document.getElementById('fileInput').addEventListener('change', (e) => handleFiles(e.target.files));
                selectedFiles = [];
                uploadBtn.disabled = false; // 这里改为 false，因为登录了可以继续传
                progressBar.style.display = 'none';
                statusMsg.textContent = "";
            }, 3000);
        });
    </script>
</body>
</html>
