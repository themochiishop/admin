<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 🔐 要「🧺 打包清单」权限；资料全部经后端 pkAdmin（只回传打包需要的资料） -->
  <script type="module">import { guard } from "/js/admin-guard.js"; window.__access = guard("pack");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧺 打包清单 - Mochiishop</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/jpeg" href="../logo.png">
  <link rel="stylesheet" href="../member-system/css/admin.css">
  <script src="../member-system/js/theme.js"></script>
  <style>
    body { padding-bottom: 40px; }
    .top { background: #0f172a; color: #fff; padding: 12px 18px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 20; }
    .top a { color: #94a3b8; }
    .top h1 { font-size: 1.05rem; }
    .top .sp { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .top button { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 7px; padding: 5px 10px; font-size: .78rem; cursor: pointer; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 420px 1fr; gap: 18px; align-items: start; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 3px var(--shadow); }
    .scan { padding: 14px; position: sticky; top: 62px; }
    .scan-row { display: flex; gap: 8px; }
    .scan-row input { flex: 1; min-width: 0; font-size: 1rem; padding: 11px 12px; border: 1.5px solid var(--line2); border-radius: 9px; background: var(--card); font-family: ui-monospace, Menlo, monospace; }
    .scan-row input:focus { outline: none; border-color: #db2777; }
    .btn { border: 0; border-radius: 9px; font-weight: 700; cursor: pointer; font-size: .9rem; padding: 10px 14px; }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-cam { background: #db2777; color: #fff; white-space: nowrap; }
    .btn-ok { background: #16a34a; color: #fff; width: 100%; padding: 13px; font-size: 1rem; margin-top: 12px; }
    .btn-line { background: var(--card); color: var(--text2); border: 1px solid var(--line2); }
    .hint { font-size: .74rem; color: var(--muted); margin-top: 6px; }
    .result { margin-top: 14px; border-radius: 11px; border: 2px solid #db2777; overflow: hidden; }
    .result.is-done { border-color: #16a34a; }
    .result-head { background: var(--pink-bg); padding: 10px 12px; }
    .result.is-done .result-head { background: var(--green-bg); }
    .result-head .no { font-family: ui-monospace, Menlo, monospace; font-size: .82rem; color: var(--text2); }
    .result-head .who { font-weight: 800; color: var(--ink); font-size: 1.05rem; margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .tag { font-size: .68rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
    .t-shopee { background: #ea580c; color: #fff; } .t-tiktok { background: #334155; color: #fff; }
    .t-mem { background: var(--pink-bg2); color: var(--pink-tx); }
    .count { margin-left: auto; background: #db2777; color: #fff; font-size: .78rem; padding: 2px 9px; border-radius: 99px; }
    .result.is-done .count { background: #16a34a; }
    .items { padding: 6px 12px 12px; }
    .it { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
    .it:last-of-type { border-bottom: 0; }
    .it .ic { font-size: 1.35rem; width: 30px; text-align: center; flex-shrink: 0; }
    .it .nm { flex: 1; min-width: 0; }
    .it .nm b { color: var(--ink); font-size: .95rem; }
    .it .nm small { display: block; color: var(--muted); font-size: .74rem; }
    .it input[type=checkbox] { width: 26px; height: 26px; accent-color: #16a34a; flex-shrink: 0; cursor: pointer; }
    .it.sent { opacity: .5; } .it.sent b { text-decoration: line-through; }
    .warn { background: var(--amber-bg); border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: .8rem; color: var(--amber-tx); }
    .warn + .warn { margin-top: 6px; }
    .note { font-size: .74rem; color: var(--blue-tx); background: var(--blue-bg); border-radius: 8px; padding: 6px 9px; margin-top: 8px; }
    .none { margin-top: 14px; border: 2px dashed var(--line2); border-radius: 11px; padding: 22px; text-align: center; }
    .none .big { font-size: 2.6rem; }
    .none b { display: block; font-size: 1.2rem; color: var(--ink); margin-top: 4px; }
    .err { margin-top: 14px; border-radius: 11px; padding: 14px; background: var(--red-bg); color: var(--red-tx); font-size: .88rem; }
    .sec { padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .sec h2 { font-size: .95rem; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sec h2 small { font-weight: 500; color: var(--muted); font-size: .76rem; }
    .sec h2 .btn { margin-left: auto; padding: 6px 12px; font-size: .8rem; }
    .prep { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .prep span { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: .85rem; color: var(--ink); }
    .prep span b { color: #db2777; margin-left: 4px; }
    .chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .chips button { border: 1px solid var(--line2); background: var(--card); border-radius: 99px; padding: 4px 11px; font-size: .78rem; color: var(--text2); cursor: pointer; }
    .chips button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
    .row { display: grid; grid-template-columns: 24px 190px 1fr auto; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: .86rem; cursor: pointer; }
    .row:hover { background: var(--soft2); }
    .row .no { font-family: ui-monospace, Menlo, monospace; font-size: .78rem; color: var(--text2); word-break: break-all; }
    .row .who { font-weight: 700; color: var(--ink); }
    .row .what i { font-style: normal; display: inline-block; background: var(--soft); border-radius: 6px; padding: 1px 7px; margin: 2px 4px 2px 0; font-size: .8rem; color: var(--text); }
    .row .what i.w { color: var(--amber-tx); background: var(--amber-bg); }
    .row .st { font-size: .76rem; font-weight: 700; white-space: nowrap; }
    .row.done { opacity: .5; } .row.done .st { color: var(--green-tx); }
    .row.sel { background: var(--pink-bg); }
    .row input[type=checkbox] { width: 20px; height: 20px; accent-color: #16a34a; cursor: pointer; }
    .st-todo { color: #db2777; }
    .empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: .9rem; }
    .claimhint { padding: 8px 16px; font-size: .74rem; color: var(--muted); background: var(--soft2); border-bottom: 1px solid var(--line); }
    /* 📷 扫描视窗 */
    [hidden] { display: none !important; }
    #result { scroll-margin-top: 64px; }
    .cam { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
    .cam video { width: 100%; max-width: 520px; max-height: 70vh; border-radius: 12px; background: #000; object-fit: cover; }
    .cam .frame { position: relative; width: 100%; max-width: 520px; }
    .cam .frame::after { content: ""; position: absolute; left: 8%; right: 8%; top: 38%; height: 24%; border: 3px solid #f472b6; border-radius: 10px; box-shadow: 0 0 0 2000px rgba(0,0,0,.25); pointer-events: none; }
    .cam p { color: #e2e8f0; font-size: .85rem; margin: 12px 0; text-align: center; }
    .cam .btn { background: #fff; color: #0f172a; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .88rem; z-index: 120; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
    @media (max-width: 860px) {
      .wrap { grid-template-columns: 1fr; padding: 10px; }
      .scan { position: static; }
      .row { grid-template-columns: 22px 1fr auto; }
      .row .what { grid-column: 2 / 4; }
    }
  </style>
</head>
<body>
  <div class="top">
    <a href="../" title="回到控制台">←</a><h1>🧺 打包清单</h1>
    <div class="sp"><button id="themeBtn" title="白色 / 暗黑模式">🌓</button><button id="reloadBtn" title="重新读取">🔄</button></div>
  </div>

  <div class="wrap">
    <!-- 左：扫描 / 找单号 → 这一包 -->
    <div class="card scan">
      <div class="scan-row">
        <input id="q" placeholder="扫描或输入单号 / 买家名" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button id="camBtn" class="btn btn-cam">📷 扫描</button>
      </div>
      <div class="hint">扫面单上的订单号条码，或输入单号（后几位也可以）、买家名，按 Enter</div>
      <div id="result"></div>
    </div>

    <!-- 右：这一批 -->
    <div class="card">
      <div class="sec">
        <h2>📋 先准备这些 <small id="batchInfo">读取中…</small><button id="finishBtn" class="btn btn-line" hidden>✅ 这批打包完成</button></h2>
        <div id="prep" class="prep"></div>
        <div id="chips" class="chips"></div>
      </div>
      <div id="claimHint" class="claimhint" hidden></div>
      <div id="list"><div class="empty">读取中…</div></div>
    </div>
  </div>

  <div id="cam" class="cam" hidden>
    <div class="frame"><video id="video" playsinline muted></video></div>
    <p id="camMsg">把订单号条码对准框框</p>
    <button id="camClose" class="btn">关闭</button>
  </div>

  <script type="module">
    import { app } from "../member-system/js/firebase-config.js";
    import { can } from "/js/admin-guard.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-functions.js";

    const pkAdmin = httpsCallable(getFunctions(app, "asia-southeast1"), "pkAdmin");
    const $ = id => document.getElementById(id);
    const esc = x => String(x == null ? "" : x).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const norm = s => String(s || "").replace(/\s/g, "").toUpperCase();
    const noOk = no => /^[A-Z0-9]{6,40}$/.test(no);
    const errText = e => (e && e.message) || String(e);
    const PLAT = { shopee: "Shopee", tiktok: "TikTok" };
    const txId = () => "pk_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 10);

    let parcels = [], filter = "todo", sel = null, busy = false, access = null;
    let claimItems = [];          // 🏆 领奖追踪：非会员得主（没在会员系统「中奖奖品」里的）
    let claimDb = null;
    const DRAW_CONFIG = { apiKey: "AIzaSyBu5yd5-pbO82_g8mgIx-faUzuzd0NaRZQ", authDomain: "draw-tournament.firebaseapp.com", databaseURL: "https://draw-tournament-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "draw-tournament", storageBucket: "draw-tournament.firebasestorage.app", messagingSenderId: "803720903757", appId: "1:803720903757:web:8b561daabc0d69af9e7004" };
    const sentLog = new Map();   // 这次打开页面已经放进去的东西（单号 → 东西），放好后还显示「✅ 已放入」

    function toast(msg) {
      const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
      document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
    }
    // 扫到 / 勾选的回馈：手机震动 + 短音
    let actx = null;
    function beep(ok = true) {
      try { if (navigator.vibrate) navigator.vibrate(ok ? 60 : [80, 60, 80]); } catch (e) {}
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        const o = actx.createOscillator(), g = actx.createGain();
        o.frequency.value = ok ? 1040 : 320; g.gain.value = .08;
        o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (ok ? .09 : .25));
      } catch (e) {}
    }

    // ---------- 读取这一批 ----------
    async function load() {
      try {
        const r = (await pkAdmin({ op: "batch" })).data;
        parcels = r.parcels || [];
        mergeClaims();
        parcels.forEach(addSent);
        $("batchInfo").textContent = `这一批：最近 ${r.days} 天还没打包完成的 ${parcels.filter(p => !p.done).length} 张单`;
        render();
        if (sel) { const p = parcels.find(x => x.orderNo === sel.orderNo); if (p) show(p, false); }
      } catch (e) {
        $("batchInfo").textContent = "";
        $("list").innerHTML = `<div class="err">❌ 读取失败：${esc(errText(e))}</div>`;
      }
    }
    const left = p => p.items.filter(i => !i.sent);
    function addSent(p) { (sentLog.get(p.orderNo) || []).forEach(i => { if (!p.items.some(j => j.id === i.id)) p.items.push({ ...i, sent: true }); }); }
    const canLeft = p => left(p).filter(i => i.can);
    const warns = p => left(p).filter(i => !i.can);

    function render() {
      const todo = parcels.filter(p => !p.done && left(p).length);
      const done = parcels.filter(p => p.done && p.items.length);
      const warnP = parcels.filter(p => !p.done && warns(p).length);
      // 先准备这些：这一批还没放的东西（同一样东西出现在同一顾客的两包，只算一次）
      const seen = new Set(), prep = new Map();
      todo.forEach(p => canLeft(p).forEach(i => {
        if (seen.has(i.id)) return; seen.add(i.id);
        const k = i.icon + " " + (i.prep || i.title); prep.set(k, (prep.get(k) || 0) + 1);
      }));
      $("prep").innerHTML = prep.size ? [...prep.entries()].sort((a, b) => b[1] - a[1]).map(([k, n]) => `<span>${esc(k)}<b>×${n}</b></span>`).join("")
        : '<span class="muted" style="background:none;border:0;padding:0">这一批没有要放的东西 🎉</span>';
      const C = { todo: ["要放东西", todo.length], done: ["已放好", done.length], warn: ["⚠️ 待处理", warnP.length], all: ["全部", parcels.length] };
      $("chips").innerHTML = Object.entries(C).map(([k, [t, n]]) => `<button data-f="${k}" class="${filter === k ? "on" : ""}">${t} ${n}</button>`).join("");
      $("finishBtn").hidden = !parcels.some(p => !p.done);
      const list = filter === "todo" ? todo : filter === "done" ? done : filter === "warn" ? warnP : parcels;
      if (!list.length) { $("list").innerHTML = `<div class="empty">${filter === "todo" ? "🎉 这一批没有要放东西的包裹" : "没有"}</div>`; return; }
      $("list").innerHTML = list.map(p => {
        const l = left(p), c = canLeft(p).length;
        return `<div class="row ${p.done && !c ? "done" : ""} ${sel && sel.orderNo === p.orderNo ? "sel" : ""}" data-no="${esc(p.orderNo)}">
          <input type="checkbox" data-pack="${esc(p.orderNo)}" ${p.done ? "checked" : ""} title="${c ? "勾选 = 这一包全部已放入" : "标记打包完成"}">
          <div><div class="no">${esc(p.orderNo)}</div><div class="who">${esc(p.username || "-")}${p.uid ? " 🎫" : ""}</div></div>
          <div class="what">${l.length ? l.map(i => `<i class="${i.can ? "" : "w"}">${i.icon} ${esc(i.prep || i.title)}${i.can ? "" : " ⚠️"}</i>`).join("") : '<i>（没有）</i>'}</div>
          <span class="st ${c ? "st-todo" : ""}">${c ? c + " 样" : p.done ? "✅ 已放好" : warns(p).length ? "⚠️" : "—"}</span>
        </div>`;
      }).join("");
    }

    // ---------- 这一包 ----------
    function show(p, scroll = true) {
      sel = p;
      const l = left(p), c = canLeft(p), w = warns(p), sent = p.items.filter(i => i.sent);
      const other = l.filter(i => parcels.some(x => x !== p && !x.done && left(x).some(j => j.id === i.id)));
      const plat = PLAT[p.platform] ? `<span class="tag t-${p.platform}">${PLAT[p.platform]}</span>` : "";
      const mem = p.uid ? `<span class="tag t-mem">🎫 会员${p.member ? " · " + esc(p.member) : ""}</span>` : "";
      if (!l.length && !sent.length) {
        $("result").innerHTML = `<div class="none"><div class="big">⭕</div><b>这包不用放</b>
          <div class="hint">${esc(p.orderNo)} · ${esc(p.username || "")} ${plat} 没有要随单寄出的东西</div>
          ${p.done ? "" : `<button class="btn btn-line" data-done="${esc(p.orderNo)}" style="margin-top:10px">标记这包打包完成</button>`}</div>`;
      } else {
        const all = c.length === 0;
        $("result").innerHTML = `<div class="result ${all ? "is-done" : ""}">
          <div class="result-head"><div class="no">${esc(p.orderNo)}</div>
            <div class="who">${esc(p.username || "-")} ${plat}${mem}<span class="count">${all ? (sent.length ? "✅ 已全部放好" : "⚠️ 先处理") : `这包要放 ${c.length} 样`}</span></div></div>
          <div class="items">
            ${c.map(i => item(i, false)).join("")}
            ${sent.map(i => item(i, true)).join("")}
            ${w.map(i => `<div class="warn">⚠️ ${i.icon} ${esc(i.title)}：${esc(i.warn || i.sub)}</div>`).join("")}
            ${other.length ? `<div class="note">💡 这位顾客这一批有不只一包：${other.map(i => esc(i.prep || i.title)).join("、")} 放其中一包就好</div>` : ""}
            ${c.length ? `<button class="btn btn-ok" data-all="${esc(p.orderNo)}" ${busy ? "disabled" : ""}>✅ 全部已放入（${c.length} 样）</button>`
              : p.done ? "" : `<button class="btn btn-line" data-done="${esc(p.orderNo)}" style="margin-top:10px;width:100%">标记这包打包完成</button>`}
          </div></div>`;
      }
      document.querySelectorAll(".row").forEach(r => r.classList.toggle("sel", r.dataset.no === p.orderNo));
      if (scroll && innerWidth <= 860) $("result").scrollIntoView({ behavior: "smooth", block: "start" });
    }
    const item = (i, sent) => `<div class="it ${sent ? "sent" : ""}"><span class="ic">${i.icon}</span>
      <span class="nm"><b>${esc(i.title)}</b><small>${sent ? "✅ 已放入" : esc(i.sub || "")}</small></span>
      ${sent ? "" : `<input type="checkbox" data-item="${esc(i.id)}" ${busy ? "disabled" : ""} title="放进这一包">`}</div>`;

    // ---------- 找 ----------
    async function find(raw) {
      const q = String(raw || "").trim();
      if (!q) return;
      const n = norm(q);
      $("q").select();
      let p = parcels.find(x => x.orderNo === n);
      if (!p && n.length >= 4) { const m = parcels.filter(x => x.orderNo.endsWith(n)); if (m.length === 1) p = m[0]; else if (m.length > 1) { listPick(m, `单号后几位「${q}」有 ${m.length} 张单`); return; } }
      if (!p) { const m = parcels.filter(x => (x.username || "").toLowerCase() === q.toLowerCase()); if (m.length === 1) p = m[0]; else if (m.length > 1) { listPick(m, `买家「${q}」这一批有 ${m.length} 张单`); return; } }
      if (p) { beep(true); show(p); return; }
      // 不在这一批：问后端（比较早的单 / 买家名）
      $("result").innerHTML = '<div class="hint" style="margin-top:14px">查找中…</div>';
      try {
        const r = (await pkAdmin(noOk(n) ? { op: "lookup", orderNo: n } : { op: "lookup", username: q })).data;
        if (!r.found) { beep(false); $("result").innerHTML = `<div class="err">找不到「${esc(q)}」。<br><small>订单要先录入（订单录入页或表格提交），同步后才查得到。</small></div>`; return; }
        const x = r.parcel;
        attachClaims(x); addSent(x);
        beep(true);
        show(x);
      } catch (e) { beep(false); $("result").innerHTML = `<div class="err">❌ ${esc(errText(e))}</div>`; }
    }
    function listPick(m, title) {
      beep(true);
      $("result").innerHTML = `<div class="note" style="margin-top:14px">${esc(title)}，选一张：</div>` +
        m.map(p => `<div class="row" data-no="${esc(p.orderNo)}" style="grid-template-columns:1fr auto;border:1px solid var(--line);border-radius:8px;margin-top:6px">
          <div><div class="no">${esc(p.orderNo)}</div><div class="who">${esc(p.username)}</div></div><span class="st">${canLeft(p).length ? canLeft(p).length + " 样" : "—"}</span></div>`).join("");
    }

    // ---------- 勾选 ----------
    async function ship(p, items, done) {
      if (busy) return;
      const svr = items.filter(i => i.kind !== "claim"), cl = items.filter(i => i.kind === "claim");
      busy = true; show(p, false);
      const failed = [];
      try {
        if (svr.length || done) {
          const r = (await pkAdmin({ op: "ship", orderNo: p.orderNo, items: svr.map(i => ({ kind: i.kind, id: i.id })), txId: txId(), done: !!done })).data;
          (r.results || []).forEach(x => {
            const it = svr.find(i => i.id === x.id);
            if (!x.ok) failed.push(`${(it || {}).title || x.id}：${x.error}`);
            else if (it) sentLog.set(p.orderNo, (sentLog.get(p.orderNo) || []).concat([it]));
          });
        }
        for (const i of cl) {
          try { await shipClaim(i, p.orderNo); sentLog.set(p.orderNo, (sentLog.get(p.orderNo) || []).concat([i])); }
          catch (e) { failed.push(`${i.title}：${errText(e)}`); }
        }
      } catch (e) { failed.push(errText(e)); }
      busy = false;
      if (failed.length) { beep(false); alert("有些没成功：\n\n" + failed.join("\n")); }
      else { beep(true); toast(done ? "✅ 这一包打包完成" : "✅ 已放入"); }
      await load();
    }

    // ---------- 🏆 领奖追踪（非会员得主）：同一个浏览器登录过领奖追踪才读得到 ----------
    async function setupClaims() {
      if (!access || !can(access, "draw.claims")) return;
      try {
        await loadScript("https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js");
        await loadScript("https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js");
        await loadScript("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js");
        const fb = window.firebase;
        // 和领奖追踪同一组设定（这段本来就公开在网页里）→ 同一个网站登录过领奖追踪，这里就直接是登录状态
        if (!fb.apps.length) fb.initializeApp(DRAW_CONFIG);
        fb.auth().onAuthStateChanged(async u => {
          if (!u) { $("claimHint").hidden = false; $("claimHint").innerHTML = '🏆 非会员抽奖得主的奖品：<a href="../draw_tournament/claims.html" target="_blank">登录领奖追踪</a> 后重新整理这一页，也会一起列出。'; return; }
          claimDb = fb.database();
          const v = (await claimDb.ref("draw_private/claimBatches").once("value")).val() || {};
          claimItems = [];
          Object.entries(v).forEach(([bid, b]) => Object.entries((b && b.items) || {}).forEach(([k, x]) => {
            if (!x || x.removed || x.voided || x.shipped) return;
            claimItems.push({ kind: "claim", id: `${bid}|${k}`, bid, key: k, icon: "🏆", title: `领奖追踪「${x.rank || "奖品"}」`,
              prep: `${b.label || ""} ${x.rank || "奖品"}`.trim(), sub: `${b.label || ""}${b.title ? " · " + b.title : ""} · 非会员得主`, can: true,
              name: String(x.name || "").toLowerCase(), orderNo: x.orderNo || "" });
          }));
          $("claimHint").hidden = true;
          mergeClaims(); render(); if (sel) show(sel, false);
        });
      } catch (e) { console.warn("claims", e); }
    }
    function loadScript(src) {
      return new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok();
        const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
    }
    // 只给非会员：会员的得奖在会员系统「🏆 中奖奖品」处理（已经列在这一包里）
    const platOfNo = no => { const c = norm(no).charAt(0); return c === "5" ? "tiktok" : c === "2" ? "shopee" : ""; };
    function attachClaims(p) {
      if (p.uid || !claimItems.length) return;
      const mine = claimItems.filter(c => c.name && c.name === String(p.username || "").toLowerCase() && (!platOfNo(c.orderNo) || platOfNo(c.orderNo) === p.platform));
      mine.forEach(c => { if (!p.items.some(i => i.id === c.id)) p.items.push({ ...c }); });
    }
    function mergeClaims() { parcels.forEach(attachClaims); }
    async function shipClaim(i, orderNo) {
      if (!claimDb) throw new Error("没有登录领奖追踪");
      const ref = claimDb.ref(`draw_private/claimBatches/${i.bid}/items/${i.key}`);
      const cur = (await ref.once("value")).val() || {};
      const note = [cur.note, `随 ${orderNo} 寄出（打包清单）`].filter(Boolean).join(" · ").slice(0, 200);
      await ref.update({ shipped: true, note, ts: window.firebase.database.ServerValue.TIMESTAMP });
      claimItems = claimItems.filter(c => c.id !== i.id);
    }

    // ---------- 📷 扫描（Chrome / Android 用内建 BarcodeDetector；iPhone 用 ZXing）----------
    let stream = null, stopScan = null;
    async function openCam() {
      $("cam").hidden = false; $("camMsg").textContent = "把订单号条码对准框框";
      const video = $("video");
      const done = text => { closeCam(); $("q").value = text; find(text); };
      try {
        if ("BarcodeDetector" in window) {
          const det = new BarcodeDetector({ formats: ["code_128", "qr_code", "code_39", "ean_13"] });
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } }, audio: false });
          video.srcObject = stream; await video.play();
          let alive = true; stopScan = () => { alive = false; };
          const tick = async () => {
            if (!alive) return;
            try { const r = await det.detect(video); const hit = pick(r.map(x => x.rawValue)); if (hit) return done(hit); } catch (e) {}
            setTimeout(tick, 120);
          };
          tick();
        } else {
          await loadScript("https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js");
          const reader = new ZXingBrowser.BrowserMultiFormatReader();
          const ctl = await reader.decodeFromConstraints({ video: { facingMode: "environment" } }, video, res => {
            if (!res) return; const hit = pick([res.getText()]); if (hit) done(hit);
          });
          stopScan = () => ctl.stop();
        }
      } catch (e) {
        $("camMsg").textContent = "❌ 打不开相机：" + errText(e) + "（请允许使用相机，或直接输入单号）";
      }
    }
    // 只认订单号；扫到追踪号 / 网址就提示
    function pick(vals) {
      for (const v of vals) {
        const t = norm(v);
        if (/^SPX|^JNT|^JT\d|^MY\d|^NLMY|^ER\d/.test(t) || /^HTTPS?:/.test(t)) { $("camMsg").textContent = "⚠️ 这是追踪号或网址，请扫「订单号」的条码"; continue; }
        if (noOk(t)) return t;
      }
      return null;
    }
    function closeCam() {
      try { stopScan && stopScan(); } catch (e) {}
      stopScan = null;
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      $("video").srcObject = null;
      $("cam").hidden = true;
    }

    // ---------- 事件 ----------
    $("q").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); find($("q").value); } });
    $("camBtn").onclick = openCam;
    $("camClose").onclick = closeCam;
    $("reloadBtn").onclick = () => load();
    $("themeBtn").onclick = () => {
      const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      try { localStorage.setItem("msAdminTheme", t); } catch (e) {}
    };
    $("chips").addEventListener("click", e => { const b = e.target.closest("button[data-f]"); if (b) { filter = b.dataset.f; render(); } });
    document.addEventListener("click", async e => {
      const t = e.target;
      if (t.matches("input[data-pack]")) {                       // 列表上的勾：整包
        e.stopPropagation();
        const p = parcels.find(x => x.orderNo === t.dataset.pack);
        if (!p) return;
        if (p.done) { t.checked = true; if (confirm("取消「打包完成」？这张单会回到要处理的清单。")) { await pkAdmin({ op: "done", orderNos: [p.orderNo], undo: true }).catch(err => alert("❌ " + errText(err))); load(); } return; }
        const c = canLeft(p);
        if (c.length && !confirm(`${p.orderNo} · ${p.username}\n\n确认以下 ${c.length} 样都已放进这一包？\n\n${c.map(i => "• " + i.title).join("\n")}`)) { t.checked = false; return; }
        show(p, false); ship(p, c, true); return;
      }
      if (t.matches("input[data-item]")) {                       // 这一包的单样东西
        const it = sel && left(sel).find(i => i.id === t.dataset.item);
        if (it) ship(sel, [it], false);
        return;
      }
      const all = t.closest("[data-all]");
      if (all && sel) { ship(sel, canLeft(sel), true); return; }
      const dn = t.closest("[data-done]");
      if (dn && sel) { ship(sel, [], true); return; }
      const row = t.closest(".row[data-no]");
      if (row) { const p = parcels.find(x => x.orderNo === row.dataset.no); if (p) show(p); }
    });
    $("finishBtn").onclick = async () => {
      const open = parcels.filter(p => !p.done);
      const unfinished = open.filter(p => canLeft(p).length);
      if (!confirm(unfinished.length
        ? `还有 ${unfinished.length} 包没勾完（${unfinished.map(p => p.username).slice(0, 5).join("、")}${unfinished.length > 5 ? "…" : ""}）。\n\n仍然把这一批 ${open.length} 张单全部标记打包完成？\n没勾的东西会保留，那位顾客下一单还会出现。`
        : `把这一批 ${open.length} 张单全部标记打包完成？`)) return;
      try { await pkAdmin({ op: "done", orderNos: open.map(p => p.orderNo) }); toast("✅ 这批打包完成"); }
      catch (e) { alert("❌ " + errText(e)); }
      sel = null; $("result").innerHTML = ""; load();
    };

    window.__access.then(a => { access = a; load(); setupClaims(); $("q").focus(); });
  </script>
</body>
