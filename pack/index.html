<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 🔐 要「🧺 打包清单」权限；资料全部经后端 pkAdmin（只回传打包需要的资料） -->
  <script type="module">import { guard } from "/js/admin-guard.js"; window.__access = guard("pack");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>🧺 打包 - Mochiishop</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/jpeg" href="../logo.png">
  <link rel="stylesheet" href="../member-system/css/admin.css">
  <script src="../member-system/js/theme.js"></script>
  <style>
    /* ===== PDA 式版面：上 = 扫描列，中 = 结果，下 = 大按钮 + 分页 ===== */
    [hidden] { display: none !important; }
    /* 整页贴满屏幕（手机网址列收起 / 展开都不会在底下留一条空白）*/
    html { height: 100%; background: #0f172a; }
    body { position: fixed; inset: 0; margin: 0; display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; }
    input { user-select: text; }
    .bar { background: #0f172a; color: #fff; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .bar a { color: #94a3b8; font-size: 1.1rem; padding: 2px 6px; }
    .bar h1 { font-size: 1rem; white-space: nowrap; }
    .bar .sp { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .bar button { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 8px; padding: 5px 8px; font-size: .74rem; cursor: pointer; white-space: nowrap; }
    .bar .range { background: #db2777; border-color: #db2777; color: #fff; font-weight: 700; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
    .bar .ico { width: 38px; height: 34px; padding: 0; font-size: 1.05rem; position: relative; display: grid; place-items: center; }
    .bar .ico.big { width: 44px; height: 38px; font-size: 1.35rem; }
    .bar .ico .dot { position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: #facc15; box-shadow: 0 0 0 2px #1e293b; }

    .scanbar { background: #0f172a; padding: 0 10px 10px; display: flex; gap: 8px; flex-shrink: 0; }
    .scanbar input { flex: 1; min-width: 0; font-size: 1.15rem; padding: 12px; border: 2px solid #db2777; border-radius: 10px; background: #fff; color: #0f172a; font-family: ui-monospace, Menlo, monospace; letter-spacing: .5px; }
    .scanbar input:focus { outline: none; box-shadow: 0 0 0 3px rgba(219,39,119,.35); }
    .scanbar button { border: 0; border-radius: 10px; font-size: 1.15rem; padding: 0 14px; cursor: pointer; background: #1e293b; color: #fff; }
    .scanbar .cam { background: #db2777; font-weight: 700; font-size: .95rem; }
    .scanbar button.off { opacity: .55; }
    .scanhint { background: #0f172a; color: #f9a8d4; font-size: .78rem; padding: 0 12px 8px; margin-top: -4px; flex-shrink: 0; }

    .stats { display: flex; gap: 6px; padding: 7px 10px; background: var(--card); border-bottom: 1px solid var(--line); font-size: .76rem; color: var(--text2); flex-shrink: 0; overflow-x: auto; white-space: nowrap; }
    .stats b { color: var(--ink); }
    .stats .pill { background: var(--soft); border-radius: 99px; padding: 2px 9px; }
    .stats .pk { background: var(--pink-bg); color: var(--pink-tx); }
    .stats .gn { background: var(--green-bg); color: var(--green-tx); }
    .stats .am { background: var(--amber-bg); color: var(--amber-tx); }

    main { flex: 1; min-height: 0; display: flex; }
    .tab { flex: 1; min-width: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px; }
    body:not(.wide) .tab:not(.on) { display: none; }

    /* 结果 */
    .idle { text-align: center; color: var(--muted); padding: 40px 10px; }
    .idle .big { font-size: 3.4rem; }
    .idle b { display: block; color: var(--ink); font-size: 1.1rem; margin: 6px 0 4px; }
    .res { border-radius: 14px; overflow: hidden; border: 3px solid #db2777; background: var(--card); }
    .res-head { background: #db2777; color: #fff; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
    .res-head .hr { margin-left: auto; text-align: right; min-width: 0; }
    .res.ok, .res.none { border-color: #16a34a; } .res.ok .res-head, .res.none .res-head { background: #16a34a; }
    .res.warn { border-color: #d97706; } .res.warn .res-head { background: #d97706; }
    .res.err { border-color: #dc2626; } .res.err .res-head { background: #dc2626; }
    .res-head .big { font-size: 1.45rem; font-weight: 900; line-height: 1.15; white-space: nowrap; flex-shrink: 0; }
    .res-head .no { font-family: ui-monospace, Menlo, monospace; font-size: .82rem; opacity: .92; word-break: break-all; }
    .res-head .no .t4 { font-size: 1.3em; font-weight: 900; letter-spacing: .04em; opacity: 1; }
    .note .t4 { font-size: 1.15em; font-weight: 900; }
    .it.lock .ck { background: #16a34a; border-color: #16a34a; color: #fff; }
    .it .cant { margin-left: 8px; border: 1.5px solid var(--amber-tx); color: var(--amber-tx); background: transparent; border-radius: 10px; padding: 8px 10px; font-weight: 800; font-size: .85rem; cursor: pointer; white-space: nowrap; }
    .it.skip { opacity: .75; } .it.skip .nm small { color: var(--amber-tx); }
    .finrow { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 8px 0; font-size: .88rem; }
    .finrow .no { font-family: ui-monospace, Menlo, monospace; min-width: 120px; flex: 1 1 auto; overflow-wrap: anywhere; } .finrow .no b { font-size: 1.15em; }
    .finrow select { width: auto !important; flex: 0 0 auto; max-width: 52%; margin: 0; }
    .finrow select, .modal2 select, .modal2 textarea { padding: 8px; border: 1.5px solid var(--line2); border-radius: 8px; background: var(--card); color: var(--ink); font-size: .88rem; }
    .modal2 textarea { width: 100%; margin-top: 8px; min-height: 56px; box-sizing: border-box; }
    .printbtn { margin: 8px 0 0; border: 1.5px solid var(--line2); background: var(--card); color: var(--ink); border-radius: 10px; padding: 9px 12px; font-weight: 700; cursor: pointer; }
    .scanbar #kbBtn { position: relative; }
    .scanbar #kbBtn::after { content: "🔒"; position: absolute; right: 2px; bottom: 1px; font-size: .62rem; line-height: 1; }
    .scanbar #kbBtn.on::after { content: "🔓"; }
    .res-head .who { font-size: .86rem; font-weight: 700; margin-top: 1px; overflow-wrap: anywhere; }
    .tag { font-size: .68rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,.22); color: #fff; }
    .res-body { padding: 4px 10px 10px; }
    .sec-t { font-size: .78rem; font-weight: 800; color: var(--muted); margin: 12px 2px 2px; }
    .it { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px dashed var(--line); min-height: 54px; cursor: pointer; }
    .it.ro { cursor: default; min-height: 0; }
    .it:last-of-type { border-bottom: 0; }
    .it .ic { font-size: 1.6rem; width: 36px; text-align: center; flex-shrink: 0; }
    .it .nm { flex: 1; min-width: 0; }
    .it .nm b { color: var(--ink); font-size: 1.02rem; display: block; }
    .it .nm small { display: block; color: var(--muted); font-size: .78rem; margin-top: 1px; }
    .it .ck { width: 38px; height: 38px; border-radius: 10px; border: 3px solid var(--line2); display: grid; place-items: center; font-size: 1.3rem; flex-shrink: 0; color: #fff; font-weight: 900; }
    .it.on .ck { background: #16a34a; border-color: #16a34a; }
    .it.off { opacity: .55; } .it.off .nm small::after { content: " · 这次不寄，留到下一单"; color: var(--amber-tx); }
    html[lang=en] .it.off .nm small::after { content: " · not this time, keep for next order"; }
    .it.sent { opacity: .55; cursor: default; } .it.sent b { text-decoration: line-through; }
    .it.sent .ck { background: #64748b; border-color: #64748b; }
    .warn { background: var(--amber-bg); border-radius: 10px; padding: 10px 12px; margin-top: 8px; font-size: .86rem; color: var(--amber-tx); }
    .note { font-size: .8rem; color: var(--blue-tx); background: var(--blue-bg); border-radius: 10px; padding: 8px 11px; margin-top: 8px; }
    .linkbtn { display: block; width: 100%; margin-top: 10px; background: none; border: 1px dashed var(--line2); color: var(--text2); border-radius: 10px; padding: 10px; font-size: .84rem; cursor: pointer; }

    /* 🚚 运单 + 📷 照片 */
    .ship { margin-top: 8px; border: 2px solid var(--line2); border-radius: 12px; padding: 8px 10px; background: var(--soft2); }
    .ship .row2 { display: flex; gap: 6px; margin-top: 6px; }
    .ship .row2 select { flex: 0 0 40%; min-width: 0; } .ship .row2 .trk { flex: 1; min-width: 0; }
    .ship .sline { display: flex; align-items: center; gap: 8px; min-height: 34px; }
    .ship .sline.ph { border-top: 1px dashed var(--line2); margin-top: 8px; padding-top: 8px; }
    .ship .sline .shot { margin-left: auto; flex: 0 0 auto; padding: 9px 16px; }
    .ship .lnk { display: flex; align-items: center; gap: 6px; font-size: .76rem; color: var(--muted); margin-top: 5px; min-width: 0; }
    .ship .lnk span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ship .lnk button { background: none; border: 0; font-size: .9rem; cursor: pointer; padding: 2px 4px; }
    .ship .urlin { margin-top: 5px; }
    .ship .mini { background: var(--card); border: 1px solid var(--line2); color: var(--text2); border-radius: 8px; padding: 7px 10px; font-size: .8rem; cursor: pointer; }
    .pthumb { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 2px solid #16a34a; cursor: zoom-in; margin-left: auto; }
    .pthumb.big { width: 120px; height: 120px; display: block; margin: 6px 0 0; }
    .undone { font-size: .82rem; color: var(--amber-tx); background: var(--amber-bg, #fef3c7); border-radius: 10px; padding: 7px 11px; margin-top: 8px; line-height: 1.5; }
    .packed { font-size: .84rem; color: var(--blue-tx); background: var(--blue-bg); border-radius: 10px; padding: 9px 11px; margin-top: 8px; line-height: 1.6; }
    .packed a { text-decoration: none; }
    .editbtn { display: block; width: 100%; margin-top: 10px; border: 2px solid #db2777; background: var(--card); color: #db2777; border-radius: 10px; padding: 11px; font-weight: 800; font-size: .95rem; cursor: pointer; }
    .zoom { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.88); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
    .zoom img { max-width: 100%; max-height: 100%; border-radius: 10px; }
    .ship label { display: block; font-size: .74rem; color: var(--muted); margin: 6px 0 3px; font-weight: 700; }
    .ship select, .ship input[type=text], .ship input[type=url] { width: 100%; font-size: .95rem; padding: 9px 10px; border: 1.5px solid var(--line2); border-radius: 9px; background: var(--card); color: var(--ink); }
    .ship .trk { font-family: ui-monospace, Menlo, monospace; }
    .ship .need { display: flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 700; color: var(--ink); margin: 0; cursor: pointer; }
    .ship .need input { width: 22px; height: 22px; accent-color: #db2777; }
    .ship .miss { color: #db2777; font-size: .78rem; font-weight: 700; margin-left: auto; }
    .ship .ok { color: var(--green-tx); font-size: .78rem; font-weight: 700; margin-left: auto; }
    .ship hr { border: 0; border-top: 1px dashed var(--line2); margin: 10px 0; }
    .photo { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    .photo img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 2px solid #16a34a; }
    .photo .shot { flex: 1; border: 2px dashed #db2777; background: var(--card); color: #db2777; border-radius: 10px; padding: 14px; font-weight: 800; font-size: .95rem; cursor: pointer; }
    .photo .del { background: none; border: 1px solid var(--line2); color: var(--text2); border-radius: 8px; padding: 6px 10px; cursor: pointer; }

    .hist { margin-top: 14px; }
    .hist h3 { font-size: .78rem; color: var(--muted); font-weight: 600; margin: 0 2px 6px; }
    .hrow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); margin-bottom: 5px; font-size: .84rem; cursor: pointer; }
    .hrow .no { font-family: ui-monospace, Menlo, monospace; font-size: .76rem; color: var(--text2); }
    .hrow .who { flex: 1; min-width: 0; color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hrow .st { font-weight: 700; font-size: .78rem; white-space: nowrap; }

    /* 清单 */
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .chips button { border: 1px solid var(--line2); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: .82rem; color: var(--text2); cursor: pointer; }
    .chips button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
    .row { display: flex; gap: 10px; align-items: center; padding: 11px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; cursor: pointer; }
    .row .l { flex: 1; min-width: 0; }
    .row .no { font-family: ui-monospace, Menlo, monospace; font-size: .76rem; color: var(--text2); word-break: break-all; }
    .row .who { font-weight: 700; color: var(--ink); font-size: .92rem; }
    .row .what { margin-top: 3px; }
    .row .what i { font-style: normal; display: inline-block; background: var(--soft); border-radius: 6px; padding: 1px 7px; margin: 2px 4px 0 0; font-size: .78rem; color: var(--text); }
    .row .what i.w { color: var(--amber-tx); background: var(--amber-bg); }
    .row .st { font-size: .82rem; font-weight: 800; white-space: nowrap; color: #db2777; }
    .row.done .st { color: var(--green-tx); } .row.done { opacity: .6; }
    .row.none .st { color: var(--muted); font-weight: 600; }
    .row.sel { outline: 2px solid #db2777; }
    .empty { padding: 40px 10px; text-align: center; color: var(--muted); }
    .sub { font-size: .76rem; color: var(--muted); margin: 2px 2px 10px; }
    .claimhint .btn-claim { border: 0; background: #db2777; color: #fff; border-radius: 8px; padding: 5px 10px; font-weight: 700; font-size: .78rem; cursor: pointer; margin: 4px 2px 0; }
    .claimhint { font-size: .76rem; color: var(--muted); background: var(--soft2); border-radius: 9px; padding: 8px 10px; margin-bottom: 8px; }

    /* 准备：两个文件夹卡 */
    .folders { display: flex; gap: 0; margin-bottom: 10px; border-bottom: 2px solid var(--line2); }
    .folders button { flex: 1; border: 2px solid transparent; border-bottom: 0; background: none; padding: 10px 6px; font-size: .9rem; font-weight: 800; color: var(--muted); border-radius: 12px 12px 0 0; cursor: pointer; margin-bottom: -2px; }
    .folders button.on { background: var(--card); color: var(--ink); border-color: var(--line2); border-bottom: 2px solid var(--card); }
    .folders .n { display: inline-block; background: #db2777; color: #fff; font-size: .7rem; border-radius: 99px; padding: 0 6px; margin-left: 4px; }
    .prep { display: grid; gap: 8px; }
    .pg { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .pg summary { list-style: none; } .pg summary::-webkit-details-marker { display: none; }
    .pg summary > div { display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer; }
    .pg .ic { font-size: 1.5rem; }
    .pg .nm { flex: 1; color: var(--ink); font-weight: 700; }
    .pg .n { font-size: 1.45rem; font-weight: 900; color: #db2777; }
    .pg summary .arr { color: var(--muted); font-size: .8rem; transition: transform .15s; }
    .pg[open] summary .arr { transform: rotate(90deg); }
    .pg ul { list-style: none; margin: 0; padding: 0 12px 8px 14px; font-size: .82rem; color: var(--text2); }
    .pg li { padding: 7px 0; border-top: 1px dashed var(--line); }
    .pg li .w1 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .pg li .w1 b { color: var(--ink); font-size: .9rem; }
    .pg li .acc { font-size: .72rem; background: var(--soft); border-radius: 5px; padding: 1px 6px; color: var(--text2); white-space: nowrap; }
    .pg li .acc.S { background: #ffedd5; color: #9a3412; } .pg li .acc.T { background: #e2e8f0; color: #1e293b; }
    [data-theme=dark] .pg li .acc.S { background: #431407; color: #fdba74; } [data-theme=dark] .pg li .acc.T { background: #334155; color: #e2e8f0; }
    .pg li .mt { font-size: .7rem; font-weight: 700; padding: 0 5px; border-radius: 4px; background: var(--pink-bg); color: var(--pink-tx); }
    .pg li .mt.non { background: var(--soft); color: var(--muted); }
    .pg li .w2 { font-size: .74rem; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
    .pg li .t { color: #16a34a; font-weight: 700; } .pg li .w { color: var(--amber-tx); font-weight: 700; }

    /* 下方：大按钮 + 分页 */
    .act { flex-shrink: 0; padding: 8px 10px; background: var(--card); border-top: 1px solid var(--line); }
    .act button { width: 100%; border: 0; border-radius: 12px; padding: 15px; font-size: 1.1rem; font-weight: 900; cursor: pointer; }
    .act .go { background: #16a34a; color: #fff; }
    .act .go.dis { background: var(--soft); color: var(--muted); }
    .act .next { background: var(--navy); color: #fff; }
    .tabs { flex-shrink: 0; display: flex; background: #0f172a; margin: 0; border: 0; border-radius: 0; gap: 0; padding: 0 0 env(safe-area-inset-bottom); }   /* admin.css 的 .tabs 有 margin-bottom → 底下会多一条空白 */
    .tabs button { flex: 1; background: none; border: 0; color: #94a3b8; padding: 9px 4px 8px; font-size: .78rem; cursor: pointer; position: relative; }
    .tabs button .i { display: block; font-size: 1.25rem; }
    .tabs button.on { color: #fff; }
    .tabs button.on::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; background: #db2777; border-radius: 0 0 3px 3px; }
    .tabs .n { position: absolute; top: 3px; left: calc(50% + 8px); background: #db2777; color: #fff; font-size: .62rem; border-radius: 99px; padding: 0 5px; }

    /* 电脑 / 平板横向：扫描 + 清单 + 准备 并排 */
    body.wide .tabs { display: none; }
    /* 📱 手机：扫描框、保存按钮移到下面（右手拇指按得到）：标题 → 统计 → 内容 → 下一步提示 → 保存 → 扫描框 → 分页 */
    body:not(.wide) > .bar { order: 1; } body:not(.wide) > .stats { order: 2; } body:not(.wide) > main { order: 3; }
    body:not(.wide) > .scanhint { order: 4; margin-top: 0; padding: 7px 12px 2px; }
    body:not(.wide) > .act { order: 5; background: #0f172a; border-top: 0; padding: 6px 10px 2px; }
    body:not(.wide) > .scanbar { order: 6; padding: 8px 10px; border-top: 1px solid #1e293b; }
    body:not(.wide) > .tabs { order: 7; }
    body:not(.wide) > .scanhint { box-shadow: 0 -1px 0 #1e293b; }
    body.wide #tabScan { flex: 0 0 460px; border-right: 1px solid var(--line); }
    body.wide #tabPrep { flex: 0 0 300px; border-left: 1px solid var(--line); }

    /* 弹窗：时间段 */
    .modal2 { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 90; display: flex; align-items: flex-end; justify-content: center; }
    .modal2 .box { background: var(--card); width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); }
    @media (min-width: 600px) { .modal2 { align-items: center; } .modal2 .box { border-radius: 18px; } }
    .modal2 h2 { font-size: 1.05rem; color: var(--ink); margin-bottom: 4px; }
    .opt { display: block; border: 2px solid var(--line2); border-radius: 12px; padding: 12px; margin-top: 10px; cursor: pointer; }
    .opt.on { border-color: #db2777; background: var(--pink-bg); }
    .opt b { color: var(--ink); } .opt small { display: block; color: var(--muted); margin-top: 3px; font-size: .8rem; }
    .opt input[type=date], .opt input[type=datetime-local] { margin-top: 8px; width: 100%; padding: 8px; border: 1.5px solid var(--line2); border-radius: 8px; background: var(--card); color: var(--ink); font-size: .9rem; }
    .opt .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .srow { border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; margin-top: 10px; }
    .srow b { color: var(--ink); font-size: .95rem; } .srow small { display: block; color: var(--muted); font-size: .78rem; margin-top: 2px; }
    .seg { display: flex; gap: 6px; margin-top: 8px; }
    .seg button { flex: 1; border: 2px solid var(--line2); background: var(--card); color: var(--text2); border-radius: 10px; padding: 10px 6px; font-size: .92rem; font-weight: 700; cursor: pointer; }
    .seg button.on { border-color: #db2777; background: var(--pink-bg); color: var(--pink-tx); }

        const i = all.findIndex(y => y.orderNo === no);
        if (i >= 0) all[i] = x; else all.push(x);
      } catch (e) { console.warn("refresh", e); }
    }
    const left = p => p.items.filter(i => !i.sent);
    function addSent(p) { (sentLog.get(p.orderNo) || []).forEach(i => { if (!p.items.some(j => j.id === i.id)) p.items.push({ ...i, sent: true }); }); }
    const canLeft = p => left(p).filter(i => i.can);
    // 迎新礼已关联订单：固定在那一包（不跟「同会员第一包」走）
    const pinned = i => i.kind === "nm" && !!i.linkedOrder;
    // 单号：后四位加大加粗（打包时一般对最后四位）
    const noHtml = no => { const s = String(no || ""); return esc(s.slice(0, -4)) + `<b class="t4">${esc(s.slice(-4))}</b>`; };
    // ✋ 店主指定订单的小礼物也固定在那一包（显示照一般东西，不用迎新礼的「放不了」）
    const pinnedAny = i => pinned(i) || (i.kind === "sg" && !!i.linkedOrder);
    const freeLeft = p => canLeft(p).filter(i => !pinnedAny(i));
    const pinLeft = p => canLeft(p).filter(pinnedAny);
    const warns = p => left(p).filter(i => !i.can);
    const buyerKey = p => p.uid ? "u:" + p.uid : `p:${p.platform}:${String(p.username || "").toLowerCase()}`;
    // 同一位会员今天有几包：东西显示在第一包（还没放好的、下单最早的）
    function owners() {
      const m = new Map();
      all.filter(p => !p.done).forEach(p => { const k = buyerKey(p); if (freeLeft(p).length && !m.has(k)) m.set(k, p.orderNo); });
      return m;
    }

    function render() {
      const own = owners();
      const rows = all.map(p => {
        const k = buyerKey(p), isOwner = own.get(k) === p.orderNo;
        const c = [...(isOwner ? freeLeft(p) : []), ...pinLeft(p)];
        const st = p.done && !c.length ? "done" : c.length ? "todo" : own.has(k) ? "other" : warns(p).length ? "warn" : "none";
        return { p, c, st };
      });
      // 今天要准备：东西只算一次
      const seen = new Set(), todayItems = [];
      rows.forEach(r => r.c.forEach(i => { if (!seen.has(i.id)) { seen.add(i.id); todayItems.push({ i, who: whoOfParcel(r.p) }); } }));
      const nTodo = rows.filter(r => r.st === "todo").length, nDone = rows.filter(r => r.st === "done").length, nWarn = rows.filter(r => warns(r.p).length && !r.p.done).length;
      $("nList").hidden = !all.length; $("nList").textContent = all.length;
      $("nPrep").hidden = !todayItems.length; $("nPrep").textContent = todayItems.length;
      $("stats").innerHTML = `<span class="pill">${t("statToday", all.length)}</span>
        <span class="pill pk">${t("statTodo", nTodo)}</span>
        <span class="pill gn">${t("statDone", nDone)}</span>
        ${nWarn ? `<span class="pill am">⚠️ <b>${nWarn}</b></span>` : ""}
        <span class="pill">${t("statPrep", todayItems.length)}</span>${shift ? `<span class="pill gn">${esc(t("finShift", shift.byName || (shift.by || "").split("@")[0], fmtT(shift.finishedAt), shift.packed, shift.total))}</span>` : ""}`;
      $("rangeInfo").textContent = t("rangeInfo", fmtT(range.from), fmtT(range.to));
      // 清单
      const F = { all: [t("fAll"), rows.length], todo: [t("fTodo"), nTodo], none: [t("fNone"), rows.filter(r => r.st === "none" || r.st === "other").length], done: [t("fDone"), nDone] };
      $("chips").innerHTML = Object.entries(F).map(([k, [tx, n]]) => `<button data-f="${k}" class="${filter === k ? "on" : ""}">${esc(tx)} ${n}</button>`).join("");
      const list = rows.filter(r => filter === "all" || r.st === filter || (filter === "none" && r.st === "other"));
      const chip = (i, w) => `<i${w ? ' class="w"' : ""}>${i.icon} ${esc(tr(i, "prep") || tr(i, "title"))}${w ? " ⚠️" : ""}</i>`;
      $("list").innerHTML = !list.length ? `<div class="empty">${esc(all.length ? t("noneHere") : t("noOrders"))}</div>` : list.map(r => {
        const p = r.p, w = warns(p);
        const what = r.st === "todo" ? r.c.map(i => chip(i)).join("") + w.map(i => chip(i, true)).join("")
          : r.st === "other" ? `<i>${esc(t("inOther"))}</i>` : r.st === "done" ? p.items.filter(i => i.sent).map(i => chip(i)).join("") : w.map(i => chip(i, true)).join("");
        const st = r.st === "todo" ? t("stTodo", r.c.length) : r.st === "done" ? t("stDone") : r.st === "warn" ? "⚠️" : t("stNone");
        return `<div class="row ${r.st === "done" ? "done" : r.st === "none" || r.st === "other" ? "none" : ""} ${sel && sel.p.orderNo === p.orderNo ? "sel" : ""}" data-no="${esc(p.orderNo)}">
          <div class="l"><div class="no">${esc(p.orderNo)}</div><div class="who">${esc(p.username || "-")}${p.uid ? " 🎫" : ""}</div>${what ? `<div class="what">${what}</div>` : ""}</div>
          <span class="st">${esc(st)}</span></div>`;
      }).join("");
      // 准备
      renderPrep(todayItems);
      renderHist();
    }

    // 准备里每一行「是谁的」：名字 + 会员 / 非会员 + 平台账号 + 今天有没有单
    function whoOfParcel(p) {
      return { name: p.uid ? (p.member || p.username || t("member")) : (p.username || "-"), member: !!p.uid,
        accts: p.username ? [{ platform: p.platform, username: p.username }] : [], order: p.orderNo };
    }
    function todayOrderOf(key) { const p = all.find(x => !x.done && buyerKey(x) === key); return p ? p.orderNo : ""; }
    function whoOfPending(g) {
      if (g.uid) return { name: g.member || t("member"), member: true, accts: g.accounts || [], order: todayOrderOf(g.key), wait: true };
      return { name: g.username || "-", member: false, accts: g.platform || g.username ? [{ platform: g.platform, username: g.username }] : [], order: todayOrderOf(g.key), wait: true, plainName: true };
    }
    const acctHtml = a => { const P = PLAT[a.platform]; return `<span class="acc ${P ? P[0] : ""}">${P ? P + " " : ""}@${esc(a.username)}</span>`; };
    function whoHtml(i, w, showWait) {
      const accts = w.accts.length ? w.accts : w.plainName ? [{ platform: "", username: w.name }] : [];
      const name = w.plainName ? "" : `<b>${esc(w.name)}</b>`;
      const src = tr(i, "src");
      const st = (w.warn ? `<span class="w">${esc(w.warn)}</span>` : "") +
        (w.order ? `<span class="t">${esc(t("todayOrder", w.order.slice(-6)))}</span>` : showWait && !w.warn ? `<span class="w">${esc(t("waitOrder"))}</span>` : "");
      return `<li><div class="w1">${name}<span class="mt ${w.member ? "" : "non"}">${w.member ? "🎫 " + esc(t("member")) : esc(t("nonMember"))}</span>${accts.map(acctHtml).join("")}</div>
        <div class="w2">${src ? `<span>🗓 ${esc(src)}</span>` : ""}${st}</div></li>`;
    }
    function renderPrep(todayItems) {
      // 全部待寄：每位顾客还没寄的（可以寄的；含今天没单的）
      const allItems = [];
      pending.forEach(g => { const w = whoOfPending(g); g.items.filter(i => i.can).forEach(i => allItems.push({ i, who: pinnedAny(i) ? { ...w, order: "", warn: t("nmOrder", i.linkedOrder) } : w })); });
      claimItems.forEach(c => {
        if (c.uid) {   // 会员得主（会员系统还没有这笔奖品）
          const g = pending.find(x => x.uid === c.uid);
          allItems.push({ i: c, who: { name: c.member || t("member"), member: true, accts: g && g.accounts && g.accounts.length ? g.accounts : [{ platform: platOfNo(c.orderNo), username: c.uname }],
            order: todayOrderOf("u:" + c.uid), warn: t("claimMemTag") } });
          return;
        }
        const p = all.find(x => !x.uid && !x.done && String(x.username || "").toLowerCase() === c.name);
        allItems.push({ i: c, who: { name: c.name, member: false, plainName: true, accts: [{ platform: platOfNo(c.orderNo), username: c.uname || c.name }], order: p ? p.orderNo : "" } });
      });
      $("nToday").hidden = !todayItems.length; $("nToday").textContent = todayItems.length;
      $("nAll").hidden = !allItems.length; $("nAll").textContent = allItems.length;
      document.querySelectorAll("[data-fd]").forEach(b => b.classList.toggle("on", b.dataset.fd === folder));
      const src = folder === "today" ? todayItems : allItems;
      $("prepSub").textContent = (folder === "today" ? t("prepToday") : t("prepAll")) + (claimWarn ? "\n" + claimWarn : "");
      $("prepSub").style.whiteSpace = "pre-line";
      const G = new Map();
      src.forEach(x => { const nm = tr(x.i, "prep") || tr(x.i, "title"); const k = x.i.icon + nm; const g = G.get(k) || { icon: x.i.icon, k, nm, list: [] }; g.list.push(x); G.set(k, g); });
      const P = [...G.values()].sort((a, b) => b.list.length - a.list.length);
      lastPrep = P;
      $("prep").innerHTML = P.length ? P.map(g => `<details class="pg" data-g="${esc(folder + "|" + g.k)}" ${closedG.has(folder + "|" + g.k) ? "" : "open"}>
        <summary><div><span class="ic">${g.icon}</span><span class="nm">${esc(g.nm)}</span><span class="n">×${g.list.length}</span><span class="arr">▶</span></div></summary>
        <ul>${g.list.map(x => whoHtml(x.i, x.who, folder === "all")).join("")}</ul></details>`).join("")
        : `<div class="empty">${esc(folder === "today" ? t("emptyToday") : t("emptyAll"))}</div>`;
    }
    $("prep").addEventListener("toggle", e => { const d = e.target; if (d.dataset && d.dataset.g) d.open ? closedG.delete(d.dataset.g) : closedG.add(d.dataset.g); }, true);

    // ---------- 这一包：查看 / 勾选 + 运单 + 照片 ----------
    // 这一包要做什么：items = 有东西要放；pack = 没东西放，但还没打包；view = 已打包
    const modeOf = p => canLeft(p).length ? "items" : !p.done ? "pack" : "view";
    // 现在画面的模式：点清单 = 查看（sel.view）；扫描 = 打包；已打包的按「✏️ 修改」= 重新填运单号 / 照片（sel.redo）
    function mode() {
      if (!sel) return null;
      if (sel.view) return "view";
      const m = modeOf(sel.p);
      return m === "view" && sel.redo ? "pack" : m;
    }
    let heldTrk = "";   // 先扫到的追踪号（还没开包裹）：扫订单号后自动填进去
    const photoCache = new Map(), photoLoading = new Set();
    function openParcel(p, view = false) {
      const c = canLeft(p);
      sel = { p, on: new Set(c.filter(i => !(i.kind === "card" && i.level !== "must")).map(i => i.id)), ship: { carrier: "", trackingNo: "", trackingUrl: "", photo: "" }, needTrk: true, needPh: true, view, redo: false, urlEdit: false, nmSkip: null, nmAsk: null };
      if (!view && heldTrk && modeOf(p) !== "view") { const h = heldTrk; heldTrk = ""; fillTracking(h); }
      showSel(true);
    }
    function startEdit() {
      if (!sel) return;
      const p = sel.p;
      sel.view = false;
      if (modeOf(p) === "view") {   // 已打包：带入之前的运单号、照片，改好再保存
        sel.redo = true;
        const pk = p.packed || {};
        if (pk.trackingNo) {
          const c = CARRIERS.find(x => x.name === pk.carrierName);
          Object.assign(sel.ship, { carrier: c ? c.id : "", trackingNo: pk.trackingNo, trackingUrl: pk.trackingUrl || "" });
        } else sel.needTrk = false;
        if (photoCache.get(p.orderNo)) sel.ship.photo = photoCache.get(p.orderNo); else if (!pk.photo) sel.needPh = false;
      }
      showSel(false); focusQ();
    }
    async function loadPhoto(p) {
      const no = p.orderNo;
      if (!p.packed || !p.packed.photo || photoCache.has(no) || photoLoading.has(no)) return;
      photoLoading.add(no);
      try { const r = (await pkAdmin({ op: "photo", orderNo: no })).data; photoCache.set(no, (r && r.photo) || ""); }
      catch (e) { photoCache.set(no, ""); }
      photoLoading.delete(no);
      if (sel && sel.p.orderNo === no) showSel(false);
    }
    function showSel(fresh) {
      const { p } = sel;
      const c = canLeft(p), w = warns(p), sent = p.items.filter(i => i.sent);
      const m = mode();
      // 只留还在的勾选
      sel.on = new Set([...sel.on].filter(id => c.some(i => i.id === id)));
      const others = all.filter(x => x !== p && !x.done && buyerKey(x) === buyerKey(p)).map(x => x.orderNo);
      // 这位会员的迎新礼固定在别的单：提醒不要放这包
      const pg = pending.find(g => g.key === buyerKey(p));
      const nmElse = ((pg && pg.items) || []).filter(i => pinned(i) && i.can && i.linkedOrder !== p.orderNo && !c.some(j => j.id === i.id))
        .map(i => { const lp = all.find(x => x.orderNo === i.linkedOrder);
          // 那一包已经打包了，迎新礼却还没寄出：不要叫打包员放别包，请找管理员
          return lp && lp.done ? `<div class="warn">⚠️ ${esc(t("nmLateDone", tr(i, "title"), "\u0000")).replace("\u0000", noHtml(i.linkedOrder))}</div>`
            : `<div class="note">${esc(t("nmElse", tr(i, "title"), "\u0000")).replace("\u0000", noHtml(i.linkedOrder))}</div>`; }).join("");
      const who = [esc(p.username || "-"), PLAT[p.platform] || "", p.uid ? "🎫 " + esc(p.member || t("member")) : ""].filter(Boolean).join(" · ");
      const head = big => `<div class="res-head"><div class="big">${esc(big)}</div><div class="hr"><div class="no">${noHtml(p.orderNo)}</div><div class="who">${who}</div></div></div>`;
      const warnHtml = i => `<div class="warn">⚠️ ${i.icon} <b>${esc(tr(i, "title"))}</b>：${esc(tr(i, "warn") || tr(i, "sub"))}</div>`;
      const doneV = p.done && (!c.length || m === "view");   // 查看已打包的一包：标题显示「已打包」
      const big = doneV ? t("bigDone") : c.length ? t("bigPut", m === "view" ? c.length : sel.on.size) : w.length ? t("bigFirst") : t("bigNone");
      const cls = doneV ? "ok" : c.length ? "" : w.length ? "warn" : "none";
      let body;
      if (m === "view") {
        if (p.done) loadPhoto(p);
        const pk = p.packed, ph = photoCache.get(p.orderNo);
        const packedHtml = p.done ? `<div class="packed">${esc(t("packedBy", pk && (pk.byName || (pk.by ? pk.by.split("@")[0] : "")), pk && pk.at ? fmtT(pk.at) : ""))}
            ${pk && pk.skipped && pk.skipped.length ? `<div style="color:var(--amber-tx)">${esc(t("skippedL") + pk.skipped.map(x => x.title + (x.reason ? "（" + x.reason + "）" : "")).join("、"))}</div>` : ""}
            ${pk && pk.trackingNo ? `<div>🚚 ${esc(pk.carrierName || "")} <b>${esc(pk.trackingNo)}</b>${pk.trackingUrl ? ` <a href="${esc(pk.trackingUrl)}" target="_blank" rel="noopener">🔗</a>` : ""}</div>` : ""}
            ${pk && pk.photo ? (ph ? `<img class="pthumb big" src="${esc(ph)}" data-zoom alt="">` : ph === "" ? "" : `<div>📷 …</div>`) : ""}</div>` : "";
        body = (c.length ? `<div class="sec-t">${esc(t("secTodo"))}</div>` + c.map(i => item(i, "ro")).join("") : "")
          + (sent.length ? `<div class="sec-t">${esc(t("secSent"))}</div>` + sent.map(i => item(i, "sent")).join("") : "")
          + w.map(warnHtml).join("") + packedHtml
          + `<button class="editbtn" data-edit>${esc(modeOf(p) === "view" ? t("editRedo") : t("editPack"))}</button>`
          + (p.done || sent.length ? undoLink(p) : "");
      } else if (m === "items") {
        body = `<div class="sec-t">${esc(t("secPut"))}</div>` + c.map(i => pinned(i) ? nmItem(i) : item(i, sel.on.has(i.id) ? "on" : "off")).join("")
          + (sent.length ? `<div class="sec-t">${esc(t("secSent"))}</div>` + sent.map(i => item(i, "sent")).join("") : "")
          + w.map(warnHtml).join("")
          + (others.length ? `<div class="note">${esc(t("others", others.length, others.map(o => "…" + o.slice(-6)).join(t("sep"))))}</div>` : "")
          + nmElse + cardElse(p) + shipForm();
      } else {   // pack：没东西放（或已打包后修改）
        body = w.map(warnHtml).join("") + nmElse + cardElse(p) + shipForm();
      }
      const ud = p.undone;
      if (ud && ud.at) body += `<div class="undone">${esc(t("undoneBy", ud.byName || (ud.by || "").split("@")[0], fmtT(ud.at), ud.returned || 0))}</div>`;
      $("result").innerHTML = `<div class="res ${cls}">${head(big)}<div class="res-body">${body}</div></div>`;
      if (fresh) { $("result").firstElementChild.classList.add("flash"); addHist(p); }
      paintHint(); paintAct();
      document.querySelectorAll(".row").forEach(r => r.classList.toggle("sel", r.dataset.no === p.orderNo));
    }
    const item = (i, st) => `<div class="it ${st}" ${st === "sent" || st === "ro" ? "" : `data-item="${esc(i.id)}"`}><span class="ic">${i.icon}</span>
      <span class="nm"><b>${esc(tr(i, "title"))}</b><small>${esc(st === "sent" ? t("sentSmall") : tr(i, "sub") || "")}</small></span>${st === "ro" ? "" : `<span class="ck">${st === "on" || st === "sent" ? "✓" : ""}</span>`}</div>`;
    // 迎新礼（固定在这一包）：不能取消勾选；放不了要按「放不了」选原因
    const nmItem = i => {
      const head = `<span class="ic">${i.icon}</span><span class="nm"><b>${esc(tr(i, "title"))}</b>`;
      if (sel.nmSkip && sel.nmSkip.id === i.id)
        return `<div class="it skip">${head}<small>${esc(t("nmSkipped", sel.nmSkip.reason))}</small></span><button type="button" class="cant" data-nmundo>${esc(t("nmUndoSkip"))}</button></div>`;
      if (sel.nmAsk === i.id)
        return `<div class="it">${head}<small>${esc(t("nmCantQ"))}</small><span class="seg" style="margin-top:6px">${t("nmR").map((x, k) => `<button type="button" data-nmr="${k}">${esc(x)}</button>`).join("")}</span></span></div>`;
      return `<div class="it lock">${head}<small>${esc(tr(i, "sub") || "")} · ${esc(t("nmLock"))}</small></span><button type="button" class="cant" data-nmcant="${esc(i.id)}">${esc(t("nmCant"))}</button><span class="ck">✓</span></div>`;
    };
    const undoLink = p => `<button class="linkbtn" data-undo="${esc(p.orderNo)}">${esc(t("undoBtn"))}</button>`;
    // 运单 + 照片（紧凑：公司和单号一行；链接一行小字，要改才按 ✏️；照片和勾选同一行）
    function shipForm() {
      const s = sel.ship;
      const opts = CARRIERS.map(c => `<option value="${esc(c.id)}" ${s.carrier === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("");
      const st = (ok, okTx, missTx) => ok ? `<span class="ok">${esc(okTx)}</span>` : `<span class="miss">${esc(missTx)}</span>`;
      const link = sel.urlEdit || (s.trackingUrl && !/^https:\/\//i.test(s.trackingUrl))
        ? `<input type="url" class="urlin" data-sf="trackingUrl" value="${esc(s.trackingUrl)}" placeholder="${esc(t("urlPh"))}">`
        : `<div class="lnk">🔗 <span>${s.trackingUrl ? esc(s.trackingUrl.replace(/^https:\/\/(www\.)?/i, "")) : esc(t("urlAuto"))}</span><button type="button" data-urledit title="${esc(t("url"))}">✏️</button></div>`;
      return `<div class="ship">
        <div class="sline"><label class="need"><input type="checkbox" data-need="trk" ${sel.needTrk ? "checked" : ""}>${esc(t("needTrk"))}</label>${sel.needTrk ? st(s.trackingNo, t("trkOk"), t("trkMiss")) : ""}</div>
        ${sel.needTrk ? `<div class="row2"><select data-sf="carrier" aria-label="${esc(t("carrier"))}"><option value="">${esc(t("pick"))}</option>${opts}</select>
          <input type="text" class="trk" data-sf="trackingNo" value="${esc(s.trackingNo)}" placeholder="${esc(t("trkPh"))}" aria-label="${esc(t("trkNo"))}" autocomplete="off" autocapitalize="characters"></div>${link}` : ""}
        <div class="sline ph"><label class="need"><input type="checkbox" data-need="ph" ${sel.needPh ? "checked" : ""}>${esc(t("needPh"))}</label>
          ${sel.needPh ? (s.photo ? `<img class="pthumb" src="${esc(s.photo)}" data-zoom alt=""><button class="mini" data-ph="shot">${esc(t("phRe"))}</button><button class="mini" data-ph="del">✕</button>`
            : `<button class="shot" data-ph="shot">${esc(t("phShot"))}</button>`) : ""}</div>
      </div>`;
    }
    // 还缺什么（缺了不能保存）
    function missing() {
      if (!sel || mode() === "view") return [];
      const m = [];
      if (sel.needTrk && !sel.ship.trackingNo) m.push(t("mTrk"));
      if (sel.needTrk && sel.ship.trackingNo && !sel.ship.carrier) m.push(t("mCarrier"));
      if (sel.needTrk && sel.ship.trackingUrl && !/^https:\/\//i.test(sel.ship.trackingUrl)) m.push(t("mHttps"));
      if (sel.needPh && !sel.ship.photo) m.push(t("mPhoto"));
      return m;
    }
    function paintHint() {
      const h = $("scanHint");
      if (sel && mode() !== "view" && sel.needTrk && !sel.ship.trackingNo) { h.hidden = false; h.textContent = t("nextTrk"); }
      else h.hidden = true;
    }
    // 下方大按钮：这一包还没打包（有没有东西要放都一样），而且正在看扫描页（或电脑并排）才出现
    function paintAct() {
      const a = $("act");
      const show = sel && mode() !== "view" && (curTab === "tabScan" || document.body.classList.contains("wide"));

    // ---------- 扫描 / 输入 ----------
    async function find(raw) {
      const q = String(raw || "").trim();
      if (!q) return;
      wakeTouch();
      const n = norm(q);
      $("q").value = ""; $("q").placeholder = q;
      tab("tabScan");
      // 先比对今天的订单：是订单号就打开那一包
      let p = all.find(x => x.orderNo === n);
      const open = sel && mode() !== "view";
      // 同一包的订单号又扫到一次（条码太近）：不重开、不清掉已扫的追踪号
      if (open && sel.p.orderNo === n) {
        if (sel.needTrk && !sel.ship.trackingNo) { beep("bad"); toast(t("isOrderAgain")); } else beep("ok");
        return;
      }
      if (!p && !isOrderNo(n) && looksTracking(n)) {
        // 打开的包裹还没打包 → 这一下是追踪号
        if (open) { if (sel.ship.trackingNo === n) { beep("ok"); toast(t("trkDup")); return; } setTracking(n); return; }
        // 还没开包裹就先扫到追踪号：先记下来，扫订单号后自动填进去
        heldTrk = n; beep("ok"); paintAct(); paintHint();
        $("result").innerHTML = `<div class="idle"><div class="big">🚚</div><b>${esc(t("trkHeld", n))}</b>${esc(t("trkHeldS"))}</div>`;
        return;
      }
      if (!p && n.length >= 4 && !isOrderNo(n)) { const m = all.filter(x => x.orderNo.endsWith(n)); if (m.length === 1) p = m[0]; else if (m.length > 1) return listPick(m, t("tailMany", q, m.length)); }
      if (!p && !isOrderNo(n)) { const m = all.filter(x => (x.username || "").toLowerCase() === q.toLowerCase()); if (m.length === 1) p = m[0]; else if (m.length > 1) return listPick(m, t("userMany", q, m.length)); }
      if (p) { beep(canLeft(p).length ? "items" : "ok"); openParcel(p); return; }
      // 不在今天的时间段：问后端（任何一天的单都可以扫）
      sel = null; paintAct(); paintHint();
      $("result").innerHTML = `<div class="idle"><div class="big">🔎</div><b>${esc(t("searching"))}</b></div>`;
      try {
        const r = (await pkAdmin(noOk(n) ? { op: "lookup", orderNo: n } : { op: "lookup", username: q })).data;
        if (!r.found) { beep("bad");
          $("result").innerHTML = `<div class="res err"><div class="res-head"><div class="big">${esc(t("notFound"))}</div><div class="no">${esc(q)}</div></div>
            <div class="res-body"><div class="note" style="margin-top:10px">${esc(t("notFoundNote"))}</div></div></div>`; return; }
        const x = r.parcel; x.outside = true;   // 不在这个时间段（重新读取清单时要保留、另外更新）
        attachClaims(x); attachCard(x); addSent(x);
        if (!all.some(y => y.orderNo === x.orderNo)) all.push(x);
        beep(canLeft(x).length ? "items" : "ok");
        openParcel(x); render();
      } catch (e) { beep("bad"); $("result").innerHTML = `<div class="res err"><div class="res-head"><div class="big">${esc(t("errBig"))}</div></div><div class="res-body"><div class="note" style="margin-top:10px">${esc(errText(e))}</div></div></div>`; }
    }
    function fillTracking(no) {

      s.trackingNo = no;

    function listPick(m, title) {

    // ---------- 📷 照片（压缩到大约 100KB 内）----------
    function compress(file) {
      return new Promise((ok, no) => {
        const img = new Image();
        img.onload = () => {
          let max = 900, url = "";
          for (let i = 0; i < 4; i++) {
            const k = Math.min(1, max / Math.max(img.width, img.height));
            const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            url = c.toDataURL("image/webp", .72);
            if (!url.startsWith("data:image/webp")) url = c.toDataURL("image/jpeg", .75);
            if (url.length < 140 * 1024) break;
            max = Math.round(max * .75);
          }
          URL.revokeObjectURL(img.src); ok(url);
        };
        img.onerror = no; img.src = URL.createObjectURL(file);
      });
    }
    $("photoIn").addEventListener("change", async e => {
      const f = e.target.files && e.target.files[0]; e.target.value = "";
      if (!f || !sel) return;
      try { sel.ship.photo = await compress(f); beep("ok"); } catch (err) { alert(t("phFail", errText(err))); }
      showSel(false);

    // ---------- 💾 保存＝已放好 ----------
    async function save() {

      if (sel.needPh && s.photo) ship.photo = s.photo;
      wakeTouch();
      const svr = items.filter(i => i.kind !== "claim" && i.kind !== "card"), cl = items.filter(i => i.kind === "claim");
      const card = items.find(i => i.kind === "card");   // 🆕 新人卡：只记在这一包（packDone.newCard）
      busy = true; paintAct();
      const failed = [];
      try {
        const nmSkip = sel.nmSkip && sel.nmSkip.id ? { ...sel.nmSkip } : null;
        const skipped = canLeft(p).filter(i => i.kind !== "card" && !sel.on.has(i.id) && !(nmSkip && nmSkip.id === i.id)).map(i => ({ kind: i.kind, id: i.id, title: i.title }));
        const r = (await pkAdmin({ op: "ship", orderNo: p.orderNo, items: svr.map(i => ({ kind: i.kind, id: i.id, title: i.title })), skipped, nmSkip, txId: txId(), done: true, ship, newCard: !!card, newCardLevel: card ? card.level : undefined })).data;
        if (card) sentLog.set(p.orderNo, (sentLog.get(p.orderNo) || []).concat([card]));
        (r.results || []).forEach(x => {
          const it = svr.find(i => i.id === x.id);
          if (!x.ok) failed.push(`${it ? tr(it, "title") : x.id}：${errMsg(x.error)}`);
          else if (it) sentLog.set(p.orderNo, (sentLog.get(p.orderNo) || []).concat([it]));
        });
        for (const i of cl) {
          try { await shipClaim(i, p.orderNo, ship); sentLog.set(p.orderNo, (sentLog.get(p.orderNo) || []).concat([i])); }
          catch (e) { failed.push(`${tr(i, "title")}：${errText(e)}`); }
        }
      } catch (e) { failed.push(errText(e)); }
      busy = false;
      if (failed.length) { beep("bad"); alert(t("partFail") + "\n\n" + failed.join("\n")); }
      else { beep("ok"); toast(t("savedOk")); }
      if (ship.photo) photoCache.set(p.orderNo, ship.photo); else photoCache.delete(p.orderNo);
      if (sel && sel.p.orderNo === p.orderNo) sel.redo = false;
      if (p.outside) await refreshOne(p.orderNo);
      await load();
      // 保存好了：显示这一包的打包结果（没勾的东西还在，要放的话按「✏️ 打包这一包」）
      if (!failed.length && sel && sel.p.orderNo === p.orderNo && sel.p.done) { sel.view = true; showSel(false); }
      focusQ();
    }

    // ---------- 🏁 收工 ----------

    // ---------- ↩️ 撤销这一包 ----------

    // ---------- 🏆 领奖追踪（非会员得主）：同一个浏览器登录过领奖追踪才读得到 ----------
    async function setupClaims() {
      if (!access || !can(access, "pack")) return;   // 🧺 打包清单权限就够（店主在「👥 管理员」同步后，抽奖系统那边只让打包员读名单、改「已寄出」和备注）
      try {
        await loadScript("https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js");
        await loadScript("https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js");
        await loadScript("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js");
        const fb = window.firebase;
        if (!fb.apps.length) fb.initializeApp(DRAW_CONFIG);   // 和领奖追踪同一组设定 → 同一个网站登录过就直接是登录状态
        fb.auth().onAuthStateChanged(async u => {
          if (!u) { $("claimHint").hidden = false; $("claimHint").innerHTML = t("claimHint"); return; }
          claimDb = fb.database();
          let v;
          try { v = (await claimDb.ref("draw_private/claimBatches").once("value")).val() || {}; }
          catch (e) { claimDb = null; $("claimHint").hidden = false; $("claimHint").innerHTML = t("claimDenied", esc(u.email || errText(e))); return; }
          claimItems = [];
          Object.entries(v).forEach(([bid, b]) => Object.entries((b && b.items) || {}).forEach(([k, x]) => {
            if (!x || x.removed || x.voided || x.shipped) return;
            const label = (b && b.label) || "", rank = x.rank || "";
            claimItems.push({ kind: "claim", id: `${bid}|${k}`, bid, key: k, icon: "🏆", can: true,
              title: T.zh.claimTitle(rank || T.zh.claimPrize), prep: `${label} ${rank || T.zh.claimPrize}`.trim(), sub: `${label}${b.title ? " · " + b.title : ""} · ${T.zh.claimSub}`, src: label,
              en: { title: T.en.claimTitle(rank || T.en.claimPrize), prep: `${label} ${rank || T.en.claimPrize}`.trim(), sub: `${label}${b.title ? " · " + b.title : ""} · ${T.en.claimSub}`, src: label },
              name: String(x.name || "").toLowerCase(), uname: String(x.name || ""), orderNo: x.orderNo || "" });
          }));
          claimWarn = ""; await checkClaims();
          $("claimHint").hidden = !claimWarn; $("claimHint").textContent = claimWarn;
          all.forEach(attachClaims); render(); if (sel) showSel(false);
        });
      } catch (e) { console.warn("claims", e); }
    }
    // 🔑 连接领奖追踪（不用打开领奖追踪页）
    $("claimHint").addEventListener("click", async e => {
      const b = e.target.closest("[data-claim]"); if (!b || !window.firebase) return;
      const fa = window.firebase.auth();
      try {
        if (b.dataset.claim === "switch") await fa.signOut();
        const pv = new window.firebase.auth.GoogleAuthProvider(); pv.setCustomParameters({ prompt: "select_account" });
        await fa.signInWithPopup(pv).catch(err => {
          if (err.code === "auth/popup-blocked" || err.code === "auth/operation-not-supported-in-this-environment") return fa.signInWithRedirect(pv);
          throw err;
        });
      } catch (err) { if (err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request") alert("❌ " + errText(err)); }
    });
    // 用订单号对会员系统「🏆 中奖奖品」（和领奖追踪页一样）：
    //   会员系统有这笔 → 交给会员那一笔（已寄出就不再出现；待寄的会以 🏆 中奖奖品出现）
    //   没有，但买家账号绑定了会员 → 标成会员，要先到中奖奖品发奖
    async function checkClaims() {
      if (!claimItems.length) return;
      try {
        const r = (await pkAdmin({ op: "claims", items: claimItems.map(c => ({ id: c.id, orderNo: c.orderNo, username: c.uname })) })).data;
        const res = (r && r.res) || {};
        claimItems = claimItems.filter(c => { const x = res[c.id]; return !(x && x.club && x.club !== "cancelled"); });
        claimItems.forEach(c => {
          const x = res[c.id];
          if (!x || !x.uid) return;
          Object.assign(c, { uid: x.uid, member: x.member || "", can: false, warn: T.zh.claimMemWarn,
            sub: c.sub.replace(T.zh.claimSub, T.zh.claimMemSub) });
          c.en = { ...c.en, warn: T.en.claimMemWarn, sub: c.en.sub.replace(T.en.claimSub, T.en.claimMemSub) };
        });
      } catch (e) {
        console.warn("claims check", e);
        claimWarn = (lang === "en" ? "⚠️ Couldn't check 🏆 Claim tracking against the member system (backend pkAdmin not updated?): " : "⚠️ 领奖追踪的 🏆 没办法对照会员系统（后端 pkAdmin 还没更新？）：") + errText(e);
      }
    }
    function loadScript(src) {
      return new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok();
        const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
    }
    const platOfNo = no => { const c = norm(no).charAt(0); return c === "5" ? "tiktok" : c === "2" ? "shopee" : ""; };
    function attachClaims(p) {
      if (!claimItems.length) return;
      claimItems.filter(c => c.uid ? c.uid === p.uid
        : !p.uid && c.name && c.name === String(p.username || "").toLowerCase() && (!platOfNo(c.orderNo) || platOfNo(c.orderNo) === p.platform))
        .forEach(c => { if (!p.items.some(i => i.id === c.id)) p.items.push({ ...c }); });
    }
    // 🆕 新人卡（非会员）：后端给 p.newCard，这里变成一样「东西」，跟其他东西一起勾、一起准备
    //   同一位买家每一包用同一个 id → 只出现在他第一包，准备只算一张；不送到后端寄出，只在保存时带 newCard: true
    function attachCard(p) {
      const nc = p.newCard;
      if (!nc || nc.level === "placed" || p.items.some(i => i.kind === "card")) return;
      const must = nc.level === "must";
      const it = { kind: "card", id: "card_" + buyerKey(p), icon: "🆕", level: nc.level, can: true,
        title: T.zh.cardT, prep: T.zh.cardT, sub: must ? T.zh.cardMust : T.zh.cardSug, src: T.zh.cardSrc,
        en: { title: T.en.cardT, prep: T.en.cardT, sub: must ? T.en.cardMust : T.en.cardSug, src: T.en.cardSrc } };
      if (nc.here) it.sent = true;
      p.items.push(it);
    }
    // 30 天内另一包已经放了新人卡：提醒不用再放
    const cardElse = p => p.newCard && p.newCard.level === "placed"
      ? `<div class="note">${esc(t("cardPlaced", fmtD(p.newCard.at), "\u0000")).replace("\u0000", noHtml(p.newCard.inOrder))}</div>` : "";
    async function shipClaim(i, orderNo, ship) {
      if (!claimDb) throw new Error(t("noClaimLogin"));
      const ref = claimDb.ref(`draw_private/claimBatches/${i.bid}/items/${i.key}`);
      const cur = (await ref.once("value")).val() || {};
      const trk = ship.trackingNo ? ` · ${ship.carrierName || ""} ${ship.trackingNo}` : "";
      const note = [cur.note, `随 ${orderNo} 寄出${trk}（打包清单）`].filter(Boolean).join(" · ").slice(0, 200);   // 记录一律中文
      await ref.update({ shipped: true, note, ts: window.firebase.database.ServerValue.TIMESTAMP });
      claimItems = claimItems.filter(c => c.id !== i.id);
    }

    // ---------- 📷 相机扫条码（Chrome / Android 用内建 BarcodeDetector；iPhone 用 ZXing）----------
    let stream = null, stopScan = null;
    async function openCam() {
      wakeTouch();
      $("cam").hidden = false;
      // 面单上订单号、追踪号两个条码很近：先挑现在要的那一个（1.5 秒内没看到要的，才接受另一个）
      const wantTrk = !!(sel && mode() !== "view" && sel.needTrk && !sel.ship.trackingNo);
      $("camMsg").textContent = wantTrk ? t("camTrk") : t("camOrder");
      const video = $("video");
      const done = text => { closeCam(); find(text); };
      const okCode = s => !/^HTTPS?:/.test(s) && (noOk(s) || /^[A-Z0-9-]{8,40}$/.test(s));
      const isWanted = s => wantTrk ? !isOrderNo(s) && !(all.some(x => x.orderNo === s)) : isOrderNo(s) || all.some(x => x.orderNo === s);
      let firstSeen = 0;
      const pick = list => {
        const codes = list.map(norm).filter(okCode).filter(c => !(wantTrk && sel && c === sel.p.orderNo));
        if (!codes.length) return "";
        const good = codes.find(isWanted);
        if (good) return good;
        if (!firstSeen) firstSeen = Date.now();
        return Date.now() - firstSeen > 1500 ? codes[0] : "";
      };
      try {
        if ("BarcodeDetector" in window) {
          const det = new BarcodeDetector({ formats: ["code_128", "qr_code", "code_39", "ean_13"] });
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } }, audio: false });
          video.srcObject = stream; await video.play();
          let alive = true; stopScan = () => { alive = false; };
          const tick = async () => {
            if (!alive) return;
            try { const r = await det.detect(video); const hit = pick(r.map(x => x.rawValue)); if (hit) return done(hit); } catch (e) {}
            setTimeout(tick, 120);
          };
          tick();
        } else {
          await loadScript("https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js");
          const reader = new ZXingBrowser.BrowserMultiFormatReader();
          const ctl = await reader.decodeFromConstraints({ video: { facingMode: "environment" } }, video, res => {
            if (!res) return; const hit = pick([res.getText()]); if (hit) done(hit);
          });
          stopScan = () => ctl.stop();
        }
      } catch (e) { $("camMsg").textContent = t("camErr", errText(e)); }
    }
    function closeCam() {
      try { stopScan && stopScan(); } catch (e) {}
      stopScan = null;
      if (stream) { stream.getTracks().forEach(tk => tk.stop()); stream = null; }
      $("video").srcObject = null; $("cam").hidden = true; focusQ();
    }

    // ---------- 分页（手机）/ 并排（电脑）----------
    function tab(id) {
      curTab = id;
      document.querySelectorAll(".tab").forEach(s => s.classList.toggle("on", s.id === id));
      document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === id));
      paintAct();
    }
    const wideQ = matchMedia("(min-width: 1000px)");
    const paintWide = () => { document.body.classList.toggle("wide", wideQ.matches); paintAct(); };
    wideQ.addEventListener ? wideQ.addEventListener("change", paintWide) : wideQ.addListener(paintWide);
    paintWide();

    // ---------- 事件 ----------
    $("q").addEventListener("keydown", e => {
      if ((e.key === "Enter" || e.key === "Tab") && !e.isComposing) { if (!$("q").value.trim()) return; e.preventDefault(); find($("q").value); }
    });
    $("camBtn").onclick = openCam;
    $("camClose").onclick = closeCam;
    $("reloadBtn").onclick = () => { toast("🔄 " + t("loading")); load(); };
    document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab(b.dataset.tab); if (b.dataset.tab === "tabScan") focusQ(); });
    $("chips").addEventListener("click", e => { const b = e.target.closest("button[data-f]"); if (b) { filter = b.dataset.f; render(); } });
    $("folders").addEventListener("click", e => { const b = e.target.closest("button[data-fd]"); if (b) { folder = b.dataset.fd; render(); } });
    // 运单表单
    $("result").addEventListener("change", e => {
      const el = e.target;
      if (!sel) return;
      if (el.dataset.need === "trk") { sel.needTrk = el.checked; showSel(false); }
      else if (el.dataset.need === "ph") { sel.needPh = el.checked; showSel(false); }
      else if (el.dataset.sf === "carrier") { sel.ship.carrier = el.value; sel.ship.trackingUrl = linkOf(el.value, sel.ship.trackingNo); showSel(false); }
      else if (el.dataset.sf === "trackingNo") { const n = norm(el.value); sel.ship.trackingNo = n; if (n) { const g = guessCarrier(n); if (g && carrierOf(g) && !sel.ship.carrier) sel.ship.carrier = g; sel.ship.trackingUrl = linkOf(sel.ship.carrier, n) || sel.ship.trackingUrl; } showSel(false); }
      else if (el.dataset.sf === "trackingUrl") { sel.ship.trackingUrl = el.value.trim(); paintAct(); }
    });
    $("result").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.sf) { e.preventDefault(); e.target.blur(); } });
    document.addEventListener("click", e => {
      const el = e.target;
      if (el.closest("#setModal") || el.closest("#finModal")) return;
      const nc = el.closest("[data-nmcant]");
      if (nc && sel && !busy) { sel.nmAsk = nc.dataset.nmcant; showSel(false); return; }
      const nr = el.closest("[data-nmr]");
      if (nr && sel && sel.nmAsk && !busy) {
        const k = Number(nr.dataset.nmr), opts = t("nmR");
        let why = opts[k];
        if (k === opts.length - 1) { const x = prompt(t("nmOtherQ")); if (!x || !x.trim()) return; why = x.trim().slice(0, 200); }
        const i = canLeft(sel.p).find(j => j.id === sel.nmAsk);
        sel.nmSkip = { id: sel.nmAsk, reason: why, title: i ? i.title : "" }; sel.on.delete(sel.nmAsk); sel.nmAsk = null; showSel(false); return;
      }
      if (el.closest("[data-nmundo]") && sel && !busy) { if (sel.nmSkip) sel.on.add(sel.nmSkip.id); sel.nmSkip = null; showSel(false); return; }
      const it = el.closest("[data-item]");
      if (it && sel && !busy) { const id = it.dataset.item; sel.on.has(id) ? sel.on.delete(id) : sel.on.add(id); showSel(false); return; }
      const ph = el.closest("[data-ph]");
      if (ph && sel) { if (ph.dataset.ph === "del") { sel.ship.photo = ""; showSel(false); } else $("photoIn").click(); return; }
      if (el.closest("[data-save]")) { save(); return; }
      if (el.closest("[data-edit]")) { startEdit(); return; }
      if (el.closest("[data-urledit]") && sel) { sel.urlEdit = true; showSel(false); const u = document.querySelector(".urlin"); if (u) u.focus(); return; }
      const z = el.closest("[data-zoom]");
      if (z) { const d = document.createElement("div"); d.className = "zoom"; d.innerHTML = `<img src="${esc(z.getAttribute("src"))}" alt="">`; d.onclick = () => d.remove(); document.body.appendChild(d); return; }
      if (el.closest("[data-undo]") && sel && !busy) { undo(sel.p); return; }
      const row = el.closest(".row[data-no], .hrow[data-no]");
      if (row) { const p = all.find(x => x.orderNo === row.dataset.no); if (p) { tab("tabScan"); openParcel(p, true); setTimeout(focusQ, 0); } return; }   // 点 = 查看
      if (!el.closest("input, button, a, select, textarea, label, summary, details")) setTimeout(focusQ, 0);
    });

    applyStatic(); paintKb(); paintWake(); idle();
    if (location.hash === "#all") { folder = "all"; tab("tabPrep"); }   // 会员系统总览「🧺 待随单寄出」点进来
    $("stats").textContent = t("loading"); $("list").innerHTML = `<div class="empty">${esc(t("loading"))}</div>`;
    const haveRange = initRange();
    window.__access.then(async a => {
      access = a;
      await loadCarriers();
      load(); setupClaims(); wakeGet();
      if (!haveRange) openRange(); else focusQ();
    });
  </script>
</body>
</html>
