<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 🔐 要「🧺 打包清单」权限；资料全部经后端 pkAdmin（只回传打包需要的资料） -->
  <script type="module">import { guard } from "/js/admin-guard.js"; window.__access = guard("pack");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>🧺 打包 - Mochiishop</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/jpeg" href="../logo.png">
  <link rel="stylesheet" href="../member-system/css/admin.css">
  <script src="../member-system/js/theme.js"></script>
  <style>
    /* ===== PDA 式版面：上 = 扫描列，中 = 结果，下 = 大按钮 + 分页 ===== */
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; }
    input { user-select: text; }
    .bar { background: #0f172a; color: #fff; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .bar a { color: #94a3b8; font-size: 1.1rem; padding: 2px 6px; }
    .bar h1 { font-size: 1rem; white-space: nowrap; }
    .bar .sp { margin-left: auto; display: flex; gap: 6px; align-items: center; min-width: 0; }
    .bar button { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 7px; padding: 5px 8px; font-size: .74rem; cursor: pointer; white-space: nowrap; }
    .bar button.on { background: #854d0e; border-color: #ca8a04; color: #fef9c3; }
    .bar .range { background: #db2777; border-color: #db2777; color: #fff; font-weight: 700; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }

    .scanbar { background: #0f172a; padding: 0 10px 10px; display: flex; gap: 8px; flex-shrink: 0; }
    .scanbar input { flex: 1; min-width: 0; font-size: 1.15rem; padding: 12px; border: 2px solid #db2777; border-radius: 10px; background: #fff; color: #0f172a; font-family: ui-monospace, Menlo, monospace; letter-spacing: .5px; }
    .scanbar input:focus { outline: none; box-shadow: 0 0 0 3px rgba(219,39,119,.35); }
    .scanbar button { border: 0; border-radius: 10px; font-size: 1.15rem; padding: 0 14px; cursor: pointer; background: #1e293b; color: #fff; }
    .scanbar .cam { background: #db2777; font-weight: 700; font-size: .95rem; }
    .scanbar button.off { opacity: .55; }
    .scanhint { background: #0f172a; color: #f9a8d4; font-size: .78rem; padding: 0 12px 8px; margin-top: -4px; flex-shrink: 0; }

    .stats { display: flex; gap: 6px; padding: 7px 10px; background: var(--card); border-bottom: 1px solid var(--line); font-size: .76rem; color: var(--text2); flex-shrink: 0; overflow-x: auto; white-space: nowrap; }
    .stats b { color: var(--ink); }
    .stats .pill { background: var(--soft); border-radius: 99px; padding: 2px 9px; }
    .stats .pk { background: var(--pink-bg); color: var(--pink-tx); }
    .stats .gn { background: var(--green-bg); color: var(--green-tx); }
    .stats .am { background: var(--amber-bg); color: var(--amber-tx); }

    main { flex: 1; min-height: 0; display: flex; }
    .tab { flex: 1; min-width: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px; }
    body:not(.wide) .tab:not(.on) { display: none; }

    /* 结果 */
    .idle { text-align: center; color: var(--muted); padding: 40px 10px; }
    .idle .big { font-size: 3.4rem; }
    .idle b { display: block; color: var(--ink); font-size: 1.1rem; margin: 6px 0 4px; }
    .res { border-radius: 14px; overflow: hidden; border: 3px solid #db2777; background: var(--card); }
    .res-head { background: #db2777; color: #fff; padding: 12px 14px; }
    .res.ok, .res.none { border-color: #16a34a; } .res.ok .res-head, .res.none .res-head { background: #16a34a; }
    .res.warn { border-color: #d97706; } .res.warn .res-head { background: #d97706; }
    .res.err { border-color: #dc2626; } .res.err .res-head { background: #dc2626; }
    .res-head .big { font-size: 1.6rem; font-weight: 900; line-height: 1.15; }
    .res-head .no { font-family: ui-monospace, Menlo, monospace; font-size: .86rem; opacity: .92; margin-top: 4px; word-break: break-all; }
    .res-head .who { font-size: 1rem; font-weight: 700; margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .tag { font-size: .68rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,.22); color: #fff; }
    .res-body { padding: 4px 10px 10px; }
    .sec-t { font-size: .78rem; font-weight: 800; color: var(--muted); margin: 12px 2px 2px; }
    .it { display: flex; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 1px dashed var(--line); min-height: 60px; cursor: pointer; }
    .it:last-of-type { border-bottom: 0; }
    .it .ic { font-size: 1.6rem; width: 36px; text-align: center; flex-shrink: 0; }
    .it .nm { flex: 1; min-width: 0; }
    .it .nm b { color: var(--ink); font-size: 1.02rem; display: block; }
    .it .nm small { display: block; color: var(--muted); font-size: .78rem; margin-top: 1px; }
    .it .ck { width: 38px; height: 38px; border-radius: 10px; border: 3px solid var(--line2); display: grid; place-items: center; font-size: 1.3rem; flex-shrink: 0; color: #fff; font-weight: 900; }
    .it.on .ck { background: #16a34a; border-color: #16a34a; }
    .it.off { opacity: .55; } .it.off .nm small::after { content: " · 这次不寄，留到下一单"; color: var(--amber-tx); }
    .it.sent { opacity: .55; cursor: default; } .it.sent b { text-decoration: line-through; }
    .it.sent .ck { background: #64748b; border-color: #64748b; }
    .warn { background: var(--amber-bg); border-radius: 10px; padding: 10px 12px; margin-top: 8px; font-size: .86rem; color: var(--amber-tx); }
    .note { font-size: .8rem; color: var(--blue-tx); background: var(--blue-bg); border-radius: 10px; padding: 8px 11px; margin-top: 8px; }
    .linkbtn { display: block; width: 100%; margin-top: 10px; background: none; border: 1px dashed var(--line2); color: var(--text2); border-radius: 10px; padding: 10px; font-size: .84rem; cursor: pointer; }

    /* 🚚 运单 + 📷 照片 */
    .ship { margin-top: 12px; border: 2px solid var(--line2); border-radius: 12px; padding: 10px; background: var(--soft2); }
    .ship .row2 { display: flex; gap: 8px; }
    .ship label { display: block; font-size: .74rem; color: var(--muted); margin: 6px 0 3px; font-weight: 700; }
    .ship select, .ship input[type=text], .ship input[type=url] { width: 100%; font-size: .95rem; padding: 9px 10px; border: 1.5px solid var(--line2); border-radius: 9px; background: var(--card); color: var(--ink); }
    .ship .trk { font-family: ui-monospace, Menlo, monospace; }
    .ship .need { display: flex; align-items: center; gap: 8px; font-size: .86rem; font-weight: 700; color: var(--ink); margin: 2px 0 0; cursor: pointer; }
    .ship .need input { width: 22px; height: 22px; accent-color: #db2777; }
    .ship .miss { color: #db2777; font-size: .78rem; font-weight: 700; margin-left: auto; }
    .ship .ok { color: var(--green-tx); font-size: .78rem; font-weight: 700; margin-left: auto; }
    .ship hr { border: 0; border-top: 1px dashed var(--line2); margin: 10px 0; }
    .photo { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    .photo img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 2px solid #16a34a; }
    .photo .shot { flex: 1; border: 2px dashed #db2777; background: var(--card); color: #db2777; border-radius: 10px; padding: 14px; font-weight: 800; font-size: .95rem; cursor: pointer; }
    .photo .del { background: none; border: 1px solid var(--line2); color: var(--text2); border-radius: 8px; padding: 6px 10px; cursor: pointer; }

    .hist { margin-top: 14px; }
    .hist h3 { font-size: .78rem; color: var(--muted); font-weight: 600; margin: 0 2px 6px; }
    .hrow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); margin-bottom: 5px; font-size: .84rem; cursor: pointer; }
    .hrow .no { font-family: ui-monospace, Menlo, monospace; font-size: .76rem; color: var(--text2); }
    .hrow .who { flex: 1; min-width: 0; color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hrow .st { font-weight: 700; font-size: .78rem; white-space: nowrap; }

    /* 清单 */
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .chips button { border: 1px solid var(--line2); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: .82rem; color: var(--text2); cursor: pointer; }
    .chips button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
    .row { display: flex; gap: 10px; align-items: center; padding: 11px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; cursor: pointer; }
    .row .l { flex: 1; min-width: 0; }
    .row .no { font-family: ui-monospace, Menlo, monospace; font-size: .76rem; color: var(--text2); word-break: break-all; }
    .row .who { font-weight: 700; color: var(--ink); font-size: .92rem; }
    .row .what { margin-top: 3px; }
    .row .what i { font-style: normal; display: inline-block; background: var(--soft); border-radius: 6px; padding: 1px 7px; margin: 2px 4px 0 0; font-size: .78rem; color: var(--text); }
    .row .what i.w { color: var(--amber-tx); background: var(--amber-bg); }
    .row .st { font-size: .82rem; font-weight: 800; white-space: nowrap; color: #db2777; }
    .row.done .st { color: var(--green-tx); } .row.done { opacity: .6; }
    .row.none .st { color: var(--muted); font-weight: 600; }
    .row.sel { outline: 2px solid #db2777; }
    .empty { padding: 40px 10px; text-align: center; color: var(--muted); }
    .sub { font-size: .76rem; color: var(--muted); margin: 2px 2px 10px; }
    .claimhint { font-size: .76rem; color: var(--muted); background: var(--soft2); border-radius: 9px; padding: 8px 10px; margin-bottom: 8px; }

    /* 准备：两个文件夹卡 */
    .folders { display: flex; gap: 0; margin-bottom: 10px; border-bottom: 2px solid var(--line2); }
    .folders button { flex: 1; border: 2px solid transparent; border-bottom: 0; background: none; padding: 10px 6px; font-size: .9rem; font-weight: 800; color: var(--muted); border-radius: 12px 12px 0 0; cursor: pointer; margin-bottom: -2px; }
    .folders button.on { background: var(--card); color: var(--ink); border-color: var(--line2); border-bottom: 2px solid var(--card); }
    .folders .n { display: inline-block; background: #db2777; color: #fff; font-size: .7rem; border-radius: 99px; padding: 0 6px; margin-left: 4px; }
    .prep { display: grid; gap: 8px; }
    .pg { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .pg summary { list-style: none; } .pg summary::-webkit-details-marker { display: none; }
    .pg summary > div { display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer; }
    .pg .ic { font-size: 1.5rem; }
    .pg .nm { flex: 1; color: var(--ink); font-weight: 700; }
    .pg .n { font-size: 1.45rem; font-weight: 900; color: #db2777; }
    .pg ul { list-style: none; margin: 0; padding: 0 14px 10px 54px; font-size: .82rem; color: var(--text2); }
    .pg li { padding: 4px 0; border-top: 1px dashed var(--line); display: flex; gap: 8px; }
    .pg li span { margin-left: auto; font-size: .74rem; font-weight: 700; }
    .pg li .t { color: #16a34a; } .pg li .w { color: var(--muted); }

    /* 下方：大按钮 + 分页 */
    .act { flex-shrink: 0; padding: 8px 10px; background: var(--card); border-top: 1px solid var(--line); }
    .act button { width: 100%; border: 0; border-radius: 12px; padding: 15px; font-size: 1.1rem; font-weight: 900; cursor: pointer; }
    .act .go { background: #16a34a; color: #fff; }
    .act .go.dis { background: var(--soft); color: var(--muted); }
    .act .next { background: var(--navy); color: #fff; }
    .tabs { flex-shrink: 0; display: flex; background: #0f172a; padding-bottom: env(safe-area-inset-bottom); }
    .tabs button { flex: 1; background: none; border: 0; color: #94a3b8; padding: 9px 4px 8px; font-size: .78rem; cursor: pointer; position: relative; }
    .tabs button .i { display: block; font-size: 1.25rem; }
    .tabs button.on { color: #fff; }
    .tabs button.on::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; background: #db2777; border-radius: 0 0 3px 3px; }
    .tabs .n { position: absolute; top: 3px; left: calc(50% + 8px); background: #db2777; color: #fff; font-size: .62rem; border-radius: 99px; padding: 0 5px; }

    /* 电脑 / 平板横向：扫描 + 清单 + 准备 并排 */
    body.wide .tabs { display: none; }
    body.wide #tabScan { flex: 0 0 460px; border-right: 1px solid var(--line); }
    body.wide #tabPrep { flex: 0 0 300px; border-left: 1px solid var(--line); }

    /* 弹窗：时间段 */
    .modal2 { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 90; display: flex; align-items: flex-end; justify-content: center; }
    .modal2 .box { background: var(--card); width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); }
    @media (min-width: 600px) { .modal2 { align-items: center; } .modal2 .box { border-radius: 18px; } }
    .modal2 h2 { font-size: 1.05rem; color: var(--ink); margin-bottom: 4px; }
    .opt { display: block; border: 2px solid var(--line2); border-radius: 12px; padding: 12px; margin-top: 10px; cursor: pointer; }
    .opt.on { border-color: #db2777; background: var(--pink-bg); }
    .opt b { color: var(--ink); } .opt small { display: block; color: var(--muted); margin-top: 3px; font-size: .8rem; }
    .opt input[type=date], .opt input[type=datetime-local] { margin-top: 8px; width: 100%; padding: 8px; border: 1.5px solid var(--line2); border-radius: 8px; background: var(--card); color: var(--ink); font-size: .9rem; }
    .opt .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .modal2 .go { width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 12px; background: #db2777; color: #fff; font-size: 1.05rem; font-weight: 900; cursor: pointer; }

    /* 📷 */
    .camv { position: fixed; inset: 0; background: rgba(0,0,0,.94); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
    .camv video { width: 100%; max-width: 520px; max-height: 70vh; border-radius: 12px; background: #000; object-fit: cover; }
    .camv .frame { position: relative; width: 100%; max-width: 520px; }
    .camv .frame::after { content: ""; position: absolute; left: 8%; right: 8%; top: 38%; height: 24%; border: 3px solid #f472b6; border-radius: 10px; pointer-events: none; }
    .camv p { color: #e2e8f0; font-size: .9rem; margin: 12px 0; text-align: center; }
    .camv button { background: #fff; color: #0f172a; border: 0; border-radius: 10px; padding: 12px 28px; font-weight: 800; font-size: 1rem; }
    .toast { position: fixed; left: 50%; top: 120px; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 1rem; font-weight: 700; z-index: 120; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
    .flash { animation: flash .45s; }
    @keyframes flash { from { filter: brightness(1.6); } to { filter: none; } }
  </style>
</head>
<body>
  <div class="bar">
    <a href="../" title="回到控制台">←</a><h1>🧺 打包</h1>
    <div class="sp">
      <button id="rangeBtn" class="range" title="今天要寄出的包裹：哪个时间段下的单">📅 …</button>
      <button id="wakeBtn" title="屏幕常亮：进入后 1 小时内不会自动关屏（有操作会再延长），按一下可以关掉">🔆</button>
      <button id="themeBtn" title="白色 / 暗黑模式">🌓</button>
      <button id="reloadBtn" title="重新读取">🔄</button>
    </div>
  </div>
  <div class="scanbar">
    <input id="q" placeholder="扫描订单号 / 追踪号" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search">
    <button id="kbBtn" title="⌨️ 键盘：关掉后点输入框不会跳出键盘（PDA 扫描枪用）">⌨️</button>
    <button id="camBtn" class="cam">📷 扫描</button>
  </div>
  <div class="scanhint" id="scanHint" hidden></div>
  <div class="stats" id="stats">读取中…</div>

  <main>
    <section id="tabScan" class="tab on">
      <div id="result"></div>
      <div id="hist" class="hist"></div>
    </section>
    <section id="tabList" class="tab">
      <div id="claimHint" class="claimhint" hidden></div>
      <div id="rangeInfo" class="sub"></div>
      <div id="chips" class="chips"></div>
      <div id="list"><div class="empty">读取中…</div></div>
    </section>
    <section id="tabPrep" class="tab">
      <div class="folders" id="folders">
        <button data-fd="today" class="on">📦 今天要寄<span class="n" id="nToday" hidden></span></button>
        <button data-fd="all">🗂️ 全部待寄<span class="n" id="nAll" hidden></span></button>
      </div>
      <div id="prepSub" class="sub"></div>
      <div id="prep" class="prep"></div>
    </section>
  </main>

  <div class="act" id="act" hidden></div>
  <nav class="tabs">
    <button data-tab="tabScan" class="on"><span class="i">📷</span>扫描</button>
    <button data-tab="tabList"><span class="i">📋</span>清单<span class="n" id="nList" hidden></span></button>
    <button data-tab="tabPrep"><span class="i">🎁</span>准备<span class="n" id="nPrep" hidden></span></button>
  </nav>

  <!-- 📅 时间段：同一天只弹第一次 -->
  <div id="rangeModal" class="modal2" hidden>
    <div class="box">
      <h2>📅 今天要寄出的包裹</h2>
      <div class="sub" style="margin:0">选哪个时间段下的单。扫描不受影响：扫到任何一张单都会显示那位会员所有待寄的东西。</div>
      <label class="opt" data-opt="live"><b>🎥 直播时段</b><small id="optLive"></small></label>
      <label class="opt" data-opt="day"><b>📆 一天</b><small>00:00 – 23:59</small><input type="date" id="optDay"></label>
      <label class="opt" data-opt="custom"><b>✏️ 自定义</b><small>自己选开始和结束</small>
        <div class="two"><input type="datetime-local" id="optFrom"><input type="datetime-local" id="optTo"></div></label>
      <button class="go" id="rangeGo">确定</button>
    </div>
  </div>

  <input type="file" id="photoIn" accept="image/*" capture="environment" hidden>

  <div id="cam" class="camv" hidden>
    <div class="frame"><video id="video" playsinline muted></video></div>
    <p id="camMsg">把条码对准框框</p>
    <button id="camClose">关闭</button>
  </div>

  <script type="module">
    import { app, db } from "../member-system/js/firebase-config.js";
    import { can } from "/js/admin-guard.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-functions.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const pkAdmin = httpsCallable(getFunctions(app, "asia-southeast1"), "pkAdmin");
    const $ = id => document.getElementById(id);
    const esc = x => String(x == null ? "" : x).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const norm = s => String(s || "").replace(/\s/g, "").toUpperCase();
    const noOk = no => /^[A-Z0-9]{6,40}$/.test(no);
    const errText = e => (e && e.message) || String(e);
    const PLAT = { shopee: "Shopee", tiktok: "TikTok" };
    const txId = () => "pk_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 10);
    const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
    const pad = n => String(n).padStart(2, "0");
    const fmtT = ms => { const d = new Date(ms); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const DAY = 86400000;

    // 订单号格式：Shopee = 6 位日期 + 8 位英数；TikTok = 5 开头 18 位数字
    const isOrderNo = t => /^\d{6}[A-Z0-9]{8}$/.test(t) || /^5\d{17}$/.test(t);
    // 追踪号：至少 8 个数字（买家名不会这样）、或已知开头
    const looksTracking = t => !isOrderNo(t) && /^[A-Z0-9-]{8,40}$/.test(t) && ((t.match(/\d/g) || []).length >= 8 || /^(SPX|NV|JNT|JT)/.test(t));

      if (!sel.on.size) m.push("勾选要放的东西");
      if (sel.needTrk && !sel.ship.trackingNo) m.push("扫追踪号");
      if (sel.needTrk && sel.ship.trackingNo && !sel.ship.carrier) m.push("选运输公司");
      if (sel.needTrk && sel.ship.trackingUrl && !/^https:\/\//i.test(sel.ship.trackingUrl)) m.push("链接要 https://");
      if (sel.needPh && !sel.ship.photo) m.push("拍照");
      return m;
    }
    function paintHint() {
      const h = $("scanHint");
      if (sel && canLeft(sel.p).length && sel.needTrk && !sel.ship.trackingNo) { h.hidden = false; h.textContent = "👉 下一步：扫面单上的「追踪号」条码"; }
      else h.hidden = true;
    }
    function paintAct() {
      const a = $("act");
      if (!sel) { a.hidden = true; return; }
      a.hidden = false;
      const c = canLeft(sel.p);
      if (!c.length) { a.innerHTML = `<button class="next" data-next>▶ 扫下一包</button>`; return; }
      const m = missing();
      a.innerHTML = m.length ? `<button class="go dis" data-save>还要：${esc(m.join("、"))}</button>`
        : `<button class="go" data-save ${busy ? "disabled" : ""}>💾 保存＝已放好（${sel.on.size} 样）</button>`;
    }
    function idle() {
      sel = null;
      $("result").innerHTML = `<div class="idle"><div class="big">📦</div><b>扫面单上的订单号条码</b>扫描枪、📷 相机，或输入单号后几位 / 买家名</div>`;
      paintHint(); paintAct();
    }
    function addHist(p) { const i = hist.findIndex(h => h === p.orderNo); if (i >= 0) hist.splice(i, 1); hist.unshift(p.orderNo); if (hist.length > 30) hist.pop(); renderHist(); }
    function renderHist() {
      $("hist").innerHTML = !hist.length ? "" : `<h3>刚刚扫过</h3>` + hist.slice(0, 10).map(no => {
        const p = all.find(x => x.orderNo === no) || (sel && sel.p.orderNo === no ? sel.p : null);
        if (!p) return "";
        const c = canLeft(p).length, s = p.items.filter(i => i.sent).length;
        const st = c ? `<span class="st" style="color:#db2777">🎁 ${c} 样没放</span>` : s || p.done ? '<span class="st" style="color:var(--green-tx)">✅ 已放好</span>' : '<span class="st" style="color:var(--muted)">⭕ 不用放</span>';
        return `<div class="hrow" data-no="${esc(p.orderNo)}"><span class="no">…${esc(p.orderNo.slice(-6))}</span><span class="who">${esc(p.username || "")}</span>${st}</div>`;
      }).join("");
    }

    // ---------- 扫描 / 输入 ----------
    async function find(raw) {
      const q = String(raw || "").trim();
      if (!q) return;
      wakeTouch();
      const n = norm(q);
      $("q").value = ""; $("q").placeholder = q;
      tab("tabScan");
      // 先比对今天的订单：是订单号就打开那一包
      let p = all.find(x => x.orderNo === n);
      if (!p) {
        // 打开的包裹还要放东西 → 这一下是追踪号
        if (sel && canLeft(sel.p).length && looksTracking(n)) { setTracking(n); return; }
        if (!sel && looksTracking(n) && /^(SPX|NV)|^\d{12,16}$|^[A-Z]{2}\d{9,12}[A-Z]{0,2}$/.test(n)) {
          beep("bad"); toast("这是追踪号：请先扫「订单号」"); return;
        }
      }
      if (!p && n.length >= 4 && !isOrderNo(n)) { const m = all.filter(x => x.orderNo.endsWith(n)); if (m.length === 1) p = m[0]; else if (m.length > 1) return listPick(m, `单号后几位「${q}」有 ${m.length} 张单`); }
      if (!p && !isOrderNo(n)) { const m = all.filter(x => (x.username || "").toLowerCase() === q.toLowerCase()); if (m.length === 1) p = m[0]; else if (m.length > 1) return listPick(m, `买家「${q}」有 ${m.length} 张单`); }
      if (p) { beep(canLeft(p).length ? "items" : "ok"); openParcel(p); return; }
      // 不在今天的时间段：问后端（任何一天的单都可以扫）
      $("result").innerHTML = '<div class="idle"><div class="big">🔎</div><b>查找中…</b></div>';
      try {
        const r = (await pkAdmin(noOk(n) ? { op: "lookup", orderNo: n } : { op: "lookup", username: q })).data;
        if (!r.found) { beep("bad"); sel = null; paintAct(); paintHint();
          $("result").innerHTML = `<div class="res err"><div class="res-head"><div class="big">❌ 找不到</div><div class="no">${esc(q)}</div></div>
            <div class="res-body"><div class="note" style="margin-top:10px">订单要先录入（订单录入页或表格提交），同步后才查得到。</div></div></div>`; return; }
        const x = r.parcel;
        attachClaims(x); addSent(x);
        if (!all.some(y => y.orderNo === x.orderNo)) all.push(x);
        beep(canLeft(x).length ? "items" : "ok");
        openParcel(x); render();
      } catch (e) { beep("bad"); $("result").innerHTML = `<div class="res err"><div class="res-head"><div class="big">❌ 出错了</div></div><div class="res-body"><div class="note" style="margin-top:10px">${esc(errText(e))}</div></div></div>`; }
    }
    function setTracking(no) {
      const s = sel.ship;
      s.trackingNo = no;
      const g = guessCarrier(no);
      if (g && carrierOf(g)) s.carrier = g;
      s.trackingUrl = linkOf(s.carrier, no) || s.trackingUrl;
      sel.needTrk = true;
      beep("ok"); toast(`🚚 ${carrierOf(s.carrier) ? carrierOf(s.carrier).name : "运单号"} ${no}`);
      showSel(false);
    }
    function listPick(m, title) {
      beep("ok"); sel = null; paintAct(); paintHint();
      $("result").innerHTML = `<div class="note">${esc(title)}，选一张：</div>` +
        m.map(p => `<div class="row" data-no="${esc(p.orderNo)}" style="margin-top:6px"><div class="l"><div class="no">${esc(p.orderNo)}</div><div class="who">${esc(p.username)}</div></div>
          <span class="st">${canLeft(p).length ? canLeft(p).length + " 样" : "—"}</span></div>`).join("");
    }

    // ---------- 📷 照片（压缩到大约 100KB 内）----------
    function compress(file) {
      return new Promise((ok, no) => {
        const img = new Image();
        img.onload = () => {
          let max = 900, url = "";
          for (let i = 0; i < 4; i++) {
            const k = Math.min(1, max / Math.max(img.width, img.height));
            const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            url = c.toDataURL("image/webp", .72);
            if (!url.startsWith("data:image/webp")) url = c.toDataURL("image/jpeg", .75);
            if (url.length < 140 * 1024) break;
            max = Math.round(max * .75);
          }
          URL.revokeObjectURL(img.src); ok(url);
        };
        img.onerror = no; img.src = URL.createObjectURL(file);
      });
    }
    $("photoIn").addEventListener("change", async e => {
      const f = e.target.files && e.target.files[0]; e.target.value = "";
      if (!f || !sel) return;
      try { sel.ship.photo = await compress(f); beep("ok"); } catch (err) { alert("照片读取失败：" + errText(err)); }
      showSel(false);
    });

    // ---------- 💾 保存＝已放好 ----------
    async function save() {
      if (busy || !sel) return;
      const m = missing();
      if (m.length) { beep("bad"); toast("还要：" + m.join("、")); return; }
      const p = sel.p, items = canLeft(p).filter(i => sel.on.has(i.id));
      const s = sel.ship, ship = {};
      if (sel.needTrk && s.trackingNo) { const c = carrierOf(s.carrier); Object.assign(ship, { carrier: s.carrier, carrierName: c ? c.name : "", trackingNo: s.trackingNo, trackingUrl: s.trackingUrl }); }
      if (sel.needPh && s.photo) ship.photo = s.photo;
      wakeTouch();
      const svr = items.filter(i => i.kind !== "claim"), cl = items.filter(i => i.kind === "claim");
      busy = true; paintAct();
      const failed = [];
      try {
        const r = (await pkAdmin({ op: "ship", orderNo: p.orderNo, items: svr.map(i => ({ kind: i.kind, id: i.id })), txId: txId(), done: true, ship })).data;
        (r.results || []).forEach(x => {
          const it = svr.find(i => i.id === x.id);
          if (!x.ok) failed.push(`${(it || {}).title || x.id}：${x.error}`);
          else if (it) sentLog.set(p.orderNo, (sentLog.get(p.orderNo) || []).concat([it]));
        });
        for (const i of cl) {
          try { await shipClaim(i, p.orderNo, ship); sentLog.set(p.orderNo, (sentLog.get(p.orderNo) || []).concat([i])); }
          catch (e) { failed.push(`${i.title}：${errText(e)}`); }
        }
      } catch (e) { failed.push(errText(e)); }
      busy = false;
      if (failed.length) { beep("bad"); alert("有些没成功：\n\n" + failed.join("\n")); }
      else { beep("ok"); toast("✅ 这一包放好了"); }
      await load();
      focusQ();
    }

    // ---------- ↩️ 撤销这一包 ----------
    async function undo(p) {
      if (!confirm(`↩️ 撤销 ${p.orderNo}（${p.username || ""}）这一包？\n\n这一包用打包清单寄出的东西会全部退回：\n• 小礼物 → 待寄\n• 中奖奖品、兑换、签到达人礼物 → 待发货\n运单号、照片也会一起清掉。\n\n会员已经确认收到的不会动。迎新礼要到「新会员奖励」处理。`)) return;
      busy = true; paintAct();
      try {
        const r = (await pkAdmin({ op: "undo", orderNo: p.orderNo })).data;
        let cl = 0;
        for (const i of (sentLog.get(p.orderNo) || []).filter(i => i.kind === "claim")) {
          try { await claimDb.ref(`draw_private/claimBatches/${i.bid}/items/${i.key}`).update({ shipped: false }); cl++; claimItems.push(i); } catch (e) {}
        }
        sentLog.delete(p.orderNo);
        const n = r.smallGifts + r.prizes + r.redemptions + cl;
        alert(`↩️ 已撤销：退回 ${n} 样` + (r.welcome ? `\n\n⚠️ 这一包有 ${r.welcome} 份迎新礼已寄出，要到「新会员奖励」处理` : "") + (r.kept ? `\n\nℹ️ ${r.kept} 样会员已确认收到 / 已完成，没有退回` : ""));
      } catch (e) { alert("❌ " + errText(e)); }
      busy = false;
      await load();
    }

    // ---------- 🏆 领奖追踪（非会员得主）：同一个浏览器登录过领奖追踪才读得到 ----------
    async function setupClaims() {
      if (!access || !can(access, "draw.claims")) return;
      try {
        await loadScript("https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js");
        await loadScript("https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js");
        await loadScript("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js");
        const fb = window.firebase;
        if (!fb.apps.length) fb.initializeApp(DRAW_CONFIG);   // 和领奖追踪同一组设定 → 同一个网站登录过就直接是登录状态
        fb.auth().onAuthStateChanged(async u => {
          if (!u) { $("claimHint").hidden = false; $("claimHint").innerHTML = '🏆 非会员抽奖得主的奖品：<a href="../draw_tournament/claims.html" target="_blank">登录领奖追踪</a> 后重新整理这一页，也会一起列出。'; return; }
          claimDb = fb.database();
          const v = (await claimDb.ref("draw_private/claimBatches").once("value")).val() || {};
          claimItems = [];
          Object.entries(v).forEach(([bid, b]) => Object.entries((b && b.items) || {}).forEach(([k, x]) => {
            if (!x || x.removed || x.voided || x.shipped) return;
            claimItems.push({ kind: "claim", id: `${bid}|${k}`, bid, key: k, icon: "🏆", title: `领奖追踪「${x.rank || "奖品"}」`,
              prep: `${b.label || ""} ${x.rank || "奖品"}`.trim(), sub: `${b.label || ""}${b.title ? " · " + b.title : ""} · 非会员得主`, can: true,
              name: String(x.name || "").toLowerCase(), orderNo: x.orderNo || "" });
          }));
          $("claimHint").hidden = true;
          all.forEach(attachClaims); render(); if (sel) showSel(false);
        });
      } catch (e) { console.warn("claims", e); }
    }
    function loadScript(src) {
      return new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok();
        const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
    }
    const platOfNo = no => { const c = norm(no).charAt(0); return c === "5" ? "tiktok" : c === "2" ? "shopee" : ""; };
    function attachClaims(p) {
      if (p.uid || !claimItems.length) return;
      claimItems.filter(c => c.name && c.name === String(p.username || "").toLowerCase() && (!platOfNo(c.orderNo) || platOfNo(c.orderNo) === p.platform))
        .forEach(c => { if (!p.items.some(i => i.id === c.id)) p.items.push({ ...c }); });
    }
    async function shipClaim(i, orderNo, ship) {
      if (!claimDb) throw new Error("没有登录领奖追踪");
      const ref = claimDb.ref(`draw_private/claimBatches/${i.bid}/items/${i.key}`);
      const cur = (await ref.once("value")).val() || {};
      const trk = ship.trackingNo ? ` · ${ship.carrierName || ""} ${ship.trackingNo}` : "";
      const note = [cur.note, `随 ${orderNo} 寄出${trk}（打包清单）`].filter(Boolean).join(" · ").slice(0, 200);
      await ref.update({ shipped: true, note, ts: window.firebase.database.ServerValue.TIMESTAMP });
      claimItems = claimItems.filter(c => c.id !== i.id);
    }

    // ---------- 📷 相机扫条码（Chrome / Android 用内建 BarcodeDetector；iPhone 用 ZXing）----------
    let stream = null, stopScan = null;
    async function openCam() {
      wakeTouch();
      $("cam").hidden = false;
      $("camMsg").textContent = sel && canLeft(sel.p).length && !sel.ship.trackingNo ? "扫「追踪号」条码" : "扫「订单号」条码";
      const video = $("video");
      const done = text => { closeCam(); find(text); };
      try {
        if ("BarcodeDetector" in window) {
          const det = new BarcodeDetector({ formats: ["code_128", "qr_code", "code_39", "ean_13"] });
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } }, audio: false });
          video.srcObject = stream; await video.play();
          let alive = true; stopScan = () => { alive = false; };
          const tick = async () => {
            if (!alive) return;
            try { const r = await det.detect(video); const hit = r.map(x => norm(x.rawValue)).find(t => noOk(t) || /^[A-Z0-9-]{8,40}$/.test(t)); if (hit) return done(hit); } catch (e) {}
            setTimeout(tick, 120);
          };
          tick();
        } else {
          await loadScript("https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js");
          const reader = new ZXingBrowser.BrowserMultiFormatReader();
          const ctl = await reader.decodeFromConstraints({ video: { facingMode: "environment" } }, video, res => {
            if (!res) return; const t = norm(res.getText()); if (/^HTTPS?:/.test(t)) return; if (noOk(t) || /^[A-Z0-9-]{8,40}$/.test(t)) done(t);
          });
          stopScan = () => ctl.stop();
        }
      } catch (e) { $("camMsg").textContent = "❌ 打不开相机：" + errText(e) + "（请允许使用相机，或直接输入）"; }
    }
    function closeCam() {
      try { stopScan && stopScan(); } catch (e) {}
      stopScan = null;
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      $("video").srcObject = null; $("cam").hidden = true; focusQ();
    }

    // ---------- 分页（手机）/ 并排（电脑）----------
    function tab(id) {
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === id));
      document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === id));
    }
    const wideQ = matchMedia("(min-width: 1000px)");
    const paintWide = () => document.body.classList.toggle("wide", wideQ.matches);
    wideQ.addEventListener ? wideQ.addEventListener("change", paintWide) : wideQ.addListener(paintWide);
    paintWide();

    // ---------- 事件 ----------
    $("q").addEventListener("keydown", e => {
      if ((e.key === "Enter" || e.key === "Tab") && !e.isComposing) { if (!$("q").value.trim()) return; e.preventDefault(); find($("q").value); }
    });
    $("camBtn").onclick = openCam;
    $("camClose").onclick = closeCam;
    $("reloadBtn").onclick = () => load();
    $("themeBtn").onclick = () => {
      const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t); store.set("msAdminTheme", t);
    };
    document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab(b.dataset.tab); if (b.dataset.tab === "tabScan") focusQ(); });
    $("chips").addEventListener("click", e => { const b = e.target.closest("button[data-f]"); if (b) { filter = b.dataset.f; render(); } });
    $("folders").addEventListener("click", e => { const b = e.target.closest("button[data-fd]"); if (b) { folder = b.dataset.fd; render(); } });
    // 运单表单
    $("result").addEventListener("change", e => {
      const t = e.target;
      if (!sel) return;
      if (t.dataset.need === "trk") { sel.needTrk = t.checked; showSel(false); }
      else if (t.dataset.need === "ph") { sel.needPh = t.checked; showSel(false); }
      else if (t.dataset.sf === "carrier") { sel.ship.carrier = t.value; sel.ship.trackingUrl = linkOf(t.value, sel.ship.trackingNo); showSel(false); }
      else if (t.dataset.sf === "trackingNo") { const n = norm(t.value); sel.ship.trackingNo = n; if (n) { const g = guessCarrier(n); if (g && carrierOf(g) && !sel.ship.carrier) sel.ship.carrier = g; sel.ship.trackingUrl = linkOf(sel.ship.carrier, n) || sel.ship.trackingUrl; } showSel(false); }
      else if (t.dataset.sf === "trackingUrl") { sel.ship.trackingUrl = t.value.trim(); paintAct(); }
    });
    $("result").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.sf) { e.preventDefault(); e.target.blur(); } });
    document.addEventListener("click", e => {
      const t = e.target;
      const it = t.closest("[data-item]");
      if (it && sel && !busy) { const id = it.dataset.item; sel.on.has(id) ? sel.on.delete(id) : sel.on.add(id); showSel(false); return; }
      const ph = t.closest("[data-ph]");
      if (ph && sel) { if (ph.dataset.ph === "del") { sel.ship.photo = ""; showSel(false); } else $("photoIn").click(); return; }
      if (t.closest("[data-save]")) { save(); return; }
      if (t.closest("[data-next]")) { idle(); focusQ(); return; }
      if (t.closest("[data-undo]") && sel && !busy) { undo(sel.p); return; }
      const row = t.closest(".row[data-no], .hrow[data-no]");
      if (row) { const p = all.find(x => x.orderNo === row.dataset.no); if (p) { tab("tabScan"); openParcel(p); } return; }
      if (!t.closest("input, button, a, select, textarea, label, summary, details")) setTimeout(focusQ, 0);
    });

    paintKb(); paintWake(); idle();
    const haveRange = initRange();
    window.__access.then(async a => {
      access = a;
      await loadCarriers();
      load(); setupClaims(); wakeGet();
      if (!haveRange) openRange(); else focusQ();
    });
  </script>
</body>
</html>
