<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 🔐 要「🧺 打包清单」权限；资料全部经后端 pkAdmin（只回传打包需要的资料） -->
  <script type="module">import { guard } from "/js/admin-guard.js"; window.__access = guard("pack");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>🧺 打包 - Mochiishop</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/jpeg" href="../logo.png">
  <link rel="stylesheet" href="../member-system/css/admin.css">
  <script src="../member-system/js/theme.js"></script>
  <style>
    /* ===== PDA 式版面：上 = 扫描列，中 = 结果，下 = 大按钮 + 分页 ===== */
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; }
    input { user-select: text; }
    .bar { background: #0f172a; color: #fff; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .bar a { color: #94a3b8; font-size: 1.1rem; padding: 2px 6px; }
    .bar h1 { font-size: 1rem; white-space: nowrap; }
    .bar .sp { margin-left: auto; display: flex; gap: 6px; align-items: center; }
    .bar button { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 7px; padding: 5px 8px; font-size: .74rem; cursor: pointer; white-space: nowrap; }
    .bar button.on { background: #854d0e; border-color: #ca8a04; color: #fef9c3; }
    .seg { display: inline-flex; border: 1px solid #334155; border-radius: 7px; overflow: hidden; }
    .seg button { border: 0; border-radius: 0; }
    .seg button.on { background: #db2777; color: #fff; }

    .scanbar { background: #0f172a; padding: 0 10px 10px; display: flex; gap: 8px; flex-shrink: 0; }
    .scanbar input { flex: 1; min-width: 0; font-size: 1.15rem; padding: 12px; border: 2px solid #db2777; border-radius: 10px; background: #fff; color: #0f172a; font-family: ui-monospace, Menlo, monospace; letter-spacing: .5px; }
    .scanbar input:focus { outline: none; box-shadow: 0 0 0 3px rgba(219,39,119,.35); }
    .scanbar button { border: 0; border-radius: 10px; font-size: 1.15rem; padding: 0 14px; cursor: pointer; background: #1e293b; color: #fff; }
    .scanbar .cam { background: #db2777; font-weight: 700; font-size: .95rem; }
    .scanbar button.off { opacity: .55; }

    .stats { display: flex; gap: 6px; padding: 7px 10px; background: var(--card); border-bottom: 1px solid var(--line); font-size: .76rem; color: var(--text2); flex-shrink: 0; overflow-x: auto; white-space: nowrap; }
    .stats b { color: var(--ink); }
    .stats .pill { background: var(--soft); border-radius: 99px; padding: 2px 9px; }
    .stats .pk { background: var(--pink-bg); color: var(--pink-tx); }
    .stats .gn { background: var(--green-bg); color: var(--green-tx); }
    .stats .am { background: var(--amber-bg); color: var(--amber-tx); }

    main { flex: 1; min-height: 0; display: flex; }
    .tab { flex: 1; min-width: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px; }
    body:not(.wide) .tab:not(.on) { display: none; }

    /* 结果 */
    .idle { text-align: center; color: var(--muted); padding: 40px 10px; }
    .idle .big { font-size: 3.4rem; }
    .idle b { display: block; color: var(--ink); font-size: 1.1rem; margin: 6px 0 4px; }
    .res { border-radius: 14px; overflow: hidden; border: 3px solid #db2777; background: var(--card); }
    .res-head { background: #db2777; color: #fff; padding: 12px 14px; }
    .res.ok { border-color: #16a34a; } .res.ok .res-head { background: #16a34a; }
    .res.none { border-color: #16a34a; } .res.none .res-head { background: #16a34a; }
    .res.warn { border-color: #d97706; } .res.warn .res-head { background: #d97706; }
    .res.err { border-color: #dc2626; } .res.err .res-head { background: #dc2626; }
    .res-head .big { font-size: 1.6rem; font-weight: 900; line-height: 1.15; }
    .res-head .no { font-family: ui-monospace, Menlo, monospace; font-size: .86rem; opacity: .92; margin-top: 4px; word-break: break-all; }
    .res-head .who { font-size: 1rem; font-weight: 700; margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .tag { font-size: .68rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,.22); color: #fff; }
    .res-body { padding: 4px 10px 10px; }
    .it { display: flex; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 1px dashed var(--line); min-height: 64px; cursor: pointer; }
    .it:last-of-type { border-bottom: 0; }
    .it .ic { font-size: 1.7rem; width: 38px; text-align: center; flex-shrink: 0; }
    .it .nm { flex: 1; min-width: 0; }
    .it .nm b { color: var(--ink); font-size: 1.05rem; display: block; }
    .it .nm small { display: block; color: var(--muted); font-size: .78rem; margin-top: 1px; }
    .it .ck { width: 40px; height: 40px; border-radius: 10px; border: 3px solid var(--line2); display: grid; place-items: center; font-size: 1.4rem; flex-shrink: 0; color: #fff; }
    .it.sent { opacity: .55; cursor: default; } .it.sent b { text-decoration: line-through; }
    .it.sent .ck { background: #16a34a; border-color: #16a34a; }
    .warn { background: var(--amber-bg); border-radius: 10px; padding: 10px 12px; margin-top: 8px; font-size: .86rem; color: var(--amber-tx); }
    .note { font-size: .8rem; color: var(--blue-tx); background: var(--blue-bg); border-radius: 10px; padding: 8px 11px; margin-top: 8px; }
    .linkbtn { display: block; width: 100%; margin-top: 10px; background: none; border: 1px dashed var(--line2); color: var(--text2); border-radius: 10px; padding: 10px; font-size: .84rem; cursor: pointer; }

    .hist { margin-top: 14px; }
    .hist h3 { font-size: .78rem; color: var(--muted); font-weight: 600; margin: 0 2px 6px; }
    .hrow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); margin-bottom: 5px; font-size: .84rem; cursor: pointer; }
    .hrow .no { font-family: ui-monospace, Menlo, monospace; font-size: .76rem; color: var(--text2); }
    .hrow .who { flex: 1; min-width: 0; color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hrow .st { font-weight: 700; font-size: .78rem; white-space: nowrap; }

    /* 清单 */
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .chips button { border: 1px solid var(--line2); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: .82rem; color: var(--text2); cursor: pointer; }
    .chips button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
    .row { display: flex; gap: 10px; align-items: center; padding: 11px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; cursor: pointer; }
    .row .l { flex: 1; min-width: 0; }
    .row .no { font-family: ui-monospace, Menlo, monospace; font-size: .76rem; color: var(--text2); word-break: break-all; }
    .row .who { font-weight: 700; color: var(--ink); font-size: .92rem; }
    .row .what { margin-top: 3px; }
    .row .what i { font-style: normal; display: inline-block; background: var(--soft); border-radius: 6px; padding: 1px 7px; margin: 2px 4px 0 0; font-size: .78rem; color: var(--text); }
    .row .what i.w { color: var(--amber-tx); background: var(--amber-bg); }
    .row .st { font-size: .82rem; font-weight: 800; white-space: nowrap; color: #db2777; }
    .row.done { opacity: .5; } .row.done .st { color: var(--green-tx); }
    .row.sel { outline: 2px solid #db2777; }
    .empty { padding: 40px 10px; text-align: center; color: var(--muted); }
    .sub { font-size: .76rem; color: var(--muted); margin: 2px 2px 10px; }
    .finish { width: 100%; margin-top: 10px; padding: 13px; border-radius: 10px; border: 2px solid #16a34a; background: var(--green-bg); color: var(--green-tx); font-weight: 800; font-size: .95rem; cursor: pointer; }
    .claimhint { font-size: .76rem; color: var(--muted); background: var(--soft2); border-radius: 9px; padding: 8px 10px; margin-bottom: 8px; }

    /* 准备 */
    .prep { display: grid; gap: 8px; }
    .prep div { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .prep .ic { font-size: 1.6rem; }
    .prep .nm { flex: 1; color: var(--ink); font-weight: 700; }
    .prep .n { font-size: 1.5rem; font-weight: 900; color: #db2777; }

    /* 下方：大按钮 + 分页 */
    .act { flex-shrink: 0; padding: 8px 10px; background: var(--card); border-top: 1px solid var(--line); }
    .act button { width: 100%; border: 0; border-radius: 12px; padding: 16px; font-size: 1.15rem; font-weight: 900; cursor: pointer; }
    .act .go { background: #16a34a; color: #fff; }
    .act .next { background: var(--navy); color: #fff; }
    .act button:disabled { opacity: .55; }
    .tabs { flex-shrink: 0; display: flex; background: #0f172a; padding-bottom: env(safe-area-inset-bottom); }
    .tabs button { flex: 1; background: none; border: 0; color: #94a3b8; padding: 9px 4px 8px; font-size: .78rem; cursor: pointer; position: relative; }
    .tabs button .i { display: block; font-size: 1.25rem; }
    .tabs button.on { color: #fff; }
    .tabs button.on::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; background: #db2777; border-radius: 0 0 3px 3px; }
    .tabs .n { position: absolute; top: 3px; left: calc(50% + 8px); background: #db2777; color: #fff; font-size: .62rem; border-radius: 99px; padding: 0 5px; }

    /* 电脑 / 平板横向：扫描 + 清单 + 准备 并排，不用分页 */
    body.wide .tabs { display: none; }
    body.wide main { gap: 0; }
    body.wide #tabScan { flex: 0 0 440px; border-right: 1px solid var(--line); }
    body.wide #tabPrep { flex: 0 0 260px; border-left: 1px solid var(--line); }
    body.wide .act { position: static; }

    /* 📷 */
    .camv { position: fixed; inset: 0; background: rgba(0,0,0,.94); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
    .camv video { width: 100%; max-width: 520px; max-height: 70vh; border-radius: 12px; background: #000; object-fit: cover; }
    .camv .frame { position: relative; width: 100%; max-width: 520px; }
    .camv .frame::after { content: ""; position: absolute; left: 8%; right: 8%; top: 38%; height: 24%; border: 3px solid #f472b6; border-radius: 10px; pointer-events: none; }
    .camv p { color: #e2e8f0; font-size: .9rem; margin: 12px 0; text-align: center; }
    .camv button { background: #fff; color: #0f172a; border: 0; border-radius: 10px; padding: 12px 28px; font-weight: 800; font-size: 1rem; }
    .toast { position: fixed; left: 50%; top: 120px; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 1rem; font-weight: 700; z-index: 120; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
    .flash { animation: flash .45s; }
    @keyframes flash { from { filter: brightness(1.6); } to { filter: none; } }
  </style>
</head>
<body>
  <div class="bar">
    <a href="../" title="回到控制台">←</a><h1>🧺 打包</h1>
    <div class="sp">
      <span class="seg" title="这次 = 上次按「这批打包完成」之后下的单"><button data-scope="now" class="on">这次</button><button data-scope="all">14 天</button></span>
      <button id="wakeBtn" title="屏幕常亮：进入后 1 小时内不会自动关屏（有操作会再延长），按一下可以关掉">🔆 常亮</button>
      <button id="themeBtn" title="白色 / 暗黑模式">🌓</button>
      <button id="reloadBtn" title="重新读取">🔄</button>
    </div>
  </div>
  <div class="scanbar">
    <input id="q" placeholder="扫描 / 输入单号、买家名" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search">
    <button id="kbBtn" title="⌨️ 键盘：关掉后点输入框不会跳出键盘（PDA 扫描枪用）">⌨️</button>
    <button id="camBtn" class="cam">📷 扫描</button>
  </div>
  <div class="stats" id="stats">读取中…</div>

  <main>
    <section id="tabScan" class="tab on">
      <div id="result"></div>
      <div id="hist" class="hist"></div>
    </section>
    <section id="tabList" class="tab">
      <div id="claimHint" class="claimhint" hidden></div>
      <div id="scopeInfo" class="sub"></div>
      <div id="chips" class="chips"></div>
      <div id="list"><div class="empty">读取中…</div></div>
      <button id="finishBtn" class="finish">✅ 这批打包完成</button>
    </section>
    <section id="tabPrep" class="tab">
      <div class="sub">打包前先把这些拿齐（这次还没放的）</div>
      <div id="prep" class="prep"></div>
    </section>
  </main>

  <div class="act" id="act" hidden></div>
  <nav class="tabs">
    <button data-tab="tabScan" class="on"><span class="i">📷</span>扫描</button>
    <button data-tab="tabList"><span class="i">📋</span>清单<span class="n" id="nList" hidden></span></button>
    <button data-tab="tabPrep"><span class="i">🎁</span>准备<span class="n" id="nPrep" hidden></span></button>
  </nav>

  <div id="cam" class="camv" hidden>
    <div class="frame"><video id="video" playsinline muted></video></div>
    <p id="camMsg">把订单号条码对准框框</p>
    <button id="camClose">关闭</button>
  </div>

  <script type="module">
    import { app } from "../member-system/js/firebase-config.js";
    import { can } from "/js/admin-guard.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-functions.js";

    const pkAdmin = httpsCallable(getFunctions(app, "asia-southeast1"), "pkAdmin");
    const $ = id => document.getElementById(id);
    const esc = x => String(x == null ? "" : x).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const norm = s => String(s || "").replace(/\s/g, "").toUpperCase();
    const noOk = no => /^[A-Z0-9]{6,40}$/.test(no);
    const errText = e => (e && e.message) || String(e);
    const PLAT = { shopee: "Shopee", tiktok: "TikTok" };
    const txId = () => "pk_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 10);
    const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
    const fmtT = ms => { const d = new Date(ms); return `${d.getDate()}/${d.getMonth() + 1} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };

    let all = [], parcels = [], filter = "todo", sel = null, busy = false, access = null, lastFinish = null;
    let scope = store.get("pkScope") === "all" ? "all" : "now";
    const hist = [];              // 这次打开页面扫过的单（最新在前）
    let claimItems = [];          // 🏆 领奖追踪：非会员得主（没在会员系统「中奖奖品」里的）
    let claimDb = null;
    const DRAW_CONFIG = { apiKey: "AIzaSyBu5yd5-pbO82_g8mgIx-faUzuzd0NaRZQ", authDomain: "draw-tournament.firebaseapp.com", databaseURL: "https://draw-tournament-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "draw-tournament", storageBucket: "draw-tournament.firebasestorage.app", messagingSenderId: "803720903757", appId: "1:803720903757:web:8b561daabc0d69af9e7004" };
    const sentLog = new Map();   // 这次打开页面已经放进去的东西（单号 → 东西），放好后还显示「✅ 已放入」

    function toast(msg) {
      const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
      document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
    }
    // 扫到 / 勾选的回馈：手机震动 + 短音（要放东西 = 两声高音，不用放 = 一声，错误 = 低音）
    let actx = null;
    function beep(kind = "ok") {
      const pat = { ok: [[1040, .09]], items: [[1200, .08], [1500, .1]], bad: [[320, .25]] }[kind] || [[1040, .09]];
      try { if (navigator.vibrate) navigator.vibrate(kind === "bad" ? [80, 60, 80] : kind === "items" ? [60, 50, 60] : 50); } catch (e) {}
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        let t = actx.currentTime;
        pat.forEach(([f, d]) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; g.gain.value = .09;
          o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d); t += d + .05; });
      } catch (e) {}
    }

    // ---------- 🔆 屏幕常亮：进入后至少 1 小时，有操作就再延长 1 小时；按按钮可以关掉 ----------
    const WAKE_MS = 60 * 60000;
    let wake = null, wakeOn = store.get("pkWake") !== "off", wakeUntil = Date.now() + WAKE_MS;
    const wakeOk = "wakeLock" in navigator;
    async function wakeGet() {
      if (!wakeOk || !wakeOn || wake || document.visibilityState !== "visible") return paintWake();
      try { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; paintWake(); }); } catch (e) {}
      paintWake();
    }
    function wakeDrop() { try { wake && wake.release(); } catch (e) {} wake = null; paintWake(); }
    function wakeTouch() { if (wakeOn) { wakeUntil = Date.now() + WAKE_MS; if (!wake) wakeGet(); } }
    function paintWake() {
      const b = $("wakeBtn");
      if (!wakeOk) { b.textContent = "🔆 不支持"; b.classList.remove("on"); b.title = "这台手机 / 浏览器不支持屏幕常亮（iPhone 要 iOS 16.4 以上的 Safari）"; return; }
      const min = Math.max(0, Math.ceil((wakeUntil - Date.now()) / 60000));
      b.textContent = wakeOn ? (wake ? `🔆 常亮 ${min}′` : "🔆 点一下") : "🌙 常亮关";
      b.classList.toggle("on", wakeOn && !!wake);
    }
    setInterval(() => {
      if (wakeOn && Date.now() > wakeUntil) { wakeOn = false; wakeDrop(); toast("🌙 1 小时没有操作，屏幕常亮已关闭"); }
      paintWake();
    }, 20000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wakeGet(); });
    // 有些手机要先碰一下屏幕才能开常亮；之后每次操作都延长
    document.addEventListener("pointerdown", () => wakeTouch(), { passive: true });
    $("wakeBtn").onclick = () => {
      if (!wakeOk) { alert("这台手机 / 浏览器不支持屏幕常亮。\niPhone：要 iOS 16.4 以上，用 Safari 打开。\nAndroid：用 Chrome 打开。"); return; }
      wakeOn = !wakeOn; store.set("pkWake", wakeOn ? "on" : "off");
      if (wakeOn) { wakeUntil = Date.now() + WAKE_MS; wakeGet(); toast("🔆 屏幕常亮 1 小时"); } else { wakeDrop(); toast("🌙 屏幕常亮已关闭"); }
    };

    // ---------- ⌨️ 键盘开关（PDA 扫描枪：关掉键盘，输入框一直可以接收扫描）----------
    let kbOn = store.get("pkKb") !== "off";
    function paintKb() { $("q").inputMode = kbOn ? "text" : "none"; $("kbBtn").classList.toggle("off", !kbOn); $("kbBtn").title = kbOn ? "键盘：开（按一下关掉，PDA 扫描枪用）" : "键盘：关（按一下打开）"; }
    $("kbBtn").onclick = () => { kbOn = !kbOn; store.set("pkKb", kbOn ? "on" : "off"); paintKb(); $("q").blur(); setTimeout(focusQ, 50); };
    function focusQ() { if (!$("cam").hidden || busy) return; const a = document.activeElement; if (a && a !== $("q") && a.tagName === "INPUT") return; $("q").focus({ preventScroll: true }); }

    // ---------- 读取 ----------
    async function load() {
      try {
        const r = (await pkAdmin({ op: "batch" })).data;
        all = r.parcels || [];
        lastFinish = r.lastFinishAt || null;
        all.forEach(p => { attachClaims(p); addSent(p); });
        applyScope();
        if (sel) { const p = all.find(x => x.orderNo === sel.orderNo); if (p) show(p, false); }
      } catch (e) {
        $("stats").innerHTML = `<span class="pill am">❌ 读取失败：${esc(errText(e))}</span>`;
        $("list").innerHTML = "";
      }
    }
    // 「这次」= 上次按「这批打包完成」之后下的单；「14 天」= 最近 14 天全部
    function applyScope() {
      parcels = scope === "now" && lastFinish ? all.filter(p => (p.orderTime || 0) >= lastFinish) : all;
      document.querySelectorAll("[data-scope]").forEach(b => b.classList.toggle("on", b.dataset.scope === scope));
      $("scopeInfo").textContent = scope === "now"
        ? (lastFinish ? `这次：${fmtT(lastFinish)}（上次按「这批打包完成」）之后下的单` : "还没按过「这批打包完成」，先显示最近 14 天")
        : "最近 14 天的单（用来找漏掉没打包的）";
      render();
    }
    const left = p => p.items.filter(i => !i.sent);
    function addSent(p) { (sentLog.get(p.orderNo) || []).forEach(i => { if (!p.items.some(j => j.id === i.id)) p.items.push({ ...i, sent: true }); }); }
    const canLeft = p => left(p).filter(i => i.can);
    const warns = p => left(p).filter(i => !i.can);

    function render() {
      const todo = parcels.filter(p => !p.done && left(p).length);
      const done = parcels.filter(p => p.done && p.items.length);
      const warnP = parcels.filter(p => !p.done && warns(p).length);
      const open = parcels.filter(p => !p.done);
      // 准备：这次还没放的东西（同一样东西在同一顾客的两包，只算一次）
      const seen = new Set(), prep = new Map();
      todo.forEach(p => canLeft(p).forEach(i => {
        if (seen.has(i.id)) return; seen.add(i.id);
        const k = i.prep || i.title, cur = prep.get(i.icon + k) || { icon: i.icon, k, n: 0 }; cur.n++; prep.set(i.icon + k, cur);
      }));
      const P = [...prep.values()].sort((a, b) => b.n - a.n);
      $("prep").innerHTML = P.length ? P.map(x => `<div><span class="ic">${x.icon}</span><span class="nm">${esc(x.k)}</span><span class="n">×${x.n}</span></div>`).join("")
        : '<div class="empty" style="border:0;background:none;display:block">这次没有要放的东西 🎉</div>';
      const nPrep = P.reduce((s, x) => s + x.n, 0);
      $("nPrep").hidden = !nPrep; $("nPrep").textContent = nPrep;
      $("nList").hidden = !todo.length; $("nList").textContent = todo.length;
      const scanned = hist.length;
      $("stats").innerHTML = `<span class="pill">${scope === "now" ? "这次" : "14 天"} <b>${open.length}</b> 单</span>
        <span class="pill pk">要放东西 <b>${todo.length}</b> 包</span>
        <span class="pill gn">已放好 <b>${done.length}</b></span>
        ${warnP.length ? `<span class="pill am">⚠️ 待处理 <b>${warnP.length}</b></span>` : ""}
        ${scanned ? `<span class="pill">已扫 <b>${scanned}</b></span>` : ""}`;
      const C = { todo: ["要放东西", todo.length], done: ["已放好", done.length], warn: ["⚠️ 待处理", warnP.length], all: ["全部", parcels.length] };
      $("chips").innerHTML = Object.entries(C).map(([k, [t, n]]) => `<button data-f="${k}" class="${filter === k ? "on" : ""}">${t} ${n}</button>`).join("");
      const list = filter === "todo" ? todo : filter === "done" ? done : filter === "warn" ? warnP : parcels;
      $("list").innerHTML = !list.length ? `<div class="empty">${filter === "todo" ? "🎉 这次没有要放东西的包裹" : "没有"}</div>`
        : list.map(p => {
          const l = left(p), c = canLeft(p).length;
          return `<div class="row ${p.done && !c ? "done" : ""} ${sel && sel.orderNo === p.orderNo ? "sel" : ""}" data-no="${esc(p.orderNo)}">
            <div class="l"><div class="no">${esc(p.orderNo)}</div><div class="who">${esc(p.username || "-")}${p.uid ? " 🎫" : ""}</div>
              <div class="what">${l.length ? l.map(i => `<i class="${i.can ? "" : "w"}">${i.icon} ${esc(i.prep || i.title)}${i.can ? "" : " ⚠️"}</i>`).join("") : '<i>（没有要放的）</i>'}</div></div>
            <span class="st">${c ? c + " 样" : p.done ? "✅" : warns(p).length ? "⚠️" : "—"}</span></div>`;
        }).join("");
      renderHist();
    }

    // ---------- 这一包 ----------
    function show(p, fresh = true) {
      sel = p;
      const l = left(p), c = canLeft(p), w = warns(p), sent = p.items.filter(i => i.sent);
      const other = l.filter(i => all.some(x => x !== p && !x.done && left(x).some(j => j.id === i.id)));
      const plat = PLAT[p.platform] ? `<span class="tag">${PLAT[p.platform]}</span>` : "";
      const mem = p.uid ? `<span class="tag">🎫 ${esc(p.member || "会员")}</span>` : "";
      const head = big => `<div class="res-head"><div class="big">${big}</div><div class="no">${esc(p.orderNo)}</div><div class="who">${esc(p.username || "-")} ${plat}${mem}</div></div>`;
      let html;
      if (!l.length && !sent.length) {
        html = `<div class="res none">${head("⭕ 不用放")}<div class="res-body"><div class="note" style="margin-top:10px">这包没有要随单寄出的东西，直接打包。</div>
          ${p.done ? undoLink(p) : ""}</div></div>`;
      } else {
        const cls = c.length ? "" : w.length && !sent.length ? "warn" : "ok";
        const big = c.length ? `🎁 要放 ${c.length} 样` : sent.length && !w.length ? "✅ 已全部放好" : sent.length ? "✅ 已放好（还有待处理）" : "⚠️ 先处理";
        html = `<div class="res ${cls}">${head(big)}<div class="res-body">
          ${c.map(i => item(i, false)).join("")}
          ${sent.map(i => item(i, true)).join("")}
          ${w.map(i => `<div class="warn">⚠️ ${i.icon} <b>${esc(i.title)}</b>：${esc(i.warn || i.sub)}</div>`).join("")}
          ${other.length ? `<div class="note">💡 这位顾客这次有不只一包：${other.map(i => esc(i.prep || i.title)).join("、")} 放其中一包就好</div>` : ""}
          ${sent.length || p.done ? undoLink(p) : ""}</div></div>`;
      }
      $("result").innerHTML = html;
      if (fresh) { $("result").firstElementChild.classList.add("flash"); addHist(p); }
      paintAct();
      document.querySelectorAll(".row").forEach(r => r.classList.toggle("sel", r.dataset.no === p.orderNo));
    }
    const undoLink = p => `<button class="linkbtn" data-undo="${esc(p.orderNo)}">↩️ 撤销这一包（订单取消 / 勾错了）</button>`;
    const item = (i, sent) => `<div class="it ${sent ? "sent" : ""}" ${sent ? "" : `data-item="${esc(i.id)}"`}><span class="ic">${i.icon}</span>
      <span class="nm"><b>${esc(i.title)}</b><small>${sent ? "✅ 已放入" : esc(i.sub || "")}</small></span><span class="ck">${sent ? "✓" : ""}</span></div>`;
    // 下方大按钮
    function paintAct() {
      const a = $("act");
      if (!sel) { a.hidden = true; return; }
      const c = canLeft(sel);
      a.hidden = false;
      a.innerHTML = c.length ? `<button class="go" data-all ${busy ? "disabled" : ""}>✅ 全部已放入（${c.length} 样）</button>`
        : `<button class="next" data-next>▶ 扫下一包</button>`;
    }
    function idle() {
      sel = null;
      $("result").innerHTML = `<div class="idle"><div class="big">📦</div><b>扫面单上的订单号条码</b>扫描枪、📷 相机，或输入单号后几位 / 买家名</div>`;
      paintAct();
    }
    // 扫过的单（这次打开页面）
    function addHist(p) { const i = hist.findIndex(h => h.orderNo === p.orderNo); if (i >= 0) hist.splice(i, 1); hist.unshift({ orderNo: p.orderNo }); if (hist.length > 30) hist.pop(); renderHist(); }
    function renderHist() {
      if (!hist.length) { $("hist").innerHTML = ""; return; }
      $("hist").innerHTML = `<h3>刚刚扫过</h3>` + hist.slice(0, 12).map(h => {
        const p = all.find(x => x.orderNo === h.orderNo) || (sel && sel.orderNo === h.orderNo ? sel : null);
        if (!p) return "";
        const c = canLeft(p).length, s = p.items.filter(i => i.sent).length;
        const st = c ? `<span class="st" style="color:#db2777">🎁 ${c} 样没放</span>` : s ? '<span class="st" style="color:var(--green-tx)">✅ 已放好</span>' : warns(p).length ? '<span class="st" style="color:var(--amber-tx)">⚠️</span>' : '<span class="st" style="color:var(--muted)">⭕ 不用放</span>';
        return `<div class="hrow" data-no="${esc(p.orderNo)}"><span class="no">…${esc(p.orderNo.slice(-6))}</span><span class="who">${esc(p.username || "")}</span>${st}</div>`;
      }).join("");
    }

    // ---------- 找 ----------
    async function find(raw) {
      const q = String(raw || "").trim();
      if (!q) return;
      wakeTouch();
      const n = norm(q);
      $("q").value = ""; $("q").placeholder = q;          // 清空，下一次扫描直接进来
      tab("tabScan");
      if (isTracking(n)) { beep("bad"); sel = null; paintAct();
        $("result").innerHTML = `<div class="res err"><div class="res-head"><div class="big">⚠️ 这是追踪号</div><div class="no">${esc(q)}</div></div>
          <div class="res-body"><div class="note" style="margin-top:10px">请扫面单上「订单号」的条码（不是快递追踪号）。</div></div></div>`; return; }
      let p = all.find(x => x.orderNo === n);
      if (!p && n.length >= 4) { const m = all.filter(x => x.orderNo.endsWith(n)); if (m.length === 1) p = m[0]; else if (m.length > 1) return listPick(m, `单号后几位「${q}」有 ${m.length} 张单`); }
      if (!p) { const m = all.filter(x => (x.username || "").toLowerCase() === q.toLowerCase()); if (m.length === 1) p = m[0]; else if (m.length > 1) return listPick(m, `买家「${q}」有 ${m.length} 张单`); }
      if (p) { beep(canLeft(p).length ? "items" : "ok"); show(p); return; }
      // 不在这 14 天里：问后端（比较早的单 / 买家名）
      $("result").innerHTML = '<div class="idle"><div class="big">🔎</div><b>查找中…</b></div>';
      try {
        const r = (await pkAdmin(noOk(n) ? { op: "lookup", orderNo: n } : { op: "lookup", username: q })).data;
        if (!r.found) { beep("bad"); sel = null; paintAct();
          $("result").innerHTML = `<div class="res err"><div class="res-head"><div class="big">❌ 找不到</div><div class="no">${esc(q)}</div></div>
            <div class="res-body"><div class="note" style="margin-top:10px">订单要先录入（订单录入页或表格提交），同步后才查得到。<br>扫到的是追踪号的话，请扫「订单号」的条码。</div></div></div>`; return; }
        const x = r.parcel;
        attachClaims(x); addSent(x);
        if (!all.some(y => y.orderNo === x.orderNo)) all.push(x);
        beep(canLeft(x).length ? "items" : "ok");
        show(x);
      } catch (e) { beep("bad"); $("result").innerHTML = `<div class="res err"><div class="res-head"><div class="big">❌ 出错了</div></div><div class="res-body"><div class="note" style="margin-top:10px">${esc(errText(e))}</div></div></div>`; }
    }
    function listPick(m, title) {
      beep("ok"); sel = null; paintAct();
      $("result").innerHTML = `<div class="note">${esc(title)}，选一张：</div>` +
        m.map(p => `<div class="row" data-no="${esc(p.orderNo)}" style="margin-top:6px"><div class="l"><div class="no">${esc(p.orderNo)}</div><div class="who">${esc(p.username)}</div></div>
          <span class="st">${canLeft(p).length ? canLeft(p).length + " 样" : "—"}</span></div>`).join("");
    }

    // ---------- 勾选 ----------
    async function ship(p, items, done) {
      if (busy) return;
      wakeTouch();
      const svr = items.filter(i => i.kind !== "claim"), cl = items.filter(i => i.kind === "claim");
      busy = true; paintAct();
      const failed = [];
      try {
        if (svr.length || done) {
          const r = (await pkAdmin({ op: "ship", orderNo: p.orderNo, items: svr.map(i => ({ kind: i.kind, id: i.id })), txId: txId(), done: !!done })).data;
          (r.results || []).forEach(x => {
            const it = svr.find(i => i.id === x.id);
            if (!x.ok) failed.push(`${(it || {}).title || x.id}：${x.error}`);
            else if (it) sentLog.set(p.orderNo, (sentLog.get(p.orderNo) || []).concat([it]));
          });
        }
        for (const i of cl) {
          try { await shipClaim(i, p.orderNo); sentLog.set(p.orderNo, (sentLog.get(p.orderNo) || []).concat([i])); }
          catch (e) { failed.push(`${i.title}：${errText(e)}`); }
        }
      } catch (e) { failed.push(errText(e)); }
      busy = false;
      if (failed.length) { beep("bad"); alert("有些没成功：\n\n" + failed.join("\n")); }
      else { beep("ok"); toast(done ? "✅ 这一包放好了" : "✅ 已放入"); }
      await load();
      focusQ();
    }

    // ---------- ↩️ 撤销这一包：打包清单寄出的东西全部退回（订单被取消、勾错了）----------
    async function undo(p) {
      if (!confirm(`↩️ 撤销 ${p.orderNo}（${p.username || ""}）这一包？\n\n这一包用打包清单勾过的东西会全部退回：\n• 小礼物 → 待寄\n• 中奖奖品、兑换、签到达人礼物 → 待发货\n\n会员已经确认收到的不会动。迎新礼要到「新会员奖励」处理。`)) return;
      busy = true; paintAct();
      try {
        const r = (await pkAdmin({ op: "undo", orderNo: p.orderNo })).data;
        let cl = 0;     // 🏆 非会员得主（领奖追踪）：这次在这里勾的也退回
        for (const i of (sentLog.get(p.orderNo) || []).filter(i => i.kind === "claim")) {
          try { await claimDb.ref(`draw_private/claimBatches/${i.bid}/items/${i.key}`).update({ shipped: false }); cl++; claimItems.push(i); } catch (e) {}
        }
        sentLog.delete(p.orderNo);
        const n = r.smallGifts + r.prizes + r.redemptions + cl;
        alert(`↩️ 已撤销：退回 ${n} 样${r.smallGifts ? `\n• 小礼物 ${r.smallGifts}` : ""}${r.prizes ? `\n• 中奖奖品 ${r.prizes}` : ""}${r.redemptions ? `\n• 兑换 / 签到达人礼物 ${r.redemptions}` : ""}${cl ? `\n• 领奖追踪 ${cl}` : ""}`
          + (r.welcome ? `\n\n⚠️ 这一包有 ${r.welcome} 份迎新礼已寄出，要到「新会员奖励」处理` : "")
          + (r.kept ? `\n\nℹ️ ${r.kept} 样会员已确认收到 / 已完成，没有退回` : ""));
      } catch (e) { alert("❌ " + errText(e)); }
      busy = false;
      await load();
    }

    // ---------- 🏆 领奖追踪（非会员得主）：同一个浏览器登录过领奖追踪才读得到 ----------
    async function setupClaims() {
      if (!access || !can(access, "draw.claims")) return;
      try {
        await loadScript("https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js");
        await loadScript("https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js");
        await loadScript("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js");
        const fb = window.firebase;
        // 和领奖追踪同一组设定（这段本来就公开在网页里）→ 同一个网站登录过领奖追踪，这里就直接是登录状态
        if (!fb.apps.length) fb.initializeApp(DRAW_CONFIG);
        fb.auth().onAuthStateChanged(async u => {
          if (!u) { $("claimHint").hidden = false; $("claimHint").innerHTML = '🏆 非会员抽奖得主的奖品：<a href="../draw_tournament/claims.html" target="_blank">登录领奖追踪</a> 后重新整理这一页，也会一起列出。'; return; }
          claimDb = fb.database();
          const v = (await claimDb.ref("draw_private/claimBatches").once("value")).val() || {};
          claimItems = [];
          Object.entries(v).forEach(([bid, b]) => Object.entries((b && b.items) || {}).forEach(([k, x]) => {
            if (!x || x.removed || x.voided || x.shipped) return;
            claimItems.push({ kind: "claim", id: `${bid}|${k}`, bid, key: k, icon: "🏆", title: `领奖追踪「${x.rank || "奖品"}」`,
              prep: `${b.label || ""} ${x.rank || "奖品"}`.trim(), sub: `${b.label || ""}${b.title ? " · " + b.title : ""} · 非会员得主`, can: true,
              name: String(x.name || "").toLowerCase(), orderNo: x.orderNo || "" });
          }));
          $("claimHint").hidden = true;
          all.forEach(attachClaims); applyScope(); if (sel) show(sel, false);
        });
      } catch (e) { console.warn("claims", e); }
    }
    function loadScript(src) {
      return new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok();
        const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
    }
    // 只给非会员：会员的得奖在会员系统「🏆 中奖奖品」处理（已经列在这一包里）
    const platOfNo = no => { const c = norm(no).charAt(0); return c === "5" ? "tiktok" : c === "2" ? "shopee" : ""; };
    function attachClaims(p) {
      if (p.uid || !claimItems.length) return;
      const mine = claimItems.filter(c => c.name && c.name === String(p.username || "").toLowerCase() && (!platOfNo(c.orderNo) || platOfNo(c.orderNo) === p.platform));
      mine.forEach(c => { if (!p.items.some(i => i.id === c.id)) p.items.push({ ...c }); });
    }
    async function shipClaim(i, orderNo) {
      if (!claimDb) throw new Error("没有登录领奖追踪");
      const ref = claimDb.ref(`draw_private/claimBatches/${i.bid}/items/${i.key}`);
      const cur = (await ref.once("value")).val() || {};
      const note = [cur.note, `随 ${orderNo} 寄出（打包清单）`].filter(Boolean).join(" · ").slice(0, 200);
      await ref.update({ shipped: true, note, ts: window.firebase.database.ServerValue.TIMESTAMP });
      claimItems = claimItems.filter(c => c.id !== i.id);
    }

    // ---------- 📷 相机扫描（Chrome / Android 用内建 BarcodeDetector；iPhone 用 ZXing）----------
    let stream = null, stopScan = null;
    async function openCam() {
      wakeTouch();
      $("cam").hidden = false; $("camMsg").textContent = "把订单号条码对准框框";
      const video = $("video");
      const done = text => { closeCam(); find(text); };
      try {
        if ("BarcodeDetector" in window) {
          const det = new BarcodeDetector({ formats: ["code_128", "qr_code", "code_39", "ean_13"] });
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } }, audio: false });
          video.srcObject = stream; await video.play();
          let alive = true; stopScan = () => { alive = false; };
          const tick = async () => {
            if (!alive) return;
            try { const r = await det.detect(video); const hit = pick(r.map(x => x.rawValue)); if (hit) return done(hit); } catch (e) {}
            setTimeout(tick, 120);
          };
          tick();
        } else {
          await loadScript("https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js");
          const reader = new ZXingBrowser.BrowserMultiFormatReader();
          const ctl = await reader.decodeFromConstraints({ video: { facingMode: "environment" } }, video, res => {
            if (!res) return; const hit = pick([res.getText()]); if (hit) done(hit);
          });
          stopScan = () => ctl.stop();
        }
      } catch (e) {
        $("camMsg").textContent = "❌ 打不开相机：" + errText(e) + "（请允许使用相机，或直接输入单号）";
      }
    }
    // 只认订单号；扫到追踪号 / 网址就提示
    function isTracking(t) { return /^SPX|^JNT|^JT\d|^MY\d|^NLMY|^ER\d/.test(t) || /^HTTPS?:/.test(t); }
    function pick(vals) {
      for (const v of vals) {
        const t = norm(v);
        if (isTracking(t)) { $("camMsg").textContent = "⚠️ 这是追踪号或网址，请扫「订单号」的条码"; continue; }
        if (noOk(t)) return t;
      }
      return null;
    }
    function closeCam() {
      try { stopScan && stopScan(); } catch (e) {}
      stopScan = null;
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      $("video").srcObject = null;
      $("cam").hidden = true;
      focusQ();
    }

    // ---------- 分页（手机）/ 并排（电脑）----------
    function tab(id) {
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === id));
      document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === id));
    }
    const wideQ = matchMedia("(min-width: 1000px)");
    const paintWide = () => document.body.classList.toggle("wide", wideQ.matches);
    wideQ.addEventListener ? wideQ.addEventListener("change", paintWide) : wideQ.addListener(paintWide);
    paintWide();

    // ---------- 事件 ----------
    // 扫描枪：扫完会送出 Enter（有些是 Tab）
    $("q").addEventListener("keydown", e => {
      if ((e.key === "Enter" || e.key === "Tab") && !e.isComposing) {
        if (!$("q").value.trim()) return;
        e.preventDefault(); find($("q").value);
      }
    });
    $("camBtn").onclick = openCam;
    $("camClose").onclick = closeCam;
    $("reloadBtn").onclick = () => load();
    $("themeBtn").onclick = () => {
      const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      store.set("msAdminTheme", t);
    };
    document.querySelectorAll("[data-scope]").forEach(b => b.onclick = () => { scope = b.dataset.scope; store.set("pkScope", scope); applyScope(); });
    document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab(b.dataset.tab); if (b.dataset.tab === "tabScan") focusQ(); });
    $("chips").addEventListener("click", e => { const b = e.target.closest("button[data-f]"); if (b) { filter = b.dataset.f; render(); } });
    document.addEventListener("click", e => {
      const t = e.target;
      const it = t.closest("[data-item]");
      if (it && sel && !busy) { const x = left(sel).find(i => i.id === it.dataset.item); if (x) ship(sel, [x], !canLeft(sel).some(i => i.id !== x.id)); return; }
      if (t.closest("[data-all]") && sel && !busy) { ship(sel, canLeft(sel), true); return; }
      if (t.closest("[data-next]")) { idle(); focusQ(); return; }
      if (t.closest("[data-undo]") && sel && !busy) { undo(sel); return; }
      const row = t.closest(".row[data-no], .hrow[data-no]");
      if (row) { const p = all.find(x => x.orderNo === row.dataset.no); if (p) { tab("tabScan"); show(p); } return; }
      // 点到空白地方：回到扫描框（扫描枪随时可以扫）
      if (!t.closest("input, button, a, select, textarea")) setTimeout(focusQ, 0);
    });
    $("finishBtn").onclick = async () => {
      const open = parcels.filter(p => !p.done);
      const unfinished = open.filter(p => canLeft(p).length);
      if (!confirm((unfinished.length
        ? `还有 ${unfinished.length} 包没勾完（${unfinished.map(p => p.username).slice(0, 5).join("、")}${unfinished.length > 5 ? "…" : ""}）。\n没勾的东西会保留，那位顾客下一单还会出现。\n\n`
        : "") + `✅ 这批打包完成？\n\n${open.length} 张单会标记完成；之后下的单算「下一次」。`)) return;
      try { await pkAdmin({ op: "done", orderNos: open.map(p => p.orderNo), finish: true }); toast("✅ 这批打包完成"); }
      catch (e) { alert("❌ " + errText(e)); }
      hist.length = 0; idle(); await load(); tab("tabScan"); focusQ();
    };

    paintKb(); paintWake(); idle();
    window.__access.then(a => { access = a; load(); setupClaims(); wakeGet(); focusQ(); });
  </script>
</body>
</html>
