<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../logo.png">
  <title>订单录入 - Mochii Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --bg: #f4f6f9; --card: #fff;
      --teal: #0891b2; --teal-d: #0e7490; --ok: #16a34a; --err: #dc2626;
      --shopee: #ee4d2d; --tiktok: #111827;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: #333; line-height: 1.4;
    }
    header {
      background: var(--ink); color: #fff; padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .brand { font-size: 1rem; font-weight: 700; }
    .brand a { color: #cbd5e1; text-decoration: none; font-weight: 400; }
    .brand a:hover { color: #fff; }
    .icon-btn { background: none; border: 0; color: #cbd5e1; font-size: 1.15rem; cursor: pointer; padding: 4px 6px; }
    .icon-btn:hover { color: #fff; }
    .wrap { max-width: 560px; margin: 24px auto; padding: 0 16px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.05); margin-bottom: 16px;
    }
    h1 { font-size: 1.3rem; color: var(--ink); margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: .88rem; margin-bottom: 16px; }
    .field { margin-bottom: 14px; }
    .field label { display: flex; justify-content: space-between; align-items: center;
      font-size: .85rem; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
    .row { display: flex; gap: 8px; }
    input {
      width: 100%; padding: 11px 12px; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 8px;
      background: #fff; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(8,145,178,.15); }
    input.bad { border-color: var(--err); }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .02em; }
    .tag { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; color: #fff; }
    .tag-shopee { background: var(--shopee); }
    .tag-tiktok { background: var(--tiktok); }
    .tag-bad { background: #fee2e2; color: var(--err); }
    .hint { font-size: .8rem; margin-top: 5px; min-height: 1.1em; color: var(--muted); }
    .hint.ok { color: var(--ok); }
    .hint.err { color: var(--err); }
    .btn {
      padding: 11px 16px; font-size: .95rem; font-weight: 600; border-radius: 8px; border: 0;
      cursor: pointer; transition: background .15s; white-space: nowrap;
    }
    .btn-main { width: 100%; background: var(--teal); color: #fff; margin-top: 4px; }
    .btn-main:hover { background: var(--teal-d); }
    .btn-main:disabled { background: #94a3b8; cursor: default; }
    .btn-soft { background: #f1f5f9; color: var(--ink); border: 1px solid #cbd5e1; }
    .btn-soft:hover { background: #e2e8f0; }
    .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: .9rem; display: none; }
    .msg.show { display: block; }
    .msg.ok { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .msg.err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .recent-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .recent-head h2 { font-size: 1rem; color: var(--ink); }
    .recent { list-style: none; }
    .recent li { padding: 10px 0; border-top: 1px solid var(--line); display: grid;
      grid-template-columns: 1fr auto; gap: 2px 12px; font-size: .88rem; }
    .recent li:first-child { border-top: 0; }
    .recent .who { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recent .amt { font-weight: 600; color: var(--ink); text-align: right; }
    .recent .no { color: var(--muted); font-size: .8rem; }
    .recent .st { font-size: .8rem; text-align: right; color: var(--muted); }
    .recent li.new { animation: flash 1.6s ease; }
    @keyframes flash { from { background: #ecfeff; } to { background: transparent; } }
    .empty { color: var(--muted); font-size: .88rem; padding: 8px 0; }
    .hidden { display: none !important; }
    .setup p { font-size: .88rem; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
    @media (max-width: 480px) {
      .wrap { margin: 16px auto; }
      .card { padding: 16px; }
      input { font-size: 16px; } /* 手机上不会自动放大 */
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><a href="../">Mochiishop/admin</a> › 订单录入</div>
    <button class="icon-btn" id="gear" title="设定网址和密钥" aria-label="设定">⚙️</button>
  </header>

  <div class="wrap">
    <!-- 第一次使用：输入网址和密钥 -->
    <div class="card setup hidden" id="setup">
      <h1>连接设定</h1>
      <p>输入 Apps Script「网页应用」的网址和录入密钥。只会存在这台设备上，换手机或电脑要再输入一次。</p>
      <div class="field">
        <label for="cfgUrl">网页应用网址</label>
        <input id="cfgUrl" class="mono" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
      </div>
      <div class="field">
        <label for="cfgKey">录入密钥</label>
        <input id="cfgKey" class="mono" type="password" autocomplete="off">
      </div>
      <button class="btn btn-main" id="cfgSave">连接</button>
      <div class="msg" id="cfgMsg"></div>
    </div>

    <!-- 录入表单 -->
    <div class="card hidden" id="entry">
      <h1>📝 订单录入</h1>
      <div class="sub">从平台复制贴上，按 Enter 跳下一格，最后一格按 Enter 直接提交。</div>
      <form id="form" autocomplete="off" novalidate>
        <div class="field">
          <label for="fName">买家姓名（平台用户名）</label>
          <input id="fName" enterkeyhint="next">
          <div class="hint" id="hName"></div>
        </div>
        <div class="field">
          <label for="fNo">订单编号 <span id="tagNo"></span></label>
          <input id="fNo" class="mono" enterkeyhint="next" autocapitalize="characters">
          <div class="hint" id="hNo"></div>
        </div>
        <div class="field">
          <label for="fAmt">金额（RM）</label>
          <input id="fAmt" inputmode="decimal" enterkeyhint="next">
          <div class="hint" id="hAmt"></div>
        </div>
        <div class="field">
          <label for="fTime">时间</label>
          <div class="row">
            <input id="fTime" class="mono" placeholder="29/10/2026 02:04" enterkeyhint="done">
            <button type="button" class="btn btn-soft" id="nowBtn">现在</button>
          </div>
          <div class="hint" id="hTime"></div>
        </div>
        <button class="btn btn-main" id="submitBtn" type="submit">提交</button>
        <div class="msg" id="formMsg"></div>
      </form>
    </div>

    <!-- 最近录入 -->
    <div class="card hidden" id="recentCard">
      <div class="recent-head">
        <h2>最近录入（订单表最上面几笔）</h2>
        <button class="btn btn-soft" id="refreshBtn" style="padding:6px 10px;font-size:.8rem">刷新</button>
      </div>
      <ul class="recent" id="recent"><li class="empty">载入中…</li></ul>
    </div>
  </div>

  <script>
    // 单号格式（和 member-system-sync.gs 的 MS_PLATFORMS 一致）
    const PLATFORMS = [
      { platform: "tiktok", label: "TikTok", test: /^5\d{17}$/ },
      { platform: "shopee", label: "Shopee", test: /^\d{6}[0-9A-Z]{8}$/ },
    ];
    const CFG_KEY = "mochiiOrderEntryCfg";
    const $ = id => document.getElementById(id);

    // ---------- 设定（只存在这台设备） ----------
    function loadCfg() {
      try { return JSON.parse(localStorage.getItem(CFG_KEY) || "null"); } catch (e) { return null; }
    }
    function saveCfg(c) {
      try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) {}
    }
    let cfg = loadCfg();

    async function api(action, extra, c = cfg) {
      const res = await fetch(c.url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },   // 不触发跨域预检
        body: JSON.stringify({ action, key: c.key, ...extra }),
      });
      if (!res.ok) throw new Error("连线失败（" + res.status + "）");
      return res.json();
    }

    function show(id, on) { $(id).classList.toggle("hidden", !on); }
    function msg(id, text, type) {
      const el = $(id);
      el.textContent = text || "";
      el.className = "msg" + (text ? " show " + type : "");
    }

    function openSetup() {
      $("cfgUrl").value = (cfg && cfg.url) || "";
      $("cfgKey").value = (cfg && cfg.key) || "";
      msg("cfgMsg", "");
      show("setup", true); show("entry", false); show("recentCard", false);
      ($("cfgUrl").value ? $("cfgKey") : $("cfgUrl")).focus();
    }
    function openEntry() {
      show("setup", false); show("entry", true); show("recentCard", true);
      $("fName").focus();
    }

    $("gear").onclick = openSetup;
    $("cfgSave").onclick = async () => {
      const c = { url: $("cfgUrl").value.trim(), key: $("cfgKey").value.trim() };
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(c.url)) { msg("cfgMsg", "网址要是 https://script.google.com/…/exec", "err"); return; }
      if (!c.key) { msg("cfgMsg", "请输入密钥", "err"); return; }
      $("cfgSave").disabled = true; msg("cfgMsg", "");
      try {
        const r = await api("ping", {}, c);
        if (!r.ok) throw new Error(r.error || "连线失败");
        cfg = c; saveCfg(c);
        renderRecent(r.recent);
        openEntry();
      } catch (e) {
        msg("cfgMsg", e.message, "err");
      } finally {
        $("cfgSave").disabled = false;
      }
    };
    $("cfgKey").addEventListener("keydown", e => { if (e.key === "Enter") $("cfgSave").click(); });

    // ---------- 即时检查 ----------
    const normNo = s => String(s || "").replace(/\s/g, "").toUpperCase();
    function detect(no) { return PLATFORMS.find(p => p.test.test(no)) || null; }

    function parseTime(s) {
      s = String(s || "").trim().replace(/\s+/g, " ");
      let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
      if (m) return mk(+m[3], +m[2], +m[1], +m[4], +m[5], +(m[6] || 0));
      m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
      if (m) return mk(+m[1], +m[2], +m[3], +m[4], +m[5], +(m[6] || 0));
      return null;
    }
    function mk(y, mo, d, h, mi, se) {
      if (mo < 1 || mo > 12 || d < 1 || d > 31 || h > 23 || mi > 59 || se > 59) return null;
      const dt = new Date(y, mo - 1, d, h, mi, se);
      return dt.getMonth() === mo - 1 ? dt : null;
    }
    const p2 = n => String(n).padStart(2, "0");
    const fmt = d => `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;

    function hint(id, text, type) { $(id).textContent = text || ""; $(id).className = "hint" + (type ? " " + type : ""); }

    function checkName() {
      const v = $("fName").value.trim().replace(/^@/, "");
      $("fName").classList.toggle("bad", !v && $("fName").dataset.touched === "1");
      return !!v;
    }
    function checkNo() {
      const no = normNo($("fNo").value);
      const p = detect(no);
      if (!no) { $("tagNo").innerHTML = ""; hint("hNo", ""); $("fNo").classList.remove("bad"); return false; }
      if (p) {
        $("tagNo").innerHTML = `<span class="tag tag-${p.platform}">${p.label}</span>`;
        hint("hNo", ""); $("fNo").classList.remove("bad");
        return true;
      }
      $("tagNo").innerHTML = `<span class="tag tag-bad">格式不符</span>`;
      hint("hNo", "TikTok：5 开头 18 位数字｜Shopee：6 位日期 + 8 位英数", "err");
      $("fNo").classList.add("bad");
      return false;
    }
    function checkAmt() {
      const raw = $("fAmt").value;
      const t = raw.replace(/[^0-9.]/g, "");
      const n = Number(t);
      if (!raw.trim()) { hint("hAmt", ""); $("fAmt").classList.remove("bad"); return false; }
      if (!t || !(n > 0)) { hint("hAmt", "看不懂这个金额", "err"); $("fAmt").classList.add("bad"); return false; }
      hint("hAmt", "RM " + n.toFixed(2), "ok"); $("fAmt").classList.remove("bad");
      return true;
    }
    function checkTime() {
      const raw = $("fTime").value;
      if (!raw.trim()) { hint("hTime", "格式：日/月/年 时:分（例 29/10/2026 02:04）"); $("fTime").classList.remove("bad"); return false; }
      const d = parseTime(raw);
      if (!d) { hint("hTime", "看不懂这个时间，格式：日/月/年 时:分", "err"); $("fTime").classList.add("bad"); return false; }
      if (d.getTime() > Date.now() + 3600000) { hint("hTime", "这个时间在未来，请检查", "err"); $("fTime").classList.add("bad"); return false; }
      hint("hTime", "✓ " + fmt(d), "ok"); $("fTime").classList.remove("bad");
      return true;
    }

    $("fName").addEventListener("input", checkName);
    $("fName").addEventListener("blur", () => { $("fName").dataset.touched = "1"; checkName(); });
    $("fNo").addEventListener("input", checkNo);
    $("fAmt").addEventListener("input", checkAmt);
    $("fTime").addEventListener("input", checkTime);
    $("nowBtn").onclick = () => { $("fTime").value = fmt(new Date()).slice(0, 16); checkTime(); $("submitBtn").focus(); };

    // Enter 跳下一格；最后一格 Enter 提交
    const order = ["fName", "fNo", "fAmt", "fTime"];
    order.forEach((id, i) => $(id).addEventListener("keydown", e => {
      if (e.key !== "Enter" || e.isComposing) return;
      e.preventDefault();
      if (i < order.length - 1) $(order[i + 1]).focus();
      else $("form").requestSubmit();
    }));

    // ---------- 提交 ----------
    let lastNo = "";
    $("form").addEventListener("submit", async e => {
      e.preventDefault();
      $("fName").dataset.touched = "1";
      const okAll = [checkName(), checkNo(), checkAmt(), checkTime()];
      if (okAll.includes(false)) {
        msg("formMsg", "请先把红色的栏位填好", "err");
        $(order[okAll.indexOf(false)]).focus();
        return;
      }
      const order_ = {
        name: $("fName").value.trim(),
        orderNo: normNo($("fNo").value),
        amount: $("fAmt").value,
        time: $("fTime").value,
      };
      $("submitBtn").disabled = true; $("submitBtn").textContent = "提交中…";
      msg("formMsg", "");
      try {
        const r = await api("submit", { order: order_ });
        if (!r.ok) {
          if (r.code === "key") { openSetup(); msg("cfgMsg", "密钥不对，请重新输入", "err"); return; }
          msg("formMsg", "❌ " + (r.error || "提交失败"), "err");
          if (r.code === "dup") $("fNo").select();
          return;
        }
        lastNo = r.orderNo;
        msg("formMsg", "✅ 录入成功：" + r.orderNo + (r.synced ? "（已同步会员系统）" : "（会员系统稍后自动同步）"), "ok");
        renderRecent(r.recent);
        ["fName", "fNo", "fAmt", "fTime"].forEach(id => { $(id).value = ""; $(id).classList.remove("bad"); });
        $("fName").dataset.touched = "";
        $("tagNo").innerHTML = ""; hint("hNo", ""); hint("hAmt", ""); checkTime();
        $("fName").focus();
      } catch (err) {
        msg("formMsg", "❌ " + err.message + "。请检查网络，或到 ⚙️ 确认网址。资料还在格子里，可以再按一次提交。", "err");
      } finally {
        $("submitBtn").disabled = false; $("submitBtn").textContent = "提交";
      }
    });

    // ---------- 最近录入 ----------
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    function renderRecent(list) {
      const ul = $("recent");
      if (!list || !list.length) { ul.innerHTML = `<li class="empty">还没有订单</li>`; return; }
      ul.innerHTML = list.map(o => `
        <li class="${normNo(o.orderNo) === lastNo ? "new" : ""}">
          <span class="who">${esc(o.name)}</span><span class="amt">RM ${esc(o.amount)}</span>
          <span class="no mono">${esc(o.orderNo)} · ${esc(o.time)}</span><span class="st">${esc(o.status || "未同步")}</span>
        </li>`).join("");
    }
    $("refreshBtn").onclick = async () => {
      $("refreshBtn").disabled = true;
      try {
        const r = await api("ping", {});
        if (r.ok) renderRecent(r.recent);
        else if (r.code === "key") openSetup();
      } catch (e) { msg("formMsg", "❌ 刷新失败：" + e.message, "err"); }
      finally { $("refreshBtn").disabled = false; }
    };

    // ---------- 开始 ----------
    checkTime();
    if (cfg && cfg.url && cfg.key) {
      openEntry();
      $("refreshBtn").click();
    } else {
      openSetup();
    }
  </script>
</body>
</html>
