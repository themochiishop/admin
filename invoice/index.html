<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 🔐 权限检查：没登录或没有「invoice」权限会跳回控制台 -->
  <script type="module">import { guard } from "/js/admin-guard.js"; guard("invoice");</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PO / Invoice · Mochii Admin</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<!-- ========== 工具栏 ========== -->
<header class="toolbar">
  <div class="tb-row">
    <a class="brand" href="../">Mochiishop/admin</a><span class="crumb">› PO / Invoice</span>
    <span class="spacer"></span>
    <span id="authBox">连接中…</span>
  </div>
  <div class="tb-row">
    <div class="tabs">
      <button type="button" class="tab" data-tab="po">Purchase Order</button>
      <button type="button" class="tab" data-tab="inv">Invoice</button>
    </div>
    <button type="button" id="btnNew">＋ 新单</button>
    <button type="button" id="btnCopy">⧉ 复制成新单</button>
    <button type="button" id="btnRecords">📂 记录</button>
    <span class="spacer"></span>
    <button type="button" id="btnShare" class="hidden">📤 分享</button>
    <button type="button" id="btnDownload" class="primary">⬇️ 下载 PDF</button>
  </div>
</header>

<div id="overflowWarn" class="warn hidden">⚠️ 内容超过一页 A4，下载的 PDF 下面会被切掉。请减少品项或缩短备注。</div>

<!-- ========== 纸张（内容由 app.js 生成） ========== -->
<main>
  <section class="page" id="page-po"><div class="sheet-wrap"><div class="sheet" id="sheet-po"></div></div></section>
  <section class="page hidden" id="page-inv"><div class="sheet-wrap"><div class="sheet" id="sheet-inv"></div></div></section>
</main>

<!-- ========== 弹窗：客户 / 供应商资料 ========== -->
<div id="partyModal" class="modal hidden">
  <div class="modal-card fm">
    <div class="modal-head"><h3 id="pmTitle">资料</h3><button type="button" class="x" data-close>✕</button></div>
    <label class="row-check hidden" id="pmSameRow"><input type="checkbox" id="pmSame"> 和 Bill to 一样</label>
    <div id="pmFields">
      <div id="pmPickRow">
        <label>选择已保存的名单
          <div class="pick"><select id="pmPick"></select><button type="button" class="btn danger hidden owner-only" id="pmDel">删除</button></div>
        </label>
      </div>
      <label>姓名 / 公司名<input id="pm_name" autocomplete="off"></label>
      <label id="pmRegRow">IC / 注册号（选填）<input id="pm_regNo" autocomplete="off"></label>
      <label>地址第 1 行<input id="pm_a1" autocomplete="off"></label>
      <label>地址第 2 行<input id="pm_a2" autocomplete="off"></label>
      <div class="g3">
        <label>邮编<input id="pm_postcode" inputmode="numeric" autocomplete="off"></label>
        <label>城市<input id="pm_city" autocomplete="off"></label>
        <label>州属<select id="pm_state"></select></label>
      </div>
      <label id="pmAttnRow">联系人 Attn（选填）<input id="pm_attn" autocomplete="off"></label>
      <label>电话 / WhatsApp<input id="pm_phone" inputmode="tel" autocomplete="off"></label>
      <div id="pmBankRow" class="bank-box">
        <div class="bank-title">💳 供应商收款户口（选填，会自动写进「PAYMENT TO VENDOR」）</div>
        <div class="g2">
          <label>银行 / 电子钱包
            <select id="pm_bankSel"></select>
            <input id="pm_bankOther" class="hidden" placeholder="输入银行名称" autocomplete="off">
          </label>
          <label>户口号码<input id="pm_acct" inputmode="numeric" placeholder="1014 0000 1699 77" autocomplete="off"></label>
        </div>
        <label>户口名字（选填，不填就用供应商名字）<input id="pm_acctName" autocomplete="off"></label>
      </div>
      <label class="row-check" id="pmKeepRow"><input type="checkbox" id="pmKeep" checked> 保存到名单（下次可以直接选）</label>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn" data-close>取消</button>
      <button type="button" class="btn primary" id="pmSave">保存</button>
    </div>
  </div>
</div>

<!-- ========== 弹窗：记录 ========== -->
<div id="recModal" class="modal hidden">
  <div class="modal-card wide">
    <div class="modal-head"><h3>📂 记录</h3><button type="button" class="x" data-close>✕</button></div>
    <div class="rec-tools">
      <input id="recSearch" type="search" placeholder="搜索单号、名字、日期" autocomplete="off">
      <div class="seg" id="recSeg">
        <button type="button" data-rt="all" class="on">全部</button>
        <button type="button" data-rt="po">PO</button>
        <button type="button" data-rt="inv">Invoice</button>
      </div>
    </div>
    <div id="recList"></div>
  </div>
</div>

<datalist id="productList"></datalist>
<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
