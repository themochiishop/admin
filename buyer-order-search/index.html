<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buyer Order Search</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 10px; margin: 0; background-color: #fff; }
    
    /* 查询区域样式 */
    .search-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #333; }
    .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
    input[type="text"] { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
    input[type="text"]:focus { border-color: #1a73e8; }
    button { padding: 10px 16px; font-size: 15px; background-color: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #1557b0; }
    .summary { margin-bottom: 12px; font-size: 14px; color: #1a73e8; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; border: 1px solid #e0e0e0; border-radius: 6px; overflow: hidden; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; word-break: break-all; }
    th { background-color: #f8f9fa; color: #5f6368; font-weight: 600; }
  </style>
</head>
<body>

  <!-- 查询主界面 -->
  <div id="searchSection">
    <div class="search-title">🔍 买家订单查询 Buyer Order Search</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="输入买家姓名 Enter Buyer Name..." onkeyup="if(event.key === 'Enter') doSearch()">
      <button onclick="doSearch()">查询 Search</button>
    </div>
    
    <div id="summary" class="summary"></div>
    
    <table id="resultTable" style="display:none;">
      <thead>
        <tr>
          <th>买家姓名 Buyer Name</th>
          <th>订单编号 Order No.</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    // ⚙️ 参数配置（Apps Script 部署网址）
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyyB-vzQ7khhXzuOdVT-WWDusEA6Ag7idlgVf30I1hAoYnAWcfuu6L4b59rMelfzUSeow/exec";

    // 执行订单查询
    function doSearch() {
      var input = document.getElementById('searchInput').value;
      if(!input || input.trim() === "") return;
      
      document.getElementById('summary').innerText = "查询中 Searching...";
      document.getElementById('resultTable').style.display = "none";
      
      var fetchUrl = SCRIPT_URL + "?keyword=" + encodeURIComponent(input.trim());
      
      fetch(fetchUrl)
        .then(response => response.json())
        .then(results => {
          var tbody = document.getElementById('tableBody');
          tbody.innerHTML = "";
          
          if(!results || results.length === 0) {
            document.getElementById('summary').innerText = "共有订单数 Total Orders: 0 (未找到匹配记录 No match found)";
            return;
          }
          
          document.getElementById('summary').innerText = "共有订单数 Total Orders: " + results.length;
          
          results.forEach(row => {
            var tr = document.createElement('tr');
            tr.innerHTML = "<td>" + row.buyer + "</td><td>" + row.order + "</td>";
            tbody.appendChild(tr);
          });
          
          document.getElementById('resultTable').style.display = "table";
        })
        .catch(err => {
          document.getElementById('summary').innerText = "查询出错，请检查网络或部署网址。";
        });
    }
  </script>
</body>
</html>
