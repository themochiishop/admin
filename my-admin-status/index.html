<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, updateEmail, updatePassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJrsKAjWqz0AmjEtBzz4CeswiskdQqASw",
  authDomain: "admin-status-c3bdb.firebaseapp.com",
  databaseURL: "https://admin-status-c3bdb-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "admin-status-c3bdb",
  storageBucket: "admin-status-c3bdb.firebasestorage.app",
  messagingSenderId: "377694458194",
  appId: "1:377694458194:web:71a78ba5dbed4df1b1aa8b",
  measurementId: "G-2PYNH16Y9R"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUserUID = null;
let defaultAvatar = "";
let defaultName = "";
let uploadedImages = [];
let allMessages = [];
let currentPage = 1;
const PAGE_SIZE = 10;

function formatDate(timestamp) {
  if (!timestamp) return '';
  const date = new Date(timestamp);
  return (date.getMonth() + 1) + '/' + date.getDate() + ' ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
}

function toggleProfileEdit(showEdit) {
  document.getElementById('profileCard').style.display = showEdit ? 'block' : 'none';
  document.getElementById('mainPostsContent').style.display = showEdit ? 'none' : 'block';
  document.getElementById('toggleProfileBtn').style.display = showEdit ? 'none' : 'inline-block';
}

document.getElementById('toggleProfileBtn').addEventListener('click', () => toggleProfileEdit(true));
document.getElementById('cancelProfileTopBtn').addEventListener('click', () => toggleProfileEdit(false));
document.getElementById('cancelProfileBottomBtn').addEventListener('click', () => toggleProfileEdit(false));

function fileToBase64(file, maxWidth = 800) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width, height = img.height;
        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
    };
  });
}

document.getElementById('imgFileInput').addEventListener('change', async (e) => {
  let files = Array.from(e.target.files);
  if (files.length > 3) { alert("最多只能上传 3 张图片！"); files = files.slice(0, 3); }
  const grid = document.getElementById('imgPreviewGrid');
  grid.innerHTML = ''; uploadedImages = [];
  for (const file of files) {
    const base64 = await fileToBase64(file);
    uploadedImages.push(base64);
    const img = document.createElement('img'); img.src = base64; img.className = 'preview';
    grid.appendChild(img);
  }
});

document.getElementById('avatarFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (file) { document.getElementById('profileAvatarInput').value = await fileToBase64(file, 200); }
});

// 🔒 登录状态监听与校验 (核心修复)
onAuthStateChanged(auth, (user) => {
  if (!user) {
    // 未登录时重定向回根目录登录页 (使用完整绝对路径避免 404)
    window.location.href = "https://themochiishop.github.io/admin/";
  } else {
    currentUserUID = user.uid;
    document.getElementById('currentEmail').innerText = user.email;
    loadProfile(user); 
    loadMessages();
  }
});

function loadProfile(user) {
  onValue(ref(db, `users/${user.uid}/profile`), (snapshot) => {
    const data = snapshot.val() || {};
    defaultAvatar = data.defaultAvatar || "https://api.dicebear.com/7.x/bottts/svg?seed=" + user.uid;
    defaultName = data.displayName || user.email.split('@')[0];
    document.getElementById('currentAvatar').src = defaultAvatar;
    document.getElementById('currentName').innerText = defaultName;
    document.getElementById('profileAvatarInput').value = defaultAvatar;
    document.getElementById('profileNameInput').value = defaultName;
  });
}

document.getElementById('saveProfileBtn').addEventListener('click', async () => {
  if (!currentUserUID) return alert("鉴权失效，请重新登录！");
  const url = document.getElementById('profileAvatarInput').value.trim();
  const name = document.getElementById('profileNameInput').value.trim() || auth.currentUser.email.split('@')[0];
  try {
    await update(ref(db, `users/${currentUserUID}/profile`), { defaultAvatar: url, displayName: name });
    alert("Profile 设置保存成功！"); toggleProfileEdit(false);
  } catch (e) { alert("保存失败: " + e.message); }
});

document.getElementById('updateEmailBtn').addEventListener('click', async () => {
  const newEmail = document.getElementById('newEmailInput').value.trim();
  if (!newEmail) return alert("请输入新邮箱");
  try { 
    await updateEmail(auth.currentUser, newEmail); 
    alert("邮箱修改成功！"); 
    document.getElementById('newEmailInput').value = ''; 
  } catch (e) { alert("修改失败: " + e.message); }
});

document.getElementById('updatePasswordBtn').addEventListener('click', async () => {
  const newPass = document.getElementById('newPasswordInput').value.trim();
  if (!newPass || newPass.length < 6) return alert("密码至少需要6位");
  try { 
    await updatePassword(auth.currentUser, newPass); 
    alert("密码修改成功！"); 
    document.getElementById('newPasswordInput').value = ''; 
  } catch (e) { alert("修改失败: " + e.message); }
});

document.getElementById('logoutBtn').addEventListener('click', () => { 
  signOut(auth).then(() => window.location.href = "https://themochiishop.github.io/admin/"); 
});

document.getElementById('postBtn').addEventListener('click', async () => {
  const content = document.getElementById('msgContent').value.trim();
  if (!currentUserUID) return alert("鉴权失效，请重新登录！");
  if (!content && uploadedImages.length === 0) return alert("请输入动态内容或上传图片");
  try {
    await push(ref(db, 'messages'), {
      uid: currentUserUID, 
      content: content, 
      avatarUrl: defaultAvatar,
      authorName: defaultName, 
      images: uploadedImages, 
      likes: 0, 
      timestamp: Date.now()
    });
    document.getElementById('msgContent').value = ''; 
    document.getElementById('imgPreviewGrid').innerHTML = '';
    uploadedImages = []; 
    alert("动态发布成功！");
  } catch (e) { alert("发布失败: " + e.message); }
});

function loadMessages() {
  onValue(ref(db, 'messages'), (snapshot) => {
    allMessages = [];
    if (snapshot.exists()) {
      snapshot.forEach((childSnap) => { allMessages.push({ id: childSnap.key, ...childSnap.val() }); });
      allMessages.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    }
    renderPaginatedList();
  });
}

function renderPaginatedList() {
  const container = document.getElementById('messagesList');
  const paginationControls = document.getElementById('paginationControls');
  if (!container) return;
  container.innerHTML = '';
  if (allMessages.length === 0) {
    container.innerHTML = '<p style="color:#999; text-align:center;">暂无历史动态</p>';
    if (paginationControls) paginationControls.style.display = 'none';
    return;
  }
  if (paginationControls) paginationControls.style.display = 'flex';
  const totalPages = Math.ceil(allMessages.length / PAGE_SIZE) || 1;
  if (currentPage > totalPages) currentPage = totalPages;
  const startIndex = (currentPage - 1) * PAGE_SIZE;
  const pageData = allMessages.slice(startIndex, startIndex + PAGE_SIZE);

  pageData.forEach((item) => {
    const id = item.id, timeStr = formatDate(item.timestamp), likes = item.likes || 0;
    const rawText = item.content || '', authorName = item.authorName || '未知用户';
    const isOwner = (item.uid && item.uid === currentUserUID);
    const card = document.createElement('div'); card.className = 'msg-item-card';
    const viewSection = document.createElement('div'); viewSection.id = `view-section-${id}`;
    
    if (rawText) {
      const textDiv = document.createElement('div'); textDiv.className = 'msg-text-display'; textDiv.textContent = rawText;
      viewSection.appendChild(textDiv);
    }
    
    let validImages = Array.isArray(item.images) ? item.images.slice(0, 3) : (item.imageUrl ? [item.imageUrl] : []);
    if (validImages.length > 0) {
      const imgGrid = document.createElement('div'); imgGrid.className = 'img-preview-grid';
      validImages.forEach(src => {
        const img = document.createElement('img'); img.src = src; img.className = 'preview'; imgGrid.appendChild(img);
      });
      viewSection.appendChild(imgGrid);
    }

    const gearButtonHtml = isOwner ? `<button class="gear-btn" data-id="${id}">⚙️</button>` : '';
    const metaBar = document.createElement('div');
    metaBar.className = 'msg-meta-bar';
    metaBar.innerHTML = `<div><span class="author-badge">${authorName}</span><span class="like-badge">❤️ ${likes} 点赞</span><span style="margin-left: 6px;">🕒 ${timeStr}</span></div>${gearButtonHtml}`;
    viewSection.appendChild(metaBar);

    if (isOwner) {
      const popover = document.createElement('div');
      popover.id = `action-popover-${id}`; popover.className = 'action-popover';
      popover.innerHTML = `<button class="btn-secondary edit-act-btn" data-id="${id}" style="padding:3px 8px; font-size:0.78rem;">✏️ 编辑</button><button class="btn-danger del-act-btn" data-id="${id}" style="padding:3px 8px; font-size:0.78rem;">🗑️ 删除</button>`;
      viewSection.appendChild(popover);

      const editSection = document.createElement('div');
      editSection.id = `edit-section-${id}`; editSection.style.display = 'none';
      editSection.innerHTML = `<label style="font-size:0.85rem;"><strong>编辑动态文本：</strong></label><textarea id="edit-text-${id}" rows="3">${rawText}</textarea><div class="btn-group"><button class="btn-primary save-act-btn" data-id="${id}" style="padding:4px 10px; font-size:0.8rem;">💾 保存修改</button><button class="btn-cancel cancel-act-btn" data-id="${id}" style="padding:4px 10px; font-size:0.8rem;">✖ 取消编辑</button></div>`;
      card.appendChild(viewSection);
      card.appendChild(editSection);
    } else { 
      card.appendChild(viewSection); 
    }
    container.appendChild(card);
  });

  container.querySelectorAll('.gear-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const p = document.getElementById(`action-popover-${e.currentTarget.getAttribute('data-id')}`);
      if (p) p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
    });
  });

  container.querySelectorAll('.edit-act-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const id = e.currentTarget.getAttribute('data-id');
      document.getElementById(`view-section-${id}`).style.display = 'none';
      document.getElementById(`edit-section-${id}`).style.display = 'block';
    });
  });

  container.querySelectorAll('.cancel-act-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const id = e.currentTarget.getAttribute('data-id');
      document.getElementById(`edit-section-${id}`).style.display = 'none';
      document.getElementById(`view-section-${id}`).style.display = 'block';
    });
  });

  container.querySelectorAll('.save-act-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.currentTarget.getAttribute('data-id');
      try {
        await update(ref(db, `messages/${id}`), { content: document.getElementById(`edit-text-${id}`).value, uid: currentUserUID });
        alert("动态更新成功！");
      } catch (err) { alert("更新失败: " + err.message); }
    });
  });

  container.querySelectorAll('.del-act-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.currentTarget.getAttribute('data-id');
      if (confirm("确定要删除这条社交动态吗？")) {
        try { await remove(ref(db, `messages/${id}`)); } catch (err) { alert("删除失败: " + err.message); }
      }
    });
  });

  document.getElementById('pageIndicator').innerText = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
  document.getElementById('prevPageBtn').disabled = (currentPage === 1);
  document.getElementById('nextPageBtn').disabled = (currentPage === totalPages);
}

document.getElementById('prevPageBtn').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderPaginatedList(); window.scrollTo({ top: 0, behavior: 'smooth' }); } });
document.getElementById('nextPageBtn').addEventListener('click', () => { if (currentPage < Math.ceil(allMessages.length / PAGE_SIZE)) { currentPage++; renderPaginatedList(); window.scrollTo({ top: 0, behavior: 'smooth' }); } });
</script>
