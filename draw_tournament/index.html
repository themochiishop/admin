<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochiishop 每月抽奖 - 实时晋级大屏</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans relative overflow-x-hidden">

  <!-- 🌟 全屏豪华恭喜弹窗 (只剩最后2名/决战普及成功时触发 10 秒倒计时) -->
  <div id="congratModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md hidden flex items-center justify-center p-4 transition-all duration-500">
    <div class="bg-gradient-to-b from-slate-800 via-slate-900 to-slate-950 border-2 border-amber-400 rounded-3xl p-8 max-w-xl w-full text-center shadow-2xl relative overflow-hidden transform scale-95 transition-all">
      <div class="absolute -top-24 -left-24 w-56 h-56 bg-amber-500/30 rounded-full blur-3xl"></div>
      <div class="absolute -bottom-24 -right-24 w-56 h-56 bg-emerald-500/30 rounded-full blur-3xl"></div>

      <div class="text-7xl mb-4 animate-bounce">👑</div>
      <h2 id="congratBadge" class="text-xs font-black tracking-widest text-amber-400 uppercase mb-1">FINAL WINNER ANNOUNCEMENT</h2>
      <h3 id="congratModalTitle" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-emerald-300 to-amber-400 mb-2">
        热烈祝贺！成功获得普及荣誉！
      </h3>
      <p id="congratWinnerNames" class="text-lg font-bold text-emerald-300 my-4 bg-emerald-950/60 py-2.5 px-4 rounded-xl border border-emerald-500/40">
      </p>

      <div class="inline-flex items-center space-x-2 bg-slate-800/90 border border-slate-700 rounded-full px-5 py-2 text-xs text-slate-300 shadow">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>
        <span>将在 <span id="congratCountdown" class="text-amber-400 font-extrabold text-base">10</span> 秒后自动切回大屏榜单...</span>
      </div>
    </div>
  </div>

  <!-- 顶部 Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🏆</span>
        <div>
          <h1 class="text-xl font-bold text-amber-400">Mochiishop 每月抽奖普及榜</h1>
          <p class="text-xs text-slate-400">直播实时同步 · 买家公开公示大屏</p>
        </div>
      </div>
      <div class="flex items-center space-x-2 text-xs text-slate-400">
        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-ping"></span>
        <span>直播实时同步中...</span>
      </div>
    </div>
  </header>

  <!-- 主体区域 -->
  <main class="max-w-[1600px] mx-auto px-4 py-6 flex-1 w-full">
    
    <!-- 1. 最顶层：轮次切换 Tabs 区域 + 移至此位置的短搜索框 -->
    <div class="mb-6 flex items-center justify-between border-b border-slate-800 pb-3 gap-4">
      <div id="roundTabsContainer" class="flex space-x-2 overflow-x-auto">
        <!-- 动态生成：第 1 轮、第 2 轮选项卡 -->
      </div>
      
      <!-- 搜索框置于轮次选项卡行右侧 -->
      <div class="relative w-full sm:w-64 flex-shrink-0">
        <input 
          type="search" 
          id="searchInput" 
          oninput="renderPublicView()" 
          placeholder="🔍 搜索您的名字或订单号..." 
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-400 shadow-inner"
        >
      </div>
    </div>

    <!-- 2. 第二层：4 块概览数据统计卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">本轮参选人数</span>
        <span id="statTotalCandidates" class="text-2xl font-black text-blue-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">本轮已普及/晋级</span>
        <span id="statPassedCount" class="text-2xl font-black text-emerald-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">本轮角逐中人数</span>
        <span id="statPendingCount" class="text-2xl font-black text-amber-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">本轮已淘汰人数</span>
        <span id="statOutCount" class="text-2xl font-black text-slate-400">0</span>
      </div>
    </div>

    <!-- 3. 第三层：已普及/晋级名单展示框 -->
    <div class="mb-6 bg-slate-800/90 p-4 rounded-xl border border-emerald-500/30 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-lg shadow-emerald-950/20">
      <div class="flex-1 w-full">
        <div class="flex items-center space-x-2 mb-2">
          <span class="text-lg">🏆</span>
          <h2 id="passedTitleText" class="text-md font-bold text-emerald-400">第 1 轮 已普及/晋级名单</h2>
          <span id="passedBadgeCount" class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">0人</span>
        </div>
        <div id="passedListContainer" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto pr-1">
          <!-- 动态渲染普及买家卡片 -->
        </div>
      </div>
    </div>

    <!-- 4. 第四层：拆分为【左边角逐中买家】与【右边独立一列已淘汰名单】 -->
    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
      
      <!-- 左侧：⚡ 角逐中买家名单 (占 4 列空间，内部卡片强制所有分辨率下一排 5 张) -->
      <div class="lg:col-span-4 bg-slate-800/50 rounded-2xl p-6 border border-slate-700 min-h-[400px]">
        <div class="flex items-center space-x-2 mb-4 border-b border-slate-700/80 pb-3">
          <span class="text-lg">⚡</span>
          <h2 id="pendingTitleText" class="text-md font-bold text-amber-400">角逐中买家名单</h2>
          <!-- 紧接着显示 共 N 人待角逐 (N为黄色) -->
          <span class="text-xs text-slate-300 ml-2">
            共 <span id="pendingNumberYellow" class="text-amber-400 font-bold text-sm mx-0.5">0</span> 人待角逐
          </span>
        </div>

        <div id="pendingGridContainer" class="overflow-x-auto pb-2">
          <!-- 动态渲染强制 5 列角逐买家卡片 -->
        </div>
      </div>

      <!-- 右侧：❌ 已淘汰名单 (独立单列显示，占 1 列空间) -->
      <div class="lg:col-span-1 bg-slate-800/30 rounded-2xl p-4 border border-slate-800 min-h-[400px] flex flex-col">
        <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
          <div class="flex items-center space-x-1.5">
            <span class="text-sm">❌</span>
            <h3 class="text-xs font-bold text-slate-400">已淘汰名单</h3>
          </div>
          <span id="outBadgeCount" class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full border border-slate-700">0人</span>
        </div>

        <div id="outListContainer" class="space-y-2 flex-1 overflow-y-auto max-h-[500px] pr-1">
          <!-- 动态渲染一列已淘汰买家 -->
        </div>
      </div>

    </div>

  </main>

  <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    © Mochiishop Shopee Monthly Event. All rights reserved.
  </footer>

  <script>
    let currentRoundIndex = 0;
    let lastSeenEventTime = 0;
    let popupTimer = null;
    let state = {
      rounds: [
        { roundName: "第 1 轮", candidates: [] }
      ]
    };

    window.onload = function() {
      loadAndRender();
      setInterval(loadAndRender, 2000);
    };

    function loadAndRender() {
      const saved = localStorage.getItem('mochii_tournament_state');
      if (saved) {
        try { 
          const parsed = JSON.parse(saved); 
          if (parsed && Array.isArray(parsed.rounds) && parsed.rounds.length > 0) {
            state = parsed;
          } else if (parsed && parsed.candidates) {
            state = { rounds: [{ roundName: "第 1 轮", candidates: parsed.candidates }] };
          } else {
            state = { rounds: [{ roundName: "第 1 轮", candidates: [] }] };
          }

          if (state.latestEvent && state.latestEvent.timestamp > lastSeenEventTime) {
            lastSeenEventTime = state.latestEvent.timestamp;
            
            if (state.latestEvent.type === 'advance') {
              currentRoundIndex = state.latestEvent.targetRoundIndex;
              showPopup("🎉 恭喜进入 " + (state.rounds[currentRoundIndex]?.roundName || "下一轮") + "！", "上一轮普及人员已继承，开启下一轮角逐！", 5);
            } else if (state.latestEvent.type === 'prevRound') {
              currentRoundIndex = state.latestEvent.targetRoundIndex;
            } else if (state.latestEvent.type === 'finalCongrat') {
              currentRoundIndex = state.latestEvent.targetRoundIndex;
              showPopup("👑 恭喜买家成功获得普及荣誉！", "恭喜：" + (state.latestEvent.winnerNames || ""), 10);
            }
          }

          if (currentRoundIndex >= state.rounds.length) {
            currentRoundIndex = Math.max(0, state.rounds.length - 1);
          }

          renderRoundTabs();
          renderPublicView();
          updateStats();
        } catch(e){}
      }
    }

    function showPopup(titleText, winnerSubText, durationSeconds) {
      const modal = document.getElementById('congratModal');
      const modalTitle = document.getElementById('congratModalTitle');
      const winnerNamesEl = document.getElementById('congratWinnerNames');
      const countdownEl = document.getElementById('congratCountdown');

      if (!modal) return;

      if (modalTitle) modalTitle.innerText = titleText;
      if (winnerNamesEl) winnerNamesEl.innerText = winnerSubText;

      modal.classList.remove('hidden');

      let timeLeft = durationSeconds;
      if (countdownEl) countdownEl.innerText = timeLeft;

      if (popupTimer) clearInterval(popupTimer);

      popupTimer = setInterval(() => {
        timeLeft--;
        if (countdownEl) countdownEl.innerText = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(popupTimer);
          modal.classList.add('hidden');
        }
      }, 1000);
    }

    function renderRoundTabs() {
      const container = document.getElementById('roundTabsContainer');
      if (!container) return;

      container.innerHTML = state.rounds.map((r, idx) => {
        const isActive = (idx === currentRoundIndex);
        const activeClass = isActive ? "bg-amber-500 text-slate-950 font-bold border-amber-400 shadow-md" : "bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700";
        const title = r.roundName || `第 ${idx + 1} 轮`;
        return `<button onclick="switchRound(${idx})" class="px-4 py-1.5 rounded-lg text-xs border transition ${activeClass}">
          ${escapeHtml(title)} (${(r.candidates || []).filter(c => c.status === 'pass').length} 晋级)
        </button>`;
      }).join('');
    }

    function switchRound(idx) {
      currentRoundIndex = idx;
      renderRoundTabs();
      renderPublicView();
      updateStats();
    }

    function updateStats() {
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { roundName: "第 1 轮", candidates: [] };
      const candidates = activeRound.candidates || [];

      const total = candidates.length;
      const passed = candidates.filter(c => c.status === 'pass').length;
      const pendingCount = candidates.filter(c => c.status === 'pending').length;
      const outCount = candidates.filter(c => c.status === 'out').length;

      document.getElementById('statTotalCandidates').innerText = total;
      document.getElementById('statPassedCount').innerText = passed;
      document.getElementById('statPendingCount').innerText = pendingCount;
      document.getElementById('statOutCount').innerText = outCount;
      
      const titleName = activeRound.roundName || `第 ${currentRoundIndex + 1} 轮`;
      document.getElementById('passedTitleText').innerText = `${titleName} 已普及/晋级名单`;
      document.getElementById('passedBadgeCount').innerText = passed + '人';
      
      // 共 N 人待角逐，N 为黄色
      const numEl = document.getElementById('pendingNumberYellow');
      if (numEl) numEl.innerText = pendingCount;

      // 已淘汰统计数字
      const outBadge = document.getElementById('outBadgeCount');
      if (outBadge) outBadge.innerText = outCount + '人';
    }

    function renderPublicView() {
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { roundName: "第 1 轮", candidates: [] };
      const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();

      const list = (activeRound.candidates || []).filter(c => 
        (c.name || '').toLowerCase().includes(search) || (c.orderNo || '').toLowerCase().includes(search)
      );

      // 1. 普及名单渲染
      const passedContainer = document.getElementById('passedListContainer');
      const passedList = list.filter(c => c.status === 'pass');

      if (passedList.length === 0) {
        passedContainer.innerHTML = '<span class="text-xs text-slate-500 italic">本轮暂无普及买家，直播抽出中...</span>';
      } else {
        passedContainer.innerHTML = passedList.map(c => 
          '<div class="px-3 py-1.5 bg-emerald-950/60 border border-emerald-500/40 rounded-lg flex items-center space-x-2 text-xs shadow-sm">' +
            '<span class="font-bold text-emerald-300">' + escapeHtml(c.name) + '</span>' +
            '<span class="text-slate-400 font-mono text-[11px]">' + escapeHtml(c.orderNo) + '</span>' +
          '</div>'
        ).join('');
      }

      // 2. 左侧：⚡ 角逐中买家渲染 (🌟 强制设为硬性 grid-cols-5，不论分辨率均强行每行 5 张)
      const pendingContainer = document.getElementById('pendingGridContainer');
      const pendingList = list.filter(c => c.status === 'pending');

      if (!activeRound.candidates || activeRound.candidates.length === 0) {
        pendingContainer.innerHTML = '<div class="text-center py-12 text-slate-500"><p class="text-4xl mb-2">📋</p><p>本轮抽奖名单同步中，请关注直播间...</p></div>';
      } else if (pendingList.length === 0) {
        pendingContainer.innerHTML = '<div class="text-center py-12 text-slate-500"><p class="text-2xl mb-2">🎉</p><p>本轮全员判定完毕</p></div>';
      } else {
        const cardsHtml = pendingList.map((c, index) => 
          '<div class="p-3.5 rounded-xl border border-slate-700 bg-slate-800/80 transition hover:border-amber-400/80 min-w-0 flex flex-col justify-between shadow">' +
            '<div>' +
              '<div class="text-[11px] font-mono text-slate-400 mb-1">#' + (index + 1) + '</div>' +
              '<div class="font-bold text-slate-100 text-sm truncate">' + escapeHtml(c.name) + '</div>' +
              '<div class="text-[11px] text-amber-400/80 font-mono mt-0.5 truncate">' + escapeHtml(c.orderNo || '无订单号') + '</div>' +
            '</div>' +
          '</div>'
        ).join('');

        // 🌟 强行 5 列：grid grid-cols-5 gap-3 (不加响应式断点)
        pendingContainer.innerHTML = '<div class="grid grid-cols-5 gap-3 min-w-[600px]">' + cardsHtml + '</div>';
      }

      // 3. 右侧：❌ 已淘汰名单单独竖排渲染 (状态为 out 的买家)
      const outContainer = document.getElementById('outListContainer');
      const outList = list.filter(c => c.status === 'out');

      if (outList.length === 0) {
        outContainer.innerHTML = '<p class="text-[11px] text-slate-600 text-center py-6 italic">暂无淘汰人员</p>';
      } else {
        outContainer.innerHTML = outList.map(c => 
          '<div class="p-2.5 bg-slate-900/60 border border-slate-800 rounded-lg flex flex-col justify-center opacity-60 hover:opacity-100 transition">' +
            '<div class="font-bold text-slate-300 text-xs truncate">' + escapeHtml(c.name) + '</div>' +
            '<div class="text-[10px] text-slate-500 font-mono truncate mt-0.5">' + escapeHtml(c.orderNo || '无订单号') + '</div>' +
          '</div>'
        ).join('');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
