<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochiishop 每月抽奖 - 实时晋级大屏</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans relative overflow-x-hidden">

  <!-- 全屏豪华恭喜弹窗 -->
  <div id="congratModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md hidden flex items-center justify-center p-4 transition-all">
    <div class="bg-gradient-to-b from-slate-800 via-slate-900 to-slate-950 border-2 border-amber-400 rounded-3xl p-8 max-w-xl w-full text-center shadow-2xl relative overflow-hidden">
      <div class="text-7xl mb-4 animate-bounce">👑</div>
      <h2 class="text-xs font-black tracking-widest text-amber-400 uppercase mb-1">FINAL WINNER ANNOUNCEMENT</h2>
      <h3 id="congratModalTitle" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-emerald-300 to-amber-400 mb-2">
        热烈祝贺！成功获得普及荣誉！
      </h3>
      <p id="congratWinnerNames" class="text-lg font-bold text-emerald-300 my-4 bg-emerald-950/60 py-2.5 px-4 rounded-xl border border-emerald-500/40">
      </p>
      <div class="inline-flex items-center space-x-2 bg-slate-800/90 border border-slate-700 rounded-full px-5 py-2 text-xs text-slate-300">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>
        <span>将在 <span id="congratCountdown" class="text-amber-400 font-extrabold text-base">10</span> 秒后自动切回大屏榜单...</span>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🏆</span>
        <div>
          <h1 class="text-xl font-bold text-amber-400">Mochiishop 每月抽奖普及榜</h1>
          <p class="text-xs text-slate-400">直播实时同步 · 买家公开公示大屏</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-4">
        <!-- 前台实时模式徽章 -->
        <span id="publicModeBadge" class="text-xs font-bold text-amber-400 bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg">
          ⚙️ 模式: 加载中...
        </span>

        <div class="flex items-center space-x-1 bg-slate-900 border border-slate-700 p-1 rounded-lg">
          <button onclick="setLanguage('zh')" id="langBtn-zh" class="px-2 py-1 text-xs rounded">🇨🇳 ZH</button>
          <button onclick="setLanguage('en')" id="langBtn-en" class="px-2 py-1 text-xs rounded">🇬🇧 EN</button>
          <button onclick="setLanguage('ms')" id="langBtn-ms" class="px-2 py-1 text-xs rounded">🇲🇾 MS</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 主体区域 -->
  <main class="max-w-[1600px] mx-auto px-4 py-6 flex-1 w-full">
    <div class="mb-6 flex items-center justify-between border-b border-slate-800 pb-3 gap-4">
      <div id="roundTabsContainer" class="flex space-x-2 overflow-x-auto"></div>
      <input type="search" id="searchInput" oninput="renderPublicView()" placeholder="🔍 搜索您的名字或订单号..." class="w-64 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-400">
    </div>

    <!-- 4 卡片概览 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700"><span class="text-xs text-slate-400 block">本轮参选人数</span><span id="statTotalCandidates" class="text-2xl font-black text-blue-400">0</span></div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700"><span class="text-xs text-slate-400 block">本轮已普及/晋级</span><span id="statPassedCount" class="text-2xl font-black text-emerald-400">0</span></div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700"><span class="text-xs text-slate-400 block">本轮角逐中人数</span><span id="statPendingCount" class="text-2xl font-black text-amber-400">0</span></div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700"><span class="text-xs text-slate-400 block">本轮已淘汰人数</span><span id="statOutCount" class="text-2xl font-black text-slate-400">0</span></div>
    </div>

    <!-- 普及区 -->
    <div class="mb-6 bg-slate-800/90 p-4 rounded-xl border border-emerald-500/30">
      <div class="flex items-center space-x-2 mb-2">
        <span class="text-lg">🏆</span>
        <h2 id="passedTitleText" class="text-md font-bold text-emerald-400">已普及/晋级名单</h2>
      </div>
      <div id="passedListContainer" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto"></div>
    </div>

    <!-- 待角逐 & 淘汰列 -->
    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
      <div class="lg:col-span-4 bg-slate-800/50 rounded-2xl p-6 border border-slate-700">
        <h2 id="pendingTitleText" class="text-md font-bold text-amber-400 mb-4">⚡ 角逐中买家名单</h2>
        <div id="pendingGridContainer" class="overflow-x-auto pb-2"></div>
      </div>
      <div class="lg:col-span-1 bg-slate-800/30 rounded-2xl p-4 border border-slate-800">
        <h3 class="text-xs font-bold text-slate-400 mb-4">❌ 已淘汰名单</h3>
        <div id="outListContainer" class="space-y-2 overflow-y-auto max-h-[500px]"></div>
      </div>
    </div>
  </main>

  <script>
    let currentLang = localStorage.getItem('mochii_lang') || 'zh';
    let currentRoundIndex = 0;
    let lastSeenEventTime = 0;
    let state = { modeConfig: { enabled: true, selectedMode: 'mode1' }, rounds: [{ roundName: "第 1 轮", candidates: [] }] };

    window.onload = function() {
      loadAndRender();
      setInterval(loadAndRender, 2000);
    };

    function loadAndRender() {
      const saved = localStorage.getItem('mochii_tournament_state');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.rounds)) state = parsed;

          if (state.latestEvent && state.latestEvent.timestamp > lastSeenEventTime) {
            lastSeenEventTime = state.latestEvent.timestamp;
            if (state.latestEvent.type === 'finalCongrat') {
              showPopup("👑 恭喜买家成功获得普及荣誉！", "恭喜：" + (state.latestEvent.winnerNames || ""), 10);
            }
          }
          renderRoundTabs();
          renderPublicView();
          updateStats();
          updatePublicModeBadge();
        } catch(e){}
      }
    }

    function updatePublicModeBadge() {
      const badge = document.getElementById('publicModeBadge');
      if (!badge) return;
      if (!state.modeConfig || !state.modeConfig.enabled) {
        badge.innerText = "⚙️ 模式: 自定义自由轮次";
        return;
      }
      const m = state.modeConfig.selectedMode;
      if (m === 'mode1') badge.innerText = "⚙️ 模式: 冠亚季模式";
      else if (m === 'mode2') badge.innerText = "⚙️ 模式: 安慰奖模式";
      else if (m === 'mode3') badge.innerText = `⚙️ 模式: 自定义模式`;
    }

    function showPopup(titleText, winnerSubText, durationSeconds) {
      const modal = document.getElementById('congratModal');
      document.getElementById('congratModalTitle').innerText = titleText;
      document.getElementById('congratWinnerNames').innerText = winnerSubText;
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.add('hidden'), durationSeconds * 1000);
    }

    function getRoundTitle(idx) {
      const r = state.rounds[idx];
      if (r && r.isFinal) return "🏆 最终轮";
      return `第 ${idx + 1} 轮`;
    }

    function renderRoundTabs() {
      const container = document.getElementById('roundTabsContainer');
      if (!container) return;
      container.innerHTML = state.rounds.map((r, idx) => {
        const activeClass = (idx === currentRoundIndex) ? "bg-amber-500 text-slate-950 font-bold" : "bg-slate-800 text-slate-300";
        return `<button onclick="switchRound(${idx})" class="px-4 py-1.5 rounded-lg text-xs border ${activeClass}">${getRoundTitle(idx)}</button>`;
      }).join('');
    }

    function switchRound(idx) { currentRoundIndex = idx; renderRoundTabs(); renderPublicView(); updateStats(); }

    function updateStats() {
      const activeRound = state.rounds[currentRoundIndex] || { candidates: [] };
      const candidates = activeRound.candidates || [];
      document.getElementById('statTotalCandidates').innerText = candidates.length;
      document.getElementById('statPassedCount').innerText = candidates.filter(c => c.status === 'pass').length;
      document.getElementById('statPendingCount').innerText = candidates.filter(c => c.status === 'pending').length;
      document.getElementById('statOutCount').innerText = candidates.filter(c => c.status === 'out').length;
    }

    function renderPublicView() {
      const activeRound = state.rounds[currentRoundIndex] || { candidates: [] };
      const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const list = (activeRound.candidates || []).filter(c => (c.name || '').toLowerCase().includes(search));

      const passedList = list.filter(c => c.status === 'pass');
      document.getElementById('passedListContainer').innerHTML = passedList.map(c => `<div class="px-3 py-1 bg-emerald-950 border border-emerald-500/40 rounded text-xs text-emerald-300 font-bold">${c.name}</div>`).join('');

      const pendingList = list.filter(c => c.status === 'pending');
      document.getElementById('pendingGridContainer').innerHTML = '<div class="grid grid-cols-5 gap-3 min-w-[600px]">' + pendingList.map(c => `<div class="p-3 bg-slate-800 border border-slate-700 rounded-xl text-slate-100 font-bold text-sm">${c.name}</div>`).join('') + '</div>';

      const outList = list.filter(c => c.status === 'out');
      document.getElementById('outListContainer').innerHTML = outList.map(c => `<div class="p-2 bg-slate-900 border border-slate-800 rounded text-xs text-slate-400">${c.name}</div>`).join('');
    }

    function setLanguage(lang) { localStorage.setItem('mochii_lang', lang); }
  </script>
</body>
</html>
