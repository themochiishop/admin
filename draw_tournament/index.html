<!DOCTYPE html>
<html lang="zh-CN">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochiishop 每月抽奖 - 实时晋级榜</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- 顶部 Header (已移除管理员后台与刷新按钮) -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🏆</span>
        <div>
          <h1 class="text-xl font-bold text-amber-400">Mochiishop 每月抽奖普及榜</h1>
          <p class="text-xs text-slate-400">直播实时同步 · 买家公开公示大屏</p>
        </div>
      </div>
      <div class="flex items-center space-x-2 text-xs text-slate-400">
        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-ping"></span>
        <span>直播实时同步中...</span>
      </div>
    </div>
  </header>

  <!-- 主体区域 -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
    
    <!-- 数据概览卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">本月入围总人数</span>
        <span id="statTotalCandidates" class="text-2xl font-black text-blue-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">已成功普及/晋级</span>
        <span id="statPassedCount" class="text-2xl font-black text-emerald-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">待抽奖/角逐中</span>
        <span id="statPendingCount" class="text-2xl font-black text-amber-400">0</span>
      </div>
    </div>

    <!-- 买家个人搜索 -->
    <div class="mb-6 bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-between items-center">
      <div class="relative w-full sm:w-80">
        <input 
          type="search" 
          id="searchInput" 
          oninput="renderPublicView()" 
          placeholder="🔍 搜索您的名字或订单号..." 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-amber-400"
        >
      </div>
      <div class="text-xs text-slate-400 hidden sm:block">
        📌 页面每 3 秒自动拉取主播最新晋级判定
      </div>
    </div>

    <!-- 实时普及与角逐榜展示 -->
    <div id="publicContainer" class="bg-slate-800/50 rounded-2xl p-6 border border-slate-700 min-h-[400px]">
    </div>

  </main>

  <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    © Mochiishop Shopee Monthly Event. All rights reserved.
  </footer>

  <script>
    let state = {
      candidates: []
    };

    window.onload = function() {
      loadAndRender();
      // 自动轮询：每 3 秒同步一次主播的最新点击结果
      setInterval(loadAndRender, 3000);
    };

    function loadAndRender() {
      const saved = localStorage.getItem('mochii_tournament_state');
      if (saved) {
        try { 
          state = JSON.parse(saved); 
          renderPublicView();
          updateStats();
        } catch(e){}
      }
    }

    function updateStats() {
      const total = state.candidates.length;
      const passed = state.candidates.filter(c => c.status === 'pass').length;
      const pending = state.candidates.filter(c => c.status === 'pending').length;

      document.getElementById('statTotalCandidates').innerText = total;
      document.getElementById('statPassedCount').innerText = passed;
      document.getElementById('statPendingCount').innerText = pending;
    }

    function renderPublicView() {
      const container = document.getElementById('publicContainer');
      const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();

      const list = state.candidates.filter(c => 
        (c.name || '').toLowerCase().includes(search) || (c.orderNo || '').toLowerCase().includes(search)
      );

      if (state.candidates.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-500"><p class="text-4xl mb-2">📋</p><p>本月抽奖名单同步中，请关注直播间...</p></div>`;
        return;
      }

      const passedList = list.filter(c => c.status === 'pass');
      const pendingList = list.filter(c => c.status === 'pending');

      container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- 普及/晋级荣誉榜 -->
          <div class="bg-slate-900/80 p-4 rounded-xl border border-emerald-500/30 shadow-lg shadow-emerald-950/20">
            <h3 class="text-emerald-400 font-bold text-md mb-3 flex items-center justify-between">
              <span>🏆 已成功普及/晋级名单</span>
              <span class="text-xs font-normal text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded">${passedList.length} 人</span>
            </h3>
            <div class="space-y-2">
              ${passedList.map(c => `
                <div class="p-3 bg-emerald-950/40 border border-emerald-500/30 rounded-lg flex justify-between items-center">
                  <div class="min-w-0 flex-1 pr-2">
                    <div class="font-bold text-emerald-200 text-base truncate">\${escapeHtml(c.name)}</div>
                    <div class="text-xs text-slate-400 font-mono truncate">\${escapeHtml(c.orderNo)}</div>
                  </div>
                  <span class="text-xs font-bold text-emerald-400 bg-emerald-500/20 border border-emerald-500/30 px-2.5 py-1 rounded-full">晋级成功</span>
                </div>
              `).join('') || '<p class="text-xs text-slate-500 py-4 text-center">暂无晋级买家，直播抽出中...</p>'}
            </div>
          </div>

          <!-- 待抽奖角逐榜 -->
          <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700">
            <h3 class="text-amber-400 font-bold text-md mb-3 flex items-center justify-between">
              <span>⚡ 待抽奖/角逐中名单</span>
              <span class="text-xs font-normal text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded">${pendingList.length} 人</span>
            </h3>
            <div class="space-y-2">
              ${pendingList.map(c => `
                <div class="p-3 bg-slate-800 rounded-lg flex justify-between items-center border border-slate-700">
                  <div class="min-w-0 flex-1 pr-2">
                    <div class="font-bold text-slate-200 truncate">\${escapeHtml(c.name)}</div>
                    <div class="text-xs text-slate-400 font-mono truncate">\${escapeHtml(c.orderNo)}</div>
                  </div>
                  <span class="text-xs text-amber-400">待角逐</span>
                </div>
              `).join('') || '<p class="text-xs text-slate-500 py-4 text-center">全员抽奖公布完毕</p>'}
            </div>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
