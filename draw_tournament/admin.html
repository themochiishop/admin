<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochiishop 每月抽奖 - 直播控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- 顶部 Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🎬</span>
        <div>
          <h1 class="text-xl font-bold text-amber-400">Mochiishop 每月抽奖 - 直播控制台</h1>
          <p class="text-xs text-slate-400">管理者专属 · 卡片直控与数据管理</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <!-- 视图切换按钮 -->
        <button id="viewToggleBtn" onclick="toggleViewMode()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-lg border border-slate-600 transition">
          📊 视图切换: <span id="viewModeText" class="text-amber-400 font-bold">卡片直控</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主体区域 -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
    
    <!-- 数据概览面板 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">入围总人数</span>
        <span id="statTotalCandidates" class="text-2xl font-black text-blue-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">当前已成功晋级</span>
        <span id="statPassedCount" class="text-2xl font-black text-emerald-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">角逐/待定人数</span>
        <span id="statPendingCount" class="text-2xl font-black text-amber-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">已淘汰人数</span>
        <span id="statOutCount" class="text-2xl font-black text-slate-400">0</span>
      </div>
    </div>

    <!-- 搜索、同步状态与刷新操作栏 -->
    <div class="mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-800 p-3 rounded-xl border border-slate-700">
      <div class="relative w-full sm:w-80">
        <input 
          type="search" 
          id="searchInput" 
          oninput="renderAdminView()" 
          placeholder="🔍 快速查找买家名字/订单..." 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-amber-400"
        >
      </div>

      <!-- 数据同步提示 + 刷新表格数据按钮 -->
      <div class="text-xs text-slate-400 flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
        <span id="syncStatusText">已连接至 Google Sheets 数据源</span>
        <button onclick="fetchGoogleSheetsData(true)" class="ml-2 px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded transition flex items-center space-x-1 shadow text-xs">
          <span>🔄 刷新表格数据</span>
        </button>
      </div>
    </div>

    <!-- 卡片/分组展区 -->
    <div id="adminViewContainer">
    </div>

  </main>

  <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    © Mochiishop Shopee Monthly Event. All rights reserved.
  </footer>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1VSfYPx-lpdSAw8pgebnABW3rlSFK-8t4oxqPPcjKtt0/gviz/tq?tqx=out:csv&gid=322881163";

    let currentViewType = "grid"; // 'grid' (卡片直控) 或 'list' (分组列表)
    let state = {
      candidates: []
    };

    window.onload = function() {
      loadState();
      if (!state.candidates || state.candidates.length === 0) {
        fetchGoogleSheetsData();
      } else {
        renderAdminView();
        updateStats();
      }
    };

    function fetchGoogleSheetsData(isManual) {
      const syncStatus = document.getElementById('syncStatusText');
      if (syncStatus) syncStatus.innerText = "正在从 Google Sheets 同步中...";

      fetch(SHEET_CSV_URL)
        .then(response => {
          if (!response.ok) throw new Error("读取失败");
          return response.text();
        })
        .then(csvText => {
          parseCSVAndMerge(csvText);
          if (syncStatus) syncStatus.innerText = "已成功从 Google Sheets 同步！";
          if (isManual) alert("同步成功！已载入 Google Sheets 的最新买家名单。");
        })
        .catch(err => {
          console.error(err);
          if (syncStatus) syncStatus.innerText = "连接失败，请检查表格权限";
        });
    }

    function parseCSVAndMerge(csvText) {
      const lines = csvText.split('\n');
      const existingStatusMap = {};

      state.candidates.forEach(c => {
        if (c.name) existingStatusMap[c.name.trim()] = c.status;
      });

      const newCandidates = [];
      lines.forEach((line, idx) => {
        if (!line.trim()) return;
        const cleanLine = line.replace(/"/g, '');
        const parts = cleanLine.split(',');

        if (parts.length >= 1) {
          const name = parts[0] ? parts[0].trim() : '';
          const orderNo = parts[1] ? parts[1].trim() : '';

          if (name && name !== '买家姓名' && name !== 'Name') {
            const preservedStatus = existingStatusMap[name] || 'pending';
            newCandidates.push({
              id: Date.now() + idx,
              name: name,
              orderNo: orderNo,
              status: preservedStatus
            });
          }
        }
      });

      state.candidates = newCandidates;
      saveState();
    }

    function loadState() {
      const saved = localStorage.getItem('mochii_tournament_state');
      if (saved) {
        try { state = JSON.parse(saved); } catch(e){}
      }
    }

    function saveState() {
      localStorage.setItem('mochii_tournament_state', JSON.stringify(state));
      updateStats();
      renderAdminView();
    }

    function updateStats() {
      const total = state.candidates.length;
      const passed = state.candidates.filter(c => c.status === 'pass').length;
      const pending = state.candidates.filter(c => c.status === 'pending').length;
      const out = state.candidates.filter(c => c.status === 'out').length;

      document.getElementById('statTotalCandidates').innerText = total;
      document.getElementById('statPassedCount').innerText = passed;
      document.getElementById('statPendingCount').innerText = pending;
      document.getElementById('statOutCount').innerText = out;
    }

    function changeStatus(id, newStatus) {
      const target = state.candidates.find(c => c.id === id);
      if (target) {
        target.status = newStatus;
        saveState();
      }
    }

    function toggleViewMode() {
      currentViewType = (currentViewType === 'grid') ? 'list' : 'grid';
      const btnText = document.getElementById('viewModeText');
      if (btnText) {
        btnText.innerText = (currentViewType === 'grid') ? '卡片直控' : '分组列表';
      }
      renderAdminView();
    }

    function renderAdminView() {
      const container = document.getElementById('adminViewContainer');
      const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();

      let list = state.candidates.filter(c => 
        (c.name || '').toLowerCase().includes(search) || (c.orderNo || '').toLowerCase().includes(search)
      );

      if (list.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-500"><p class="text-2xl mb-2">🔍</p><p>未找到符合条件的买家</p></div>`;
        return;
      }

      if (currentViewType === 'grid') {
        // 卡片直控视图
        container.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            ${list.map((c, index) => {
              let borderStyle = 'border-slate-700 bg-slate-800';
              let statusBadge = `<span class="px-2 py-0.5 rounded text-xs bg-amber-500/20 text-amber-300">⌛ 角逐中</span>`;

              if (c.status === 'pass') {
                borderStyle = 'border-emerald-500 bg-slate-800 shadow-lg shadow-emerald-950/30 ring-1 ring-emerald-500';
                statusBadge = `<span class="px-2 py-0.5 rounded text-xs bg-emerald-500 text-slate-950 font-bold">🏆 已普及/晋级</span>`;
              } else if (c.status === 'out') {
                borderStyle = 'border-slate-800 bg-slate-900/60 opacity-50';
                statusBadge = `<span class="px-2 py-0.5 rounded text-xs bg-slate-700 text-slate-400">已淘汰</span>`;
              }

              return `
                <div class="p-4 rounded-xl border \${borderStyle} transition relative flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-start mb-2">
                      <span class="text-xs font-mono text-slate-400">#${index + 1}</span>${statusBadge}
                    </div>
                    <div class="font-bold text-slate-100 text-lg truncate">\${escapeHtml(c.name)}</div>
                    <div class="text-xs text-amber-400/80 font-mono mt-0.5 truncate">\${escapeHtml(c.orderNo || '无订单号')}</div>
                  </div>

                  <div class="mt-4 pt-3 border-t border-slate-700/60 flex space-x-1">
                    <button onclick="changeStatus(\${c.id}, 'pass')" class="flex-1 py-1.5 text-xs font-bold rounded \${c.status==='pass'?'bg-emerald-500 text-slate-950':'bg-slate-700 text-emerald-400 hover:bg-emerald-600 hover:text-white'} transition">
                      🏆 晋级
                    </button>
                    <button onclick="changeStatus(\${c.id}, 'pending')" class="px-2 py-1.5 text-xs rounded \${c.status==='pending'?'bg-amber-500 text-slate-950':'bg-slate-700 text-amber-400 hover:bg-amber-600 hover:text-white'} transition">
                      ⌛ 待定
                    </button>
                    <button onclick="changeStatus(\${c.id}, 'out')" class="px-2 py-1.5 text-xs rounded \${c.status==='out'?'bg-rose-500 text-white':'bg-slate-700 text-slate-400 hover:bg-rose-600 hover:text-white'} transition">
                      ❌ 淘汰
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else {
        // 分组列表视图
        const passedList = list.filter(c => c.status === 'pass');
        const pendingList = list.filter(c => c.status === 'pending');

        container.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-900/80 p-4 rounded-xl border border-emerald-500/30">
              <h3 class="text-emerald-400 font-bold text-md mb-3 flex items-center justify-between">
                <span>🏆 已普及名单 (${passedList.length} 人)</span>
              </h3>
              <div class="space-y-2">
                ${passedList.map(c => `
                  <div class="p-3 bg-emerald-950/40 border border-emerald-500/30 rounded-lg flex justify-between items-center">
                    <div class="min-w-0 flex-1 pr-2">
                      <div class="font-bold text-emerald-200 truncate">\${escapeHtml(c.name)}</div>
                      <div class="text-xs text-slate-400 font-mono truncate">\${escapeHtml(c.orderNo)}</div>
                    </div>
                    <button onclick="changeStatus(\${c.id}, 'pending')" class="text-xs bg-slate-700 hover:bg-amber-600 text-amber-300 hover:text-white px-2 py-1 rounded">撤销/改待定</button>
                  </div>
                `).join('') || '<p class="text-xs text-slate-500 py-2">暂无普及买家</p>'}
              </div>
            </div>

            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700">
              <h3 class="text-amber-400 font-bold text-md mb-3 flex items-center justify-between">
                <span>⚡ 待抽奖/角逐中名单 (${pendingList.length} 人)</span>
              </h3>
              <div class="space-y-2">
                ${pendingList.map(c => `
                  <div class="p-3 bg-slate-800 rounded-lg flex justify-between items-center border border-slate-700">
                    <div class="min-w-0 flex-1 pr-2">
                      <div class="font-bold text-slate-200 truncate">\${escapeHtml(c.name)}</div>
                      <div class="text-xs text-slate-400 font-mono truncate">\${escapeHtml(c.orderNo)}</div>
                    </div>
                    <button onclick="changeStatus(\${c.id}, 'pass')" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-2 py-1 rounded">点此晋级</button>
                  </div>
                `).join('') || '<p class="text-xs text-slate-500 py-2">全员公布完毕</p>'}
              </div>
            </div>
          </div>
        `;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
