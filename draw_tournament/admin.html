<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochiishop 每月抽奖 - 直播控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- 顶部 Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🎬</span>
        <div>
          <h1 class="text-xl font-bold text-amber-400">Mochiishop 每月抽奖 - 直播控制台</h1>
          <p class="text-xs text-slate-400">管理者专属 · 卡片直控与数据管理</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button id="viewToggleBtn" onclick="toggleViewMode()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-lg border border-slate-600 transition">
          📊 视图切换: <span id="viewModeText" class="text-amber-400 font-bold">卡片直控</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主体区域 -->
  <main class="max-w-[1600px] mx-auto px-4 py-6 flex-1 w-full">
    
    <!-- 数据概览面板 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">入围总人数</span>
        <span id="statTotalCandidates" class="text-2xl font-black text-blue-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">当前已普及/晋级</span>
        <span id="statPassedCount" class="text-2xl font-black text-emerald-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">待抽奖/角逐中人数</span>
        <span id="statPendingCount" class="text-2xl font-black text-amber-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">已淘汰人数</span>
        <span id="statOutCount" class="text-2xl font-black text-slate-400">0</span>
      </div>
    </div>

    <!-- 顶栏 1：已普及名单展示区 (可随时点击 ✕ 撤回/改待定防误触) -->
    <div class="mb-6 bg-slate-800/90 p-4 rounded-xl border border-emerald-500/30 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-lg shadow-emerald-950/20">
      <div class="flex-1 w-full">
        <div class="flex items-center space-x-2 mb-2">
          <span class="text-lg">🏆</span>
          <h2 class="text-md font-bold text-emerald-400">已普及/晋级名单</h2>
          <span id="passedBadgeCount" class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">0人</span>
          <span class="text-[11px] text-slate-400 ml-2">💡 点击小标签旁的 ✕ 可撤回改待定</span>
        </div>
        <div id="passedListContainer" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto pr-1">
          <!-- 动态渲染已普及买家（支持一键撤回） -->
        </div>
      </div>
    </div>

    <!-- 顶栏 2：数据同步提示 + 右侧短搜索框 -->
    <div class="mb-6 bg-slate-800 p-3 rounded-xl border border-slate-700 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="text-xs text-slate-400 flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
        <span id="syncStatusText">已连接至 Google Sheets 数据源</span>
        <button onclick="fetchGoogleSheetsData(true)" class="ml-2 px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded transition flex items-center space-x-1 shadow text-xs">
          <span>🔄 刷新表格数据</span>
        </button>
      </div>

      <div class="relative w-full sm:w-64">
        <input 
          type="search" 
          id="searchInput" 
          oninput="renderAdminView()" 
          placeholder="🔍 快速查找买家名字/订单..." 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-400"
        >
      </div>
    </div>

    <!-- 底部：待角逐中卡片/列表展区 (已普及的卡片自动隐藏腾空间) -->
    <div id="adminViewContainer" class="bg-slate-800/50 rounded-2xl p-6 border border-slate-700 min-h-[400px]">
    </div>

  </main>

  <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    © Mochiishop Shopee Monthly Event. All rights reserved.
  </footer>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1VSfYPx-lpdSAw8pgebnABW3rlSFK-8t4oxqPPcjKtt0/gviz/tq?tqx=out:csv&gid=322881163";

    let currentViewType = "grid"; 
    let state = { candidates: [] };

    window.onload = function() {
      loadState();
      if (!state.candidates || state.candidates.length === 0) {
        fetchGoogleSheetsData();
      } else {
        renderAdminView();
        updateStats();
      }
    };

    function fetchGoogleSheetsData(isManual) {
      const syncStatus = document.getElementById('syncStatusText');
      if (syncStatus) syncStatus.innerText = "正在从 Google Sheets 同步中...";

      fetch(SHEET_CSV_URL)
        .then(response => {
          if (!response.ok) throw new Error("读取失败");
          return response.text();
        })
        .then(csvText => {
          parseCSVAndMerge(csvText);
          if (syncStatus) syncStatus.innerText = "已成功从 Google Sheets 同步！";
          if (isManual) alert("同步成功！已载入 Google Sheets 的最新买家名单。");
        })
        .catch(err => {
          console.error(err);
          if (syncStatus) syncStatus.innerText = "连接失败，请检查表格权限";
        });
    }

    function parseCSVAndMerge(csvText) {
      const lines = csvText.split('\n');
      const existingStatusMap = {};

      state.candidates.forEach(c => {
        if (c.name) existingStatusMap[c.name.trim()] = c.status;
      });

      const newCandidates = [];
      lines.forEach((line, idx) => {
        if (!line.trim()) return;
        const cleanLine = line.replace(/"/g, '');
        const parts = cleanLine.split(',');

        if (parts.length >= 1) {
          const name = parts[0] ? parts[0].trim() : '';
          const orderNo = parts[1] ? parts[1].trim() : '';

          if (name && name !== '买家姓名' && name !== 'Name') {
            const preservedStatus = existingStatusMap[name] || 'pending';
            newCandidates.push({
              id: Date.now() + idx,
              name: name,
              orderNo: orderNo,
              status: preservedStatus
            });
          }
        }
      });

      state.candidates = newCandidates;
      saveState();
    }

    function loadState() {
      const saved = localStorage.getItem('mochii_tournament_state');
      if (saved) {
        try { state = JSON.parse(saved); } catch(e){}
      }
    }

    function saveState() {
      localStorage.setItem('mochii_tournament_state', JSON.stringify(state));
      updateStats();
      renderAdminView();
    }

    function updateStats() {
      const total = state.candidates.length;
      const passed = state.candidates.filter(c => c.status === 'pass').length;
      const pending = state.candidates.filter(c => c.status === 'pending').length;
      const out = state.candidates.filter(c => c.status === 'out').length;

      document.getElementById('statTotalCandidates').innerText = total;
      document.getElementById('statPassedCount').innerText = passed;
      document.getElementById('statPendingCount').innerText = pending;
      document.getElementById('statOutCount').innerText = out;
      document.getElementById('passedBadgeCount').innerText = passed + '人';
    }

    function changeStatus(id, newStatus) {
      const target = state.candidates.find(c => c.id === id);
      if (target) {
        target.status = newStatus;
        saveState();
      }
    }

    function toggleViewMode() {
      currentViewType = (currentViewType === 'grid') ? 'list' : 'grid';
      const btnText = document.getElementById('viewModeText');
      if (btnText) {
        btnText.innerText = (currentViewType === 'grid') ? '卡片直控' : '分组列表';
      }
      renderAdminView();
    }

    function renderAdminView() {
      const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();

      let list = state.candidates.filter(c => 
        (c.name || '').toLowerCase().includes(search) || (c.orderNo || '').toLowerCase().includes(search)
      );

      // 1. 渲染顶栏【已普及/晋级名单】(支持点击撤回)
      const passedContainer = document.getElementById('passedListContainer');
      const passedList = list.filter(c => c.status === 'pass');

      if (passedList.length === 0) {
        passedContainer.innerHTML = '<span class="text-xs text-slate-500 italic">暂无普及买家，等待您点击晋级...</span>';
      } else {
        passedContainer.innerHTML = passedList.map(c => 
          '<div class="px-3 py-1.5 bg-emerald-950/70 border border-emerald-500/50 rounded-lg flex items-center space-x-2 text-xs shadow-sm group hover:border-emerald-400 transition">' +
            '<span class="font-bold text-emerald-300">' + escapeHtml(c.name) + '</span>' +
            '<span class="text-slate-400 font-mono text-[11px]">' + escapeHtml(c.orderNo) + '</span>' +
            '<button onclick="changeStatus(' + c.id + ', \'pending\')" title="撤回改待定" class="ml-1 text-emerald-400 hover:text-rose-400 font-bold px-1 bg-emerald-900/50 rounded hover:bg-rose-950 transition">✕</button>' +
          '</div>'
        ).join('');
      }

      // 2. 渲染底部【待角逐卡片/列表】(普及卡片自动从此处移除以节省空间)
      const container = document.getElementById('adminViewContainer');
      const pendingList = list.filter(c => c.status === 'pending' || c.status === 'out');

      if (list.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-slate-500"><p class="text-2xl mb-2">🔍</p><p>未找到符合条件的买家</p></div>';
        return;
      }

      if (pendingList.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-slate-500"><p class="text-2xl mb-2">🎉</p><p>所有角逐卡片已全部完成普及判定！</p></div>';
        return;
      }

      if (currentViewType === 'grid') {
        const cardsHtml = pendingList.map((c, index) => {
          let borderStyle = 'border-slate-700 bg-slate-800';
          let statusBadge = '';

          if (c.status === 'out') {
            borderStyle = 'border-slate-800 bg-slate-900/60 opacity-50';
            statusBadge = '<span class="px-2 py-0.5 rounded text-xs bg-slate-700 text-slate-400">已淘汰</span>';
          }

          const btnPassStyle = 'bg-slate-700 text-emerald-400 hover:bg-emerald-600 hover:text-white font-bold';
          const btnOutStyle = (c.status === 'out') ? 'bg-rose-500 text-white font-bold' : 'bg-slate-700 text-slate-400 hover:bg-rose-600 hover:text-white';

          return '<div class="p-4 rounded-xl border ' + borderStyle + ' transition relative flex flex-col justify-between shadow">' +
            '<div>' +
              '<div class="flex justify-between items-start mb-2">' +
                '<span class="text-xs font-mono text-slate-400">#' + (index + 1) + '</span>' +
                statusBadge +
              '</div>' +
              '<div class="font-bold text-slate-100 text-base truncate">' + escapeHtml(c.name) + '</div>' +
              '<div class="text-xs text-amber-400/80 font-mono mt-0.5 truncate">' + escapeHtml(c.orderNo || '无订单号') + '</div>' +
            '</div>' +

            '<div class="mt-4 pt-3 border-t border-slate-700/60 flex space-x-2">' +
              '<button onclick="changeStatus(' + c.id + ', \'pass\')" class="flex-1 py-1.5 text-xs rounded transition ' + btnPassStyle + '">🏆 点击普及</button>' +
              '<button onclick="changeStatus(' + c.id + ', \'out\')" class="px-3 py-1.5 text-xs rounded transition ' + btnOutStyle + '">❌ 淘汰</button>' +
            '</div>' +
          '</div>';
        }).join('');

        container.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">' + cardsHtml + '</div>';
      } else {
        // 分组列表模式
        const pendingOnlyList = list.filter(c => c.status === 'pending');

        const pendingHtml = pendingOnlyList.map(c => 
          '<div class="p-3 bg-slate-800 rounded-lg flex justify-between items-center border border-slate-700">' +
            '<div class="min-w-0 flex-1 pr-2">' +
              '<div class="font-bold text-slate-200 truncate">' + escapeHtml(c.name) + '</div>' +
              '<div class="text-xs text-slate-400 font-mono truncate">' + escapeHtml(c.orderNo) + '</div>' +
            '</div>' +
            '<button onclick="changeStatus(' + c.id + ', \'pass\')" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1.5 rounded">点此普及</button>' +
          '</div>'
        ).join('') || '<p class="text-xs text-slate-500 py-2">全员公布完毕</p>';

        container.innerHTML = 
          '<div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700">' +
            '<h3 class="text-amber-400 font-bold text-md mb-3 flex items-center justify-between">' +
              '<span>⚡ 待角逐名单 (' + pendingOnlyList.length + ' 人)</span>' +
            '</h3>' +
            '<div class="space-y-2">' + pendingHtml + '</div>' +
          '</div>';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
