<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochiishop 每月抽奖 - 直播控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- 顶部 Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🎬</span>
        <div>
          <h1 class="text-xl font-bold text-amber-400" data-i18n="adminTitle">Mochiishop 每月抽奖 - 直播控制台</h1>
          <p class="text-xs text-slate-400" data-i18n="adminSubTitle">管理者专属 · 多轮晋级控盘系统</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-3">
        <!-- ⚙️ 模式显示与齿轮设置按钮 -->
        <div class="flex items-center space-x-2 bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg text-xs shadow-inner">
          <span id="currentModeBadge" class="text-amber-400 font-bold">模式: 冠亚季模式</span>
          <button onclick="openConfigModal()" class="text-slate-400 hover:text-amber-400 transition text-base ml-1" title="设置抽奖模式规则">
            ⚙️
          </button>
        </div>

        <!-- 🌐 语言切换按钮 -->
        <div class="flex items-center space-x-1 bg-slate-900 border border-slate-700 p-1 rounded-lg">
          <button onclick="setLanguage('zh')" id="langBtn-zh" class="px-2 py-1 text-xs rounded transition flex items-center space-x-1">
            <span>🇨🇳</span> <span class="text-[11px]">ZH</span>
          </button>
          <button onclick="setLanguage('en')" id="langBtn-en" class="px-2 py-1 text-xs rounded transition flex items-center space-x-1">
            <span>🇬🇧</span> <span class="text-[11px]">EN</span>
          </button>
          <button onclick="setLanguage('ms')" id="langBtn-ms" class="px-2 py-1 text-xs rounded transition flex items-center space-x-1">
            <span>🇲🇾</span> <span class="text-[11px]">MS</span>
          </button>
        </div>

        <button onclick="goToPrevRound()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold rounded-lg border border-slate-600 transition shadow" data-i18n="btnPrevRound">
          🔙 返回至上一轮
        </button>
        <button id="advanceNextRoundBtn" onclick="createNewRound()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-lg transition shadow flex items-center space-x-1">
          <span id="advanceNextRoundBtnText" data-i18n="btnNextRound">⏩ 推进本轮普及人员至下一轮</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ⚙️ 抽奖模式与规则配置弹窗 -->
  <div id="configModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-lg w-full shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeConfigModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">✕</button>
      <h3 class="text-lg font-bold text-amber-400 mb-4 flex items-center space-x-2">
        <span>⚙️</span>
        <span>抽奖模式与规则配置</span>
      </h3>

      <div class="space-y-4 text-xs">
        <label class="flex items-center space-x-2 bg-slate-900/80 p-3 rounded-xl border border-amber-500/30 cursor-pointer">
          <input type="checkbox" id="enableModeCheckbox" onchange="toggleModeEnable()" class="w-4 h-4 text-amber-500 rounded focus:ring-0">
          <span class="font-bold text-slate-200">启用模式规则 (必须勾选后方能生效)</span>
        </label>

        <div id="modeRadioGroup" class="space-y-3 opacity-50 pointer-events-none transition-all">
          <label class="flex items-start space-x-2 p-3 rounded-xl border border-slate-700 bg-slate-900/40 hover:bg-slate-900/80 cursor-pointer">
            <input type="radio" name="drawMode" value="mode1" class="mt-0.5">
            <div>
              <div class="font-bold text-amber-300">模式 1：冠亚季模式</div>
              <div class="text-[11px] text-slate-400 mt-0.5">普及名单手动选满 3 人（冠亚季）时自动触发大屏全屏恭喜播报。</div>
            </div>
          </label>

          <label class="flex items-start space-x-2 p-3 rounded-xl border border-slate-700 bg-slate-900/40 hover:bg-slate-900/80 cursor-pointer">
            <input type="radio" name="drawMode" value="mode2" class="mt-0.5">
            <div class="flex-1">
              <div class="font-bold text-emerald-300">模式 2：包含安慰奖模式</div>
              <div class="text-[11px] text-slate-400 mt-0.5 mb-1.5">普及名单手动选满【安慰奖+冠亚季】名额时，触发全局自动结算。</div>
              <div class="flex items-center space-x-2 bg-slate-800/80 p-2 rounded-lg border border-slate-700">
                <span class="text-slate-300">安慰奖名额:</span>
                <input type="number" id="mode2ConsolationCount" value="10" min="1" max="100" class="w-16 bg-slate-900 border border-slate-600 rounded px-2 py-0.5 font-bold text-emerald-400 focus:outline-none focus:border-emerald-400">
                <span class="text-slate-400">人 (默认10名)</span>
              </div>
            </div>
          </label>

          <label class="flex items-start space-x-2 p-3 rounded-xl border border-slate-700 bg-slate-900/40 hover:bg-slate-900/80 cursor-pointer">
            <input type="radio" name="drawMode" value="mode3" class="mt-0.5">
            <div class="flex-1">
              <div class="flex justify-between items-center">
                <div class="font-bold text-blue-300">模式 3：自定义模式</div>
                <button type="button" onclick="openMode3CustomSubModal()" class="px-2 py-1 bg-blue-600/30 hover:bg-blue-600 text-blue-300 hover:text-white border border-blue-500/40 rounded transition font-bold text-[11px]">
                  ⚙️ 自定义规则设置 ➔
                </button>
              </div>
              <div id="mode3SummaryText" class="text-[11px] text-slate-400 mt-1">勾选并设定各奖项名额。</div>
            </div>
          </label>
        </div>
      </div>

      <div class="mt-6 flex justify-end space-x-2 border-t border-slate-700/60 pt-4">
        <button onclick="saveConfigModal()" class="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-xs transition shadow">
          💾 保存设置
        </button>
      </div>
    </div>
  </div>

  <!-- 模式 3 自定义规则框架弹窗 -->
  <div id="mode3CustomSubModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border-2 border-blue-500/50 rounded-2xl p-6 max-w-md w-full shadow-2xl relative">
      <button onclick="closeMode3CustomSubModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">✕</button>
      <h3 class="text-md font-bold text-blue-400 mb-1 flex items-center space-x-2">
        <span>🛠️</span>
        <span>模式 3：自定义规则框架配置</span>
      </h3>
      <p class="text-xs text-slate-400 mb-4">请勾选需要生效的奖项规则，并设定对应的获胜人数：</p>

      <div class="space-y-3 text-xs">
        <div class="flex items-center justify-between p-2.5 bg-slate-900/80 border border-slate-700 rounded-xl">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="m3EnableChampion" class="w-4 h-4 text-amber-500 rounded focus:ring-0">
            <span class="font-bold text-amber-300">👑 冠军规则</span>
          </label>
          <div class="flex items-center space-x-1">
            <span class="text-slate-400">人数:</span>
            <input type="number" id="m3ChampionCount" value="1" min="1" max="20" class="w-14 bg-slate-800 border border-slate-600 rounded px-1 py-0.5 text-center font-bold text-amber-400">
          </div>
        </div>

        <div class="flex items-center justify-between p-2.5 bg-slate-900/80 border border-slate-700 rounded-xl">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="m3EnableRunnerUp" class="w-4 h-4 text-slate-400 rounded focus:ring-0">
            <span class="font-bold text-slate-300">🥈 亚军规则</span>
          </label>
          <div class="flex items-center space-x-1">
            <span class="text-slate-400">人数:</span>
            <input type="number" id="m3RunnerUpCount" value="1" min="1" max="20" class="w-14 bg-slate-800 border border-slate-600 rounded px-1 py-0.5 text-center font-bold text-slate-200">
          </div>
        </div>

        <div class="flex items-center justify-between p-2.5 bg-slate-900/80 border border-slate-700 rounded-xl">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="m3EnableThirdPlace" class="w-4 h-4 text-amber-700 rounded focus:ring-0">
            <span class="font-bold text-amber-600">🥉 季军规则</span>
          </label>
          <div class="flex items-center space-x-1">
            <span class="text-slate-400">人数:</span>
            <input type="number" id="m3ThirdPlaceCount" value="1" min="1" max="20" class="w-14 bg-slate-800 border border-slate-600 rounded px-1 py-0.5 text-center font-bold text-amber-500">
          </div>
        </div>

        <div class="flex items-center justify-between p-2.5 bg-slate-900/80 border border-slate-700 rounded-xl">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="m3EnableConsolation" class="w-4 h-4 text-emerald-500 rounded focus:ring-0">
            <span class="font-bold text-emerald-400">🎁 安慰奖规则</span>
          </label>
          <div class="flex items-center space-x-1">
            <span class="text-slate-400">人数:</span>
            <input type="number" id="m3ConsolationCount" value="5" min="1" max="100" class="w-14 bg-slate-800 border border-slate-600 rounded px-1 py-0.5 text-center font-bold text-emerald-300">
          </div>
        </div>
      </div>

      <div class="mt-6 flex justify-end space-x-2">
        <button onclick="saveMode3CustomSubModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-xs transition">
          ✅ 确认并保存自定义规则
        </button>
      </div>
    </div>
  </div>

  <!-- 主体区域 -->
  <main class="max-w-[1600px] mx-auto px-4 py-6 flex-1 w-full">
    <div class="mb-4 flex items-center justify-between border-b border-slate-800 pb-2">
      <div id="roundTabsContainer" class="flex space-x-2 overflow-x-auto"></div>
      <button onclick="resetRounds()" class="text-xs text-rose-400 hover:underline font-bold" data-i18n="btnResetAll">⚠️ 重置所有轮次数据</button>
    </div>

    <!-- 数据概览 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block" data-i18n="statTotal">本轮参选人数</span>
        <span id="statTotalCandidates" class="text-2xl font-black text-blue-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block" data-i18n="statPassed">本轮已普及/晋级</span>
        <span id="statPassedCount" class="text-2xl font-black text-emerald-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block" data-i18n="statPending">本轮角逐中人数</span>
        <span id="statPendingCount" class="text-2xl font-black text-amber-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block" data-i18n="statOut">本轮已淘汰人数</span>
        <span id="statOutCount" class="text-2xl font-black text-slate-400">0</span>
      </div>
    </div>

    <!-- 已普及区 -->
    <div class="mb-6 bg-slate-800/90 p-4 rounded-xl border border-emerald-500/30 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-lg">
      <div class="flex-1 w-full">
        <div class="flex items-center space-x-2 mb-2">
          <span class="text-lg">🏆</span>
          <h2 id="passedTitleText" class="text-md font-bold text-emerald-400">第 1 轮 已普及/晋级名单</h2>
          <span id="passedBadgeCount" class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">0人</span>
        </div>
        <div id="passedListContainer" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto pr-1"></div>
      </div>
    </div>

    <!-- 同步状态 & 搜索栏 -->
    <div class="mb-6 bg-slate-800 p-3 rounded-xl border border-slate-700 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="text-xs text-slate-400 flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
        <span id="syncStatusText" data-i18n="syncConnected">已连接至 Google Sheets 数据源</span>
        <button id="refreshSheetsBtn" onclick="fetchGoogleSheetsData(true)" class="ml-2 px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded transition text-xs shadow disabled:opacity-40">
          <span data-i18n="btnRefreshSheets">🔄 从表格更新第 1 轮名单</span>
        </button>
      </div>

      <div class="relative w-full sm:w-64">
        <input type="search" id="searchInput" oninput="renderAdminView()" placeholder="🔍 快速查找本轮买家/订单..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-400">
      </div>
    </div>

    <div id="adminViewContainer" class="bg-slate-800/50 rounded-2xl p-6 border border-slate-700 min-h-[400px]"></div>

  </main>

  <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    © Mochiishop Shopee Monthly Event. All rights reserved.
  </footer>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1VSfYPx-lpdSAw8pgebnABW3rlSFK-8t4oxqPPcjKtt0/gviz/tq?tqx=out:csv&gid=322881163";

    let currentLang = localStorage.getItem('mochii_lang') || 'zh';
    let currentRoundIndex = 0;
    let state = {
      modeConfig: {
        enabled: true,
        selectedMode: 'mode1',
        mode2ConsolationCount: 10,
        mode3Rules: {
          enableChampion: true, championCount: 1,
          enableRunnerUp: true, runnerUpCount: 1,
          enableThirdPlace: true, thirdPlaceCount: 1,
          enableConsolation: false, consolationCount: 5
        }
      },
      rounds: [{ roundName: "第 1 轮", candidates: [] }]
    };

    const i18n = {
      zh: {
        adminTitle: "Mochiishop 每月抽奖 - 直播控制台",
        adminSubTitle: "管理者专属 · 多轮晋级控盘系统",
        btnPrevRound: "🔙 返回至上一轮",
        btnNextRound: "⏩ 推进本轮普及人员至下一轮",
        btnResetAll: "⚠️ 重置所有轮次数据",
        statTotal: "本轮参选人数",
        statPassed: "本轮已普及/晋级",
        statPending: "本轮角逐中人数",
        statOut: "本轮已淘汰人数",
        syncConnected: "已连接至 Google Sheets 数据源",
        syncing: "正在从 Google Sheets 同步中...",
        syncSuccess: "已成功从 Google Sheets 同步！",
        btnRefreshSheets: "🔄 从表格更新第 1 轮名单",
        searchPlaceholder: "🔍 快速查找本轮买家/订单...",
        roundPrefix: "第 ",
        roundSuffix: " 轮",
        passedTitle: "已普及/晋级名单",
        noPassed: "本轮暂无普及买家，等待您点击普及...",
        noPendingList: "本轮普及判定已完成！可点击右上角【⏩ 推进本轮普及人员至下一轮】",
        btnPass: "🏆 普及",
        btnOut: "❌ 淘汰",
        btnUndoOut: "↩️ 撤回淘汰",
        badgeOut: "❌ 已淘汰",
        unitPeople: "人"
      },
      en: {
        adminTitle: "Mochiishop Monthly Draw - Admin Control",
        adminSubTitle: "Exclusive Admin · Multi-Round Tournament System",
        btnPrevRound: "🔙 Back to Previous Round",
        btnNextRound: "⏩ Advance Qualified to Next Round",
        btnResetAll: "⚠️ Reset All Rounds Data",
        statTotal: "Total Candidates",
        statPassed: "Passed / Qualified",
        statPending: "In Battle",
        statOut: "Eliminated",
        syncConnected: "Connected to Google Sheets",
        syncing: "Syncing from Google Sheets...",
        syncSuccess: "Successfully synced from Sheets!",
        btnRefreshSheets: "🔄 Refresh Round 1 List",
        searchPlaceholder: "🔍 Fast search name/order...",
        roundPrefix: "Round ",
        roundSuffix: "",
        passedTitle: "Passed / Qualified List",
        noPassed: "No qualified buyers yet in this round",
        noPendingList: "Round completed! Click 'Advance Qualified to Next Round' on top right.",
        btnPass: "🏆 Pass",
        btnOut: "❌ Out",
        btnUndoOut: "↩️ Undo Out",
        badgeOut: "❌ Out",
        unitPeople: ""
      },
      ms: {
        adminTitle: "Mochiishop Cabutan Bulanan - Konsol Kawalan",
        adminSubTitle: "Pengurus Eksklusif · Sistem Pertandingan Pelbagai Pusingan",
        btnPrevRound: "🔙 Kembali ke Pusingan Sebelumnya",
        btnNextRound: "⏩ Majukan Calon Layak ke Pusingan Seterusnya",
        btnResetAll: "⚠️ Tetap Semula Semua Data",
        statTotal: "Jumlah Calon",
        statPassed: "Lulus / Layak",
        statPending: "Dalam Bersaing",
        statOut: "Tersingkir",
        syncConnected: "Telah disambungkan ke Google Sheets",
        syncing: "Menyelaraskan dari Google Sheets...",
        syncSuccess: "Berjaya diselaraskan dari Sheets!",
        btnRefreshSheets: "🔄 Kemas Kini Senarai Pusingan 1",
        searchPlaceholder: "🔍 Cari cepat nama/pesanan...",
        roundPrefix: "Pusingan ",
        roundSuffix: "",
        passedTitle: "Senarai Layak / Lulus",
        noPassed: "Belum ada pembeli layak dalam pusingan ini",
        noPendingList: "Keputusan pusingan selesai!",
        btnPass: "🏆 Layak",
        btnOut: "❌ Singkir",
        btnUndoOut: "↩️ Batal Singkir",
        badgeOut: "❌ Tersingkir",
        unitPeople: " orang"
      }
    };

    window.onload = function() {
      setLanguage(currentLang);
      loadState();
      syncModalUIWithState();
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { candidates: [] };
      if (!activeRound.candidates || activeRound.candidates.length === 0) {
        fetchGoogleSheetsData();
      } else {
        renderRoundTabs();
        renderAdminView();
        updateStats();
      }
    };

    function openConfigModal() { document.getElementById('configModal').classList.remove('hidden'); }
    function closeConfigModal() { document.getElementById('configModal').classList.add('hidden'); }

    function openMode3CustomSubModal() { document.getElementById('mode3CustomSubModal').classList.remove('hidden'); }
    function closeMode3CustomSubModal() { document.getElementById('mode3CustomSubModal').classList.add('hidden'); }

    function toggleModeEnable() {
      const isChecked = document.getElementById('enableModeCheckbox').checked;
      const group = document.getElementById('modeRadioGroup');
      if (isChecked) group.classList.remove('opacity-50', 'pointer-events-none');
      else group.classList.add('opacity-50', 'pointer-events-none');
    }

    function saveMode3CustomSubModal() {
      const rules = {
        enableChampion: document.getElementById('m3EnableChampion').checked,
        championCount: parseInt(document.getElementById('m3ChampionCount').value, 10) || 1,
        enableRunnerUp: document.getElementById('m3EnableRunnerUp').checked,
        runnerUpCount: parseInt(document.getElementById('m3RunnerUpCount').value, 10) || 1,
        enableThirdPlace: document.getElementById('m3EnableThirdPlace').checked,
        thirdPlaceCount: parseInt(document.getElementById('m3ThirdPlaceCount').value, 10) || 1,
        enableConsolation: document.getElementById('m3EnableConsolation').checked,
        consolationCount: parseInt(document.getElementById('m3ConsolationCount').value, 10) || 5,
      };

      if (!state.modeConfig) state.modeConfig = {};
      state.modeConfig.mode3Rules = rules;
      updateMode3SummaryText();
      closeMode3CustomSubModal();
      alert("✅ 模式 3 自定义规则配置已成功保存！");
    }

    function updateMode3SummaryText() {
      const el = document.getElementById('mode3SummaryText');
      if (!el) return;
      const r = (state.modeConfig && state.modeConfig.mode3Rules) ? state.modeConfig.mode3Rules : {};
      let parts = [];
      if (r.enableChampion) parts.push(`冠军${r.championCount}名`);
      if (r.enableRunnerUp) parts.push(`亚军${r.runnerUpCount}名`);
      if (r.enableThirdPlace) parts.push(`季军${r.thirdPlaceCount}名`);
      if (r.enableConsolation) parts.push(`安慰奖${r.consolationCount}名`);

      if (parts.length === 0) el.innerText = "尚未勾选任何自定义规则（点击右侧设置）。";
      else el.innerText = `已激活规则: ${parts.join(' + ')}`;
    }

    function saveConfigModal() {
      const isEnabled = document.getElementById('enableModeCheckbox').checked;
      const radios = document.getElementsByName('drawMode');
      let selected = 'mode1';
      for (let r of radios) { if (r.checked) selected = r.value; }

      const mode2Cons = parseInt(document.getElementById('mode2ConsolationCount').value, 10) || 10;

      if (!state.modeConfig) state.modeConfig = {};
      state.modeConfig.enabled = isEnabled;
      state.modeConfig.selectedMode = selected;
      state.modeConfig.mode2ConsolationCount = mode2Cons;

      saveState();
      updateModeBadgeUI();
      closeConfigModal();
      alert("⚙️ 模式与规则已成功更新！");
    }

    function syncModalUIWithState() {
      if (!state.modeConfig) state.modeConfig = { enabled: true, selectedMode: 'mode1', mode2ConsolationCount: 10 };
      
      document.getElementById('enableModeCheckbox').checked = state.modeConfig.enabled !== false;
      toggleModeEnable();

      const radios = document.getElementsByName('drawMode');
      for (let r of radios) {
        if (r.value === (state.modeConfig.selectedMode || 'mode1')) r.checked = true;
      }

      document.getElementById('mode2ConsolationCount').value = state.modeConfig.mode2ConsolationCount || 10;

      const m3 = state.modeConfig.mode3Rules || { enableChampion: true, championCount: 1, enableRunnerUp: true, runnerUpCount: 1, enableThirdPlace: true, thirdPlaceCount: 1, enableConsolation: false, consolationCount: 5 };
      document.getElementById('m3EnableChampion').checked = !!m3.enableChampion;
      document.getElementById('m3ChampionCount').value = m3.championCount || 1;
      document.getElementById('m3EnableRunnerUp').checked = !!m3.enableRunnerUp;
      document.getElementById('m3RunnerUpCount').value = m3.runnerUpCount || 1;
      document.getElementById('m3EnableThirdPlace').checked = !!m3.enableThirdPlace;
      document.getElementById('m3ThirdPlaceCount').value = m3.thirdPlaceCount || 1;
      document.getElementById('m3EnableConsolation').checked = !!m3.enableConsolation;
      document.getElementById('m3ConsolationCount').value = m3.consolationCount || 5;

      updateMode3SummaryText();
      updateModeBadgeUI();
    }

    function updateModeBadgeUI() {
      const badge = document.getElementById('currentModeBadge');
      if (!badge) return;
      if (!state.modeConfig || !state.modeConfig.enabled) {
        badge.innerText = "模式: 未启用规则";
        badge.className = "text-slate-400 font-bold";
        return;
      }
      const m = state.modeConfig.selectedMode;
      if (m === 'mode1') badge.innerText = "模式: 冠亚季模式";
      else if (m === 'mode2') badge.innerText = `模式: 安慰奖模式(${state.modeConfig.mode2ConsolationCount || 10}名安慰奖)`;
      else if (m === 'mode3') badge.innerText = `模式: 自定义模式`;
      badge.className = "text-amber-400 font-bold";
    }

    // 🌟 核心状态变更与规则判断函数
    function changeStatus(id, newStatus) {
      const activeRound = state.rounds[currentRoundIndex];
      const target = activeRound.candidates.find(c => c.id === id);
      if (!target) return;

      target.status = newStatus;

      // 仅仅获取【已被管理者点击普及/晋级】的买家名单（pass）
      const passedCandidates = activeRound.candidates.filter(c => c.status === 'pass');
      const isModeEnabled = state.modeConfig && state.modeConfig.enabled;
      const selectedMode = state.modeConfig ? state.modeConfig.selectedMode : 'mode1';

      // 🌟 修正 1：模式 1 条件（只有当【已普及名单】被手动选满 3 人时，才触发广播）
      if (isModeEnabled && selectedMode === 'mode1' && passedCandidates.length === 3 && newStatus === 'pass') {
        const winnerNames = passedCandidates.map(c => c.name).join('、');
        
        state.latestEvent = {
          type: 'finalCongrat',
          timestamp: Date.now(),
          targetRoundIndex: currentRoundIndex,
          winnerNames: winnerNames
        };
        saveState();
        renderRoundTabs();
        alert(`👑 🎉【冠亚季军产生】！已成功选择 3 名获奖买家：${winnerNames}！公开大屏已实时同步广播！`);
        return;
      }

      // 🌟 修正 2：模式 2 条件（当【已普及名单】选满 安慰奖名额+3 时，触发广播）
      if (isModeEnabled && selectedMode === 'mode2' && newStatus === 'pass') {
        const consCount = state.modeConfig.mode2ConsolationCount || 10;
        const totalThreshold = consCount + 3; // 安慰奖 + 冠亚季3名

        if (passedCandidates.length === totalThreshold) {
          const winnerNames = passedCandidates.map(c => c.name).join('、');
          state.latestEvent = {
            type: 'finalCongrat',
            timestamp: Date.now(),
            targetRoundIndex: currentRoundIndex,
            winnerNames: winnerNames
          };
          saveState();
          renderRoundTabs();
          alert(`👑 🎉【模式 2 全局奖项诞生】！已成功选出 ${consCount} 名安慰奖与冠亚季军（共${totalThreshold}名）：${winnerNames}！公开大屏已实时同步显示！`);
          return;
        }
      }

      saveState();
    }

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('mochii_lang', lang);

      ['zh', 'en', 'ms'].forEach(l => {
        const btn = document.getElementById(`langBtn-${l}`);
        if (btn) btn.className = (l === lang) ? "px-2 py-1 text-xs rounded transition flex items-center space-x-1 bg-amber-500 text-slate-950 font-bold" : "px-2 py-1 text-xs rounded transition flex items-center space-x-1 text-slate-400 hover:text-slate-100";
      });

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key] !== undefined) el.innerText = i18n[lang][key];
      });

      renderRoundTabs();
      renderAdminView();
      updateStats();
    }

    function getRoundTitle(idx) {
      const r = state.rounds[idx];
      if (r && r.stageName) return r.stageName;
      return `${i18n[currentLang].roundPrefix}${idx + 1}${i18n[currentLang].roundSuffix}`;
    }

    function fetchGoogleSheetsData(isManual) {
      if (currentRoundIndex !== 0) { alert("仅限在第 1 轮刷新表格数据！"); return; }
      fetch(SHEET_CSV_URL)
        .then(response => response.text())
        .then(csvText => {
          parseCSVToFirstRound(csvText);
          if (isManual) alert(i18n[currentLang].syncSuccess);
        });
    }

    function parseCSVToFirstRound(csvText) {
      const lines = csvText.split('\n');
      const candidates = [];
      lines.forEach((line, idx) => {
        if (!line.trim()) return;
        const parts = line.replace(/"/g, '').split(',');
        if (parts[0] && parts[0].trim() !== '买家姓名' && parts[0].trim() !== 'Name') {
          candidates.push({ id: Date.now() + idx, name: parts[0].trim(), orderNo: parts[1] ? parts[1].trim() : '', status: 'pending' });
        }
      });
      state.rounds[0].candidates = candidates;
      saveState();
      renderRoundTabs();
    }

    function goToPrevRound() {
      if (currentRoundIndex === 0) return;
      if (confirm("确认返回上一轮？")) {
        if (currentRoundIndex === state.rounds.length - 1 && state.rounds.length > 1) state.rounds.pop();
        currentRoundIndex = Math.max(0, currentRoundIndex - 1);
        
        state.latestEvent = {
          type: 'prevRound',
          timestamp: Date.now(),
          targetRoundIndex: currentRoundIndex
        };

        saveState();
        renderRoundTabs();
      }
    }

    function createNewRound() {
      const currentRound = state.rounds[currentRoundIndex];
      const passedCandidates = (currentRound.candidates || []).filter(c => c.status === 'pass');

      if (passedCandidates.length === 0) {
        alert("必须先选择普及/晋级买家！");
        return;
      }

      const nextRoundNumber = state.rounds.length + 1;
      const nextRoundCandidates = passedCandidates.map((c, idx) => ({ id: Date.now() + idx, name: c.name, orderNo: c.orderNo, status: 'pending' }));
      
      let stageLabel = `第 ${nextRoundNumber} 轮`;

      if (state.modeConfig && state.modeConfig.enabled && state.modeConfig.selectedMode === 'mode2') {
        const consCount = state.modeConfig.mode2ConsolationCount || 10;
        if (passedCandidates.length === consCount + 3) {
          stageLabel = `🎁 安慰奖环节 (共${consCount}名额)`;
        } else if (passedCandidates.length <= 3) {
          stageLabel = `🏆 冠亚季头三决战环节`;
        }
      }

      state.rounds.push({ roundName: stageLabel, stageName: stageLabel, candidates: nextRoundCandidates });
      currentRoundIndex = state.rounds.length - 1;

      state.latestEvent = {
        type: 'advance',
        timestamp: Date.now(),
        targetRoundIndex: currentRoundIndex
      };

      saveState();
      renderRoundTabs();
      alert(`🎉 已成功推进开启【${stageLabel}】！买家公开大屏已自动跟随更新。`);
    }

    function renderRoundTabs() {
      const container = document.getElementById('roundTabsContainer');
      if (!container) return;
      container.innerHTML = state.rounds.map((r, idx) => {
        const activeClass = (idx === currentRoundIndex) ? "bg-amber-500 text-slate-950 font-bold border-amber-400" : "bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700";
        return `<button onclick="switchRound(${idx})" class="px-4 py-1.5 rounded-lg text-xs border transition ${activeClass}">${escapeHtml(getRoundTitle(idx))}</button>`;
      }).join('');
    }

    function switchRound(idx) { currentRoundIndex = idx; renderRoundTabs(); renderAdminView(); updateStats(); }

    function loadState() {
      const saved = localStorage.getItem('mochii_tournament_state');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.rounds)) state = parsed;
        } catch(e){}
      }
    }

    function saveState() {
      localStorage.setItem('mochii_tournament_state', JSON.stringify(state));
      updateStats();
      renderAdminView();
    }

    function updateStats() {
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { candidates: [] };
      const candidates = activeRound.candidates || [];

      document.getElementById('statTotalCandidates').innerText = candidates.length;
      document.getElementById('statPassedCount').innerText = candidates.filter(c => c.status === 'pass').length;
      document.getElementById('statPendingCount').innerText = candidates.filter(c => c.status === 'pending').length;
      document.getElementById('statOutCount').innerText = candidates.filter(c => c.status === 'out').length;
    }

    function renderAdminView() {
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { candidates: [] };
      const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();

      let list = (activeRound.candidates || []).filter(c => (c.name || '').toLowerCase().includes(search) || (c.orderNo || '').toLowerCase().includes(search));

      const passedContainer = document.getElementById('passedListContainer');
      const passedList = list.filter(c => c.status === 'pass');

      if (passedList.length === 0) {
        passedContainer.innerHTML = `<span class="text-xs text-slate-500 italic">${i18n[currentLang].noPassed}</span>`;
      } else {
        passedContainer.innerHTML = passedList.map(c => 
          '<div class="px-3 py-1.5 bg-emerald-950/70 border border-emerald-500/50 rounded-lg flex items-center space-x-2 text-xs shadow-sm">' +
            '<span class="font-bold text-emerald-300">' + escapeHtml(c.name) + '</span>' +
            '<span class="text-slate-400 font-mono text-[11px]">' + escapeHtml(c.orderNo || '无订单号') + '</span>' +
            '<button onclick="changeStatus(' + c.id + ', \'pending\')" class="ml-1 text-emerald-400 hover:text-rose-400 font-bold px-1 rounded">✕</button>' +
          '</div>'
        ).join('');
      }

      const container = document.getElementById('adminViewContainer');
      const pendingList = list.filter(c => c.status === 'pending' || c.status === 'out');

      if (pendingList.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-500"><p class="text-2xl mb-2">🎉</p><p>${i18n[currentLang].noPendingList}</p></div>`;
        return;
      }

      const cardsHtml = pendingList.map((c, index) => {
        let borderStyle = 'border-slate-700 bg-slate-800';
        let statusBadge = '';
        let btnOutHtml = '';

        if (c.status === 'out') {
          borderStyle = 'border-slate-800 bg-slate-900/60 opacity-60';
          statusBadge = `<span class="px-2 py-0.5 rounded text-xs bg-slate-700 text-slate-400 font-bold">${i18n[currentLang].badgeOut}</span>`;
          btnOutHtml = `<button onclick="changeStatus(${c.id}, 'pending')" class="flex-1 py-1.5 text-xs rounded bg-amber-600 hover:bg-amber-500 text-white font-bold">${i18n[currentLang].btnUndoOut}</button>`;
        } else {
          btnOutHtml = `<button onclick="changeStatus(${c.id}, 'out')" class="px-3 py-1.5 text-xs rounded bg-slate-700 text-slate-400 hover:bg-rose-600 hover:text-white font-bold">${i18n[currentLang].btnOut}</button>`;
        }

        return '<div class="p-4 rounded-xl border ' + borderStyle + ' flex flex-col justify-between shadow">' +
          '<div>' +
            '<div class="flex justify-between items-start mb-2"><span class="text-xs font-mono text-slate-400">#' + (index + 1) + '</span>' + statusBadge + '</div>' +
            '<div class="font-bold text-slate-100 text-base truncate">' + escapeHtml(c.name) + '</div>' +
            '<div class="text-xs text-amber-400/80 font-mono mt-0.5 truncate">' + escapeHtml(c.orderNo || '无订单号') + '</div>' +
          '</div>' +
          '<div class="mt-4 pt-3 border-t border-slate-700/60 flex space-x-2">' +
            (c.status !== 'out' ? `<button onclick="changeStatus(${c.id}, 'pass')" class="flex-1 py-1.5 text-xs rounded bg-slate-700 text-emerald-400 hover:bg-emerald-600 hover:text-white font-bold">${i18n[currentLang].btnPass}</button>` : '') +
            btnOutHtml +
          '</div>' +
        '</div>';
      }).join('');

      container.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">' + cardsHtml + '</div>';
    }

    function resetRounds() {
      if (confirm("确认重置所有数据？")) {
        currentRoundIndex = 0;
        state.rounds = [{ roundName: "第 1 轮", candidates: [] }];
        delete state.latestEvent;
        saveState();
        fetchGoogleSheetsData(true);
      }
    }

    function escapeHtml(str) { return str ? String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
  </script>
</body>
</html>
