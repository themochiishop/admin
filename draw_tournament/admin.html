<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochiishop 每月抽奖 - 直播控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans relative">

  <!-- 顶部 Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🎬</span>
        <div>
          <h1 class="text-xl font-bold text-amber-400" data-i18n="adminTitle">Mochiishop 每月抽奖 - 直播控制台</h1>
          <p class="text-xs text-slate-400 flex items-center space-x-2">
            <span data-i18n="adminSubTitle">管理者专属 · 多轮晋级控盘系统</span>
            <span id="currentModeBadge" class="hidden bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full text-[11px] font-bold"></span>
          </p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        
        <!-- ⚙️ 模式设置齿轮按钮 -->
        <button onclick="openSettingsModal()" class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 border border-slate-600 text-amber-400 rounded-lg text-xs font-bold transition flex items-center space-x-1 shadow" title="设置比赛模式">
          <span>⚙️</span> <span data-i18n="btnSettings">模式设置</span>
        </button>

        <!-- 🌐 语言切换按钮 -->
        <div class="flex items-center space-x-1 bg-slate-900 border border-slate-700 p-1 rounded-lg">
          <button onclick="setLanguage('zh')" id="langBtn-zh" class="px-2 py-1 text-xs rounded transition flex items-center space-x-1">
            <span>🇨🇳</span> <span class="text-[11px]">ZH</span>
          </button>
          <button onclick="setLanguage('en')" id="langBtn-en" class="px-2 py-1 text-xs rounded transition flex items-center space-x-1">
            <span>🇬🇧</span> <span class="text-[11px]">EN</span>
          </button>
          <button onclick="setLanguage('ms')" id="langBtn-ms" class="px-2 py-1 text-xs rounded transition flex items-center space-x-1">
            <span>🇲🇾</span> <span class="text-[11px]">MS</span>
          </button>
        </div>

        <button onclick="goToPrevRound()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold rounded-lg border border-slate-600 transition shadow" data-i18n="btnPrevRound">
          🔙 返回至上一轮
        </button>
        <button id="advanceNextRoundBtn" onclick="createNewRound()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-lg transition shadow flex items-center space-x-1 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-blue-600">
          <span id="advanceNextRoundBtnText" data-i18n="btnNextRound">⏩ 推进本轮普及人员至下一轮</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主体区域 -->
  <main class="max-w-[1600px] mx-auto px-4 py-6 flex-1 w-full">
    
    <!-- 轮次切换 Tabs 区域 -->
    <div class="mb-4 flex items-center justify-between border-b border-slate-800 pb-2">
      <div id="roundTabsContainer" class="flex space-x-2 overflow-x-auto">
        <!-- 动态生成轮次选项卡 -->
      </div>
      <button onclick="resetRounds()" class="text-xs text-rose-400 hover:underline font-bold" data-i18n="btnResetAll">⚠️ 重置所有轮次数据</button>
    </div>

    <!-- 数据概览面板 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block" data-i18n="statTotal">本轮参选人数</span>
        <span id="statTotalCandidates" class="text-2xl font-black text-blue-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block" data-i18n="statPassed">本轮已普及/晋级</span>
        <span id="statPassedCount" class="text-2xl font-black text-emerald-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block" data-i18n="statPending">本轮角逐中人数</span>
        <span id="statPendingCount" class="text-2xl font-black text-amber-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block" data-i18n="statOut">本轮已淘汰人数</span>
        <span id="statOutCount" class="text-2xl font-black text-slate-400">0</span>
      </div>
    </div>

    <!-- 顶栏 1：已普及名单展示区 -->
    <div class="mb-6 bg-slate-800/90 p-4 rounded-xl border border-emerald-500/30 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-lg shadow-emerald-950/20">
      <div class="flex-1 w-full">
        <div class="flex items-center space-x-2 mb-2">
          <span class="text-lg">🏆</span>
          <h2 id="passedTitleText" class="text-md font-bold text-emerald-400">第 1 轮 已普及/晋级名单</h2>
          <span id="passedBadgeCount" class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">0人</span>
          <span class="text-[11px] text-slate-400 ml-2" data-i18n="undoTip">💡 点击小标签旁的 ✕ 可撤回改待定</span>
        </div>
        <div id="passedListContainer" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto pr-1">
        </div>
      </div>
    </div>

    <!-- 顶栏 2：同步状态与短搜索框 -->
    <div class="mb-6 bg-slate-800 p-3 rounded-xl border border-slate-700 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="text-xs text-slate-400 flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
        <span id="syncStatusText" data-i18n="syncConnected">已连接至 Google Sheets 数据源</span>
        <button id="refreshSheetsBtn" onclick="fetchGoogleSheetsData(true)" class="ml-2 px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded transition text-xs shadow disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-emerald-600">
          <span data-i18n="btnRefreshSheets">🔄 从表格更新第 1 轮名单</span>
        </button>
      </div>

      <div class="relative w-full sm:w-64">
        <input 
          type="search" 
          id="searchInput" 
          oninput="renderAdminView()" 
          placeholder="🔍 快速查找本轮买家/订单..." 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-400"
        >
      </div>
    </div>

    <!-- 底部：待角逐中 / 淘汰买家卡片展区 -->
    <div id="adminViewContainer" class="bg-slate-800/50 rounded-2xl p-6 border border-slate-700 min-h-[400px]">
    </div>

  </main>

  <!-- ⚙️ 比赛模式设置弹窗 -->
  <div id="settingsModalOverlay" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl relative">
      <button onclick="closeSettingsModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white font-bold">✕</button>
      <div class="flex items-center space-x-2 mb-4">
        <span class="text-xl">⚙️</span>
        <h3 class="text-lg font-bold text-amber-400">比赛模式设置</h3>
      </div>
      <p class="text-xs text-slate-400 mb-4">勾选后模式生效，大屏与控制台将显示当前活动规则模式：</p>
      
      <div class="space-y-3 mb-6">
        <!-- 模式 1 -->
        <label class="flex items-start space-x-3 p-3 bg-slate-900/60 border border-slate-700 rounded-xl cursor-pointer hover:border-amber-400/50 transition">
          <input type="checkbox" id="mode1Checkbox" onchange="toggleModeCheck('mode1')" class="mt-1 w-4 h-4 text-amber-500 rounded border-slate-600 focus:ring-0 bg-slate-800">
          <div>
            <div class="text-xs font-bold text-slate-200">模式 1：冠亚季模式 (Standard Podiums)</div>
            <div class="text-[11px] text-slate-400 mt-0.5">标准角逐，直至决出前三名（冠亚季军）。</div>
          </div>
        </label>

        <!-- 模式 2 -->
        <label class="flex items-start space-x-3 p-3 bg-slate-900/60 border border-slate-700 rounded-xl cursor-pointer hover:border-amber-400/50 transition">
          <input type="checkbox" id="mode2Checkbox" onchange="toggleModeCheck('mode2')" class="mt-1 w-4 h-4 text-amber-500 rounded border-slate-600 focus:ring-0 bg-slate-800">
          <div>
            <div class="text-xs font-bold text-slate-200">模式 2：包含安慰奖模式 (Consolation Prize Mode)</div>
            <div class="text-[11px] text-slate-400 mt-0.5">未晋级人员额外获得普惠/安慰奖参与资格。</div>
          </div>
        </label>
      </div>

      <div class="flex justify-end space-x-2">
        <button onclick="closeSettingsModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold rounded-lg transition">取消</button>
        <button onclick="saveModeSettings()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold rounded-lg transition">保存设置</button>
      </div>
    </div>
  </div>

  <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    © Mochiishop Shopee Monthly Event. All rights reserved.
  </footer>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1VSfYPx-lpdSAw8pgebnABW3rlSFK-8t4oxqPPcjKtt0/gviz/tq?tqx=out:csv&gid=322881163";

    let currentLang = localStorage.getItem('mochii_lang') || 'zh';
    let currentRoundIndex = 0;
    let state = { rounds: [{ roundName: "第 1 轮", candidates: [] }], currentMode: null };

    const i18n = {
      zh: {
        adminTitle: "Mochiishop 每月抽奖 - 直播控制台",
        adminSubTitle: "管理者专属 · 多轮晋级控盘系统",
        btnSettings: "模式设置",
        btnPrevRound: "🔙 返回至上一轮",
        btnNextRound: "⏩ 推进本轮普及人员至下一轮",
        btnFinalRound: "🏆 已是最终轮",
        btnResetAll: "⚠️ 重置所有轮次数据",
        statTotal: "本轮参选人数",
        statPassed: "本轮已普及/晋级",
        statPending: "本轮角逐中人数",
        statOut: "本轮已淘汰人数",
        undoTip: "💡 点击小标签旁的 ✕ 可撤回改待定",
        syncConnected: "已连接至 Google Sheets 数据源",
        syncing: "正在从 Google Sheets 同步中...",
        syncSuccess: "已成功从 Google Sheets 同步！",
        btnRefreshSheets: "🔄 从表格更新第 1 轮名单",
        searchPlaceholder: "🔍 快速查找本轮买家/订单...",
        roundPrefix: "第 ",
        roundSuffix: " 轮",
        finalRoundTitle: "🏆 最终轮",
        passedTitle: "已普及/晋级名单",
        noPassed: "本轮暂无普及买家，等待您点击普及...",
        noPendingList: "本轮普及判定已完成！",
        btnPass: "🏆 普及",
        btnOut: "❌ 淘汰",
        btnUndoOut: "↩️ 撤回淘汰",
        badgeOut: "❌ 已淘汰",
        unitPeople: "人"
      },
      en: {
        adminTitle: "Mochiishop Monthly Draw - Admin Control",
        adminSubTitle: "Exclusive Admin · Multi-Round Tournament System",
        btnSettings: "Mode Settings",
        btnPrevRound: "🔙 Back to Previous Round",
        btnNextRound: "⏩ Advance Qualified to Next Round",
        btnFinalRound: "🏆 Final Round Reached",
        btnResetAll: "⚠️ Reset All Rounds Data",
        statTotal: "Total Candidates",
        statPassed: "Passed / Qualified",
        statPending: "In Battle",
        statOut: "Eliminated",
        undoTip: "💡 Click ✕ on badge to undo",
        syncConnected: "Connected to Google Sheets",
        syncing: "Syncing from Google Sheets...",
        syncSuccess: "Successfully synced from Sheets!",
        btnRefreshSheets: "🔄 Refresh Round 1 List",
        searchPlaceholder: "🔍 Fast search name/order...",
        roundPrefix: "Round ",
        roundSuffix: "",
        finalRoundTitle: "🏆 Final Round",
        passedTitle: "Passed / Qualified List",
        noPassed: "No qualified buyers yet in this round",
        noPendingList: "Round completed!",
        btnPass: "🏆 Pass",
        btnOut: "❌ Out",
        btnUndoOut: "↩️ Undo Out",
        badgeOut: "❌ Out",
        unitPeople: ""
      },
      ms: {
        adminTitle: "Mochiishop Cabutan Bulanan - Konsol Kawalan",
        adminSubTitle: "Pengurus Eksklusif · Sistem Pertandingan Pelbagai Pusingan",
        btnSettings: "Tetapan Mod",
        btnPrevRound: "🔙 Kembali ke Pusingan Sebelumnya",
        btnNextRound: "⏩ Majukan Calon Layak ke Pusingan Seterusnya",
        btnFinalRound: "🏆 Pusingan Akhir",
        btnResetAll: "⚠️ Tetap Semula Semua Data",
        statTotal: "Jumlah Calon",
        statPassed: "Lulus / Layak",
        statPending: "Dalam Bersaing",
        statOut: "Tersingkir",
        undoTip: "💡 Klik ✕ pada lencana untuk batalkan",
        syncConnected: "Telah disambungkan ke Google Sheets",
        syncing: "Menyelaraskan dari Google Sheets...",
        syncSuccess: "Berjaya diselaraskan dari Sheets!",
        btnRefreshSheets: "🔄 Kemas Kini Senarai Pusingan 1",
        searchPlaceholder: "🔍 Cari cepat nama/pesanan...",
        roundPrefix: "Pusingan ",
        roundSuffix: "",
        finalRoundTitle: "🏆 Pusingan Akhir",
        passedTitle: "Senarai Layak / Lulus",
        noPassed: "Belum ada pembeli layak dalam pusingan ini",
        noPendingList: "Keputusan pusingan selesai!",
        btnPass: "🏆 Layak",
        btnOut: "❌ Singkir",
        btnUndoOut: "↩️ Batal Singkir",
        badgeOut: "❌ Tersingkir",
        unitPeople: " orang"
      }
    };

    window.onload = function() {
      setLanguage(currentLang);
      loadState();
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { candidates: [] };
      if (!activeRound.candidates || activeRound.candidates.length === 0) {
        fetchGoogleSheetsData();
      } else {
        renderRoundTabs();
        renderAdminView();
        updateStats();
        updateModeBadge();
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('mochii_lang', lang);

      ['zh', 'en', 'ms'].forEach(l => {
        const btn = document.getElementById(`langBtn-${l}`);
        if (btn) {
          if (l === lang) {
            btn.className = "px-2 py-1 text-xs rounded transition flex items-center space-x-1 bg-amber-500 text-slate-950 font-bold";
          } else {
            btn.className = "px-2 py-1 text-xs rounded transition flex items-center space-x-1 text-slate-400 hover:text-slate-100";
          }
        }
      });

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key] !== undefined) {
          el.innerText = i18n[lang][key];
        }
      });

      const searchInp = document.getElementById('searchInput');
      if (searchInp) searchInp.placeholder = i18n[lang].searchPlaceholder;

      renderRoundTabs();
      renderAdminView();
      updateStats();
      updateModeBadge();
    }

    function getRoundTitle(idx) {
      const r = state.rounds[idx];
      if (r && r.isFinal) {
        return i18n[currentLang].finalRoundTitle;
      }
      if (r && r.roundName) {
        const match = r.roundName.match(/\d+/);
        const num = match ? match[0] : (idx + 1);
        return `${i18n[currentLang].roundPrefix}${num}${i18n[currentLang].roundSuffix}`;
      }
      return `${i18n[currentLang].roundPrefix}${idx + 1}${i18n[currentLang].roundSuffix}`;
    }

    /* ⚙️ 模式弹窗与切换逻辑 */
    function openSettingsModal() {
      document.getElementById('mode1Checkbox').checked = (state.currentMode === 'mode1');
      document.getElementById('mode2Checkbox').checked = (state.currentMode === 'mode2');
      document.getElementById('settingsModalOverlay').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModalOverlay').classList.add('hidden');
    }

    function toggleModeCheck(selected) {
      if (selected === 'mode1' && document.getElementById('mode1Checkbox').checked) {
        document.getElementById('mode2Checkbox').checked = false;
      } else if (selected === 'mode2' && document.getElementById('mode2Checkbox').checked) {
        document.getElementById('mode1Checkbox').checked = false;
      }
    }

    function saveModeSettings() {
      const isMode1 = document.getElementById('mode1Checkbox').checked;
      const isMode2 = document.getElementById('mode2Checkbox').checked;

      if (isMode1) state.currentMode = 'mode1';
      else if (isMode2) state.currentMode = 'mode2';
      else state.currentMode = null;

      saveState();
      updateModeBadge();
      closeSettingsModal();
      alert("⚙️ 模式设置已保存更新！");
    }

    function updateModeBadge() {
      const badge = document.getElementById('currentModeBadge');
      if (!badge) return;

      if (state.currentMode === 'mode1') {
        badge.innerText = "🏆 冠亚季模式";
        badge.classList.remove('hidden');
      } else if (state.currentMode === 'mode2') {
        badge.innerText = "🎁 安慰奖模式";
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function fetchGoogleSheetsData(isManual) {
      if (currentRoundIndex !== 0) {
        alert("禁止在第 2 轮及后续轮次刷新表格，以免覆盖晋级数据！请先切换回【第 1 轮】。");
        return;
      }

      const syncStatus = document.getElementById('syncStatusText');
      if (syncStatus) syncStatus.innerText = i18n[currentLang].syncing;

      fetch(SHEET_CSV_URL)
        .then(response => response.text())
        .then(csvText => {
          parseCSVToFirstRound(csvText);
          if (syncStatus) syncStatus.innerText = i18n[currentLang].syncSuccess;
          if (isManual) alert(i18n[currentLang].syncSuccess);
        })
        .catch(err => console.error("读取失败", err));
    }

    function parseCSVToFirstRound(csvText) {
      const lines = csvText.split('\n');
      const candidates = [];

      lines.forEach((line, idx) => {
        if (!line.trim()) return;
        const cleanLine = line.replace(/"/g, '');
        const parts = cleanLine.split(',');

        if (parts.length >= 1) {
          const name = parts[0] ? parts[0].trim() : '';
          const orderNo = parts[1] ? parts[1].trim() : '';

          if (name && name !== '买家姓名' && name !== 'Name') {
            candidates.push({
              id: Date.now() + idx,
              name: name,
              orderNo: orderNo,
              status: 'pending'
            });
          }
        }
      });

      if (!state.rounds || state.rounds.length === 0) {
        state.rounds = [{ roundName: "第 1 轮", candidates: candidates }];
      } else {
        state.rounds[0].candidates = candidates;
      }

      saveState();
      renderRoundTabs();
    }

    function goToPrevRound() {
      if (currentRoundIndex === 0) {
        alert("当前已经是第 1 轮，无法再返回上一轮。");
        return;
      }

      if (confirm(`确认返回至上一轮（第 ${currentRoundIndex} 轮）？`)) {
        if (currentRoundIndex === state.rounds.length - 1 && state.rounds.length > 1) {
          state.rounds.pop();
        }
        
        currentRoundIndex = Math.max(0, currentRoundIndex - 1);

        state.latestEvent = {
          type: 'prevRound',
          timestamp: Date.now(),
          targetRoundIndex: currentRoundIndex
        };

        saveState();
        renderRoundTabs();
      }
    }

    function createNewRound() {
      const currentRound = state.rounds[currentRoundIndex];
      if (currentRound && currentRound.isFinal) {
        alert("当前已是最终轮，无法继续推进！");
        return;
      }

      const passedCandidates = (currentRound.candidates || []).filter(c => c.status === 'pass');

      if (passedCandidates.length === 0) {
        alert("当前轮次尚未选择任何普及/晋级买家，请先点击【普及】按钮选出晋级选手！");
        return;
      }

      const nextRoundNumber = state.rounds.length + 1;
      const nextRoundCandidates = passedCandidates.map((c, idx) => ({
        id: Date.now() + idx,
        name: c.name,
        orderNo: c.orderNo,
        status: 'pending'
      }));

      state.rounds.push({
        roundName: `第 ${nextRoundNumber} 轮`,
        candidates: nextRoundCandidates
      });

      currentRoundIndex = state.rounds.length - 1;

      state.latestEvent = {
        type: 'advance',
        timestamp: Date.now(),
        targetRoundIndex: currentRoundIndex
      };

      saveState();
      renderRoundTabs();
      alert(`🎉 已成功开启【第 ${nextRoundNumber} 轮】！公开大屏已自动同步显示。`);
    }

    function renderRoundTabs() {
      const container = document.getElementById('roundTabsContainer');
      if (!container) return;

      container.innerHTML = state.rounds.map((r, idx) => {
        const isActive = (idx === currentRoundIndex);
        const activeClass = isActive ? "bg-amber-500 text-slate-950 font-bold border-amber-400" : "bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700";
        return `<button onclick="switchRound(${idx})" class="px-4 py-1.5 rounded-lg text-xs border transition ${activeClass}">
          ${escapeHtml(getRoundTitle(idx))}
        </button>`;
      }).join('');
    }

    function switchRound(idx) {
      currentRoundIndex = idx;
      renderRoundTabs();
      renderAdminView();
      updateStats();
    }

    function loadState() {
      const saved = localStorage.getItem('mochii_tournament_state');
      if (saved) {
        try { 
          const parsed = JSON.parse(saved); 
          if (parsed && Array.isArray(parsed.rounds) && parsed.rounds.length > 0) {
            state = parsed;
          } else if (parsed && parsed.candidates) {
            state = { rounds: [{ roundName: "第 1 轮", candidates: parsed.candidates }], currentMode: null };
          } else {
            state = { rounds: [{ roundName: "第 1 轮", candidates: [] }], currentMode: null };
          }
        } catch(e){
          state = { rounds: [{ roundName: "第 1 轮", candidates: [] }], currentMode: null };
        }
      } else {
        state = { rounds: [{ roundName: "第 1 轮", candidates: [] }], currentMode: null };
      }
    }

    function saveState() {
      localStorage.setItem('mochii_tournament_state', JSON.stringify(state));
      updateStats();
      renderAdminView();
    }

    function updateStats() {
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { candidates: [] };
      const candidates = activeRound.candidates || [];

      const total = candidates.length;
      const passed = candidates.filter(c => c.status === 'pass').length;
      const pending = candidates.filter(c => c.status === 'pending').length;
      const out = candidates.filter(c => c.status === 'out').length;

      document.getElementById('statTotalCandidates').innerText = total;
      document.getElementById('statPassedCount').innerText = passed;
      document.getElementById('statPendingCount').innerText = pending;
      document.getElementById('statOutCount').innerText = out;

      const titleName = getRoundTitle(currentRoundIndex);
      document.getElementById('passedTitleText').innerText = `${titleName} ${i18n[currentLang].passedTitle}`;
      document.getElementById('passedBadgeCount').innerText = passed + i18n[currentLang].unitPeople;

      const advanceBtn = document.getElementById('advanceNextRoundBtn');
      const advanceBtnText = document.getElementById('advanceNextRoundBtnText');

      if (activeRound.isFinal) {
        if (advanceBtn) advanceBtn.setAttribute('disabled', 'disabled');
        if (advanceBtnText) advanceBtnText.innerText = i18n[currentLang].btnFinalRound;
      } else {
        if (advanceBtn) advanceBtn.removeAttribute('disabled');
        if (advanceBtnText) advanceBtnText.innerText = i18n[currentLang].btnNextRound;
      }

      const refreshBtn = document.getElementById('refreshSheetsBtn');
      if (refreshBtn) {
        if (currentRoundIndex !== 0) {
          refreshBtn.setAttribute('disabled', 'disabled');
          refreshBtn.title = '第 2 轮及后续轮次禁止刷新表格，防止覆盖晋级数据！';
        } else {
          refreshBtn.removeAttribute('disabled');
          refreshBtn.title = '从表格更新第 1 轮名单';
        }
      }
    }

    /* 🌟 核心升级：当只剩 1 人时自动夺冠，无需开启下一轮 */
    function changeStatus(id, newStatus) {
      const activeRound = state.rounds[currentRoundIndex];
      const target = activeRound.candidates.find(c => c.id === id);
      if (!target) return;

      target.status = newStatus;

      const remainingPendingList = activeRound.candidates.filter(c => c.status === 'pending');

      // 自动逻辑：当点击普及后，如果剩余待角逐的人数只剩【最后 1 名】
      if (newStatus === 'pass' && remainingPendingList.length === 1) {
        const lastCandidate = remainingPendingList[0];
        lastCandidate.status = 'pass'; // 自动将最后这 1 名晋级为最终冠军

        activeRound.isFinal = true;
        activeRound.roundName = "最终轮";

        const allWinners = activeRound.candidates.filter(c => c.status === 'pass').map(c => c.name).join('、');

        state.latestEvent = {
          type: 'finalCongrat',
          timestamp: Date.now(),
          targetRoundIndex: currentRoundIndex,
          winnerNames: allWinners
        };

        saveState();
        renderRoundTabs();

        setTimeout(() => {
          alert(`👑 终极判定！角逐名单仅剩最后 1 名【${lastCandidate.name}】，已自动夺冠！本轮设为最终轮，公开大屏已广播冠军结果！`);
        }, 100);

      } else {
        saveState();
      }
    }

    function renderAdminView() {
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { candidates: [] };
      const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();

      let list = (activeRound.candidates || []).filter(c => 
        (c.name || '').toLowerCase().includes(search) || (c.orderNo || '').toLowerCase().includes(search)
      );

      // 1. 普及区
      const passedContainer = document.getElementById('passedListContainer');
      const passedList = list.filter(c => c.status === 'pass');

      if (passedList.length === 0) {
        passedContainer.innerHTML = `<span class="text-xs text-slate-500 italic">${i18n[currentLang].noPassed}</span>`;
      } else {
        passedContainer.innerHTML = passedList.map(c => 
          '<div class="px-3 py-1.5 bg-emerald-950/70 border border-emerald-500/50 rounded-lg flex items-center space-x-2 text-xs shadow-sm">' +
            '<span class="font-bold text-emerald-300">' + escapeHtml(c.name) + '</span>' +
            '<span class="text-slate-400 font-mono text-[11px]">' + escapeHtml(c.orderNo) + '</span>' +
            '<button onclick="changeStatus(' + c.id + ', \'pending\')" title="Undo" class="ml-1 text-emerald-400 hover:text-rose-400 font-bold px-1 bg-emerald-900/50 rounded hover:bg-rose-950 transition">✕</button>' +
          '</div>'
        ).join('');
      }

      // 2. 待角逐 / 淘汰卡片区
      const container = document.getElementById('adminViewContainer');
      const pendingList = list.filter(c => c.status === 'pending' || c.status === 'out');

      if (pendingList.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-500"><p class="text-2xl mb-2">🎉</p><p>${i18n[currentLang].noPendingList}</p></div>`;
        return;
      }

      const cardsHtml = pendingList.map((c, index) => {
        let borderStyle = 'border-slate-700 bg-slate-800';
        let statusBadge = '';
        let btnOutHtml = '';

        if (c.status === 'out') {
          borderStyle = 'border-slate-800 bg-slate-900/60 opacity-60';
          statusBadge = `<span class="px-2 py-0.5 rounded text-xs bg-slate-700 text-slate-400 font-bold">${i18n[currentLang].badgeOut}</span>`;
          btnOutHtml = `<button onclick="changeStatus(${c.id}, 'pending')" class="flex-1 py-1.5 text-xs rounded transition bg-amber-600 hover:bg-amber-500 text-white font-bold shadow">${i18n[currentLang].btnUndoOut}</button>`;
        } else {
          btnOutHtml = `<button onclick="changeStatus(${c.id}, 'out')" class="px-3 py-1.5 text-xs rounded transition bg-slate-700 text-slate-400 hover:bg-rose-600 hover:text-white font-bold">${i18n[currentLang].btnOut}</button>`;
        }

        const btnPassStyle = 'bg-slate-700 text-emerald-400 hover:bg-emerald-600 hover:text-white font-bold';

        return '<div class="p-4 rounded-xl border ' + borderStyle + ' transition relative flex flex-col justify-between shadow">' +
          '<div>' +
            '<div class="flex justify-between items-start mb-2">' +
              '<span class="text-xs font-mono text-slate-400">#' + (index + 1) + '</span>' +
              statusBadge +
            '</div>' +
            '<div class="font-bold text-slate-100 text-base truncate">' + escapeHtml(c.name) + '</div>' +
            '<div class="text-xs text-amber-400/80 font-mono mt-0.5 truncate">' + escapeHtml(c.orderNo || '-') + '</div>' +
          '</div>' +

          '<div class="mt-4 pt-3 border-t border-slate-700/60 flex space-x-2">' +
            (c.status !== 'out' ? `<button onclick="changeStatus(${c.id}, 'pass')" class="flex-1 py-1.5 text-xs rounded transition ${btnPassStyle}">${i18n[currentLang].btnPass}</button>` : '') +
            btnOutHtml +
          '</div>' +
        '</div>';
      }).join('');

      container.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">' + cardsHtml + '</div>';
    }

    function resetRounds() {
      if (confirm("确认重置所有轮次数据？这会清除所有轮次并重新从 Google 表格同步第 1 轮。")) {
        currentRoundIndex = 0;
        state = {
          rounds: [
            { roundName: "第 1 轮", candidates: [] }
          ],
          currentMode: null
        };
        localStorage.setItem('mochii_tournament_state', JSON.stringify(state));
        fetchGoogleSheetsData(true);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
