<!DOCTYPE html>
<html lang="zh-CN">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochiishop 每月抽奖 - 直播控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .folder-tab {
      position: absolute; top: -10px; left: 0px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a; font-weight: 900; font-size: 9px;
      padding: 1px 8px;
      border-top-left-radius: 6px; border-top-right-radius: 6px;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.3);
      letter-spacing: 0.5px; z-index: 10;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🎬</span>
        <div>
          <h1 id="adminHeaderTitle" class="text-xl font-bold text-amber-400" data-i18n="adminTitle">Mochiishop 每月抽奖 - 直播控制台</h1>
          <p class="text-xs text-slate-400" data-i18n="adminSubTitle">香水盲抽 · Shopee直播分组PK控盘系统</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-3">
        <div class="relative group cursor-pointer">
          <div class="flex items-center space-x-2 bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg text-xs shadow-inner hover:border-amber-400/60 transition">
            <span id="currentModeBadge" class="text-amber-400 font-bold">模式: 冠亚季模式</span>
            <button onclick="openConfigModal()" class="text-slate-400 hover:text-amber-400 transition text-base ml-1" title="设置抽奖模式与导入规则">⚙️</button>
          </div>
        </div>

        <div class="flex items-center space-x-1 bg-slate-900 border border-slate-700 p-1 rounded-lg">
          <button onclick="setLanguage('zh')" id="langBtn-zh" class="px-2 py-1 text-xs rounded transition flex items-center space-x-1"><span>🇨🇳</span><span class="text-[11px]">ZH</span></button>
          <button onclick="setLanguage('en')" id="langBtn-en" class="px-2 py-1 text-xs rounded transition flex items-center space-x-1"><span>🇬🇧</span><span class="text-[11px]">EN</span></button>
          <button onclick="setLanguage('ms')" id="langBtn-ms" class="px-2 py-1 text-xs rounded transition flex items-center space-x-1"><span>🇲🇾</span><span class="text-[11px]">MS</span></button>
        </div>

        <button onclick="goToPrevRound()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold rounded-lg border border-slate-600 transition shadow" data-i18n="btnPrevRound">🔙 返回上一轮</button>
        <button id="advanceNextRoundBtn" onclick="createNewRound()" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg transition shadow flex items-center space-x-1">
          <span id="advanceNextRoundBtnText" data-i18n="btnNextRound">⏩ 锁定本轮晋级者并推进下一轮</span>
        </button>
      </div>
    </div>
  </header>

  <div id="configModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-lg w-full shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeConfigModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">✕</button>
      <h3 class="text-lg font-bold text-amber-400 mb-4 flex items-center space-x-2"><span>⚙️</span><span>抽奖模式与规则配置</span></h3>
      <div class="space-y-3 text-xs">
        <div class="bg-slate-900/90 rounded-xl border border-slate-700 overflow-hidden">
          <button onclick="toggleCardAccordion('cardTitleSetting')" class="w-full p-3 flex justify-between items-center text-amber-300 font-bold hover:bg-slate-800/60 transition">
            <span class="flex items-center space-x-2"><span>✏️</span><span>系统标题与显示配置</span></span>
            <span id="arrow-cardTitleSetting" class="text-slate-400 transition-transform">▼</span>
          </button>
          <div id="cardTitleSetting" class="hidden p-3 pt-0 border-t border-slate-800 space-y-3">
            <label class="flex items-center space-x-2 bg-slate-800/80 p-2.5 rounded-lg border border-amber-500/30 cursor-pointer mt-2">
              <input type="checkbox" id="publicVisibleCheckbox" class="w-4 h-4 text-amber-500 rounded focus:ring-0">
              <span class="font-bold text-slate-200">🌐 开启前台网页对外公开显示</span>
            </label>
            <div><label class="block text-slate-400 mb-1">后台控制台标题:</label><input type="text" id="adminTitleInput" placeholder="Mochiishop 每月抽奖 - 直播控制台" class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-amber-300 focus:outline-none"></div>
            <div><label class="block text-slate-400 mb-1">前台公示大屏标题:</label><input type="text" id="publicTitleInput" placeholder="留空则跟随语言自动切换" class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-amber-300 focus:outline-none"></div>
          </div>
        </div>
        <div class="bg-slate-900/90 rounded-xl border border-slate-700 overflow-hidden">
          <button onclick="toggleCardAccordion('cardImportSetting')" class="w-full p-3 flex justify-between items-center text-amber-300 font-bold hover:bg-slate-800/60 transition">
            <span class="flex items-center space-x-2"><span>📥</span><span>买家名单导入模式配置</span></span>
            <span id="arrow-cardImportSetting" class="text-slate-400 transition-transform">▼</span>
          </button>
          <div id="cardImportSetting" class="hidden p-3 pt-0 border-t border-slate-800 space-y-2.5">
            <label class="flex items-center space-x-2 cursor-pointer mt-2"><input type="radio" name="importMode" value="default" onchange="toggleImportModeUI()" class="text-amber-500 focus:ring-0"><span class="text-slate-200 font-bold">默认链接导入 (Google Sheets 预设)</span></label>
            <label class="flex items-center space-x-2 cursor-pointer"><input type="radio" name="importMode" value="customUrl" onchange="toggleImportModeUI()" class="text-amber-500 focus:ring-0"><span class="text-slate-200 font-bold">修改链接导入 (自定义表格 CSV URL)</span></label>
            <div id="customUrlInputArea" class="pl-6 hidden"><input type="url" id="customSheetUrlInput" placeholder="https://docs.google.com/spreadsheets/d/.../gviz/tq?tqx=out:csv" class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-xs text-amber-300 focus:outline-none"></div>
            <label class="flex items-center space-x-2 cursor-pointer"><input type="radio" name="importMode" value="fileUpload" onchange="toggleImportModeUI()" class="text-amber-500 focus:ring-0"><span class="text-slate-200 font-bold">导入本地名单文件 (.csv / .txt)</span></label>
            <div id="fileUploadArea" class="pl-6 hidden space-y-1.5"><input type="file" id="localFileInput" accept=".csv, .txt" class="text-xs text-slate-300 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400"></div>
          </div>
        </div>
        <div class="bg-slate-900/90 rounded-xl border border-slate-700 overflow-hidden">
          <button onclick="toggleCardAccordion('cardDrawModeSetting')" class="w-full p-3 flex justify-between items-center text-amber-300 font-bold hover:bg-slate-800/60 transition">
            <span class="flex items-center space-x-2"><span>🎮</span><span>抽奖规则与玩法模式</span></span>
            <span id="arrow-cardDrawModeSetting" class="text-slate-400 transition-transform">▼</span>
          </button>
          <div id="cardDrawModeSetting" class="hidden p-3 pt-0 border-t border-slate-800 space-y-3">
            <label class="flex items-center space-x-2 bg-slate-800/80 p-2.5 rounded-lg border border-amber-500/30 cursor-pointer mt-2">
              <input type="checkbox" id="enableModeCheckbox" onchange="toggleModeEnable()" class="w-4 h-4 text-amber-500 rounded focus:ring-0">
              <span class="font-bold text-slate-200">启用模式规则</span>
            </label>
            <div class="bg-slate-800/50 p-2.5 rounded-lg border border-slate-700 space-y-1.5">
              <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" id="useDefaultPickCountCheckbox" class="w-4 h-4 text-amber-500 rounded focus:ring-0"><span class="font-bold text-amber-300">启用默认盲抽数量</span></label>
              <div class="flex items-center space-x-2 pl-6">
                <span class="text-slate-400">默认每次抽取:</span>
                <input type="number" id="defaultPickCountInput" value="4" min="1" max="20" class="w-16 bg-slate-900 border border-slate-600 rounded px-2 py-0.5 text-center font-bold text-amber-400 focus:outline-none">
                <span class="text-slate-400">人</span>
              </div>
            </div>
            <div id="modeRadioGroup" class="space-y-2.5 opacity-50 pointer-events-none transition-all">
              <label class="flex items-start space-x-2 p-2.5 rounded-lg border border-slate-700 bg-slate-800/40 hover:bg-slate-800 cursor-pointer">
                <input type="radio" name="drawMode" value="mode1" class="mt-0.5">
                <div>
                  <div class="font-bold text-amber-300">模式 1：冠亚季排位模式</div>
                  <div class="text-[11px] text-slate-400 mt-0.5">剩3人时点击设为【季军】。</div>
                </div>
              </label>
              <label class="flex items-start space-x-2 p-2.5 rounded-lg border border-slate-700 bg-slate-800/40 hover:bg-slate-800 cursor-pointer">
                <input type="radio" name="drawMode" value="mode2" class="mt-0.5">
                <div class="flex-1">
                  <div class="font-bold text-emerald-300">模式 2：冠亚季 + 安慰奖模式</div>
                  <div class="text-[11px] text-slate-400 mt-0.5 mb-1.5">晋级区需至少包含 (N + 3) 人才能开启。</div>
                  <div class="flex items-center space-x-2 bg-slate-900/80 p-2 rounded border border-slate-700">
                    <span class="text-slate-300">安慰奖名额:</span>
                    <input type="number" id="mode2ConsolationCount" value="10" min="1" max="100" class="w-16 bg-slate-800 border border-slate-600 rounded px-2 py-0.5 font-bold text-emerald-400 focus:outline-none">
                    <span class="text-slate-400">人</span>
                  </div>
                </div>
              </label>
            </div>
          </div>
        </div>
      </div>
      <div class="mt-6 flex justify-end space-x-2 border-t border-slate-700/60 pt-4">
        <button onclick="saveConfigModal()" class="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-xs transition shadow">💾 保存设置</button>
      </div>
    </div>
  </div>

  <main class="max-w-[1600px] mx-auto px-4 py-6 flex-1 w-full">
    <div class="mb-4 flex items-center justify-between border-b border-slate-800 pb-2">
      <div id="roundTabsContainer" class="flex space-x-2 overflow-x-auto"></div>
      <button onclick="resetRounds()" class="text-xs text-rose-400 hover:underline font-bold">⚠️ 重置所有轮次数据</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700"><span class="text-xs text-slate-400 block">本轮参选人数</span><span id="statTotalCandidates" class="text-2xl font-black text-blue-400">0</span></div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700"><span class="text-xs text-slate-400 block">本轮晋级/胜出</span><span id="statPassedCount" class="text-2xl font-black text-emerald-400">0</span></div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700"><span class="text-xs text-slate-400 block">本轮待PK人数</span><span id="statPendingCount" class="text-2xl font-black text-amber-400">0</span></div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700"><span class="text-xs text-slate-400 block">本轮已淘汰人数</span><span id="statOutCount" class="text-2xl font-black text-slate-400">0</span></div>
    </div>

    <div class="mb-6 bg-slate-800/90 p-4 rounded-xl border border-emerald-500/30 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-lg">
      <div class="flex-1 w-full">
        <div class="flex items-center space-x-2 mb-2">
          <span class="text-lg">🏆</span>
          <h2 id="passedTitleText" class="text-md font-bold text-emerald-400">本轮晋级区</h2>
          <span id="passedBadgeCount" class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="passedListContainer" class="flex flex-wrap gap-3 max-h-40 overflow-y-auto no-scrollbar pr-1 pt-2"></div>
      </div>
    </div>

    <div class="mb-6 bg-slate-800 p-3.5 rounded-xl border border-slate-700 flex flex-col md:flex-row justify-between items-center gap-3">
      <div class="flex items-center space-x-2 w-full md:w-auto">
        <button onclick="pickRandomGroup()" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-xs rounded-lg shadow-lg flex items-center space-x-1 transition transform active:scale-95"><span>🎲</span><span>随机盲抽组</span></button>
        <button onclick="clearCurrentActiveGroup()" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs rounded-lg transition font-bold">清空盲抽组</button>
      </div>
      <div class="flex items-center space-x-3 w-full md:w-auto justify-end">
        <div class="text-xs text-slate-400 flex items-center space-x-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
          <span>买家数据导入就绪</span>
          <button id="refreshSheetsBtn" onclick="fetchGoogleSheetsData(true)" class="ml-2 px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded transition text-xs shadow">🔄 刷新 / 导入名单</button>
        </div>
        <input type="search" id="searchInput" oninput="renderAdminView()" placeholder="🔍 名字或订单号..." class="w-36 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-400 shadow-inner">
      </div>
    </div>

    <div id="activeGroupDisplay" class="mb-6 hidden bg-gradient-to-r from-amber-950/40 via-slate-800/80 to-amber-950/40 border-2 border-amber-500/50 rounded-2xl p-4 shadow-xl">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 pb-3 border-b border-amber-500/30 gap-2">
        <div class="flex items-center space-x-2">
          <span class="text-xl">🔥</span>
          <h3 class="text-sm font-bold text-amber-400">当前正在直播盲抽 PK 组</h3>
          <span id="adminPollBadge" class="text-xs bg-amber-500 text-slate-950 font-black px-2 py-0.5 rounded shadow">POLL #1</span>
          <span id="triggerStatusTag" class="text-xs bg-slate-900 border border-amber-400 text-amber-300 px-2 py-0.5 rounded font-bold">🎯 等待设定触发号...</span>
        </div>
        <div class="flex items-center space-x-2 w-full md:w-auto justify-end flex-wrap gap-1">
          <span class="text-xs text-slate-300 font-bold">根据观众投票输入触发号:</span>
          <div id="triggerButtonsContainer" class="flex items-center space-x-1"></div>
          <button onclick="revealPKWinner()" id="adminRevealBtn" class="px-3.5 py-1.5 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-white font-black text-xs rounded-lg transition shadow-lg animate-pulse">🎰 揭晓开奖</button>
          <span id="adminLockedHint" class="hidden text-[10px] text-rose-400 font-bold">🚫 前台已登入管理员，后台锁定</span>
        </div>
      </div>
      <div id="activeGroupGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3"></div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
      <div id="adminViewWrapper" class="lg:col-span-4 bg-slate-800/50 rounded-2xl p-6 border border-slate-700 min-h-[160px]">
        <h2 class="text-md font-bold text-amber-400 mb-4 pb-2 border-b border-slate-700">待 PK 买家名单池</h2>
        <div id="adminViewContainer"></div>
      </div>
      <div class="lg:col-span-1 bg-slate-800/30 rounded-2xl p-4 border border-slate-800 min-h-[300px] flex flex-col">
        <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
          <div class="flex items-center space-x-1.5"><span class="text-sm">❌</span><h3 class="text-xs font-bold text-slate-400">淘汰区 (新至旧)</h3></div>
          <span id="outBadgeCount" class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full border border-slate-700">0</span>
        </div>
        <div id="adminOutListContainer" class="space-y-4 flex-1 overflow-y-auto no-scrollbar max-h-[600px] pr-1"></div>
      </div>
    </div>
  </main>

  <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    © Mochiishop Shopee Monthly Event. All rights reserved.
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBu5yd5-pbO82_g8mgIx-faUzuzd0NaRZQ",
      authDomain: "draw-tournament.firebaseapp.com",
      databaseURL: "https://draw-tournament-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "draw-tournament",
      storageBucket: "draw-tournament.firebasestorage.app",
      messagingSenderId: "803720903757",
      appId: "1:803720903757:web:8b561daabc0d69af9e7004"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    firebase.auth().signInAnonymously().catch((error) => { console.error("匿名登录失败:", error); });

    const DEFAULT_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1VSfYPx-lpdSAw8pgebnABW3rlSFK-8t4oxqPPcjKtt0/gviz/tq?tqx=out:csv&gid=322881163";

    let currentLang = localStorage.getItem('mochii_lang') || 'zh';
    let currentRoundIndex = 0;
    let activeGroup4Ids = [];
    let publicAdminActive = false; 

    let state = {
      customAdminTitle: '', customPublicTitle: '', isPublicVisible: true, pollCount: 0, currentPollNumber: 0,
      pkStage: 'voting', triggerNumber: null, drawRoundIndex: 0, activeGroupMembers: [], activeGroupIds: [],
      passHistory: [], settled: false,
      pdfConfig: { title: 'MOCHIISHOP OFFICIAL DRAW', title2: 'OCTOBER FINAL WINNER REPORT', subTitle: 'Shopee Live Monthly Event Official Certificate', footer: '© Mochiishop Official Live Tournament System. Verified Result.' },
      modeConfig: { enabled: true, selectedMode: 'mode1', mode2ConsolationCount: 10, useDefaultPickCount: true, defaultPickCount: 4, importMode: 'default', customSheetUrl: '' },
      rounds: [{ roundName: "第 1 轮", candidates: [] }]
    };

    window.onload = function() {
      db.ref('tournament_state').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          state = val;
          (state.rounds || []).forEach(r => { (r.candidates || []).forEach(c => { if (c.id) c.id = String(c.id); }); });
          if (state.activeGroupIds) state.activeGroupIds = state.activeGroupIds.map(id => String(id));
          if (state.activeGroupMembers) state.activeGroupMembers = state.activeGroupMembers.map(m => ({ ...m, id: String(m.id) }));
          if (!state.passHistory) state.passHistory = [];
          
          if (state.activeGroupIds && state.activeGroupIds.length > 0) {
            activeGroup4Ids = [...state.activeGroupIds];
          } else {
            activeGroup4Ids = [];
          }

          renderRoundTabs();
          renderAdminView();
          updateStats();
          syncModalUIWithState();
        }
      });

      db.ref('tournament_state/publicAdminActive').on('value', (snap) => {
        publicAdminActive = !!snap.val();
        updateAdminRevealButtonLock();
      });
    };

    function updateAdminRevealButtonLock() {
      const btn = document.getElementById('adminRevealBtn');
      const hint = document.getElementById('adminLockedHint');
      if (!btn) return;
      if (publicAdminActive) {
        btn.disabled = true;
        btn.classList.add('opacity-40', 'cursor-not-allowed', 'grayscale');
        btn.classList.remove('animate-pulse');
        btn.textContent = '🚫 前台管理员已接管';
        if (hint) hint.classList.remove('hidden');
      } else {
        btn.disabled = false;
        btn.classList.remove('opacity-40', 'cursor-not-allowed', 'grayscale');
        btn.classList.add('animate-pulse');
        btn.textContent = '🎰 揭晓开奖';
        if (hint) hint.classList.add('hidden');
      }
    }

    function toggleCardAccordion(cardId) {
      const card = document.getElementById(cardId);
      const arrow = document.getElementById(`arrow-${cardId}`);
      if (card) {
        card.classList.toggle('hidden');
        if (arrow) arrow.style.transform = card.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
      }
    }

    function openConfigModal() { document.getElementById('configModal').classList.remove('hidden'); }
    function closeConfigModal() { document.getElementById('configModal').classList.add('hidden'); }

    function toggleImportModeUI() {
      const selected = document.querySelector('input[name="importMode"]:checked')?.value || 'default';
      const customArea = document.getElementById('customUrlInputArea');
      const fileArea = document.getElementById('fileUploadArea');
      customArea.classList.add('hidden');
      fileArea.classList.add('hidden');
      if (selected === 'customUrl') customArea.classList.remove('hidden');
      if (selected === 'fileUpload') fileArea.classList.remove('hidden');
    }

    function toggleModeEnable() {
      const isChecked = document.getElementById('enableModeCheckbox').checked;
      const group = document.getElementById('modeRadioGroup');
      if (isChecked) group.classList.remove('opacity-50', 'pointer-events-none');
      else group.classList.add('opacity-50', 'pointer-events-none');
    }

    function syncModalUIWithState() {
      document.getElementById('publicVisibleCheckbox').checked = state.isPublicVisible !== false;
      document.getElementById('adminTitleInput').value = state.customAdminTitle || '';
      document.getElementById('publicTitleInput').value = state.customPublicTitle || '';

      if (!state.modeConfig) state.modeConfig = { enabled: true, selectedMode: 'mode1', mode2ConsolationCount: 10, useDefaultPickCount: true, defaultPickCount: 4, importMode: 'default', customSheetUrl: '' };
      document.getElementById('enableModeCheckbox').checked = state.modeConfig.enabled !== false;
      document.getElementById('useDefaultPickCountCheckbox').checked = state.modeConfig.useDefaultPickCount !== false;
      document.getElementById('defaultPickCountInput').value = state.modeConfig.defaultPickCount || 4;
      toggleModeEnable();

      const radios = document.getElementsByName('drawMode');
      for (let r of radios) { if (r.value === (state.modeConfig.selectedMode || 'mode1')) r.checked = true; }
      document.getElementById('mode2ConsolationCount').value = state.modeConfig.mode2ConsolationCount || 10;
    }

    function saveConfigModal() {
      state.isPublicVisible = document.getElementById('publicVisibleCheckbox').checked;
      state.customAdminTitle = document.getElementById('adminTitleInput').value.trim();
      state.customPublicTitle = document.getElementById('publicTitleInput').value.trim();

      const isEnabled = document.getElementById('enableModeCheckbox').checked;
      const radios = document.getElementsByName('drawMode');
      let selectedMode = 'mode1';
      for (let r of radios) { if (r.checked) selectedMode = r.value; }

      const mode2Cons = parseInt(document.getElementById('mode2ConsolationCount').value, 10) || 10;
      const useDefaultPickCount = document.getElementById('useDefaultPickCountCheckbox').checked;
      const defaultPickCount = parseInt(document.getElementById('defaultPickCountInput').value, 10) || 4;

      if (!state.modeConfig) state.modeConfig = {};
      state.modeConfig.enabled = isEnabled;
      state.modeConfig.selectedMode = selectedMode;
      state.modeConfig.mode2ConsolationCount = mode2Cons;
      state.modeConfig.useDefaultPickCount = useDefaultPickCount;
      state.modeConfig.defaultPickCount = defaultPickCount;

      saveState();
      closeConfigModal();
    }

    function fetchGoogleSheetsData(isManual) {
      if (currentRoundIndex !== 0) { if (isManual) alert("仅限在第 1 轮刷新/导入数据！"); return; }
      const cfg = state.modeConfig || {};
      const importMode = cfg.importMode || 'default';

      if (importMode === 'fileUpload') {
        const fileInput = document.getElementById('localFileInput');
        if (fileInput && fileInput.files.length > 0) { readLocalFileAndParse(fileInput.files[0]); return; }
        else if (isManual) { alert("⚠️ 请先在设置弹窗中选择并上传本地 .csv 或 .txt 文件！"); openConfigModal(); return; }
      }
      let fetchUrl = DEFAULT_SHEET_CSV_URL;
      if (importMode === 'customUrl' && cfg.customSheetUrl) fetchUrl = cfg.customSheetUrl;

      fetch(fetchUrl)
        .then(response => response.text())
        .then(csvText => { parseCSVToFirstRound(csvText); if (isManual) alert("✅ 已成功导入买家名单！"); })
        .catch(err => { alert("❌ 导入失败，请检查链接格式或网络连接！"); });
    }

    function readLocalFileAndParse(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        parseCSVToFirstRound(e.target.result);
        alert(`✅ 已成功从本地文件【${file.name}】导入买家名单！`);
      };
      reader.readAsText(file);
    }

    function parseCSVToFirstRound(csvText) {
      const lines = csvText.split('\n');
      const candidates = [];
      lines.forEach((line, idx) => {
        if (!line.trim()) return;
        const parts = line.replace(/"/g, '').split(',');
        if (parts[0] && parts[0].trim() !== '买家姓名' && parts[0].trim() !== 'Name') {
          const nameStr = parts[0].trim();
          const orderStr = parts[1] ? parts[1].trim() : '';
          const uniqueId = `${nameStr}_${orderStr}_${idx}`;
          candidates.push({ id: uniqueId, name: nameStr, orderNo: orderStr, status: 'pending' });
        }
      });
      state.rounds[0].candidates = candidates;
      state.passHistory = []; 
      saveState();
      renderRoundTabs();
    }

    function pickRandomGroup() {
      const activeRound = state.rounds[currentRoundIndex];
      const pendingList = (activeRound.candidates || []).filter(c => c.status === 'pending');

      if (pendingList.length === 0) { alert("⚠️ 当前没有待 PK 的买家！"); return; }

      let targetCount = 4;
      const cfg = state.modeConfig || {};
      if (cfg.useDefaultPickCount) targetCount = cfg.defaultPickCount || 4;
      else {
        const inputStr = prompt("请输入本次要随机盲抽的人数:", "4");
        if (inputStr === null) return;
        targetCount = parseInt(inputStr, 10);
        if (isNaN(targetCount) || targetCount <= 0) { alert("请输入有效的数字！"); return; }
      }

      state.pollCount = (state.pollCount || 0) + 1;
      state.currentPollNumber = state.pollCount;
      state.pkStage = 'voting';
      state.triggerNumber = null;
      state.drawRoundIndex = currentRoundIndex;
      state.settled = false;

      const shuffled = [...pendingList].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, Math.min(targetCount, shuffled.length));
      
      activeGroup4Ids = selected.map(c => String(c.id));
      state.activeGroupIds = activeGroup4Ids;

      state.activeGroupMembers = selected.map((c) => ({
        id: String(c.id),
        displayNumber: null,
        name: c.name,
        orderNo: c.orderNo
      }));

      saveState();
      renderActiveGroupUI();
      renderAdminView();
    }

    function setTriggerNumber(num) {
      if (!activeGroup4Ids || activeGroup4Ids.length === 0) return;
      if (num < 1 || num > activeGroup4Ids.length) { alert("触发号超出当前组人数范围！"); return; }
      state.triggerNumber = num;
      state.pkStage = 'triggered';
      saveState();
      renderActiveGroupUI();
    }

    function revealPKWinner() {
      if (publicAdminActive) { alert("⚠️ 前台已登入管理员，请在前台大屏上点击开奖！"); return; }
      if (!activeGroup4Ids || activeGroup4Ids.length === 0) return;
      if (!state.triggerNumber) { alert("⚠️ 请先设定触发号！"); return; }
      if (state.settled) { alert("本轮正在结算中，请稍候"); return; }
      if (state.activeGroupMembers.every(m => m.displayNumber !== null)) { alert("⚠️ 本轮 #号 已经分配过了，无法重复开奖！"); return; }

      state.pkStage = 'revealed';
      state.settled = true;
      saveState();

      setTimeout(() => {
        const total = state.activeGroupMembers.length;
        const nums = Array.from({ length: total }, (_, i) => i + 1).sort(() => 0.5 - Math.random());
        
        state.activeGroupMembers = state.activeGroupMembers.map((m, idx) => ({ ...m, displayNumber: nums[idx] }));
        const winnerMember = state.activeGroupMembers.find(m => m.displayNumber === state.triggerNumber);
        if (winnerMember) passWinnerAndEliminateOthers(winnerMember.id);
      }, 2200);
    }

    function clearCurrentActiveGroup() {
      activeGroup4Ids = [];
      state.activeGroupIds = [];
      state.activeGroupMembers = [];
      delete state.currentPollNumber;
      state.pkStage = 'voting';
      state.triggerNumber = null;
      state.settled = false;
      saveState();
      document.getElementById('activeGroupDisplay').classList.add('hidden');
      renderAdminView();
    }

    function passWinnerAndEliminateOthers(winnerId) {
      if (state.settled && state.pkStage === 'voting' && activeGroup4Ids.length === 0) return;
      const activeRound = state.rounds[state.drawRoundIndex ?? currentRoundIndex];
      if (!activeRound) return;

      const winnerMember = (state.activeGroupMembers || []).find(m => String(m.id) === String(winnerId));
      const pollLabel = `POLL #${state.currentPollNumber || 1} (#${winnerMember ? winnerMember.displayNumber : '?'})`;
      
      if (!state.passHistory) state.passHistory = [];
      const winnerCandidate = activeRound.candidates.find(c => String(c.id) === String(winnerId));
      if (winnerCandidate && !state.passHistory.some(p => String(p.id) === String(winnerId))) {
        state.passHistory.push({ id: winnerCandidate.id, name: winnerCandidate.name, orderNo: winnerCandidate.orderNo, pollLabel, roundIndex: state.drawRoundIndex ?? currentRoundIndex });
      }

      activeGroup4Ids.forEach(id => {
        const target = activeRound.candidates.find(c => String(c.id) === String(id));
        if (target) {
          if (String(id) === String(winnerId)) { target.status = 'pass'; target.pollLabel = pollLabel; }
          else { target.status = 'out'; target.eliminatedRoundIndex = state.drawRoundIndex ?? currentRoundIndex; }
        }
      });

      activeGroup4Ids = []; state.activeGroupIds = []; state.activeGroupMembers = [];
      state.pkStage = 'voting'; state.triggerNumber = null; state.settled = false;
      
      saveState(); renderActiveGroupUI();
    }

    function renderActiveGroupUI() {
      const displayContainer = document.getElementById('activeGroupDisplay');
      const grid = document.getElementById('activeGroupGrid');
      const pollBadge = document.getElementById('adminPollBadge');
      const triggerStatusTag = document.getElementById('triggerStatusTag');
      const triggerButtonsContainer = document.getElementById('triggerButtonsContainer');

      if (state.activeGroupIds && state.activeGroupIds.length > 0 && activeGroup4Ids.length === 0) activeGroup4Ids = [...state.activeGroupIds];
      if (!activeGroup4Ids || activeGroup4Ids.length === 0) { displayContainer.classList.add('hidden'); return; }

      displayContainer.classList.remove('hidden');
      if (pollBadge && state.currentPollNumber) pollBadge.innerText = `POLL #${state.currentPollNumber}`;

      if (triggerStatusTag) {
        if (state.triggerNumber) {
          triggerStatusTag.innerText = `🎯 设定触发号：#${state.triggerNumber}`;
          triggerStatusTag.className = "text-xs bg-amber-500 text-slate-950 font-black px-2 py-0.5 rounded shadow animate-bounce";
        } else {
          triggerStatusTag.innerText = `🎯 等待设定触发号...`;
          triggerStatusTag.className = "text-xs bg-slate-900 border border-amber-400 text-amber-300 px-2 py-0.5 rounded font-bold";
        }
      }

      if (triggerButtonsContainer) {
        const total = (state.activeGroupMembers || []).length || activeGroup4Ids.length;
        triggerButtonsContainer.innerHTML = Array.from({length: total}, (_, i) => i + 1).map(num => {
          const isSelected = (state.triggerNumber === num);
          const btnClass = isSelected ? "bg-amber-500 text-slate-950 font-black scale-110 shadow-lg border-2 border-white" : "bg-slate-800 text-amber-300 border border-amber-500/50 hover:bg-amber-500 hover:text-slate-950";
          return `<button onclick="setTriggerNumber(${num})" class="w-7 h-7 rounded-lg text-xs transition transform font-black ${btnClass}">#${num}</button>`;
        }).join('');
      }

      const activeRound = state.rounds[state.drawRoundIndex ?? currentRoundIndex];
      let members = (state.activeGroupMembers || []).map(m => {
        const c = (activeRound.candidates || []).find(x => String(x.id) === String(m.id));
        return c ? { ...c, displayNumber: m.displayNumber } : null;
      }).filter(Boolean);

      const isRevealed = (state.pkStage === 'revealed');

      grid.innerHTML = members.map((c) => {
        const realNum = c.displayNumber;
        const hasNumber = realNum !== null && realNum !== undefined;
        const isWinner = isRevealed && hasNumber && (realNum === state.triggerNumber);

        let cardHeaderTag = `<span class="text-xs font-black bg-amber-500 text-slate-950 px-2 py-0.5 rounded-full shadow animate-pulse">#？</span>`;
        let cardBorder = "border-amber-500/40 bg-slate-900/90";

        if (isRevealed && hasNumber) {
          if (isWinner) {
            cardHeaderTag = `<span class="text-xs font-black bg-emerald-400 text-slate-950 px-2.5 py-0.5 rounded-full shadow-lg animate-bounce">🏆 #${realNum} 命中</span>`;
            cardBorder = "border-2 border-emerald-400 bg-emerald-950/40 shadow-emerald-500/20 shadow-2xl scale-105";
          } else {
            cardHeaderTag = `<span class="text-xs font-black bg-slate-700 text-slate-400 px-2 py-0.5 rounded-full">#${realNum}</span>`;
            cardBorder = "border-slate-800 bg-slate-900/50 opacity-60";
          }
        }

        return `<div class="${cardBorder} rounded-xl p-3 flex flex-col justify-between shadow transition-all duration-500">
          <div>
            <div class="flex justify-between items-center mb-1">${cardHeaderTag}</div>
            <div class="font-bold text-amber-300 text-sm truncate mt-1">${escapeHtml(c.name)}</div>
            <div class="text-[11px] text-slate-400 font-mono truncate">${escapeHtml(c.orderNo || '无订单号')}</div>
          </div>
        </div>`;
      }).join('');
    }

    function undoEliminatedCandidate(id) {
      let foundCandidate = null;
      (state.rounds || []).forEach(r => {
        const target = (r.candidates || []).find(c => String(c.id) === String(id));
        if (target) foundCandidate = target;
      });
      if (!foundCandidate) return;

      (state.rounds || []).forEach(r => {
        (r.candidates || []).forEach(c => {
          if (String(c.id) === String(id)) {
            c.status = 'pending'; delete c.eliminatedRoundIndex; delete c.rankTitle; delete c.rankKey; delete c.pollLabel;
          }
        });
      });

      if (state.passHistory) state.passHistory = state.passHistory.filter(c => String(c.id) !== String(id));

      const currentRound = state.rounds[currentRoundIndex];
      const existsInCurrent = (currentRound.candidates || []).some(c => String(c.id) === String(id));
      if (!existsInCurrent) {
        currentRound.candidates.push({ id: foundCandidate.id, name: foundCandidate.name, orderNo: foundCandidate.orderNo, status: 'pending' });
      }

      saveState();
      alert(`↩️ 买家【${foundCandidate.name}】已撤回并重新回到当前轮次名单池！`);
    }

    function changeStatus(id, newStatus) {
      if (newStatus === 'pending') { undoEliminatedCandidate(id); return; }

      const activeRound = state.rounds[currentRoundIndex];
      const target = activeRound.candidates.find(c => String(c.id) === String(id));
      if (!target) return;

      target.status = newStatus;
      if (newStatus === 'out') target.eliminatedRoundIndex = currentRoundIndex;

      const isModeEnabled = state.modeConfig && state.modeConfig.enabled;
      const selectedMode = state.modeConfig ? state.modeConfig.selectedMode : 'mode1';

      if (isModeEnabled && activeRound) {
        const totalCandidates = activeRound.candidates || [];

        if (selectedMode === 'mode2' && activeRound.isConsolationStage) {
          if (newStatus === 'pass') {
            target.rankTitle = "🎁 安慰奖"; target.rankKey = "rankConsolation";
            const consolationsPicked = totalCandidates.filter(c => c.rankKey === "rankConsolation");
            const targetConsolationTotal = state.modeConfig.mode2ConsolationCount || 10;
            if (consolationsPicked.length >= targetConsolationTotal) {
              const remainingThree = totalCandidates.filter(c => c.rankKey !== "rankConsolation");
              const stageLabel = "🏆 冠亚季争夺战 (剩3人)";
              const podiumCandidates = remainingThree.map((c, idx) => ({ id: `${c.name}_${c.orderNo}_${Date.now()}_${idx}`, name: c.name, orderNo: c.orderNo, pollLabel: c.pollLabel || '', status: 'pending' }));
              state.rounds.push({ roundName: stageLabel, stageName: stageLabel, candidates: podiumCandidates });
              currentRoundIndex = state.rounds.length - 1;
              saveState(); renderRoundTabs();
              alert(i18n[currentLang].alertConsolationDone.replace('{total}', targetConsolationTotal));
              return;
            }
          }
        }

        if (totalCandidates.length === 3 && newStatus === 'pass' && !activeRound.isConsolationStage) {
          target.rankTitle = "🥉 季军"; target.rankKey = "rankThird";
          const remainingTwo = totalCandidates.filter(c => String(c.id) !== String(target.id));
          state.latestEvent = { type: 'finalCongrat', timestamp: Date.now(), winnerNamesKey: 'third', winnerName: target.name };
          const finalRoundCandidates = remainingTwo.map((c, idx) => ({ id: `${c.name}_${c.orderNo}_${Date.now()}_${idx}`, name: c.name, orderNo: c.orderNo, pollLabel: c.pollLabel || '', status: 'pending' }));
          const stageLabel = "👑 冠亚军终极决战 (2选1)";
          state.rounds.push({ roundName: stageLabel, stageName: stageLabel, candidates: finalRoundCandidates });
          currentRoundIndex = state.rounds.length - 1;
          saveState(); renderRoundTabs();
          alert(i18n[currentLang].alertThirdSuccess.replace('{name}', target.name));
          return;
        }

        if (totalCandidates.length === 2 && newStatus === 'pass' && !activeRound.isConsolationStage) {
          target.rankTitle = "👑 冠军"; target.rankKey = "rankChampion";
          const runnerUpObj = totalCandidates.find(c => String(c.id) !== String(target.id));
          let runnerUpName = "未知买家";
          if (runnerUpObj) { runnerUpObj.status = 'pass'; runnerUpObj.rankTitle = "🥈 亚军"; runnerUpObj.rankKey = "rankRunnerUp"; runnerUpName = runnerUpObj.name; }
          state.latestEvent = { type: 'finalCongrat', timestamp: Date.now(), winnerNamesKey: 'final', championName: target.name, runnerUpName: runnerUpName };
          saveState();
          alert(i18n[currentLang].alertFinalSuccess.replace('{winner}', target.name).replace('{runnerUp}', runnerUpName));
          return;
        }
      }
      saveState();
    }

    function setLanguage(lang) { currentLang = lang; renderRoundTabs(); renderAdminView(); updateStats(); updateModeBadgeUI(); }
    function updateModeBadgeUI() { /* muted for brevity, visual only */ }
    function updateHeaderTitle() { document.getElementById('adminHeaderTitle').innerText = state.customAdminTitle || 'Mochiishop 每月抽奖 - 直播控制台'; }
    function getRoundTitle(idx) { const r = state.rounds[idx]; return r.isConsolationStage ? `🎁 Consolation (${r.candidates.length})` : (r.stageName && r.stageName.includes("冠亚军") ? `👑 Final (2)` : (r.stageName && r.stageName.includes("冠亚季") ? `🏆 Podium (3)` : `第 ${idx + 1} 轮`)); }

    function goToPrevRound() {
      if (currentRoundIndex === 0) return;
      if (confirm("确认返回上一轮？")) {
        if (currentRoundIndex === state.rounds.length - 1 && state.rounds.length > 1) state.rounds.pop();
        currentRoundIndex = Math.max(0, currentRoundIndex - 1);
        saveState(); renderRoundTabs();
      }
    }

    function createNewRound() {
      const currentRound = state.rounds[currentRoundIndex];
      const passedCandidates = (currentRound.candidates || []).filter(c => c.status === 'pass');
      const totalCandidates = currentRound.candidates || [];
      
      if (passedCandidates.length === 0) { alert("⚠️ 请先选出晋级/胜出的买家！"); return; }
      if (passedCandidates.length === totalCandidates.length) { alert("⚠️ 全员都是晋级，无人被淘汰！请确认。"); return; }

      currentRound.candidates.forEach(c => {
        if (c.status !== 'pass') { c.status = 'out'; if (c.eliminatedRoundIndex === undefined) c.eliminatedRoundIndex = currentRoundIndex; }
      });

      const nextRoundNumber = state.rounds.length + 1;
      const nextRoundCandidates = passedCandidates.map((c, idx) => ({ id: `${c.name}_${c.orderNo}_${Date.now()}_${idx}`, name: c.name, orderNo: c.orderNo, pollLabel: c.pollLabel || '', status: 'pending' }));

      let stageLabel = `第 ${nextRoundNumber} 轮 (${passedCandidates.length}人角逐)`;
      let isConsolationStage = false;
      if (state.modeConfig.selectedMode === 'mode2' && passedCandidates.length === (state.modeConfig.mode2ConsolationCount + 3)) {
        stageLabel = `🎁 安慰奖遴选阶段 (${passedCandidates.length}人角逐${state.modeConfig.mode2ConsolationCount}名安慰奖)`;
        isConsolationStage = true;
      }

      state.rounds.push({ roundName: stageLabel, stageName: stageLabel, isConsolationStage: isConsolationStage, candidates: nextRoundCandidates });
      currentRoundIndex = state.rounds.length - 1;
      
      activeGroup4Ids = []; state.activeGroupIds = []; state.activeGroupMembers = [];
      state.pkStage = 'voting'; state.triggerNumber = null; state.settled = false;

      saveState(); renderRoundTabs();
      alert(`🎉 成功开启【${stageLabel}】！`);
    }

    function renderRoundTabs() {
      const container = document.getElementById('roundTabsContainer');
      if (!container) return;
      container.innerHTML = state.rounds.map((r, idx) => {
        const activeClass = (idx === currentRoundIndex) ? "bg-amber-500 text-slate-950 font-bold border-amber-400" : "bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700";
        return `<button onclick="switchRound(${idx})" class="px-4 py-1.5 rounded-lg text-xs border transition ${activeClass}">${escapeHtml(getRoundTitle(idx))}</button>`;
      }).join('');
    }

    function switchRound(idx) { 
      currentRoundIndex = idx; 
      if (state.drawRoundIndex === idx && state.activeGroupIds && state.activeGroupIds.length > 0) activeGroup4Ids = [...state.activeGroupIds];
      else if (state.activeGroupIds && state.activeGroupIds.length > 0 && state.pkStage !== 'voting') activeGroup4Ids = [...state.activeGroupIds];
      else activeGroup4Ids = [];
      renderRoundTabs(); renderAdminView(); updateStats(); 
    }

    function saveState() {
      localStorage.setItem('mochii_tournament_state', JSON.stringify(state));
      db.ref('tournament_state').set(state);
      updateStats(); renderAdminView(); updateRefreshButtonState();
    }

    function updateStats() {
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { candidates: [] };
      const candidates = activeRound.candidates || [];
      const totalCount = candidates.length;
      
      let passedCount = candidates.filter(c => c.status === 'pass').length;
      if (state.passHistory) passedCount = Math.max(passedCount, state.passHistory.filter(h => h.roundIndex === currentRoundIndex).length);

      document.getElementById('statTotalCandidates').innerText = totalCount;
      document.getElementById('statPassedCount').innerText = passedCount;
      document.getElementById('statPendingCount').innerText = candidates.filter(c => c.status === 'pending').length;
      
      let totalOutCount = 0;
      (state.rounds || []).forEach(r => { totalOutCount += (r.candidates || []).filter(c => c.status === 'out').length; });
      document.getElementById('statOutCount').innerText = totalOutCount;
      updateRefreshButtonState();
    }

    function renderAdminView() {
      renderActiveGroupUI();
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { candidates: [] };
      const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      let list = (activeRound.candidates || []).filter(c => (c.name || '').toLowerCase().includes(search) || (c.orderNo || '').toLowerCase().includes(search));

      const passedContainer = document.getElementById('passedListContainer');
      let passedList = list.filter(c => c.status === 'pass');
      if (state.passHistory) {
        state.passHistory.forEach(hist => { if (!passedList.some(c => String(c.id) === String(hist.id))) passedList.push(hist); });
      }
      passedList.sort((a, b) => {
        const numA = a.pollLabel ? parseInt(a.pollLabel.replace(/[^0-9]/g, '')) : 9999;
        const numB = b.pollLabel ? parseInt(b.pollLabel.replace(/[^0-9]/g, '')) : 9999;
        return numA - numB;
      });

      passedContainer.innerHTML = passedList.length === 0 ? `<span class="text-xs text-slate-500 italic">本轮暂无胜出买家...</span>` : passedList.map(c => {
          const rankText = c.rankTitle ? `<span class="bg-amber-500 text-slate-950 font-black px-1.5 py-0.5 rounded text-[10px] ml-1">${c.rankTitle}</span>` : '';
          const folderTabHtml = c.pollLabel ? `<div class="folder-tab">${escapeHtml(c.pollLabel)}</div>` : '';
          return `<div class="relative px-3 py-2 bg-emerald-950/70 border border-emerald-500/50 rounded-lg flex items-center space-x-2 text-xs shadow-sm mt-1.5">` + folderTabHtml +
            '<span class="font-bold text-emerald-300 mt-1">' + escapeHtml(c.name) + '</span>' +
            '<span class="text-slate-400 font-mono text-[11px] mt-1">' + escapeHtml(c.orderNo || '无订单号') + '</span>' + rankText +
            '<button onclick="undoEliminatedCandidate(\'' + c.id + '\')" class="ml-1 text-emerald-400 hover:text-rose-400 font-bold px-1 rounded mt-1">✕</button>' +
          '</div>';
        }).join('');

      const container = document.getElementById('adminViewContainer');
      const pendingList = list.filter(c => c.status === 'pending');

      if (pendingList.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500"><p class="text-2xl mb-2">🎉</p><p>本轮选拔已完成！</p></div>`;
      } else {
        const cardsHtml = pendingList.map((c, index) => {
          let borderStyle = 'border-slate-700 bg-slate-800';
          let statusBadge = '';
          if (activeGroup4Ids.includes(String(c.id))) {
            borderStyle = 'border-amber-400/80 bg-amber-950/30 ring-2 ring-amber-500/50';
            statusBadge = `<span class="px-1.5 py-0.5 rounded text-[9px] bg-amber-500 text-slate-950 font-black">🔥 PK中</span>`;
          }
          const folderTabHtml = c.pollLabel ? `<div class="folder-tab">${escapeHtml(c.pollLabel)}</div>` : '';
          return `<div class="relative p-3 rounded-xl border ${borderStyle} flex flex-col justify-between shadow transition min-w-0 mt-2">` + folderTabHtml +
            '<div>' +
              '<div class="flex justify-between items-center mb-1"><span class="text-[10px] font-mono text-slate-400">#' + (index + 1) + '</span>' + statusBadge + '</div>' +
              '<div class="font-bold text-slate-100 text-sm truncate mt-1.5">' + escapeHtml(c.name) + '</div>' +
              '<div class="text-[10px] text-amber-400/80 font-mono mt-0.5 truncate">' + escapeHtml(c.orderNo || '无订单号') + '</div>' +
            '</div>' +
            '<div class="mt-3 pt-2 border-t border-slate-700/60 flex space-x-1">' +
              `<button onclick="changeStatus('${c.id}', 'pass')" class="flex-1 py-1 text-[11px] rounded font-bold transition bg-slate-700 text-emerald-400 hover:bg-emerald-600 hover:text-white">🏆 晋级</button>` +
              `<button onclick="changeStatus('${c.id}', 'out')" class="px-2 py-1 text-[11px] rounded bg-slate-700 text-slate-400 hover:bg-rose-600 hover:text-white font-bold">❌ 淘汰</button>` +
            '</div>' +
          '</div>';
        }).join('');
        container.innerHTML = '<div class="grid grid-cols-5 gap-3">' + cardsHtml + '</div>';
      }
    }

    function resetRounds() {
      if (confirm("确认重置所有数据？")) {
        db.ref('tournament_state').transaction(() => {
          return {
            customAdminTitle: state.customAdminTitle || '', customPublicTitle: state.customPublicTitle || '',
            isPublicVisible: true, pollCount: 0, currentPollNumber: 0, pkStage: 'voting', triggerNumber: null,
            drawRoundIndex: 0, activeGroupMembers: [], activeGroupIds: [], passHistory: [], settled: false,
            modeConfig: state.modeConfig || {}, rounds: [{ roundName: "第 1 轮", candidates: [] }], publicAdminActive: false
          };
        }, (error) => {
          if (!error) {
            currentRoundIndex = 0; activeGroup4Ids = [];
            alert("✅ 所有数据已重置清空！"); fetchGoogleSheetsData(true);
          } else alert("❌ 重置失败，请重试");
        });
      }
    }

    function escapeHtml(str) { return str ? String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
  </script>
</body>
</html>
