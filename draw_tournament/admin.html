<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochiishop 每月抽奖 - 直播控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- 顶部 Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🎬</span>
        <div>
          <h1 class="text-xl font-bold text-amber-400" data-i18n="adminTitle">Mochiishop 每月抽奖 - 直播控制台</h1>
          <p class="text-xs text-slate-400" data-i18n="adminSubTitle">管理者专属 · 多轮晋级控盘系统</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <!-- ⚙️ 决战弹窗阈值设置项 -->
        <div class="flex items-center space-x-1.5 bg-slate-900 border border-slate-700 px-2.5 py-1 rounded-lg text-xs">
          <span class="text-amber-400 font-bold">⚙️ 决战提示阈值:</span>
          <span class="text-slate-400">剩</span>
          <input 
            type="number" 
            id="finalThresholdInput" 
            value="2" 
            min="1" 
            max="10" 
            class="w-10 bg-slate-800 border border-slate-600 rounded text-center text-amber-300 font-bold focus:outline-none focus:border-amber-400"
            title="设置当剩余角逐买家达到此人数时弹出决战询问框"
          >
          <span class="text-slate-400">人弹窗</span>
        </div>

        <!-- 🌐 语言切换按钮 (国旗显示) -->
        <div class="flex items-center space-x-1 bg-slate-900 border border-slate-700 p-1 rounded-lg">
          <button onclick="setLanguage('zh')" id="langBtn-zh" class="px-2 py-1 text-xs rounded transition flex items-center space-x-1">
            <span>🇨🇳</span> <span class="text-[11px]">ZH</span>
          </button>
          <button onclick="setLanguage('en')" id="langBtn-en" class="px-2 py-1 text-xs rounded transition flex items-center space-x-1">
            <span>🇬🇧</span> <span class="text-[11px]">EN</span>
          </button>
          <button onclick="setLanguage('ms')" id="langBtn-ms" class="px-2 py-1 text-xs rounded transition flex items-center space-x-1">
            <span>🇲🇾</span> <span class="text-[11px]">MS</span>
          </button>
        </div>

        <button onclick="goToPrevRound()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold rounded-lg border border-slate-600 transition shadow" data-i18n="btnPrevRound">
          🔙 返回至上一轮
        </button>
        <button onclick="createNewRound()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-lg transition shadow flex items-center space-x-1">
          <span data-i18n="btnNextRound">⏩ 推进本轮普及人员至下一轮</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主体区域 -->
  <main class="max-w-[1600px] mx-auto px-4 py-6 flex-1 w-full">
    
    <!-- 轮次切换 Tabs 区域 -->
    <div class="mb-4 flex items-center justify-between border-b border-slate-800 pb-2">
      <div id="roundTabsContainer" class="flex space-x-2 overflow-x-auto">
        <!-- 动态生成轮次选项卡 -->
      </div>
      <button onclick="resetRounds()" class="text-xs text-rose-400 hover:underline font-bold" data-i18n="btnResetAll">⚠️ 重置所有轮次数据</button>
    </div>

    <!-- 数据概览面板 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block" data-i18n="statTotal">本轮参选人数</span>
        <span id="statTotalCandidates" class="text-2xl font-black text-blue-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block" data-i18n="statPassed">本轮已普及/晋级</span>
        <span id="statPassedCount" class="text-2xl font-black text-emerald-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block" data-i18n="statPending">本轮角逐中人数</span>
        <span id="statPendingCount" class="text-2xl font-black text-amber-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block" data-i18n="statOut">本轮已淘汰人数</span>
        <span id="statOutCount" class="text-2xl font-black text-slate-400">0</span>
      </div>
    </div>

    <!-- 顶栏 1：已普及名单展示区 -->
    <div class="mb-6 bg-slate-800/90 p-4 rounded-xl border border-emerald-500/30 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-lg shadow-emerald-950/20">
      <div class="flex-1 w-full">
        <div class="flex items-center space-x-2 mb-2">
          <span class="text-lg">🏆</span>
          <h2 id="passedTitleText" class="text-md font-bold text-emerald-400">第 1 轮 已普及/晋级名单</h2>
          <span id="passedBadgeCount" class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">0人</span>
          <span class="text-[11px] text-slate-400 ml-2" data-i18n="undoTip">💡 点击小标签旁的 ✕ 可撤回改待定</span>
        </div>
        <div id="passedListContainer" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto pr-1">
        </div>
      </div>
    </div>

    <!-- 顶栏 2：同步状态与短搜索框 -->
    <div class="mb-6 bg-slate-800 p-3 rounded-xl border border-slate-700 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="text-xs text-slate-400 flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
        <span id="syncStatusText" data-i18n="syncConnected">已连接至 Google Sheets 数据源</span>
        <button id="refreshSheetsBtn" onclick="fetchGoogleSheetsData(true)" class="ml-2 px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded transition text-xs shadow disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-emerald-600">
          <span data-i18n="btnRefreshSheets">🔄 从表格更新第 1 轮名单</span>
        </button>
      </div>

      <div class="relative w-full sm:w-64">
        <input 
          type="search" 
          id="searchInput" 
          oninput="renderAdminView()" 
          placeholder="🔍 快速查找本轮买家/订单..." 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-400"
        >
      </div>
    </div>

    <!-- 底部：待角逐中 / 淘汰买家卡片展区 -->
    <div id="adminViewContainer" class="bg-slate-800/50 rounded-2xl p-6 border border-slate-700 min-h-[400px]">
    </div>

  </main>

  <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    © Mochiishop Shopee Monthly Event. All rights reserved.
  </footer>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1VSfYPx-lpdSAw8pgebnABW3rlSFK-8t4oxqPPcjKtt0/gviz/tq?tqx=out:csv&gid=322881163";

    let currentLang = localStorage.getItem('mochii_lang') || 'zh';
    let currentRoundIndex = 0;
    let state = { rounds: [{ roundName: "第 1 轮", candidates: [] }] };

    const i18n = {
      zh: {
        adminTitle: "Mochiishop 每月抽奖 - 直播控制台",
        adminSubTitle: "管理者专属 · 多轮晋级控盘系统",
        btnPrevRound: "🔙 返回至上一轮",
        btnNextRound: "⏩ 推进本轮普及人员至下一轮",
        btnResetAll: "⚠️ 重置所有轮次数据",
        statTotal: "本轮参选人数",
        statPassed: "本轮已普及/晋级",
        statPending: "本轮角逐中人数",
        statOut: "本轮已淘汰人数",
        undoTip: "💡 点击小标签旁的 ✕ 可撤回改待定",
        syncConnected: "已连接至 Google Sheets 数据源",
        syncing: "正在从 Google Sheets 同步中...",
        syncSuccess: "已成功从 Google Sheets 同步！",
        btnRefreshSheets: "🔄 从表格更新第 1 轮名单",
        searchPlaceholder: "🔍 快速查找本轮买家/订单...",
        roundPrefix: "第 ",
        roundSuffix: " 轮",
        passedTitle: "已普及/晋级名单",
        noPassed: "本轮暂无普及买家，等待您点击普及...",
        noPendingList: "本轮普及判定已完成！可点击右上角【⏩ 推进普及名单至下一轮】",
        btnPass: "🏆 普及",
        btnOut: "❌ 淘汰",
        btnUndoOut: "↩️ 撤回淘汰",
        badgeOut: "❌ 已淘汰",
        unitPeople: "人"
      },
      en: {
        adminTitle: "Mochiishop Monthly Draw - Admin Control",
        adminSubTitle: "Exclusive Admin · Multi-Round Tournament System",
        btnPrevRound: "🔙 Back to Previous Round",
        btnNextRound: "⏩ Advance Qualified to Next Round",
        btnResetAll: "⚠️ Reset All Rounds Data",
        statTotal: "Total Candidates",
        statPassed: "Passed / Qualified",
        statPending: "In Battle",
        statOut: "Eliminated",
        undoTip: "💡 Click ✕ on badge to undo",
        syncConnected: "Connected to Google Sheets",
        syncing: "Syncing from Google Sheets...",
        syncSuccess: "Successfully synced from Sheets!",
        btnRefreshSheets: "🔄 Refresh Round 1 List",
        searchPlaceholder: "🔍 Fast search name/order...",
        roundPrefix: "Round ",
        roundSuffix: "",
        passedTitle: "Passed / Qualified List",
        noPassed: "No qualified buyers yet in this round",
        noPendingList: "Round completed! Click 'Advance Qualified to Next Round' on top right.",
        btnPass: "🏆 Pass",
        btnOut: "❌ Out",
        btnUndoOut: "↩️ Undo Out",
        badgeOut: "❌ Out",
        unitPeople: ""
      },
      ms: {
        adminTitle: "Mochiishop Cabutan Bulanan - Konsol Kawalan",
        adminSubTitle: "Pengurus Eksklusif · Sistem Pertandingan Pelbagai Pusingan",
        btnPrevRound: "🔙 Kembali ke Pusingan Sebelumnya",
        btnNextRound: "⏩ Majukan Calon Layak ke Pusingan Seterusnya",
        btnResetAll: "⚠️ Tetap Semula Semua Data",
        statTotal: "Jumlah Calon",
        statPassed: "Lulus / Layak",
        statPending: "Dalam Bersaing",
        statOut: "Tersingkir",
        undoTip: "💡 Klik ✕ pada lencana untuk batalkan",
        syncConnected: "Telah disambungkan ke Google Sheets",
        syncing: "Menyelaraskan dari Google Sheets...",
        syncSuccess: "Berjaya diselaraskan dari Sheets!",
        btnRefreshSheets: "🔄 Kemas Kini Senarai Pusingan 1",
        searchPlaceholder: "🔍 Cari cepat nama/pesanan...",
        roundPrefix: "Pusingan ",
        roundSuffix: "",
        passedTitle: "Senarai Layak / Lulus",
        noPassed: "Belum ada pembeli layak dalam pusingan ini",
        noPendingList: "Keputusan pusingan selesai! Klik butang di atas untuk ke pusingan seterusnya.",
        btnPass: "🏆 Layak",
        btnOut: "❌ Singkir",
        btnUndoOut: "↩️ Batal Singkir",
        badgeOut: "❌ Tersingkir",
        unitPeople: " orang"
      }
    };

    window.onload = function() {
      setLanguage(currentLang);
      loadState();
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { candidates: [] };
      if (!activeRound.candidates || activeRound.candidates.length === 0) {
        fetchGoogleSheetsData();
      } else {
        renderRoundTabs();
        renderAdminView();
        updateStats();
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('mochii_lang', lang);

      ['zh', 'en', 'ms'].forEach(l => {
        const btn = document.getElementById(`langBtn-${l}`);
        if (btn) {
          if (l === lang) {
            btn.className = "px-2 py-1 text-xs rounded transition flex items-center space-x-1 bg-amber-500 text-slate-950 font-bold";
          } else {
            btn.className = "px-2 py-1 text-xs rounded transition flex items-center space-x-1 text-slate-400 hover:text-slate-100";
          }
        }
      });

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key] !== undefined) {
          el.innerText = i18n[lang][key];
        }
      });

      const searchInp = document.getElementById('searchInput');
      if (searchInp) searchInp.placeholder = i18n[lang].searchPlaceholder;

      renderRoundTabs();
      renderAdminView();
      updateStats();
    }

    function getRoundTitle(idx) {
      const r = state.rounds[idx];
      if (r && r.roundName) {
        const match = r.roundName.match(/\d+/);
        const num = match ? match[0] : (idx + 1);
        return `${i18n[currentLang].roundPrefix}${num}${i18n[currentLang].roundSuffix}`;
      }
      return `${i18n[currentLang].roundPrefix}${idx + 1}${i18n[currentLang].roundSuffix}`;
    }

    function fetchGoogleSheetsData(isManual) {
      if (currentRoundIndex !== 0) {
        alert("禁止在第 2 轮及后续轮次刷新表格，以免覆盖晋级数据！请先切换回【第 1 轮】。");
        return;
      }

      const syncStatus = document.getElementById('syncStatusText');
      if (syncStatus) syncStatus.innerText = i18n[currentLang].syncing;

      fetch(SHEET_CSV_URL)
        .then(response => response.text())
        .then(csvText => {
          parseCSVToFirstRound(csvText);
          if (syncStatus) syncStatus.innerText = i18n[currentLang].syncSuccess;
          if (isManual) alert(i18n[currentLang].syncSuccess);
        })
        .catch(err => console.error("读取失败", err));
    }

    function parseCSVToFirstRound(csvText) {
      const lines = csvText.split('\n');
      const candidates = [];

      lines.forEach((line, idx) => {
        if (!line.trim()) return;
        const cleanLine = line.replace(/"/g, '');
        const parts = cleanLine.split(',');

        if (parts.length >= 1) {
          const name = parts[0] ? parts[0].trim() : '';
          const orderNo = parts[1] ? parts[1].trim() : '';

          if (name && name !== '买家姓名' && name !== 'Name') {
            candidates.push({
              id: Date.now() + idx,
              name: name,
              orderNo: orderNo,
              status: 'pending'
            });
          }
        }
      });

      if (!state.rounds || state.rounds.length === 0) {
        state.rounds = [{ roundName: "第 1 轮", candidates: candidates }];
      } else {
        state.rounds[0].candidates = candidates;
      }

      saveState();
      renderRoundTabs();
    }

    function goToPrevRound() {
      if (currentRoundIndex === 0) {
        alert("当前已经是第 1 轮，无法再返回上一轮。");
        return;
      }

      if (confirm(`确认返回至上一轮（第 ${currentRoundIndex} 轮）？`)) {
        if (currentRoundIndex === state.rounds.length - 1 && state.rounds.length > 1) {
          state.rounds.pop();
        }
        
        currentRoundIndex = Math.max(0, currentRoundIndex - 1);

        state.latestEvent = {
          type: 'prevRound',
          timestamp: Date.now(),
          targetRoundIndex: currentRoundIndex
        };

        saveState();
        renderRoundTabs();
      }
    }

    function createNewRound() {
      const currentRound = state.rounds[currentRoundIndex];
      const passedCandidates = (currentRound.candidates || []).filter(c => c.status === 'pass');

      if (passedCandidates.length === 0) {
        alert("当前轮次尚未选择任何普及/晋级买家，请先点击【普及】按钮选出晋级选手！");
        return;
      }

      const nextRoundNumber = state.rounds.length + 1;
      const nextRoundCandidates = passedCandidates.map((c, idx) => ({
        id: Date.now() + idx,
        name: c.name,
        orderNo: c.orderNo,
        status: 'pending'
      }));

      state.rounds.push({
        roundName: `第 ${nextRoundNumber} 轮`,
        candidates: nextRoundCandidates
      });

      currentRoundIndex = state.rounds.length - 1;

      state.latestEvent = {
        type: 'advance',
        timestamp: Date.now(),
        targetRoundIndex: currentRoundIndex
      };

      saveState();
      renderRoundTabs();
      alert(`🎉 已成功开启【第 ${nextRoundNumber} 轮】！公开大屏已自动同步显示。`);
    }

    function renderRoundTabs() {
      const container = document.getElementById('roundTabsContainer');
      if (!container) return;

      container.innerHTML = state.rounds.map((r, idx) => {
        const isActive = (idx === currentRoundIndex);
        const activeClass = isActive ? "bg-amber-500 text-slate-950 font-bold border-amber-400" : "bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700";
        return `<button onclick="switchRound(${idx})" class="px-4 py-1.5 rounded-lg text-xs border transition ${activeClass}">
          ${escapeHtml(getRoundTitle(idx))}
        </button>`;
      }).join('');
    }

    function switchRound(idx) {
      currentRoundIndex = idx;
      renderRoundTabs();
      renderAdminView();
      updateStats();
    }

    function loadState() {
      const saved = localStorage.getItem('mochii_tournament_state');
      if (saved) {
        try { 
          const parsed = JSON.parse(saved); 
          if (parsed && Array.isArray(parsed.rounds) && parsed.rounds.length > 0) {
            state = parsed;
          } else if (parsed && parsed.candidates) {
            state = { rounds: [{ roundName: "第 1 轮", candidates: parsed.candidates }] };
          } else {
            state = { rounds: [{ roundName: "第 1 轮", candidates: [] }] };
          }
        } catch(e){
          state = { rounds: [{ roundName: "第 1 轮", candidates: [] }] };
        }
      } else {
        state = { rounds: [{ roundName: "第 1 轮", candidates: [] }] };
      }
    }

    function saveState() {
      localStorage.setItem('mochii_tournament_state', JSON.stringify(state));
      updateStats();
      renderAdminView();
    }

    function updateStats() {
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { candidates: [] };
      const candidates = activeRound.candidates || [];

      const total = candidates.length;
      const passed = candidates.filter(c => c.status === 'pass').length;
      const pending = candidates.filter(c => c.status === 'pending').length;
      const out = candidates.filter(c => c.status === 'out
