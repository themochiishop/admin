<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochiishop 每月抽奖 - 直播控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- 顶部 Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🎬</span>
        <div>
          <h1 class="text-xl font-bold text-amber-400">Mochiishop 每月抽奖 - 直播控制台</h1>
          <p class="text-xs text-slate-400">管理者专属 · 多轮晋级控盘系统</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="createNewRound()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-lg transition shadow flex items-center space-x-1">
          <span>⏩ 推进本轮普及人员至下一轮</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主体区域 -->
  <main class="max-w-[1600px] mx-auto px-4 py-6 flex-1 w-full">
    
    <!-- 轮次切换 Tabs 区域 -->
    <div class="mb-4 flex items-center justify-between border-b border-slate-800 pb-2">
      <div id="roundTabsContainer" class="flex space-x-2 overflow-x-auto">
        <!-- 动态生成轮次选项卡 -->
      </div>
      <button onclick="resetRounds()" class="text-xs text-rose-400 hover:underline font-bold">⚠️ 重置所有轮次数据</button>
    </div>

    <!-- 数据概览面板 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">本轮参选人数</span>
        <span id="statTotalCandidates" class="text-2xl font-black text-blue-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">本轮已普及/晋级</span>
        <span id="statPassedCount" class="text-2xl font-black text-emerald-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">本轮角逐中人数</span>
        <span id="statPendingCount" class="text-2xl font-black text-amber-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block">本轮已淘汰人数</span>
        <span id="statOutCount" class="text-2xl font-black text-slate-400">0</span>
      </div>
    </div>

    <!-- 顶栏 1：已普及名单展示区 (点击 ✕ 可快速撤回) -->
    <div class="mb-6 bg-slate-800/90 p-4 rounded-xl border border-emerald-500/30 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-lg shadow-emerald-950/20">
      <div class="flex-1 w-full">
        <div class="flex items-center space-x-2 mb-2">
          <span class="text-lg">🏆</span>
          <h2 id="passedTitleText" class="text-md font-bold text-emerald-400">第 1 轮 已普及/晋级名单</h2>
          <span id="passedBadgeCount" class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">0人</span>
          <span class="text-[11px] text-slate-400 ml-2">💡 点击小标签旁的 ✕ 可撤回改待定</span>
        </div>
        <div id="passedListContainer" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto pr-1">
          <!-- 动态渲染普及买家 -->
        </div>
      </div>
    </div>

    <!-- 顶栏 2：同步状态与短搜索框 -->
    <div class="mb-6 bg-slate-800 p-3 rounded-xl border border-slate-700 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="text-xs text-slate-400 flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
        <span id="syncStatusText">已连接至 Google Sheets 数据源</span>
        <button onclick="fetchGoogleSheetsData(true)" class="ml-2 px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded transition text-xs shadow">
          <span>🔄 从表格更新第 1 轮名单</span>
        </button>
      </div>

      <div class="relative w-full sm:w-64">
        <input 
          type="search" 
          id="searchInput" 
          oninput="renderAdminView()" 
          placeholder="🔍 快速查找本轮买家/订单..." 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-400"
        >
      </div>
    </div>

    <!-- 底部：待角逐中卡片展区 -->
    <div id="adminViewContainer" class="bg-slate-800/50 rounded-2xl p-6 border border-slate-700 min-h-[400px]">
    </div>

  </main>

  <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    © Mochiishop Shopee Monthly Event. All rights reserved.
  </footer>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1VSfYPx-lpdSAw8pgebnABW3rlSFK-8t4oxqPPcjKtt0/gviz/tq?tqx=out:csv&gid=322881163";

    let currentRoundIndex = 0;
    let state = {
      rounds: [
        { roundName: "第 1 轮", candidates: [] }
      ]
    };

    window.onload = function() {
      loadState();
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { candidates: [] };
      if (!activeRound.candidates || activeRound.candidates.length === 0) {
        fetchGoogleSheetsData();
      } else {
        renderRoundTabs();
        renderAdminView();
        updateStats();
      }
    };

    function fetchGoogleSheetsData(isManual) {
      const syncStatus = document.getElementById('syncStatusText');
      if (syncStatus) syncStatus.innerText = "正在从 Google Sheets 同步中...";

      fetch(SHEET_CSV_URL)
        .then(response => response.text())
        .then(csvText => {
          parseCSVToFirstRound(csvText);
          if (syncStatus) syncStatus.innerText = "已成功从 Google Sheets 同步！";
          if (isManual) alert("已从表格载入第 1 轮最新名单！");
        })
        .catch(err => console.error("读取失败", err));
    }

    function parseCSVToFirstRound(csvText) {
      const lines = csvText.split('\n');
      const candidates = [];

      lines.forEach((line, idx) => {
        if (!line.trim()) return;
        const cleanLine = line.replace(/"/g, '');
        const parts = cleanLine.split(',');

        if (parts.length >= 1) {
          const name = parts[0] ? parts[0].trim() : '';
          const orderNo = parts[1] ? parts[1].trim() : '';

          if (name && name !== '买家姓名' && name !== 'Name') {
            candidates.push({
              id: Date.now() + idx,
              name: name,
              orderNo: orderNo,
              status: 'pending'
            });
          }
        }
      });

      if (!state.rounds || state.rounds.length === 0) {
        state.rounds = [{ roundName: "第 1 轮", candidates: candidates }];
      } else {
        state.rounds[0].candidates = candidates;
      }

      saveState();
      renderRoundTabs();
    }

    function createNewRound() {
      const currentRound = state.rounds[currentRoundIndex];
      const passedCandidates = (currentRound.candidates || []).filter(c => c.status === 'pass');

      if (passedCandidates.length === 0) {
        alert("当前轮次尚未选择任何普及/晋级买家，请先点击【普及】按钮选出晋级选手！");
        return;
      }

      const nextRoundNumber = state.rounds.length + 1;
      const nextRoundCandidates = passedCandidates.map((c, idx) => ({
        id: Date.now() + idx,
        name: c.name,
        orderNo: c.orderNo,
        status: 'pending'
      }));

      state.rounds.push({
        roundName: `第 ${nextRoundNumber} 轮`,
        candidates: nextRoundCandidates
      });

      currentRoundIndex = state.rounds.length - 1;
      saveState();
      renderRoundTabs();
      alert(`🎉 已成功开启【第 ${nextRoundNumber} 轮】！已继承上一轮普及的 ${nextRoundCandidates.length} 位买家名单。`);
    }

    function renderRoundTabs() {
      const container = document.getElementById('roundTabsContainer');
      if (!container) return;

      container.innerHTML = state.rounds.map((r, idx) => {
        const isActive = (idx === currentRoundIndex);
        const activeClass = isActive ? "bg-amber-500 text-slate-950 font-bold border-amber-400" : "bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700";
        return `<button onclick="switchRound(${idx})" class="px-4 py-1.5 rounded-lg text-xs border transition ${activeClass}">
          ${escapeHtml(r.roundName)}
        </button>`;
      }).join('');
    }

    function switchRound(idx) {
      currentRoundIndex = idx;
      renderRoundTabs();
      renderAdminView();
      updateStats();
    }

    function loadState() {
      const saved = localStorage.getItem('mochii_tournament_state');
      if (saved) {
        try { 
          const parsed = JSON.parse(saved); 
          if (parsed && Array.isArray(parsed.rounds) && parsed.rounds.length > 0) {
            state = parsed;
          } else if (parsed && parsed.candidates) {
            state = { rounds: [{ roundName: "第 1 轮", candidates: parsed.candidates }] };
          } else {
            state = { rounds: [{ roundName: "第 1 轮", candidates: [] }] };
          }
        } catch(e){
          state = { rounds: [{ roundName: "第 1 轮", candidates: [] }] };
        }
      } else {
        state = { rounds: [{ roundName: "第 1 轮", candidates: [] }] };
      }
    }

    function saveState() {
      localStorage.setItem('mochii_tournament_state', JSON.stringify(state));
      updateStats();
      renderAdminView();
    }

    function updateStats() {
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { roundName: "第 1 轮", candidates: [] };
      const candidates = activeRound.candidates || [];

      const total = candidates.length;
      const passed = candidates.filter(c => c.status === 'pass').length;
      const pending = candidates.filter(c => c.status === 'pending').length;
      const out = candidates.filter(c => c.status === 'out').length;

      document.getElementById('statTotalCandidates').innerText = total;
      document.getElementById('statPassedCount').innerText = passed;
      document.getElementById('statPendingCount').innerText = pending;
      document.getElementById('statOutCount').innerText = out;

      document.getElementById('passedTitleText').innerText = `${activeRound.roundName || '第 1 轮'} 已普及/晋级名单`;
      document.getElementById('passedBadgeCount').innerText = passed + '人';
    }

    function changeStatus(id, newStatus) {
      const activeRound = state.rounds[currentRoundIndex];
      const target = activeRound.candidates.find(c => c.id === id);
      if (target) {
        target.status = newStatus;
        saveState();
      }
    }

    function renderAdminView() {
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { roundName: "第 1 轮", candidates: [] };
      const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();

      let list = (activeRound.candidates || []).filter(c => 
        (c.name || '').toLowerCase().includes(search) || (c.orderNo || '').toLowerCase().includes(search)
      );

      // 1. 普及区
      const passedContainer = document.getElementById('passedListContainer');
      const passedList = list.filter(c => c.status === 'pass');

      if (passedList.length === 0) {
        passedContainer.innerHTML = '<span class="text-xs text-slate-500 italic">本轮暂无普及买家，等待您点击普及...</span>';
      } else {
        passedContainer.innerHTML = passedList.map(c => 
          '<div class="px-3 py-1.5 bg-emerald-950/70 border border-emerald-500/50 rounded-lg flex items-center space-x-2 text-xs shadow-sm">' +
            '<span class="font-bold text-emerald-300">' + escapeHtml(c.name) + '</span>' +
            '<span class="text-slate-400 font-mono text-[11px]">' + escapeHtml(c.orderNo) + '</span>' +
            '<button onclick="changeStatus(' + c.id + ', \'pending\')" title="撤回改待定" class="ml-1 text-emerald-400 hover:text-rose-400 font-bold px-1 bg-emerald-900/50 rounded hover:bg-rose-950 transition">✕</button>' +
          '</div>'
        ).join('');
      }

      // 2. 待角逐卡片区
      const container = document.getElementById('adminViewContainer');
      const pendingList = list.filter(c => c.status === 'pending' || c.status === 'out');

      if (pendingList.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-slate-500"><p class="text-2xl mb-2">🎉</p><p>本轮普及判定已完成！可点击右上角【⏩ 推进普及名单至下一轮】</p></div>';
        return;
      }

      const cardsHtml = pendingList.map((c, index) => {
        let borderStyle = 'border-slate-700 bg-slate-800';
        let statusBadge = '';

        if (c.status === 'out') {
          borderStyle = 'border-slate-800 bg-slate-900/60 opacity-50';
          statusBadge = '<span class="px-2 py-0.5 rounded text-xs bg-slate-700 text-slate-400">已淘汰</span>';
        }

        const btnPassStyle = 'bg-slate-700 text-emerald-400 hover:bg-emerald-600 hover:text-white font-bold';
        const btnOutStyle = (c.status === 'out') ? 'bg-rose-500 text-white font-bold' : 'bg-slate-700 text-slate-400 hover:bg-rose-600 hover:text-white';

        return '<div class="p-4 rounded-xl border ' + borderStyle + ' transition relative flex flex-col justify-between shadow">' +
          '<div>' +
            '<div class="flex justify-between items-start mb-2">' +
              '<span class="text-xs font-mono text-slate-400">#' + (index + 1) + '</span>' +
              statusBadge +
            '</div>' +
            '<div class="font-bold text-slate-100 text-base truncate">' + escapeHtml(c.name) + '</div>' +
            '<div class="text-xs text-amber-400/80 font-mono mt-0.5 truncate">' + escapeHtml(c.orderNo || '无订单号') + '</div>' +
          '</div>' +

          '<div class="mt-4 pt-3 border-t border-slate-700/60 flex space-x-2">' +
            '<button onclick="changeStatus(' + c.id + ', \'pass\')" class="flex-1 py-1.5 text-xs rounded transition ' + btnPassStyle + '">🏆 普及</button>' +
            '<button onclick="changeStatus(' + c.id + ', \'out\')" class="px-3 py-1.5 text-xs rounded transition ' + btnOutStyle + '">❌ 淘汰</button>' +
          '</div>' +
        '</div>';
      }).join('');

      container.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">' + cardsHtml + '</div>';
    }

    // 🌟 彻底修复：重置时写入标准数据结构，防止公开大屏显示 undefined
    function resetRounds() {
      if (confirm("确认重置所有轮次数据？这会清除所有轮次并重新从 Google 表格同步第 1 轮。")) {
        currentRoundIndex = 0;
        state = {
          rounds: [
            { roundName: "第 1 轮", candidates: [] }
          ]
        };
        localStorage.setItem('mochii_tournament_state', JSON.stringify(state));
        fetchGoogleSheetsData(true);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
