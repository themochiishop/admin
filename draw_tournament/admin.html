<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochiishop 每月抽奖 - 管理后台控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- 🔥 引入 Firebase 8.x SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans pb-12">

  <!-- 顶部 Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
        <div class="flex items-center space-x-2">
          <span class="text-2xl">⚙️</span>
          <div>
            <h1 class="text-base sm:text-lg font-bold text-amber-400">Mochiishop 抽奖控制台 (后台)</h1>
            <p class="text-[10px] sm:text-xs text-slate-400">实时操盘 · 轮次管理 · 奖项判定 · 导出名单</p>
          </div>
        </div>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-3 text-xs w-full sm:w-auto justify-end">
        <button onclick="togglePublicVisibility()" id="publicVisibilityToggleBtn" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition shadow">
          🌐 前台大屏: 显示中
        </button>
        <button onclick="exportWinnersExcel()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg transition shadow flex items-center space-x-1">
          <span>📊</span>
          <span>导出获奖名单 Excel</span>
        </button>
        <button onclick="resetTournamentData()" class="px-3 py-1.5 bg-rose-700 hover:bg-rose-600 text-white font-bold rounded-lg transition shadow">
          🗑️ 重置全场比赛
        </button>
      </div>
    </div>
  </header>

  <!-- 主体区域 -->
  <main class="max-w-[1600px] mx-auto px-4 py-6 flex-1 w-full space-y-6">

    <!-- 1. 标题与规则模式设定区 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-800/80 p-4 rounded-2xl border border-slate-700 shadow">
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">📢 前台大屏自定义标题</label>
        <div class="flex space-x-2">
          <input type="text" id="customTitleInput" placeholder="输入大屏标题..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
          <button onclick="saveCustomTitle()" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-lg transition">保存标题</button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">🏆 比赛规则模式配置</label>
        <div class="flex flex-wrap items-center gap-2 sm:gap-3">
          <select id="modeSelect" onchange="saveModeConfig()" class="bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-1.5 text-amber-300 font-bold focus:outline-none">
            <option value="mode1">冠亚季模式 (仅产出前3名)</option>
            <option value="mode2">3 + 安慰奖模式</option>
          </select>
          <div id="consolationInputGroup" class="hidden flex items-center space-x-1">
            <span class="text-xs text-slate-400">安慰奖人数:</span>
            <input type="number" id="consolationCountInput" value="10" min="1" max="100" onchange="saveModeConfig()" class="w-16 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-center text-emerald-400 font-bold">
          </div>
        </div>
      </div>
    </div>

    <!-- 2. 直播间盲抽 PK 操盘面板 -->
    <div id="adminPKControlPanel" class="bg-gradient-to-r from-amber-950/40 via-slate-800 to-amber-950/40 border-2 border-amber-500/50 rounded-2xl p-4 sm:p-5 shadow-2xl space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-amber-500/30 pb-3">
        <div class="flex items-center space-x-2">
          <span class="text-xl animate-bounce">🔥</span>
          <h2 class="text-base font-black text-amber-400">直播间分组盲抽 PK 操盘面板</h2>
        </div>

        <div class="flex items-center space-x-2">
          <button onclick="generateRandomPKGroup()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-lg transition shadow">
            🎲 随机抽取一组买家 (盲抽)
          </button>
        </div>
      </div>

      <!-- 触发号选择与揭晓开奖核心控制栏 -->
      <div class="bg-slate-900/90 p-3.5 rounded-xl border border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-3">
        <div class="flex items-center space-x-2">
          <span class="text-xs font-bold text-slate-300">🎯 设定本轮触发号：</span>
          <div id="triggerNumberSelector" class="flex space-x-1"></div>
        </div>

        <!-- 🎰 开奖控制按钮 -->
        <div>
          <button id="adminRevealBtn" onclick="revealPKWinner()" class="px-4 py-2 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-white font-black text-xs sm:text-sm rounded-xl transition shadow-lg animate-pulse">
            🎰 揭晓本轮开奖
          </button>
        </div>
      </div>

      <!-- 当前盲抽候选买家卡片列表 -->
      <div id="activeGroupCandidatesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3"></div>
    </div>

    <!-- 3. 买家数据导入与轮次切换区 -->
    <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700 space-y-4 shadow">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-700 pb-3">
        <div class="flex items-center space-x-2">
          <span class="text-lg">📥</span>
          <h2 class="text-sm font-bold text-slate-200">买家名单导入与轮次管理</h2>
        </div>
        
        <div class="flex items-center space-x-2">
          <button onclick="createNewRound()" class="px-3 py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-lg transition">
            ➕ 新增一轮
          </button>
          <button onclick="advancePassedToNextRound()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg transition">
            🚀 推进晋级者至下一轮
          </button>
        </div>
      </div>

      <div id="adminRoundTabs" class="flex space-x-2 overflow-x-auto no-scrollbar pb-1"></div>

      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
        <textarea id="importTextarea" rows="2" placeholder="批量粘贴买家名单 (格式：姓名 订单号 或 仅姓名，每行一人)..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100 focus:outline-none focus:border-amber-400"></textarea>
        <button onclick="importCandidatesToCurrentRound()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs rounded-lg transition shadow flex-shrink-0">
          批量导入当前轮
        </button>
      </div>
    </div>

    <!-- 4. 当前轮次参选人员与状态控制区 -->
    <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700 min-h-[300px] shadow">
      <div class="flex justify-between items-center mb-3 border-b border-slate-700 pb-2">
        <div class="flex items-center space-x-2">
          <h3 class="text-xs font-bold text-amber-400">📋 当前轮次买家状态列表</h3>
          <span id="adminCandidateTotalBadge" class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full">共 0 人</span>
        </div>
        <div id="quickBatchActionBox" class="flex space-x-2"></div>
      </div>
      <div id="adminCandidatesListTable" class="overflow-x-auto"></div>
    </div>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBu5yd5-pbO82_g8mgIx-faUzuzd0NaRZQ",
      authDomain: "draw-tournament.firebaseapp.com",
      databaseURL: "https://draw-tournament-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "draw-tournament",
      storageBucket: "draw-tournament.firebasestorage.app",
      messagingSenderId: "803720903757",
      appId: "1:803720903757:web:8b561daabc0d69af9e7004",
      measurementId: "G-X7PJ23JKDB"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    firebase.auth().signInAnonymously().catch(err => console.error("后台登录失败:", err));

    let currentRoundIndex = 0;
    let state = {
      customPublicTitle: '',
      isPublicVisible: true,
      publicAdminActive: false,
      pkStage: 'voting',
      triggerNumber: null,
      activeGroupIds: [],
      modeConfig: { enabled: true, selectedMode: 'mode1', mode2ConsolationCount: 10 },
      rounds: [{ roundName: "第 1 轮", candidates: [] }]
    };

    window.onload = function() {
      db.ref('tournament_state').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          state = val;
          if (currentRoundIndex >= state.rounds.length) {
            currentRoundIndex = Math.max(0, state.rounds.length - 1);
          }
          renderAdminUI();
          updateAdminRevealBtnState(); // 自动监听前台解锁锁盘状态
        }
      });
    };

    // 🔒 按钮权限状态同步函数 (前台解锁时禁用后台按钮)
    function updateAdminRevealBtnState() {
      const revealBtn = document.getElementById('adminRevealBtn');
      if (!revealBtn) return;

      if (state.publicAdminActive) {
        revealBtn.disabled = true;
        revealBtn.className = "px-3.5 py-1.5 bg-slate-700 text-slate-500 font-bold text-xs rounded-lg cursor-not-allowed opacity-60";
        revealBtn.title = "🔒 前台大屏已开启管理员控制，后台开奖已锁定！";
      } else {
        revealBtn.disabled = false;
        revealBtn.className = "px-3.5 py-1.5 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-white font-black text-xs rounded-lg transition shadow-lg animate-pulse";
        revealBtn.title = "点击揭晓开奖";
      }
    }

    // 🎰 揭晓开奖动作函数（带安全拦截）
    function revealPKWinner() {
      const activeGroup4Ids = state.activeGroupIds || [];
      if (!activeGroup4Ids || activeGroup4Ids.length === 0) {
        alert("⚠️ 当前没有盲抽中的买家组！");
        return;
      }

      // 🔒 安全拦截：如果前台大屏已被管理员控制，后台阻止开奖
      if (state.publicAdminActive) {
        alert("🔒 前台大屏已开启管理员控制，后台开奖已被锁定！");
        return;
      }

      if (!state.triggerNumber) {
        alert("⚠️ 请先根据直播间观众投票设定【触发号 #N】后再点击揭晓开奖！");
        return;
      }

      state.pkStage = 'revealed';
      db.ref('tournament_state').set(state);

      // 3.8 秒慢翻牌特效后结算
      setTimeout(() => {
        const winnerId = state.activeGroupIds[state.triggerNumber - 1];
        if (winnerId) {
          passWinnerAndEliminateOthers(winnerId);
        }
      }, 3800);
    }

    function passWinnerAndEliminateOthers(winnerId) {
      const activeRound = state.rounds[currentRoundIndex];
      const winnerIndex = state.activeGroupIds.indexOf(winnerId) + 1;
      const pollLabel = `POLL #${state.currentPollNumber || 1} (#${winnerIndex})`;

      state.activeGroupIds.forEach(id => {
        const target = activeRound.candidates.find(c => c.id === id);
        if (target) {
          if (id === winnerId) {
            target.status = 'pass';
            target.pollLabel = pollLabel;
          } else {
            target.status = 'out';
            target.eliminatedRoundIndex = currentRoundIndex;
          }
        }
      });

      delete state.activeGroupIds;
      state.pkStage = 'voting';
      state.triggerNumber = null;

      db.ref('tournament_state').set(state);
    }

    function setTriggerNumber(num) {
      state.triggerNumber = num;
      state.pkStage = 'triggered';
      db.ref('tournament_state').set(state);
    }

    function generateRandomPKGroup() {
      const activeRound = state.rounds[currentRoundIndex];
      const pendingCandidates = (activeRound.candidates || []).filter(c => c.status === 'pending');

      if (pendingCandidates.length === 0) {
        alert("⚠️ 当前轮次已没有【待PK】的买家！");
        return;
      }

      const count = Math.min(5, pendingCandidates.length);
      const shuffled = [...pendingCandidates].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, count);

      state.activeGroupIds = selected.map(c => c.id);
      state.currentPollNumber = (state.currentPollNumber || 0) + 1;
      state.pkStage = 'voting';
      state.triggerNumber = null;

      db.ref('tournament_state').set(state);
    }

    function renderAdminUI() {
      // 1. 渲染前台大屏可见性按钮
      const visBtn = document.getElementById('publicVisibilityToggleBtn');
      if (visBtn) {
        if (state.isPublicVisible) {
          visBtn.innerText = "🌐 前台大屏: 显示中";
          visBtn.className = "px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition shadow";
        } else {
          visBtn.innerText = "🙈 前台大屏: 已屏蔽(计算中)";
          visBtn.className = "px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg transition shadow";
        }
      }

      // 2. 渲染模式设置
      const modeSelect = document.getElementById('modeSelect');
      const consGroup = document.getElementById('consolationInputGroup');
      const consInput = document.getElementById('consolationCountInput');
      
      if (state.modeConfig) {
        if (modeSelect) modeSelect.value = state.modeConfig.selectedMode || 'mode1';
        if (consInput && state.modeConfig.mode2ConsolationCount) {
          consInput.value = state.modeConfig.mode2ConsolationCount;
        }
        if (consGroup) {
          if (state.modeConfig.selectedMode === 'mode2') consGroup.classList.remove('hidden');
          else consGroup.classList.add('hidden');
        }
      }

      // 3. 渲染自定义标题
      const titleInput = document.getElementById('customTitleInput');
      if (titleInput && state.customPublicTitle !== undefined) {
        titleInput.value = state.customPublicTitle;
      }

      // 4. 渲染触发号选择器
      const selector = document.getElementById('triggerNumberSelector');
      if (selector && state.activeGroupIds) {
        selector.innerHTML = state.activeGroupIds.map((_, idx) => {
          const num = idx + 1;
          const isSel = (state.triggerNumber === num);
          const btnClass = isSel ? "bg-amber-500 text-slate-950 font-black scale-110" : "bg-slate-800 text-slate-300 border border-slate-600";
          return `<button onclick="setTriggerNumber(${num})" class="w-7 h-7 text-xs rounded transition ${btnClass}">#${num}</button>`;
        }).join('');
      }

      // 5. 渲染盲抽 PK 候选卡片
      const groupGrid = document.getElementById('activeGroupCandidatesGrid');
      if (groupGrid) {
        if (state.activeGroupIds && state.activeGroupIds.length > 0) {
          const activeRound = state.rounds[currentRoundIndex];
          const members = (activeRound.candidates || []).filter(c => state.activeGroupIds.includes(c.id));
          groupGrid.innerHTML = members.map((c, idx) => `
            <div class="p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-center shadow">
              <span class="text-[10px] font-black bg-amber-500 text-slate-950 px-2 py-0.5 rounded-full">#${idx + 1}</span>
              <div class="font-bold text-xs text-amber-300 truncate mt-1.5">${escapeHtml(c.name)}</div>
              <div class="text-[10px] text-slate-400 font-mono truncate mt-0.5">${escapeHtml(c.orderNo || '无订单号')}</div>
            </div>
          `).join('');
        } else {
          groupGrid.innerHTML = `<div class="col-span-full text-center py-4 text-xs text-slate-500">点击“随机抽取一组买家”开始操盘</div>`;
        }
      }

      // 6. 渲染轮次 Tabs
      const roundTabs = document.getElementById('adminRoundTabs');
      if (roundTabs) {
        roundTabs.innerHTML = state.rounds.map((r, idx) => {
          const isActive = (idx === currentRoundIndex);
          const cls = isActive ? "bg-amber-500 text-slate-950 font-bold border-amber-400" : "bg-slate-900 text-slate-400 border-slate-700 hover:bg-slate-800";
          return `<button onclick="switchRound(${idx})" class="px-3 py-1.5 rounded-lg text-xs border transition flex-shrink-0 ${cls}">${r.roundName || `第 \${idx+1} 轮`}</button>`;
        }).join('');
      }

      // 7. 渲染买家列表表格
      const table = document.getElementById('adminCandidatesListTable');
      const activeRound = state.rounds[currentRoundIndex] || { candidates: [] };
      const candidates = activeRound.candidates || [];
      document.getElementById('adminCandidateTotalBadge').innerText = `共 ${candidates.length} 人`;

      if (table) {
        if (candidates.length === 0) {
          table.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">当前轮暂无人员数据，请使用文本框批量导入</p>`;
        } else {
          table.innerHTML = `
            <table class="w-full text-left text-xs text-slate-300">
              <thead class="bg-slate-900 text-slate-400 uppercase text-[10px]">
                <tr>
                  <th class="p-2.5">序号</th>
                  <th class="p-2.5">买家姓名</th>
                  <th class="p-2.5">订单号</th>
                  <th class="p-2.5">状态</th>
                  <th class="p-2.5">获奖头衔/标签</th>
                  <th class="p-2.5 text-right">操盘操作</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800">
                ${candidates.map((c, i) => `
                  <tr class="hover:bg-slate-800/60 transition">
                    <td class="p-2.5 font-mono text-slate-500">#\${i+1}</td>
                    <td class="p-2.5 font-bold text-amber-300">\${escapeHtml(c.name)}</td>
                    <td class="p-2.5 font-mono text-slate-400">\${escapeHtml(c.orderNo || '-')}</td>
                    <td class="p-2.5">\${getStatusBadge(c.status)}</td>
                    <td class="p-2.5 font-bold text-emerald-400">\${c.rankTitle ? escapeHtml(c.rankTitle) : '-'}</td>
                    <td class="p-2.5 text-right space-x-1">
                      <button onclick="setCandidateStatus('\${c.id}', 'pass')" class="px-2 py-0.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-[10px]">晋级</button>
                      <button onclick="setCandidateStatus('\${c.id}', 'out')" class="px-2 py-0.5 bg-rose-600 hover:bg-rose-500 text-white rounded text-[10px]">淘汰</button>
                      <button onclick="setCandidateStatus('\${c.id}', 'pending')" class="px-2 py-0.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded text-[10px]">还原</button>
                      <button onclick="deleteCandidate('\${c.id}')" class="px-1.5 py-0.5 bg-slate-800 hover:bg-rose-900 text-rose-400 rounded text-[10px]">删除</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        }
      }
    }

    function switchRound(idx) {
      currentRoundIndex = idx;
      renderAdminUI();
    }

    function createNewRound() {
      const newRoundIndex = state.rounds.length + 1;
      state.rounds.push({
        roundName: `第 ${newRoundIndex} 轮`,
        candidates: []
      });
      currentRoundIndex = state.rounds.length - 1;
      db.ref('tournament_state').set(state);
    }

    function advancePassedToNextRound() {
      const currentRound = state.rounds[currentRoundIndex];
      const passedList = (currentRound.candidates || []).filter(c => c.status === 'pass');

      if (passedList.length === 0) {
        alert("⚠️ 当前轮次没有已晋级的买家！");
        return;
      }

      let targetRoundIndex = currentRoundIndex + 1;
      if (targetRoundIndex >= state.rounds.length) {
        state.rounds.push({
          roundName: `第 ${targetRoundIndex + 1} 轮`,
          candidates: []
        });
      }

      const targetRound = state.rounds[targetRoundIndex];
      if (!targetRound.candidates) targetRound.candidates = [];

      passedList.forEach(c => {
        if (!targetRound.candidates.some(tc => tc.id === c.id)) {
          targetRound.candidates.push({
            id: c.id,
            name: c.name,
            orderNo: c.orderNo,
            status: 'pending'
          });
        }
      });

      currentRoundIndex = targetRoundIndex;
      db.ref('tournament_state').set(state);
      alert(`✅ 已成功将 ${passedList.length} 位晋级买家推进至 第 ${targetRoundIndex + 1} 轮！`);
    }

    function setCandidateStatus(candidateId, status) {
      const activeRound = state.rounds[currentRoundIndex];
      const target = activeRound.candidates.find(c => c.id === candidateId);
      if (target) {
        target.status = status;
        db.ref('tournament_state').set(state);
      }
    }

    function deleteCandidate(candidateId) {
      const activeRound = state.rounds[currentRoundIndex];
      activeRound.candidates = activeRound.candidates.filter(c => c.id !== candidateId);
      db.ref('tournament_state').set(state);
    }

    function togglePublicVisibility() {
      state.isPublicVisible = !state.isPublicVisible;
      db.ref('tournament_state').set(state);
    }

    function saveCustomTitle() {
      const input = document.getElementById('customTitleInput');
      state.customPublicTitle = input.value;
      db.ref('tournament_state').set(state);
      alert("✅ 标题更新成功！");
    }

    function saveModeConfig() {
      const modeSelect = document.getElementById('modeSelect');
      const consInput = document.getElementById('consolationCountInput');

      state.modeConfig = {
        enabled: true,
        selectedMode: modeSelect.value,
        mode2ConsolationCount: parseInt(consInput.value) || 10
      };

      db.ref('tournament_state').set(state);
    }

    function importCandidatesToCurrentRound() {
      const textarea = document.getElementById('importTextarea');
      const text = textarea.value.trim();
      if (!text) return;

      const lines = text.split('\n');
      const activeRound = state.rounds[currentRoundIndex];
      if (!activeRound.candidates) activeRound.candidates = [];

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;
        const parts = trimmed.split(/\s+/);
        const name = parts[0];
        const orderNo = parts[1] || '';

        activeRound.candidates.push({
          id: 'c_' + Math.random().toString(36).substr(2, 9),
          name: name,
          orderNo: orderNo,
          status: 'pending'
        });
      });

      textarea.value = '';
      db.ref('tournament_state').set(state);
    }

    function exportWinnersExcel() {
      let winnersData = [];
      (state.rounds || []).forEach((r, idx) => {
        (r.candidates || []).forEach(c => {
          if (c.rankTitle || c.status === 'pass') {
            winnersData.push({
              "轮次": r.roundName || `第 ${idx+1} 轮`,
              "买家姓名": c.name,
              "订单号": c.orderNo || '无订单号',
              "获胜头衔": c.rankTitle || '已晋级',
              "状态": c.status === 'pass' ? '晋级/胜出' : c.status
            });
          }
        });
      });

      if (winnersData.length === 0) {
        alert("⚠️ 当前暂无获奖或晋级人员名单！");
        return;
      }

      const ws = XLSX.utils.json_to_sheet(winnersData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "获奖名单");
      XLSX.writeFile(wb, `Mochiishop_抽奖获奖名单.xlsx`);
    }

    function resetTournamentData() {
      if (!confirm("⚠️ 确定要彻底重置全场抽奖数据吗？此操作不可撤销！")) return;

      state = {
        customPublicTitle: '',
        isPublicVisible: true,
        publicAdminActive: false,
        pkStage: 'voting',
        triggerNumber: null,
        modeConfig: { enabled: true, selectedMode: 'mode1', mode2ConsolationCount: 10 },
        rounds: [{ roundName: "第 1 轮", candidates: [] }]
      };

      db.ref('tournament_state').set(state);
      alert("✅ 重置成功！");
    }

    function getStatusBadge(status) {
      if (status === 'pass') return `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-1.5 py-0.5 rounded text-[10px]">已晋级</span>`;
      if (status === 'out') return `<span class="bg-rose-500/20 text-rose-400 border border-rose-500/30 px-1.5 py-0.5 rounded text-[10px]">已淘汰</span>`;
      return `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-1.5 py-0.5 rounded text-[10px]">待PK</span>`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
