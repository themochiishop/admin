<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochiishop 每月抽奖 - 直播控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- 顶部 Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🎬</span>
        <div>
          <h1 class="text-xl font-bold text-amber-400" data-i18n="adminTitle">Mochiishop 每月抽奖 - 直播控制台</h1>
          <p class="text-xs text-slate-400" data-i18n="adminSubTitle">香水盲抽 · Shopee直播4人分组PK控盘系统</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-3">
        <!-- ⚙️ 模式显示与齿轮设置按钮 -->
        <div class="flex items-center space-x-2 bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg text-xs shadow-inner">
          <span id="currentModeBadge" class="text-amber-400 font-bold">模式: 冠亚季模式</span>
          <button onclick="openConfigModal()" class="text-slate-400 hover:text-amber-400 transition text-base ml-1" title="设置抽奖模式规则">⚙️</button>
        </div>

        <!-- 🌐 语言切换按钮 -->
        <div class="flex items-center space-x-1 bg-slate-900 border border-slate-700 p-1 rounded-lg">
          <button onclick="setLanguage('zh')" id="langBtn-zh" class="px-2 py-1 text-xs rounded transition flex items-center space-x-1">
            <span>🇨🇳</span> <span class="text-[11px]">ZH</span>
          </button>
          <button onclick="setLanguage('en')" id="langBtn-en" class="px-2 py-1 text-xs rounded transition flex items-center space-x-1">
            <span>🇬🇧</span> <span class="text-[11px]">EN</span>
          </button>
          <button onclick="setLanguage('ms')" id="langBtn-ms" class="px-2 py-1 text-xs rounded transition flex items-center space-x-1">
            <span>🇲🇾</span> <span class="text-[11px]">MS</span>
          </button>
        </div>

        <button onclick="goToPrevRound()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold rounded-lg border border-slate-600 transition shadow" data-i18n="btnPrevRound">
          🔙 返回上一轮
        </button>
        <button id="advanceNextRoundBtn" onclick="createNewRound()" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg transition shadow flex items-center space-x-1">
          <span id="advanceNextRoundBtnText" data-i18n="btnNextRound">⏩ 锁定本轮普及者并推进下一轮</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ⚙️ 抽奖模式与规则配置弹窗 -->
  <div id="configModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-lg w-full shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeConfigModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">✕</button>
      <h3 class="text-lg font-bold text-amber-400 mb-4 flex items-center space-x-2">
        <span>⚙️</span>
        <span>抽奖模式与规则配置</span>
      </h3>

      <div class="space-y-4 text-xs">
        <label class="flex items-center space-x-2 bg-slate-900/80 p-3 rounded-xl border border-amber-500/30 cursor-pointer">
          <input type="checkbox" id="enableModeCheckbox" onchange="toggleModeEnable()" class="w-4 h-4 text-amber-500 rounded focus:ring-0">
          <span class="font-bold text-slate-200">启用模式规则 (必须勾选后方能生效)</span>
        </label>

        <div id="modeRadioGroup" class="space-y-3 opacity-50 pointer-events-none transition-all">
          <label class="flex items-start space-x-2 p-3 rounded-xl border border-slate-700 bg-slate-900/40 hover:bg-slate-900/80 cursor-pointer">
            <input type="radio" name="drawMode" value="mode1" class="mt-0.5">
            <div>
              <div class="font-bold text-amber-300">模式 1：冠亚季排位模式</div>
              <div class="text-[11px] text-slate-400 mt-0.5">剩3人时点击设为【季军】，系统自动弹窗并推进冠亚军决战；余下2人选1为【冠军】，未被选取的自动定位【亚军】。</div>
            </div>
          </label>

          <label class="flex items-start space-x-2 p-3 rounded-xl border border-slate-700 bg-slate-900/40 hover:bg-slate-900/80 cursor-pointer">
            <input type="radio" name="drawMode" value="mode2" class="mt-0.5">
            <div class="flex-1">
              <div class="font-bold text-emerald-300">模式 2：冠亚季 + 安慰奖模式</div>
              <div class="text-[11px] text-slate-400 mt-0.5 mb-1.5">除了冠亚季外，保留 N 名安慰奖名额。</div>
              <div class="flex items-center space-x-2 bg-slate-800/80 p-2 rounded-lg border border-slate-700">
                <span class="text-slate-300">安慰奖名额:</span>
                <input type="number" id="mode2ConsolationCount" value="10" min="1" max="100" class="w-16 bg-slate-900 border border-slate-600 rounded px-2 py-0.5 font-bold text-emerald-400 focus:outline-none focus:border-emerald-400">
                <span class="text-slate-400">人</span>
              </div>
            </div>
          </label>
        </div>
      </div>

      <div class="mt-6 flex justify-end space-x-2 border-t border-slate-700/60 pt-4">
        <button onclick="saveConfigModal()" class="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-xs transition shadow">
          💾 保存设置
        </button>
      </div>
    </div>
  </div>

  <!-- 主体区域 -->
  <main class="max-w-[1600px] mx-auto px-4 py-6 flex-1 w-full">
    <div class="mb-4 flex items-center justify-between border-b border-slate-800 pb-2">
      <div id="roundTabsContainer" class="flex space-x-2 overflow-x-auto"></div>
      <button onclick="resetRounds()" class="text-xs text-rose-400 hover:underline font-bold" data-i18n="btnResetAll">⚠️ 重置所有轮次数据</button>
    </div>

    <!-- 数据概览 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block" data-i18n="statTotal">本轮参选人数</span>
        <span id="statTotalCandidates" class="text-2xl font-black text-blue-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block" data-i18n="statPassed">本轮普及/胜出 (将晋级下一轮)</span>
        <span id="statPassedCount" class="text-2xl font-black text-emerald-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block" data-i18n="statPending">本轮待PK人数</span>
        <span id="statPendingCount" class="text-2xl font-black text-amber-400">0</span>
      </div>
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
        <span class="text-xs text-slate-400 block" data-i18n="statOut">本轮已淘汰人数</span>
        <span id="statOutCount" class="text-2xl font-black text-slate-400">0</span>
      </div>
    </div>

    <!-- 已普及/晋级区 -->
    <div class="mb-6 bg-slate-800/90 p-4 rounded-xl border border-emerald-500/30 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-lg">
      <div class="flex-1 w-full">
        <div class="flex items-center space-x-2 mb-2">
          <span class="text-lg">🏆</span>
          <h2 id="passedTitleText" class="text-md font-bold text-emerald-400">本轮普及/晋级区</h2>
          <span id="passedBadgeCount" class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">0人</span>
        </div>
        <div id="passedListContainer" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto pr-1"></div>
      </div>
    </div>

    <!-- ⚡ Shopee 直播 4 人PK控制操作栏 -->
    <div class="mb-6 bg-slate-800 p-3.5 rounded-xl border border-slate-700 flex flex-col md:flex-row justify-between items-center gap-3">
      <div class="flex items-center space-x-2 w-full md:w-auto">
        <button onclick="pickRandomGroup4()" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-xs rounded-lg shadow-lg flex items-center space-x-1 transition transform active:scale-95">
          <span>🎲</span>
          <span>随机盲抽 4 人组 (对应4支香水)</span>
        </button>
        <button onclick="clearCurrentActiveGroup()" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs rounded-lg transition font-bold">
          清空当前4人组
        </button>
      </div>

      <div class="flex items-center space-x-3 w-full md:w-auto justify-end">
        <div class="text-xs text-slate-400 flex items-center space-x-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
          <span id="syncStatusText">Google Sheets 数据同步已就绪</span>
          <button id="refreshSheetsBtn" onclick="fetchGoogleSheetsData(true)" class="ml-2 px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded transition text-xs shadow">
            🔄 刷新第 1 轮名单
          </button>
        </div>
        <input type="search" id="searchInput" oninput="renderAdminView()" placeholder="🔍 快速查找买家/订单..." class="w-48 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-400">
      </div>
    </div>

    <!-- 当前选中的 4 人 PK 组展示区 -->
    <div id="activeGroupDisplay" class="mb-6 hidden bg-gradient-to-r from-amber-950/40 via-slate-800/80 to-amber-950/40 border-2 border-amber-500/50 rounded-2xl p-4 shadow-xl">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center space-x-2">
          <span class="text-xl">🔥</span>
          <h3 class="text-sm font-bold text-amber-400">当前正在 Shopee 直播间 4 人投票组 (盲抽香水编号 1-4)</h3>
        </div>
        <span class="text-xs text-slate-400">投出1位后点击【⚡ 组内胜出】，系统将自动普及该选手并淘汰同组另外3人</span>
      </div>
      <div id="activeGroupGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3"></div>
    </div>

    <!-- 🌟 特殊轮次高亮提示 Banner -->
    <div id="specialRoundBanner" class="mb-6 hidden bg-gradient-to-r from-amber-500/20 via-amber-500/30 to-amber-500/20 border-2 border-amber-400 rounded-2xl p-4 text-center animate-pulse">
      <h3 id="specialRoundBannerTitle" class="text-base font-black text-amber-300"></h3>
      <p id="specialRoundBannerSub" class="text-xs text-amber-200/90 mt-1"></p>
    </div>

    <!-- 主卡片网格 -->
    <div id="adminViewContainer" class="bg-slate-800/50 rounded-2xl p-6 border border-slate-700 min-h-[400px]"></div>

  </main>

  <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    © Mochiishop Shopee Monthly Event. All rights reserved.
  </footer>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1VSfYPx-lpdSAw8pgebnABW3rlSFK-8t4oxqPPcjKtt0/gviz/tq?tqx=out:csv&gid=322881163";

    let currentLang = localStorage.getItem('mochii_lang') || 'zh';
    let currentRoundIndex = 0;
    let activeGroup4Ids = [];

    let state = {
      modeConfig: { enabled: true, selectedMode: 'mode1', mode2ConsolationCount: 10 },
      rounds: [{ roundName: "第 1 轮", candidates: [] }]
    };

    const i18n = {
      zh: {
        adminTitle: "Mochiishop 每月抽奖 - 直播控制台",
        adminSubTitle: "香水盲抽 · Shopee直播4人分组PK控盘系统",
        btnPrevRound: "🔙 返回上一轮",
        btnNextRound: "⏩ 锁定本轮普及者并推进下一轮",
        btnResetAll: "⚠️ 重置所有轮次数据",
        statTotal: "本轮参选人数",
        statPassed: "本轮普及/胜出",
        statPending: "本轮待PK人数",
        statOut: "本轮已淘汰人数",
        roundPrefix: "第 ",
        roundSuffix: " 轮",
        noPassed: "本轮暂无胜出买家...",
        noPendingList: "本轮选拔已完成！请点击右上角【⏩ 推进下一轮】",
        btnPass: "🏆 普及",
        btnPassThird: "🥉 设为季军",
        btnPassChampion: "👑 设为冠军",
        btnOut: "❌ 淘汰",
        btnUndoOut: "↩️ 撤回淘汰",
        badgeOut: "❌ 已淘汰"
      },
      en: {
        adminTitle: "Mochiishop Monthly Draw - Admin Control",
        adminSubTitle: "Perfume Blind Draw · Shopee Live 4-Buyer Voting",
        btnPrevRound: "🔙 Previous Round",
        btnNextRound: "⏩ Advance Qualified Buyers",
        btnResetAll: "⚠️ Reset All",
        statTotal: "Total Candidates",
        statPassed: "Passed",
        statPending: "In Battle",
        statOut: "Eliminated",
        roundPrefix: "Round ",
        roundSuffix: "",
        noPassed: "No passed buyers yet",
        noPendingList: "Round completed!",
        btnPass: "🏆 Pass",
        btnPassThird: "🥉 Set 3rd Place",
        btnPassChampion: "👑 Set Champion",
        btnOut: "❌ Out",
        btnUndoOut: "↩️ Undo",
        badgeOut: "❌ Out"
      },
      ms: {
        adminTitle: "Mochiishop Cabutan Bulanan - Konsol Kawalan",
        adminSubTitle: "Cabutan Minyak Wangi · Undian 4 Pembeli Shopee Live",
        btnPrevRound: "🔙 Pusingan Sebelum",
        btnNextRound: "⏩ Majukan Calon Layak",
        btnResetAll: "⚠️ Tetap Semula",
        statTotal: "Jumlah Calon",
        statPassed: "Lulus",
        statPending: "Dalam Bersaing",
        statOut: "Tersingkir",
        roundPrefix: "Pusingan ",
        roundSuffix: "",
        noPassed: "Belum ada pembeli layak",
        noPendingList: "Pusingan selesai!",
        btnPass: "🏆 Layak",
        btnPassThird: "🥉 Tempat Ke-3",
        btnPassChampion: "👑 Juara",
        btnOut: "❌ Singkir",
        btnUndoOut: "↩️ Batal Singkir",
        badgeOut: "❌ Tersingkir"
      }
    };

    window.onload = function() {
      setLanguage(currentLang);
      loadState();
      syncModalUIWithState();
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { candidates: [] };
      if (!activeRound.candidates || activeRound.candidates.length === 0) {
        fetchGoogleSheetsData();
      } else {
        renderRoundTabs();
        renderAdminView();
        updateStats();
      }
    };

    function openConfigModal() { document.getElementById('configModal').classList.remove('hidden'); }
    function closeConfigModal() { document.getElementById('configModal').classList.add('hidden'); }

    function toggleModeEnable() {
      const isChecked = document.getElementById('enableModeCheckbox').checked;
      const group = document.getElementById('modeRadioGroup');
      if (isChecked) group.classList.remove('opacity-50', 'pointer-events-none');
      else group.classList.add('opacity-50', 'pointer-events-none');
    }

    function saveConfigModal() {
      const isEnabled = document.getElementById('enableModeCheckbox').checked;
      const radios = document.getElementsByName('drawMode');
      let selected = 'mode1';
      for (let r of radios) { if (r.checked) selected = r.value; }

      const mode2Cons = parseInt(document.getElementById('mode2ConsolationCount').value, 10) || 10;

      if (!state.modeConfig) state.modeConfig = {};
      state.modeConfig.enabled = isEnabled;
      state.modeConfig.selectedMode = selected;
      state.modeConfig.mode2ConsolationCount = mode2Cons;

      saveState();
      updateModeBadgeUI();
      closeConfigModal();
      alert("⚙️ 模式与规则已成功更新！");
    }

    function syncModalUIWithState() {
      if (!state.modeConfig) state.modeConfig = { enabled: true, selectedMode: 'mode1', mode2ConsolationCount: 10 };
      document.getElementById('enableModeCheckbox').checked = state.modeConfig.enabled !== false;
      toggleModeEnable();

      const radios = document.getElementsByName('drawMode');
      for (let r of radios) {
        if (r.value === (state.modeConfig.selectedMode || 'mode1')) r.checked = true;
      }
      document.getElementById('mode2ConsolationCount').value = state.modeConfig.mode2ConsolationCount || 10;
      updateModeBadgeUI();
    }

    function updateModeBadgeUI() {
      const badge = document.getElementById('currentModeBadge');
      if (!badge) return;
      if (!state.modeConfig || !state.modeConfig.enabled) {
        badge.innerText = "模式: 未启用规则";
        badge.className = "text-slate-400 font-bold";
        return;
      }
      const m = state.modeConfig.selectedMode;
      if (m === 'mode1') badge.innerText = "模式: 冠亚季模式";
      else if (m === 'mode2') badge.innerText = `模式: 安慰奖模式(${state.modeConfig.mode2ConsolationCount || 10}名安慰奖)`;
      badge.className = "text-amber-400 font-bold";
    }

    function pickRandomGroup4() {
      const activeRound = state.rounds[currentRoundIndex];
      const pendingList = (activeRound.candidates || []).filter(c => c.status === 'pending');

      if (pendingList.length === 0) {
        alert("⚠️ 当前没有待 PK 的买家！");
        return;
      }

      const shuffled = [...pendingList].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, Math.min(4, shuffled.length));
      activeGroup4Ids = selected.map(c => c.id);

      state.activeGroupIds = activeGroup4Ids;
      saveState();
      renderActiveGroupUI();
      renderAdminView();
    }

    function clearCurrentActiveGroup() {
      activeGroup4Ids = [];
      delete state.activeGroupIds;
      saveState();
      document.getElementById('activeGroupDisplay').classList.add('hidden');
      renderAdminView();
    }

    function passWinnerAndEliminateOthers(winnerId) {
      const activeRound = state.rounds[currentRoundIndex];
      
      activeGroup4Ids.forEach(id => {
        const target = activeRound.candidates.find(c => c.id === id);
        if (target) {
          if (id === winnerId) {
            target.status = 'pass';
          } else {
            target.status = 'out';
          }
        }
      });

      activeGroup4Ids = [];
      delete state.activeGroupIds;
      
      changeStatus(winnerId, 'pass');
      saveState();
      renderActiveGroupUI();
    }

    function renderActiveGroupUI() {
      const displayContainer = document.getElementById('activeGroupDisplay');
      const grid = document.getElementById('activeGroupGrid');
      
      if (!activeGroup4Ids || activeGroup4Ids.length === 0) {
        displayContainer.classList.add('hidden');
        return;
      }

      displayContainer.classList.remove('hidden');
      const activeRound = state.rounds[currentRoundIndex];
      const groupMembers = (activeRound.candidates || []).filter(c => activeGroup4Ids.includes(c.id));

      grid.innerHTML = groupMembers.map((c, idx) => {
        return `<div class="bg-slate-900/90 border border-amber-500/40 rounded-xl p-3 flex flex-col justify-between shadow">
          <div>
            <div class="flex justify-between items-center mb-1">
              <span class="text-[10px] font-black bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded">香水 #${idx + 1}</span>
              <span class="text-[10px] font-mono text-slate-400">ID: ${c.id.toString().slice(-4)}</span>
            </div>
            <div class="font-bold text-amber-300 text-sm truncate">${escapeHtml(c.name)}</div>
            <div class="text-[11px] text-slate-400 font-mono truncate">${escapeHtml(c.orderNo || '无订单号')}</div>
          </div>
          <button onclick="passWinnerAndEliminateOthers(${c.id})" class="mt-3 w-full py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg transition shadow">
            ⚡ 投票胜出 (普及选他)
          </button>
        </div>`;
      }).join('');
    }

    // 🌟 核心排位状态变更与模式 1 自动化流程处理
    function changeStatus(id, newStatus) {
      const activeRound = state.rounds[currentRoundIndex];
      const target = activeRound.candidates.find(c => c.id === id);
      if (!target) return;

      target.status = newStatus;

      const isModeEnabled = state.modeConfig && state.modeConfig.enabled;
      const selectedMode = state.modeConfig ? state.modeConfig.selectedMode : 'mode1';

      if (isModeEnabled && selectedMode === 'mode1') {
        const totalCandidates = activeRound.candidates;
        const pendingCandidates = totalCandidates.filter(c => c.status === 'pending');

        // 🌟 逻辑 1：名单池仅剩 3 人时，点击的人锁定为【季军】，推送前台弹窗并【自动推进冠亚军决战】
        if (totalCandidates.length === 3 && newStatus === 'pass') {
          target.rankTitle = "🥉 季军";

          // 余下 2 位未被选取的买家
          const remainingTwo = totalCandidates.filter(c => c.id !== target.id);

          // 向前台推送 🥉 季军弹窗通知 (10秒自动关闭)
          state.latestEvent = {
            type: 'finalCongrat',
            timestamp: Date.now(),
            winnerNames: `🥉 季军得主: ${target.name}`
          };

          // 自动推进至最后一轮：👑 冠亚军决战轮 (2人)
          const finalRoundCandidates = remainingTwo.map((c, idx) => ({
            id: Date.now() + idx,
            name: c.name,
            orderNo: c.orderNo,
            status: 'pending'
          }));

          const stageLabel = "👑 冠亚军终极决战 (2选1)";
          state.rounds.push({
            roundName: stageLabel,
            stageName: stageLabel,
            candidates: finalRoundCandidates
          });

          currentRoundIndex = state.rounds.length - 1;
          saveState();
          renderRoundTabs();
          alert(`🥉 恭喜买家【${target.name}】获得 🥉 季军！\n\n前台已同步播放 10 秒恭喜海报，系统已自动为你推进至【👑 冠亚军终极决战】！`);
          return;
        }

        // 🌟 逻辑 2：冠亚军决战轮（仅剩 2 人），点击选中的为【冠军】，未被点击的自动定为【亚军】
        if (totalCandidates.length === 2 && newStatus === 'pass') {
          target.rankTitle = "👑 冠军";
          
          const runnerUpObj = totalCandidates.find(c => c.id !== target.id);
          let runnerUpName = "未知买家";
          if (runnerUpObj) {
            runnerUpObj.status = 'pass';
            runnerUpObj.rankTitle = "🥈 亚军";
            runnerUpName = runnerUpObj.name;
          }

          // 向前台推送冠亚军弹窗通知 (10秒自动关闭)
          state.latestEvent = {
            type: 'finalCongrat',
            timestamp: Date.now(),
            winnerNames: `👑 冠军: ${target.name}  |  🥈 亚军: ${runnerUpName}`
          };

          saveState();
          alert(`👑 🎉【终极冠亚军诞生】！\n\n👑 冠军：${target.name}\n🥈 亚军：${runnerUpName}\n\n前台公开大屏已同步向全场播放恭喜海报（10秒后自动关闭切回大屏）！`);
          return;
        }
      }

      saveState();
    }

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('mochii_lang', lang);

      ['zh', 'en', 'ms'].forEach(l => {
        const btn = document.getElementById(`langBtn-${l}`);
        if (btn) btn.className = (l === lang) ? "px-2 py-1 text-xs rounded transition flex items-center space-x-1 bg-amber-500 text-slate-950 font-bold" : "px-2 py-1 text-xs rounded transition flex items-center space-x-1 text-slate-400 hover:text-slate-100";
      });

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key] !== undefined) el.innerText = i18n[lang][key];
      });

      renderRoundTabs();
      renderAdminView();
      updateStats();
    }

    function getRoundTitle(idx) {
      const r = state.rounds[idx];
      if (r && r.stageName) return r.stageName;
      return `${i18n[currentLang].roundPrefix}${idx + 1}${i18n[currentLang].roundSuffix}`;
    }

    function fetchGoogleSheetsData(isManual) {
      if (currentRoundIndex !== 0) { alert("仅限在第 1 轮刷新表格数据！"); return; }
      fetch(SHEET_CSV_URL)
        .then(response => response.text())
        .then(csvText => {
          parseCSVToFirstRound(csvText);
          if (isManual) alert("✅ 已成功从 Google Sheets 同步名单！");
        });
    }

    function parseCSVToFirstRound(csvText) {
      const lines = csvText.split('\n');
      const candidates = [];
      lines.forEach((line, idx) => {
        if (!line.trim()) return;
        const parts = line.replace(/"/g, '').split(',');
        if (parts[0] && parts[0].trim() !== '买家姓名' && parts[0].trim() !== 'Name') {
          candidates.push({ id: Date.now() + idx, name: parts[0].trim(), orderNo: parts[1] ? parts[1].trim() : '', status: 'pending' });
        }
      });
      state.rounds[0].candidates = candidates;
      saveState();
      renderRoundTabs();
    }

    function goToPrevRound() {
      if (currentRoundIndex === 0) return;
      if (confirm("确认返回上一轮？")) {
        if (currentRoundIndex === state.rounds.length - 1 && state.rounds.length > 1) state.rounds.pop();
        currentRoundIndex = Math.max(0, currentRoundIndex - 1);
        saveState();
        renderRoundTabs();
      }
    }

    function createNewRound() {
      const currentRound = state.rounds[currentRoundIndex];
      const passedCandidates = (currentRound.candidates || []).filter(c => c.status === 'pass');
      const totalCandidates = currentRound.candidates || [];

      if (passedCandidates.length === 0) {
        alert("⚠️ 请先选出普及/胜出的买家，才能推进开启下一轮！");
        return;
      }

      if (passedCandidates.length === totalCandidates.length) {
        alert("⚠️ 全员都是普及，无人被淘汰！请确认是否有落选的买家。");
        return;
      }

      currentRound.candidates.forEach(c => {
        if (c.status !== 'pass') c.status = 'out';
      });

      const nextRoundNumber = state.rounds.length + 1;
      const nextRoundCandidates = passedCandidates.map((c, idx) => ({
        id: Date.now() + idx,
        name: c.name,
        orderNo: c.orderNo,
        status: 'pending'
      }));

      const stageLabel = `第 ${nextRoundNumber} 轮 (${passedCandidates.length}人角逐)`;

      state.rounds.push({
        roundName: stageLabel,
        stageName: stageLabel,
        candidates: nextRoundCandidates
      });

      currentRoundIndex = state.rounds.length - 1;
      activeGroup4Ids = [];
      delete state.activeGroupIds;

      saveState();
      renderRoundTabs();
      alert(`🎉 成功开启【${stageLabel}】！只保留普及成功的 ${passedCandidates.length} 名买家进入下一轮 PK。`);
    }

    function renderRoundTabs() {
      const container = document.getElementById('roundTabsContainer');
      if (!container) return;
      container.innerHTML = state.rounds.map((r, idx) => {
        const activeClass = (idx === currentRoundIndex) ? "bg-amber-500 text-slate-950 font-bold border-amber-400" : "bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700";
        return `<button onclick="switchRound(${idx})" class="px-4 py-1.5 rounded-lg text-xs border transition ${activeClass}">${escapeHtml(getRoundTitle(idx))}</button>`;
      }).join('');
    }

    function switchRound(idx) { currentRoundIndex = idx; renderRoundTabs(); renderAdminView(); updateStats(); }

    function loadState() {
      const saved = localStorage.getItem('mochii_tournament_state');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.rounds)) {
            state = parsed;
            if (state.activeGroupIds) activeGroup4Ids = state.activeGroupIds;
          }
        } catch(e){}
      }
    }

    function saveState() {
      localStorage.setItem('mochii_tournament_state', JSON.stringify(state));
      updateStats();
      renderAdminView();
    }

    function updateStats() {
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { candidates: [] };
      const candidates = activeRound.candidates || [];

      document.getElementById('statTotalCandidates').innerText = candidates.length;
      document.getElementById('statPassedCount').innerText = candidates.filter(c => c.status === 'pass').length;
      document.getElementById('statPendingCount').innerText = candidates.filter(c => c.status === 'pending').length;
      document.getElementById('statOutCount').innerText = candidates.filter(c => c.status === 'out').length;
    }

    function renderAdminView() {
      renderActiveGroupUI();
      const activeRound = (state.rounds && state.rounds[currentRoundIndex]) ? state.rounds[currentRoundIndex] : { candidates: [] };
      const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();

      let list = (activeRound.candidates || []).filter(c => (c.name || '').toLowerCase().includes(search) || (c.orderNo || '').toLowerCase().includes(search));

      // 判断模式1特殊人数场景
      const isModeEnabled = state.modeConfig && state.modeConfig.enabled;
      const selectedMode = state.modeConfig ? state.modeConfig.selectedMode : 'mode1';
      const isMode1ThreeLeft = isModeEnabled && selectedMode === 'mode1' && activeRound.candidates.length === 3;
      const isMode1TwoLeft = isModeEnabled && selectedMode === 'mode1' && activeRound.candidates.length === 2;

      // 特殊 Banner 提示
      const banner = document.getElementById('specialRoundBanner');
      const bannerTitle = document.getElementById('specialRoundBannerTitle');
      const bannerSub = document.getElementById('specialRoundBannerSub');

      if (isMode1ThreeLeft) {
        banner.classList.remove('hidden');
        bannerTitle.innerText = "🔥 当前本轮仅剩 3 人角逐！请点击下方【🥉 设为季军】按钮选择季军得主";
        bannerSub.innerText = "选出季军后，系统将自动向大屏推送 10 秒海报，并自动将余下 2 人推进至【👑 冠亚军决战】！";
      } else if (isMode1TwoLeft) {
        banner.classList.remove('hidden');
        bannerTitle.innerText = "👑【冠亚军终极决战 (2选1)】！请点击选出冠军";
        bannerSub.innerText = "点击选择的一位将自动定为【👑 冠军】，未被选择的一位自动定为【🥈 亚军】，并同步推送大屏喜报！";
      } else {
        banner.classList.add('hidden');
      }

      const passedContainer = document.getElementById('passedListContainer');
      const passedList = list.filter(c => c.status === 'pass');

      if (passedList.length === 0) {
        passedContainer.innerHTML = `<span class="text-xs text-slate-500 italic">${i18n[currentLang].noPassed}</span>`;
      } else {
        passedContainer.innerHTML = passedList.map(c => {
          const rankText = c.rankTitle ? `<span class="bg-amber-500 text-slate-950 font-black px-1.5 py-0.5 rounded text-[10px]">${c.rankTitle}</span>` : '';
          return '<div class="px-3 py-1.5 bg-emerald-950/70 border border-emerald-500/50 rounded-lg flex items-center space-x-2 text-xs shadow-sm">' +
            rankText +
            '<span class="font-bold text-emerald-300">' + escapeHtml(c.name) + '</span>' +
            '<span class="text-slate-400 font-mono text-[11px]">' + escapeHtml(c.orderNo || '无订单号') + '</span>' +
            '<button onclick="changeStatus(' + c.id + ', \'pending\')" class="ml-1 text-emerald-400 hover:text-rose-400 font-bold px-1 rounded">✕</button>' +
          '</div>';
        }).join('');
      }

      const container = document.getElementById('adminViewContainer');
      const pendingList = list.filter(c => c.status === 'pending' || c.status === 'out');

      if (pendingList.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-500"><p class="text-2xl mb-2">🎉</p><p>${i18n[currentLang].noPendingList}</p></div>`;
        return;
      }

      const cardsHtml = pendingList.map((c, index) => {
        let borderStyle = 'border-slate-700 bg-slate-800';
        let statusBadge = '';
        let btnOutHtml = '';

        if (activeGroup4Ids.includes(c.id)) {
          borderStyle = 'border-amber-400/80 bg-amber-950/30 ring-2 ring-amber-500/50';
          statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] bg-amber-500 text-slate-950 font-black">🔥 在PK组</span>`;
        }

        if (c.status === 'out') {
          borderStyle = 'border-slate-800 bg-slate-900/60 opacity-60';
          statusBadge = `<span class="px-2 py-0.5 rounded text-xs bg-slate-700 text-slate-400 font-bold">${i18n[currentLang].badgeOut}</span>`;
          btnOutHtml = `<button onclick="changeStatus(${c.id}, 'pending')" class="flex-1 py-1.5 text-xs rounded bg-amber-600 hover:bg-amber-500 text-white font-bold">${i18n[currentLang].btnUndoOut}</button>`;
        } else {
          btnOutHtml = `<button onclick="changeStatus(${c.id}, 'out')" class="px-3 py-1.5 text-xs rounded bg-slate-700 text-slate-400 hover:bg-rose-600 hover:text-white font-bold">${i18n[currentLang].btnOut}</button>`;
        }

        // 🌟 动态计算普及按钮文本与样式
        let passBtnLabel = i18n[currentLang].btnPass;
        let passBtnClass = "bg-slate-700 text-emerald-400 hover:bg-emerald-600 hover:text-white";

        if (isMode1ThreeLeft) {
          passBtnLabel = i18n[currentLang].btnPassThird;
          passBtnClass = "bg-amber-500 text-slate-950 font-black hover:bg-amber-400 animate-bounce";
        } else if (isMode1TwoLeft) {
          passBtnLabel = i18n[currentLang].btnPassChampion;
          passBtnClass = "bg-emerald-500 text-slate-950 font-black hover:bg-emerald-400 animate-pulse";
        }

        return '<div class="p-4 rounded-xl border ' + borderStyle + ' flex flex-col justify-between shadow transition">' +
          '<div>' +
            '<div class="flex justify-between items-start mb-2"><span class="text-xs font-mono text-slate-400">#' + (index + 1) + '</span>' + statusBadge + '</div>' +
            '<div class="font-bold text-slate-100 text-base truncate">' + escapeHtml(c.name) + '</div>' +
            '<div class="text-xs text-amber-400/80 font-mono mt-0.5 truncate">' + escapeHtml(c.orderNo || '无订单号') + '</div>' +
          '</div>' +
          '<div class="mt-4 pt-3 border-t border-slate-700/60 flex space-x-2">' +
            (c.status !== 'out' ? `<button onclick="changeStatus(${c.id}, 'pass')" class="flex-1 py-1.5 text-xs rounded font-bold transition ${passBtnClass}">${passBtnLabel}</button>` : '') +
            btnOutHtml +
          '</div>' +
        '</div>';
      }).join('');

      container.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">' + cardsHtml + '</div>';
    }

    function resetRounds() {
      if (confirm("确认重置所有数据？")) {
        currentRoundIndex = 0;
        state.rounds = [{ roundName: "第 1 轮", candidates: [] }];
        activeGroup4Ids = [];
        delete state.activeGroupIds;
        delete state.latestEvent;
        saveState();
        fetchGoogleSheetsData(true);
      }
    }

    function escapeHtml(str) { return str ? String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
  </script>
</body>
</html>
