<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 🔐 权限检查：没登录或没有「draw.claims」权限会跳回控制台 -->
  <script type="module">import { guard } from "/js/admin-guard.js"; guard("draw.claims").then(a => {
    // 🗑 删除整场清单：只有店主看得到
    window.__isShopOwner = !!a.owner;
    const b = document.getElementById("deleteBatchBtn");
    if (b && a.owner) b.classList.remove("hidden");
  });</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎁 领奖追踪 - Mochiishop</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../logo.png">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .chk { width: 22px; height: 22px; cursor: pointer; accent-color: #0ea5e9; }
    .item-done { opacity: .55; }
    .tag-T { background: #334155; color: #f1f5f9; }
    .tag-S { background: #ea580c; color: #fff; }
    .club { background: #831843; color: #fbcfe8; border: 1px solid #db2777; }
    .club-done { background: #064e3b; color: #a7f3d0; border: 1px solid #10b981; }
    .club-off { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- 登录 -->
  <div id="gate" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-6">
    <div class="w-full max-w-sm text-center">
      <div class="text-5xl mb-3">🎁</div>
      <h1 class="text-lg font-bold text-sky-300 mb-1">领奖追踪</h1>
      <p id="gateMsg" class="text-xs text-slate-400 mb-6">正在检查登录状态…</p>
      <button id="gateLogin" onclick="login()" class="hidden w-full py-3 bg-white hover:bg-slate-100 text-slate-900 font-bold rounded-md">🔐 使用 Google 登录</button>
      <button id="gateSwitch" onclick="firebase.auth().signOut()" class="hidden w-full mt-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-bold rounded-md">切换账号</button>
    </div>
  </div>

  <header class="sticky top-0 z-30 bg-slate-800/95 backdrop-blur border-b border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-x-3 gap-y-2">
      <a href="../" class="text-slate-400 hover:text-white text-sm" title="回到控制台首页">←</a>
      <h1 class="text-base sm:text-lg font-bold text-sky-300">🎁 领奖追踪</h1>
      <select id="batchSel" onchange="selectBatch(this.value)" class="bg-slate-900 border border-slate-600 rounded px-2 py-1.5 text-sm text-slate-100 max-w-[220px]"></select>
      <div class="flex items-center gap-2 ml-auto">
        <label class="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer select-none"><input type="checkbox" id="onlyTodo" onchange="render()" class="w-4 h-4"> 只看未寄出</label>
        <button onclick="downloadCSV()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded">⬇️ CSV</button>
        <button id="userBtn" onclick="if (confirm('确认退出登录？')) firebase.auth().signOut()" class="px-2 py-1.5 bg-slate-900 border border-slate-700 text-[10px] text-slate-400 rounded max-w-[150px] truncate" title="点击退出登录"></button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-4">
    <div id="summary" class="flex flex-wrap gap-2 mb-4"></div>
    <div id="clubHint" class="hidden mb-4 rounded-lg border border-pink-800 bg-pink-950/40 px-3 py-2 text-xs text-pink-200"></div>
    <!-- 🎁 小礼物：这一期没得奖的买家（下面最后一个 module 脚本负责） -->
    <div id="sgPanel" class="hidden mb-4"></div>
    <div id="list"></div>
    <div id="footerTools" class="hidden mt-8 pt-4 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500">
      <span>勾选和备注会自动保存（离开输入框即保存），只有后台账号看得到。</span>
      <button id="deleteBatchBtn" onclick="deleteBatch()" class="hidden px-2.5 py-1 border border-rose-500/40 text-rose-300 hover:bg-rose-600 hover:text-white rounded">🗑 删除这一场的清单</button>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBu5yd5-pbO82_g8mgIx-faUzuzd0NaRZQ",
      authDomain: "draw-tournament.firebaseapp.com",
      databaseURL: "https://draw-tournament-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "draw-tournament",
      storageBucket: "draw-tournament.firebasestorage.app",
      messagingSenderId: "803720903757",
      appId: "1:803720903757:web:8b561daabc0d69af9e7004"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    // 店主 + 「👥 管理员」页面勾了「领奖追踪」的人（名单在 draw_staff，由管理员页面同步）
    const DRAW_OWNER_EMAIL = 'mail@themochiishop.com';
    const drawStaffKey = e => String(e || '').toLowerCase().replace(/\./g, ',');
    const BATCHES = 'draw_private/claimBatches';
    let batches = {}, curId = null, started = false;

    const $ = id => document.getElementById(id);
    const esc = x => String(x == null ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    async function isAllowed(u) {
      if (!(u && !u.isAnonymous && (u.providerData || []).some(p => p && p.providerId === 'google.com'))) return false;
      if (String(u.email || '').toLowerCase() === DRAW_OWNER_EMAIL) return true;
      try { const v = (await db.ref('draw_staff/' + drawStaffKey(u.email)).once('value')).val(); return !!(v && v.claims === true); }
      catch (e) { return false; }
    }
    const platformOf = o => { const c = String(o || '').trim().charAt(0); return c === '5' ? 'T' : c === '2' ? 'S' : ''; };

    // 🎫 会员俱乐部「🏆 中奖奖品」的进度（下面的 module 脚本读取后放进 window.clubPrizes：订单号 → { status, id }）
    const CLUB_ST = { unclaimed: '待领取', claimed: '待审核', approved: '待发货', shipped: '已发货', completed: '已完成', cancelled: '已取消' };
    const normNo = o => String(o || '').replace(/\s/g, '').toUpperCase();
    const clubOf = x => (window.clubPrizes || {})[normNo(x.orderNo)] || null;
    const clubDone = x => { const c = clubOf(x); return !!c && (c.status === 'shipped' || c.status === 'completed'); };
    const isDone = x => !!x.shipped || clubDone(x);   // 自己勾「已寄出」，或俱乐部那边已发货 = 已寄出
    // 🚫 作废（失联、逾期等）：不算进得主人数和未寄出，控制台提醒也不再算；记录保留，可以恢复
    const VOID_REASONS = { expired: '⏰ 兑换已逾期', lost: '📵 联系不上', other: '✏️ 其他原因' };
    const isVoid = x => !!x.voided;
    const voidText = x => x.voidReason === 'other' ? (x.voidNote || '其他原因') : (VOID_REASONS[x.voidReason] || '已作废').replace(/^\S+\s/, '');
    window.onClubPrizes = () => { fillSelect(); render(); };

    // 分组：C = 安慰奖（右边）　T = 冠亚季（左上）　F = 入围和其他（左下）
    const grpOf = x => {
      const r = String(x.rank || '');
      if (/安慰/.test(r)) return 'C';
      if (/入围/.test(r)) return 'F';
      if (/冠|亚|季|🥇|🥈|🥉|第\s*[1-3一二三]\s*名/.test(r)) return 'T';
      return 'F';
    };

    function login() {
      const p = new firebase.auth.GoogleAuthProvider();
      p.setCustomParameters({ prompt: 'select_account' });
      firebase.auth().signInWithPopup(p).catch(e => {
        if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') return firebase.auth().signInWithRedirect(p);
        if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
        alert('❌ 登录失败：' + (e.code || e.message));
      });
    }
    firebase.auth().onAuthStateChanged(async u => {
      const ok = await isAllowed(u);
      $('gate').classList.toggle('hidden', ok);
      $('gateLogin').classList.toggle('hidden', !!u);
      $('gateSwitch').classList.toggle('hidden', !(u && !ok));
      $('gateMsg').textContent = !u ? '请用后台 Google 账号登录' : ok ? '' : `账号 ${u.email || ''} 没有权限，请切换账号`;
      if (!ok) return;
      $('userBtn').textContent = '👤 ' + (u.email || '');
      if (started) return;
      started = true;
      db.ref(BATCHES).on('value', snap => { batches = snap.val() || {}; fillSelect(); render(); },
        e => { $('list').innerHTML = `<p class="text-rose-300 py-8 text-center">❌ 读取失败：${esc(e.code || e.message)}<br><span class="text-xs text-slate-400">请确认 Firebase 规则已加入 draw_private。</span></p>`; });
    });

    function itemsOf(id) {
      const b = batches[id] || {};
      return Object.entries(b.items || {}).map(([key, v]) => ({ key, ...v })).sort((a, b) => (a.sort ?? 999) - (b.sort ?? 999));
    }
    function stats(id) {
      const all = itemsOf(id).filter(x => !x.removed), it = all.filter(x => !isVoid(x));
      return { total: it.length, contacted: it.filter(x => x.contacted || clubOf(x)).length, shipped: it.filter(isDone).length, voided: all.length - it.length };
    }
    function batchName(id) {
      const b = batches[id] || {};
      // 同一个月有两场以上时，加上日期时间区分
      const dup = Object.keys(batches).some(k => k !== id && (batches[k] || {}).label === b.label);
      const d = new Date(b.createdAt || 0), p = n => String(n).padStart(2, '0');
      return (b.label || id) + (dup && b.createdAt ? ` ${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}` : '') + (b.title ? ` · ${b.title}` : '');
    }
    function fillSelect() {
      const ids = Object.keys(batches).sort((a, b) => (((batches[b] || {}).month || '') + b).localeCompare(((batches[a] || {}).month || '') + a));   // 月份新的在前
      if (!ids.length) { $('batchSel').innerHTML = '<option>还没有清单</option>'; curId = null; return; }
      if (!curId || !batches[curId]) {
        const want = new URLSearchParams(location.search).get('id');
        curId = (want && batches[want]) ? want : (ids.find(id => { const s = stats(id); return s.shipped < s.total; }) || ids[0]);
      }
      $('batchSel').innerHTML = ids.map(id => {
        const s = stats(id), left = s.total - s.shipped;
        return `<option value="${esc(id)}" ${id === curId ? 'selected' : ''}>${esc(batchName(id))}${left ? `（${left} 位未寄出）` : '（✅ 全部寄出）'}</option>`;
      }).join('');
    }
    function selectBatch(id) { curId = id; render(); }

    // 单个得主的一张卡
    function card(x) {
      const p = platformOf(x.orderNo), c = clubOf(x), cd = clubDone(x);
      const clubTag = c ? `<a href="../member-system/prizes.html" target="_blank" class="text-[10px] px-1.5 py-0.5 rounded ${cd ? 'club-done' : c.status === 'cancelled' ? 'club-off' : 'club'}" title="在会员系统「🏆 中奖奖品」处理">🎫 俱乐部：${esc(CLUB_ST[c.status] || c.status)}</a>` : '';
      if (isVoid(x)) return `<div class="rounded-lg border border-slate-700 bg-slate-900/60 p-3 item-done">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
          <span class="text-amber-300 font-bold text-sm whitespace-nowrap">${esc(x.rank || '')}</span>
          <span class="font-bold text-slate-300 line-through">${esc(x.name || '')}</span>
          <span class="font-mono text-xs text-slate-400 break-all">${esc(x.orderNo || '-')}</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-700 text-slate-200">🚫 已作废：${esc(voidText(x))}</span>
          ${clubTag}
          <button data-k="${esc(x.key)}" onclick="unvoidItem(this.dataset.k)" class="ml-auto px-2 py-1 bg-slate-700 hover:bg-slate-600 text-xs rounded">↩️ 恢复</button>
        </div>
        ${x.note ? `<div class="mt-1 text-xs text-slate-400">备注：${esc(x.note)}</div>` : ''}
      </div>`;
      return `<div class="rounded-lg border ${x.removed ? 'border-rose-800 bg-rose-950/30' : 'border-slate-700 bg-slate-800/70'} p-3 ${isDone(x) ? 'item-done' : ''}">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
          <span class="text-amber-300 font-bold text-sm whitespace-nowrap">${esc(x.rank || '')}</span>
          <span class="font-bold text-slate-100">${esc(x.name || '')}</span>
          <span class="font-mono text-xs text-slate-300 break-all">${esc(x.orderNo || '-')}</span>
          ${p ? `<span class="text-[10px] px-1.5 py-0.5 rounded tag-${p}">${p === 'T' ? 'TikTok' : 'Shopee'}</span>` : ''}
          ${x.removed ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-rose-700 text-white">名次已撤销</span>' : ''}
          ${clubTag}
        </div>
        <div class="mt-2 flex flex-wrap items-center gap-x-4 gap-y-2">
          <label class="flex items-center gap-1.5 text-sm cursor-pointer select-none"><input type="checkbox" class="chk" data-k="${esc(x.key)}" ${x.contacted ? 'checked' : ''} onchange="setItem(this.dataset.k, 'contacted', this.checked)"> 已联系</label>
          ${cd && !x.shipped ? '<span class="text-sm text-emerald-300">✅ 已寄出（俱乐部）</span>' : `<label class="flex items-center gap-1.5 text-sm cursor-pointer select-none"><input type="checkbox" class="chk" data-k="${esc(x.key)}" ${x.shipped ? 'checked' : ''} onchange="setItem(this.dataset.k, 'shipped', this.checked)"> 已寄出</label>`}
          <input type="text" data-k="${esc(x.key)}" value="${esc(x.note || '')}" placeholder="备注：已私讯 / 运单号…" onchange="setItem(this.dataset.k, 'note', this.value.trim())"
            class="flex-1 min-w-[160px] bg-slate-900 border border-slate-600 rounded px-2.5 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-sky-400">
          ${isDone(x) ? '' : `<select data-k="${esc(x.key)}" onchange="voidItem(this.dataset.k, this.value); this.value = ''" title="得主失联、超过领奖期限等，作废后不再算未寄出"
            class="bg-slate-900 border border-slate-600 rounded px-2 py-1.5 text-xs text-slate-300">
            <option value="">🚫 作废…</option>${Object.entries(VOID_REASONS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>`}
        </div>
        ${c && c.status === 'cancelled' ? '<div class="mt-1 text-xs text-slate-400">💡 俱乐部那边已取消这个奖品，确定不寄的话可以按「🚫 作废」</div>' : ''}
      </div>`;
    }

    function render() {
      const list = $('list');
      const a = document.activeElement;
      if (a && list.contains(a) && a.type === 'text') return;            // 正在输入备注时先不刷新
      if (window.onBatchRender) window.onBatchRender();                  // 🎁 小礼物区块跟着换场次
      if (!curId || !batches[curId]) {
        $('summary').innerHTML = '';
        $('footerTools').classList.add('hidden');
        list.innerHTML = `<div class="text-center text-slate-500 py-16"><div class="text-4xl mb-2">🎁</div><p class="text-sm">还没有领奖清单</p><p class="text-xs mt-1">每月抽奖比赛结束后，得主会自动出现在这里。</p></div>`;
        return;
      }
      const s = stats(curId);
      $('summary').innerHTML = `
        <span class="px-3 py-1.5 rounded bg-slate-800 border border-slate-700 text-xs">共 <b>${s.total}</b> 位得主</span>
        <span class="px-3 py-1.5 rounded bg-sky-950 border border-sky-700 text-xs text-sky-200">已联系 <b>${s.contacted}/${s.total}</b></span>
        <span class="px-3 py-1.5 rounded bg-emerald-950 border border-emerald-700 text-xs text-emerald-200">已寄出 <b>${s.shipped}/${s.total}</b></span>
        ${s.voided ? `<span class="px-3 py-1.5 rounded bg-slate-800 border border-slate-700 text-xs text-slate-300">🚫 已作废 <b>${s.voided}</b></span>` : ''}
        ${s.total - s.shipped ? `<span class="px-3 py-1.5 rounded bg-rose-950 border border-rose-700 text-xs text-rose-200">还有 <b>${s.total - s.shipped}</b> 位未寄出</span>` : '<span class="px-3 py-1.5 rounded bg-emerald-600 text-xs font-bold">✅ 全部寄出</span>'}`;
      $('footerTools').classList.remove('hidden');
      let items = itemsOf(curId);
      if ($('onlyTodo').checked) items = items.filter(x => !isDone(x) && !x.removed && !isVoid(x));
      if (!items.length) { list.innerHTML = '<p class="text-center text-slate-500 py-12 text-sm">🎉 没有未寄出的得主</p>'; return; }

      // 左边：冠亚季 → 空一行 → 入围　右边：安慰奖
      const T = [], F = [], C = [];
      items.forEach(x => { const g = grpOf(x); (g === 'C' ? C : g === 'T' ? T : F).push(x); });
      const col = arr => arr.map(card).join('');
      const left = col(T) + (T.length && F.length ? '<div class="h-5" aria-hidden="true"></div>' : '') + col(F);
      const parts = [];
      if (left) parts.push(`<div class="space-y-2 min-w-0">${left}</div>`);
      if (C.length) parts.push(`<div class="space-y-2 min-w-0">${col(C)}</div>`);
      list.innerHTML = `<div class="grid gap-x-5 gap-y-5 items-start ${parts.length === 2 ? 'md:grid-cols-2' : ''}">${parts.join('')}</div>`;
    }
    function setItem(key, field, value) {
      if (!curId) return;
      db.ref(`${BATCHES}/${curId}/items/${key}`).update({ [field]: value, ts: firebase.database.ServerValue.TIMESTAMP })
        .catch(e => alert('❌ 保存失败：' + (e.code || e.message)));
    }
    function voidItem(key, reason) {
      if (!curId || !reason) return;
      const x = itemsOf(curId).find(i => i.key === key);
      if (!x) return;
      let note = '';
      if (reason === 'other') {
        note = prompt(`作废 ${x.name || ''}（${x.orderNo || ''}）的原因：`, '');
        if (note === null) return;
        note = note.trim().slice(0, 100);
        if (!note) { alert('请填写原因'); return; }
      } else if (!confirm(`作废 ${x.name || ''}（${x.orderNo || ''}）？\n原因：${VOID_REASONS[reason]}\n\n作废后不再算未寄出，之后可以按「↩️ 恢复」。`)) return;
      db.ref(`${BATCHES}/${curId}/items/${key}`).update({ voided: true, voidReason: reason, voidNote: note,
        voidedAt: firebase.database.ServerValue.TIMESTAMP, voidedBy: (firebase.auth().currentUser || {}).email || '',
        ts: firebase.database.ServerValue.TIMESTAMP }).catch(e => alert('❌ 保存失败：' + (e.code || e.message)));
    }
    function unvoidItem(key) {
      if (!curId || !confirm('恢复这位得主？会重新算进未寄出。')) return;
      db.ref(`${BATCHES}/${curId}/items/${key}`).update({ voided: null, voidReason: null, voidNote: null, voidedAt: null, voidedBy: null,
        ts: firebase.database.ServerValue.TIMESTAMP }).catch(e => alert('❌ 保存失败：' + (e.code || e.message)));
    }
    function downloadCSV() {
      if (!curId) return;
      const q = v => { const t = String(v == null ? '' : v); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
      const rows = [['名次', '名字', '订单号', '平台', '已联系', '已寄出', '会员俱乐部', '作废原因', '备注']].concat(itemsOf(curId).map(x =>
        [x.rank + (x.removed ? '（已撤销）' : ''), x.name, x.orderNo, { T: 'TikTok', S: 'Shopee' }[platformOf(x.orderNo)] || '', x.contacted ? '✔' : '', isDone(x) ? '✔' : '', clubOf(x) ? CLUB_ST[clubOf(x).status] || clubOf(x).status : '', isVoid(x) ? voidText(x) : '', x.note || '']));
      const blob = new Blob(['\uFEFF' + rows.map(r => r.map(q).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `Mochiishop_Claims_${curId}.csv`;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
    function deleteBatch() {
      if (!curId || !window.__isShopOwner) return;   // 只有店主可以删
      const s = stats(curId);
      if (!confirm(`🗑 删除【${batchName(curId)}】的领奖清单？\n\n共 ${s.total} 位得主（已寄出 ${s.shipped} 位）。删除后无法恢复，建议先下载 CSV。`)) return;
      const id = curId; curId = null;
      db.ref(`${BATCHES}/${id}`).remove().catch(e => alert('❌ 删除失败：' + (e.code || e.message)));
    }
  </script>

  <!-- 🎫 读取会员系统「🏆 中奖奖品」：同一个浏览器登录过会员系统后台才读得到 -->
  <script type="module">
    import { auth, db } from "../member-system/js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const hint = document.getElementById("clubHint");
    const RANK = { completed: 6, shipped: 5, approved: 4, claimed: 3, unclaimed: 2, cancelled: 1 };
    const off = msg => { hint.innerHTML = msg; hint.classList.remove("hidden"); };
    let started = false;
    onAuthStateChanged(auth, async user => {
      if (!user) { off('🎫 还没登录会员系统后台，看不到会员得奖者的俱乐部进度。<a href="../member-system/" target="_blank" class="underline font-bold">登录会员系统</a> 后重新整理这一页。'); return; }
      if (started) return;
      try { if (!(await getDoc(doc(db, "admins", user.uid))).exists()) { off("🎫 登录的会员系统账号不是管理员，看不到俱乐部进度。"); return; } }
      catch (e) { return; }
      started = true;
      hint.classList.add("hidden");
      onSnapshot(collection(db, "prizeWins"), snap => {
        const map = {};
        snap.docs.forEach(d => {
          const w = d.data(), no = String(w.orderNo || "").replace(/\s/g, "").toUpperCase();
          if (!no) return;
          if (!map[no] || (RANK[w.status] || 0) > (RANK[map[no].status] || 0)) map[no] = { status: w.status, id: d.id };
        });
        window.clubPrizes = map;
        if (window.onClubPrizes) window.onClubPrizes();
      }, e => console.warn("prizeWins", e));
    });
  </script>
  <!-- 🎁 小礼物：这一期没得奖的买家，每人 / 每单送一份，随下一单寄出（资料在会员系统 Firestore，只有后端 sgAdmin 写） -->
  <script type="module">
    import { app, auth, db } from "../member-system/js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-functions.js";

    const sgAdmin = httpsCallable(getFunctions(app, "asia-southeast1"), "sgAdmin");
    const panel = document.getElementById("sgPanel");
    const esc = x => String(x == null ? "" : x).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const norm = o => String(o || "").replace(/\s/g, "").toUpperCase();
    const fmtD = t => { const d = t && t.toDate ? t.toDate() : null; return d ? `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}` : "-"; };
    const ST = { pending: "待寄", sent: "已寄出", voided: "已作废" };
    const errText = e => (e && e.message) || String(e);

    let ready = false, sgBatches = {}, gifts = [], giftsFor = null, unGifts = null, open = false, busy = false;

    onAuthStateChanged(auth, user => {
      if (!user || ready) return;
      ready = true;
      onSnapshot(collection(db, "smallGiftBatches"), snap => {
        sgBatches = {};
        snap.docs.forEach(d => { sgBatches[d.id] = d.data(); });
        draw();
      }, e => { console.warn("smallGiftBatches", e); ready = false; panel.classList.add("hidden"); });
    });
    window.onBatchRender = () => { if (ready) draw(); };

    // 这一场没得奖的订单 = 参加名单 − 得主（名次被撤销的人算没得奖）
    function nonWinners(b) {
      const won = new Set(Object.values(b.items || {}).filter(x => x && !x.removed).map(x => norm(x.orderNo)));
      return Object.values(b.participants || {}).filter(p => p && p.o && !won.has(norm(p.o))).map(p => ({ orderNo: p.o, name: p.n || "" }));
    }

    function watchGifts(id) {
      if (giftsFor === id) return;
      if (unGifts) unGifts();
      giftsFor = id; gifts = []; unGifts = null;
      if (!id || !sgBatches[id]) return;
      unGifts = onSnapshot(query(collection(db, "smallGifts"), where("batchId", "==", id)), snap => {
        gifts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        draw();
      }, e => console.warn("smallGifts", e));
    }

    function draw(force) {
      const f = document.activeElement;
      if (!force && f && panel.contains(f) && (f.tagName === "INPUT" || f.tagName === "SELECT")) return;   // 正在填礼物名称时先不刷新
      const id = typeof curId !== "undefined" ? curId : null;
      const b = id && typeof batches !== "undefined" ? batches[id] : null;
      if (!b) { panel.classList.add("hidden"); return; }
      const box = (html, tone = "amber") => `<div class="rounded-lg border border-${tone}-700/60 bg-${tone}-950/30 p-3">${html}</div>`;
      const sgb = sgBatches[id];
      watchGifts(sgb ? id : null);
      panel.classList.remove("hidden");

      if (sgb) {                                   // 已经生成
        const c = { pending: 0, sent: 0, voided: 0 };
        gifts.forEach(g => { c[g.status] = (c[g.status] || 0) + 1; });
        const rows = gifts.slice().sort((a, b) => (a.status === "pending" ? 0 : 1) - (b.status === "pending" ? 0 : 1) || String(a.name).localeCompare(String(b.name)));
        panel.innerHTML = box(`
          <div class="flex flex-wrap items-center gap-x-3 gap-y-1.5 text-xs">
            <b class="text-amber-200 text-sm">🎁 小礼物「${esc(sgb.giftName)}」</b>
            <span class="text-amber-100/80">${sgb.mode === "person" ? "每人一份" : "每单一份"} · 期限到 ${fmtD(sgb.deadline)}</span>
            <span class="px-2 py-0.5 rounded bg-slate-800 border border-slate-700">共 <b>${sgb.count}</b> 份（会员 ${sgb.members || 0}）</span>
            <span class="px-2 py-0.5 rounded bg-sky-950 border border-sky-700 text-sky-200">待寄 <b>${c.pending}</b></span>
            <span class="px-2 py-0.5 rounded bg-emerald-950 border border-emerald-700 text-emerald-200">已寄出 <b>${c.sent}</b></span>
            ${c.voided ? `<span class="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300">🚫 作废 <b>${c.voided}</b></span>` : ""}
            <button data-act="toggle" class="ml-auto px-2.5 py-1 bg-slate-700 hover:bg-slate-600 rounded font-bold">${open ? "收起名单 ▲" : "📋 名单 ▼"}</button>
          </div>
          ${open ? `<div class="mt-3 max-h-[420px] overflow-auto rounded border border-slate-700">
            <table class="w-full text-left text-xs">
              <thead class="sticky top-0 bg-slate-800 text-slate-400"><tr><th class="py-1.5 px-2">买家</th><th class="py-1.5 px-2">订单号</th><th class="py-1.5 px-2">会员</th><th class="py-1.5 px-2">状态</th><th class="py-1.5 px-2"></th></tr></thead>
              <tbody>${rows.map(g => `<tr class="border-t border-slate-700/60 ${g.status === "pending" ? "" : "opacity-60"}">
                <td class="py-1.5 px-2 font-bold">${esc(g.name || g.username)} <span class="text-[10px] px-1 rounded ${g.platform === "tiktok" ? "tag-T" : g.platform === "shopee" ? "tag-S" : ""}">${g.platform === "tiktok" ? "TikTok" : g.platform === "shopee" ? "Shopee" : ""}</span></td>
                <td class="py-1.5 px-2 font-mono text-slate-300">${(g.orderNos || []).map(esc).join("<br>")}</td>
                <td class="py-1.5 px-2">${g.uid ? '<span class="text-pink-300">🎫 会员</span>' : '<span class="text-slate-500">—</span>'}</td>
                <td class="py-1.5 px-2">${esc(ST[g.status] || g.status)}${g.status === "sent" && g.sentOrder ? `<div class="text-[10px] text-slate-400">随 ${esc(g.sentOrder)}</div>` : ""}${g.status === "voided" ? `<div class="text-[10px] text-slate-400">${g.voidReason === "expired" ? "过期没下单" : esc(g.voidNote || "手动作废")}</div>` : ""}${g.status === "pending" && g.orderFound ? '<div class="text-[10px] text-emerald-300">✅ 已下新单，等打包</div>' : ""}</td>
                <td class="py-1.5 px-2 text-right whitespace-nowrap">${g.status === "pending" ? `<button data-act="void" data-id="${esc(g.id)}" class="px-2 py-0.5 border border-slate-600 hover:bg-slate-700 rounded">🚫 作废</button>` : g.status === "voided" ? `<button data-act="restore" data-id="${esc(g.id)}" class="px-2 py-0.5 border border-slate-600 hover:bg-slate-700 rounded">↩️ 恢复</button>` : ""}</td>
              </tr>`).join("")}</tbody>
            </table></div>
            <p class="mt-2 text-[11px] text-slate-400">寄出在「📦 打包清单」勾选。过期没下单的会在每天早上自动作废，会员会收到通知；到期前 7 天会先提醒会员。</p>` : ""}`);
        return;
      }

      if (!b.participants) {                       // 功能上线前的抽奖：没有参加名单
        panel.innerHTML = box(`<div class="text-xs text-slate-300">🎁 <b>小礼物</b>：这一场没有参加名单（小礼物功能上线前的抽奖）。从下一期开始，比赛结束按「✅ 更新到领奖追踪」时会自动带上名单。</div>`, "slate");
        return;
      }

      const list = nonWinners(b);
      if (!list.length) { panel.innerHTML = box(`<div class="text-xs text-slate-300">🎁 这一场所有订单都得奖了，没有小礼物要送。</div>`, "slate"); return; }
      const keep = id => { const el = document.getElementById(id); return el ? el.value : null; };
      const vName = keep("sgName") ?? "", vMode = keep("sgMode") ?? "order", vDays = keep("sgDays") ?? "30";
      panel.innerHTML = box(`
        <div class="flex flex-wrap items-center gap-2">
          <b class="text-amber-200 text-sm">🎁 小礼物</b>
          <span class="text-xs text-amber-100/80">这一场有 <b>${list.length}</b> 张订单没得奖，送一份小礼物，随买家下一单寄出</span>
        </div>
        <div class="mt-2.5 flex flex-wrap items-end gap-2 text-xs">
          <label class="flex flex-col gap-1">礼物名称
            <input id="sgName" maxlength="60" value="${esc(vName)}" placeholder="例如：Mochii 贴纸" class="w-48 bg-slate-900 border border-slate-600 rounded px-2 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400"></label>
          <label class="flex flex-col gap-1">送法
            <select id="sgMode" class="bg-slate-900 border border-slate-600 rounded px-2 py-1.5 text-sm text-slate-100">
              <option value="order" ${vMode === "order" ? "selected" : ""}>每单一份</option>
              <option value="person" ${vMode === "person" ? "selected" : ""}>每人一份</option></select></label>
          <label class="flex flex-col gap-1">期限（天）
            <input id="sgDays" type="number" min="1" max="365" value="${esc(vDays)}" class="w-20 bg-slate-900 border border-slate-600 rounded px-2 py-1.5 text-sm text-slate-100"></label>
          <button data-act="create" ${busy ? "disabled" : ""} class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded disabled:opacity-50">${busy ? "生成中…" : "🎁 生成小礼物"}</button>
        </div>
        <p class="mt-2 text-[11px] text-slate-400">每人一份：同一位会员（包括绑定的其他平台账号）这一期没中的单合成一份。生成后礼物名称和送法不能再改。</p>`);
    }

    panel.addEventListener("click", async e => {
      const btn = e.target.closest("button[data-act]");
      if (!btn || busy) return;
      const act = btn.dataset.act, id = (typeof curId !== "undefined") ? curId : null;
      if (act === "toggle") { open = !open; draw(true); return; }
      if (act === "void" || act === "restore") {
        const g = gifts.find(x => x.id === btn.dataset.id);
        if (!g) return;
        let note = "";
        if (act === "void") {
          note = prompt(`作废 ${g.name || g.username} 的小礼物？\n可以填原因（可留空）：`, "");
          if (note === null) return;
        } else if (!confirm(`恢复 ${g.name || g.username} 的小礼物？\n恢复后不会再自动过期作废。`)) return;
        btn.disabled = true;
        try { await sgAdmin({ op: act, id: g.id, note: note.trim() }); }
        catch (err) { alert("❌ " + errText(err)); btn.disabled = false; }
        return;
      }
      if (act === "create") {
        const b = batches[id];
        if (!b) return;
        const giftName = document.getElementById("sgName").value.trim();
        const mode = document.getElementById("sgMode").value;
        const days = parseInt(document.getElementById("sgDays").value, 10);
        if (!giftName) { alert("请填写礼物名称"); return; }
        if (!(days >= 1 && days <= 365)) { alert("期限要 1–365 天"); return; }
        const list = nonWinners(b);
        if (!confirm(`🎁 生成小礼物？\n\n期别：${b.label || id}\n礼物：${giftName}\n送法：${mode === "person" ? "每人一份" : "每单一份"}\n期限：${days} 天\n没得奖的订单：${list.length} 张\n\n生成后礼物名称和送法不能再改。`)) return;
        busy = true; draw(true);
        try {
          const r = (await sgAdmin({ op: "create", batchId: id, label: b.label || "", month: b.month || "", giftName, mode, days, list })).data;
          alert(`✅ 已生成 ${r.count} 份小礼物（${r.orders} 张订单，其中 ${r.members} 份认得出是会员）`);
        } catch (err) { alert("❌ 生成失败：" + errText(err)); }
        busy = false; draw(true);
      }
    });
  </script>
</body>
</html>
