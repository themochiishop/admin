<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mochii Shop - COD 面单打印系统</title>
  <!-- Barcode 条形码生成库 -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #262626;
      color: #333;
    }

    /* 顶部导航控制栏 */
    .top-header {
      background: #18181b;
      color: #fff;
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #ec4899;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.1rem;
      font-weight: 700;
    }
    .brand-logo-mini {
      height: 38px;
      width: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ec4899;
    }
    .btn-back {
      color: #f472b6;
      text-decoration: none;
      font-size: 0.88rem;
      border: 1px solid #f472b6;
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s;
      font-weight: 600;
    }
    .btn-back:hover {
      background: #ec4899;
      color: #fff;
    }

    .main-container {
      max-width: 1320px;
      margin: 24px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 24px;
    }

    /* 左侧录入卡片 */
    .form-card {
      background: #ffffff;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      height: fit-content;
    }
    .form-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #f472b6;
    }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 700; color: #475569; margin-bottom: 4px; }
    .form-control, .form-select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .form-control:focus, .form-select:focus {
      outline: none;
      border-color: #ec4899;
      box-shadow: 0 0 0 3px rgba(236,72,153,0.15);
    }

    /* 商品选择卡片 */
    .item-card {
      background: #fdf2f8;
      border: 1px solid #fbcfe8;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .item-card-header { display: flex; justify-content: space-between; font-size: 0.78rem; font-weight: 700; color: #db2777; margin-bottom: 6px; }
    .btn-remove-item { color: #ef4444; cursor: pointer; }
    .item-row-grid { display: grid; grid-template-columns: 1fr 1fr 65px; gap: 6px; }

    .btn-add-item {
      background: #fce7f3;
      color: #db2777;
      border: 1px dashed #f472b6;
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .btn-add-item:hover { background: #fbcfe8; }

    .btn-action-group { display: flex; gap: 10px; }
    .btn-primary {
      flex: 1;
      background: #ec4899;
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(236,72,153,0.3);
    }
    .btn-primary:hover { background: #db2777; }

    .btn-copy {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 11px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 右侧 A4 预览区 */
    .preview-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .preview-actions {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .btn-print {
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 9px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(22,163,74,0.3);
    }

    /* A4 面单容器 */
    .awb-paper {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      padding: 32px 38px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      font-family: "Times New Roman", Times, serif, Arial;
      color: #000;
      box-sizing: border-box;
      border-radius: 2px;
    }

    /* 页眉结构 */
    .awb-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .awb-logo-img {
      width: 68px;
      height: 68px;
      object-fit: contain;
      border-radius: 50%;
      display: block;
    }
    .awb-title {
      font-size: 1.55rem;
      font-weight: 900;
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: 0.5px;
    }
    .awb-barcode-container svg {
      height: 44px;
      max-width: 170px;
    }

    .awb-divider-thick { border-top: 2px solid #000; margin: 10px 0 14px 0; }
    .awb-divider-dashed { border-top: 1px dashed #555; margin: 12px 0; }

    /* 信息对齐表 */
    .awb-info-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 4px;
    }
    .awb-info-table td {
      padding: 3px 0;
      font-size: 0.93rem;
      vertical-align: top;
    }
    .label-col { width: 120px; font-weight: 700; white-space: nowrap; }
    .colon-col { width: 15px; text-align: center; font-weight: bold; }
    .val-col { font-weight: 700; color: #000; }

    .awb-product-block { margin-bottom: 10px; }
    .awb-prod-title { font-weight: 800; font-size: 0.92rem; }
    .awb-var-row {
      display: flex;
      justify-content: space-between;
      font-weight: 800;
      font-size: 1.02rem;
      padding-right: 35px;
      margin-top: 2px;
    }

    .awb-footer-note {
      text-align: center;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      color: #111;
      margin-top: 28px;
      line-height: 1.4;
      font-weight: 600;
    }

    @media print {
      body { background: #fff; }
      body * { visibility: hidden; }
      .awb-paper, .awb-paper * { visibility: visible; }
      .awb-paper {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        max-width: 100%;
        box-shadow: none;
        padding: 20px;
      }
      .top-header, .form-card, .preview-actions { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- 顶栏 -->
  <div class="top-header">
    <div class="brand-title">
      <!-- 双重路径保底：优先使用相对路径 logo.jpg，找不到则使用线上图片 -->
      <img src="../logo.jpg" class="brand-logo-mini" alt="Mochii Logo" onerror="this.src='https://themochiishop.github.io/admin/logo.jpg'">
      <span>The Mochii Shop — COD Express System</span>
    </div>
    <a href="../" class="btn-back">⬅️ 返回管理控制台</a>
  </div>

  <div class="main-container">
    
    <!-- 左侧表单 -->
    <div class="form-card">
      <div class="form-title">📝 订单数据录入</div>
      
      <div class="form-group">
        <label>User Name / 买家姓名</label>
        <input type="text" id="inputUsername" class="form-control" value="ssvo10dp9e">
      </div>

      <div class="form-group">
        <label>Order ID / 订单号</label>
        <input type="text" id="inputOrderId" class="form-control" value="261014HN714REB">
      </div>

      <div class="form-group">
        <label>Shipp Channel / 运输渠道</label>
        <select id="inputChannel" class="form-select">
          <option value="COD" selected>COD</option>
          <option value="Cash Payment at Physical Stores">Cash Payment at Physical Stores</option>
          <option value="Dispatched By System(Virtual Goods)">Dispatched By System(Virtual Goods)</option>
          <option value="Own Fleet (SPX)">Own Fleet (SPX)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Store / 店铺名称</label>
        <input type="text" id="inputStore" class="form-control" value="The MoChii Shop@Shopee">
      </div>

      <div class="form-group">
        <label>Buyer Message / 买家留言</label>
        <input type="text" id="inputBuyerMsg" class="form-control" placeholder="留空则不显示">
      </div>

      <div class="form-group">
        <label>Internal note / 内部备注</label>
        <input type="text" id="inputInternalNote" class="form-control" placeholder="留空则不显示">
      </div>

      <!-- Excel 数据选择 -->
      <div class="form-group">
        <label>商品及变体选择器 (自动匹配 Excel 目录库)</label>
        <div id="itemsContainer"></div>
        <button class="btn-add-item" onclick="addItemCard()">+ 添加新商品/变体行</button>
      </div>

      <div class="btn-action-group">
        <button class="btn-primary" onclick="generateAWB()">更新面单预览</button>
        <button class="btn-copy" onclick="copyWheelFormat()">📋 复制抽奖格式</button>
      </div>
    </div>

    <!-- 右侧 A4 面单预览 -->
    <div class="preview-card">
      <div class="preview-actions">
        <span style="color:#f472b6; font-weight:700;">📄 面单实时预览 View</span>
        <button class="btn-print" onclick="window.print()">🖨️ 打印面单 AWB</button>
      </div>

      <div class="awb-paper" id="awbPaper">
        
        <!-- 页眉：店铺粉色 Logo + 标题 + 条码 -->
        <div class="awb-header-flex">
          <div>
            <img class="awb-logo-img" src="../logo.jpg" alt="Logo" onerror="this.src='https://themochiishop.github.io/admin/logo.jpg'">
          </div>
          <div class="awb-title">Order List</div>
          <div class="awb-barcode-container">
            <svg id="barcode"></svg>
          </div>
        </div>

        <div class="awb-divider-thick"></div>

        <!-- 订单基本信息结构 -->
        <table class="awb-info-table">
          <tr>
            <td class="label-col">User Name</td>
            <td class="colon-col">:</td>
            <td class="val-col" id="awbUserName">ssvo10dp9e</td>
          </tr>
          <tr>
            <td class="label-col">Order ID</td>
            <td class="colon-col">:</td>
            <td class="val-col" id="awbOrderId">261014HN714REB</td>
          </tr>
          <tr>
            <td class="label-col">Shipp Channel</td>
            <td class="colon-col">:</td>
            <td class="val-col" id="awbChannel">COD</td>
          </tr>
          <tr>
            <td class="label-col">Store</td>
            <td class="colon-col">:</td>
            <td class="val-col" id="awbStore">The MoChii Shop@Shopee</td>
          </tr>
        </table>

        <!-- 商品动态渲染区 -->
        <div id="awbProductsArea"></div>

        <div class="awb-divider-dashed"></div>

        <!-- 买家留言与备注 -->
        <table class="awb-info-table">
          <tr>
            <td class="label-col">Buyer Message</td>
            <td class="colon-col">:</td>
            <td class="val-col" id="awbBuyerMsg"></td>
          </tr>
          <tr>
            <td class="label-col">Internal note</td>
            <td class="colon-col">:</td>
            <td class="val-col" id="awbInternalNote"></td>
          </tr>
        </table>

        <!-- 底部生成时间戳 -->
        <div class="awb-footer-note">
          <div>Generated by The Mochii Shop System</div>
          <div id="awbTimestamp">18/10/2026 01:42</div>
        </div>

      </div>
    </div>

  </div>

  <script>
    const EXCEL_DATABASE = {
      products: [
        "[Live Play] Handmade Gelang Tangan",
        "[NOT FOR SALE] Free Gift Zone",
        "[Live Play] Bingo 49 Card Game",
        "[Live Play] Ice Cube Challenge",
        "HappyBoomBoom Game",
        "Redeem-Redeem"
      ],
      variations: {
        "[Live Play] Handmade Gelang Tangan": [
          "Premium-10", "Premium-3", "Premium-5", "Premium Pro-Max",
          "Kiwi", "Durian", "Nanas", "Tembikai", "Strawbery", "Pisang", "Bendi"
        ],
        "[NOT FOR SALE] Free Gift Zone": [
          "Premium Pro-Max", "Random", "Keychain-1", "Cincin-1"
        ],
        "[Live Play] Bingo 49 Card Game": ["Bingo 49 Card Game", "Ice Cube Game"],
        "[Live Play] Ice Cube Challenge": ["1 Game", "3 Game (Free 1)"],
        "HappyBoomBoom Game": ["Normal-3", "Normal-5"],
        "Redeem-Redeem": ["Redeem-Redeem"]
      },
      quantities: ["x1", "x2", "x3", "x4", "x5", "x6", "x7", "x8", "x9", "x10"]
    };

    let itemCounter = 0;

    window.onload = function() {
      addItemCard("[Live Play] Handmade Gelang Tangan", "Premium-10", "x1");
      addItemCard("[NOT FOR SALE] Free Gift Zone", "Premium Pro-Max", "x1");
      generateAWB();
    };

    function addItemCard(defaultProd = "", defaultVar = "", defaultQty = "x1") {
      itemCounter++;
      const container = document.getElementById('itemsContainer');
      const card = document.createElement('div');
      card.className = 'item-card';
      card.id = `itemCard_${itemCounter}`;

      let prodOptions = EXCEL_DATABASE.products.map(p => 
        `<option value="${p}" ${p === defaultProd ? 'selected' : ''}>${p}</option>`
      ).join('');

      let qtyOptions = EXCEL_DATABASE.quantities.map(q => 
        `<option value="${q}" ${q === defaultQty ? 'selected' : ''}>${q}</option>`
      ).join('');

      card.innerHTML = `
        <div class="item-card-header">
          <span>商品及变体项 #${itemCounter}</span>
          <span class="btn-remove-item" onclick="removeItemCard(${itemCounter})">✕ 删除</span>
        </div>
        <div style="margin-bottom:4px;">
          <select class="form-select select-prod" onchange="updateVariationDropdown(${itemCounter})">
            ${prodOptions}
          </select>
        </div>
        <div class="item-row-grid">
          <select class="form-select select-var"></select>
          <input type="text" class="form-control custom-var-input" placeholder="补充变体">
          <select class="form-select select-qty">${qtyOptions}</select>
        </div>
      `;

      container.appendChild(card);
      updateVariationDropdown(itemCounter, defaultVar);
    }

    function removeItemCard(id) {
      const card = document.getElementById(`itemCard_${id}`);
      if (card) card.remove();
    }

    function updateVariationDropdown(id, defaultVar = "") {
      const card = document.getElementById(`itemCard_${id}`);
      const prodSelect = card.querySelector('.select-prod');
      const varSelect = card.querySelector('.select-var');
      const selectedProd = prodSelect.value;

      const vars = EXCEL_DATABASE.variations[selectedProd] || ["Normal"];
      varSelect.innerHTML = vars.map(v => 
        `<option value="${v}" ${v === defaultVar ? 'selected' : ''}>${v}</option>`
      ).join('');
    }

    function generateAWB() {
      const username = document.getElementById('inputUsername').value || '';
      const orderId = document.getElementById('inputOrderId').value || '';
      const channel = document.getElementById('inputChannel').value;
      const store = document.getElementById('inputStore').value || '';
      const buyerMsg = document.getElementById('inputBuyerMsg').value || '';
      const internalNote = document.getElementById('inputInternalNote').value || '';

      document.getElementById('awbUserName').innerText = username;
      document.getElementById('awbOrderId').innerText = orderId;
      document.getElementById('awbChannel').innerText = channel;
      document.getElementById('awbStore').innerText = store;
      document.getElementById('awbBuyerMsg').innerText = buyerMsg;
      document.getElementById('awbInternalNote').innerText = internalNote;

      if (orderId) {
        JsBarcode("#barcode", orderId, {
          format: "CODE128",
          width: 1.8,
          height: 38,
          displayValue: false
        });
      }

      const itemCards = document.querySelectorAll('.item-card');
      const productsArea = document.getElementById('awbProductsArea');
      productsArea.innerHTML = '';

      itemCards.forEach(card => {
        const prodName = card.querySelector('.select-prod').value;
        const varSelect = card.querySelector('.select-var').value;
        const customVar = card.querySelector('.custom-var-input').value.trim();
        const varName = customVar ? `${varSelect} ${customVar}` : varSelect;
        const qty = card.querySelector('.select-qty').value;

        const block = document.createElement('div');
        block.className = 'awb-product-block';
        block.innerHTML = `
          <div class="awb-divider-dashed"></div>
          <table class="awb-info-table">
            <tr>
              <td class="label-col">Product(s)</td>
              <td class="colon-col">:</td>
              <td class="val-col awb-prod-title">${prodName}</td>
            </tr>
            <tr>
              <td class="label-col">Variation</td>
              <td class="colon-col">:</td>
              <td class="val-col">
                <div class="awb-var-row">
                  <span>${varName}</span>
                  <span>${qty}</span>
                </div>
              </td>
            </tr>
          </table>
        `;
        productsArea.appendChild(block);
      });

      const now = new Date();
      const dateStr = String(now.getDate()).padStart(2, '0') + '/' +
                      String(now.getMonth() + 1).padStart(2, '0') + '/' +
                      now.getFullYear() + ' ' +
                      String(now.getHours()).padStart(2, '0') + ':' +
                      String(now.getMinutes()).padStart(2, '0');
      document.getElementById('awbTimestamp').innerText = dateStr;
    }

    function copyWheelFormat() {
      const username = document.getElementById('inputUsername').value.trim();
      const orderId = document.getElementById('inputOrderId').value.trim();
      if (!username || !orderId) {
        alert('请先输入买家姓名和订单号！');
        return;
      }
      const wheelText = `${username} #${orderId}`;
      navigator.clipboard.writeText(wheelText).then(() => {
        alert(`已复制大转盘格式:\n"${wheelText}"`);
      });
    }
  </script>
</body>
</html>
