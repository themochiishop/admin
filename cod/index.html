<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COD 面单打印系统 - The Mochii Shop</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    :root {
      --primary: #ec4899;
      --primary-hover: #db2777;
      --bg-color: #fce7f3;
      --border-color: #fbcfe8;
      --card-bg: #ffffff;
      --text-main: #374151;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { margin: 0; padding: 20px; background-color: var(--bg-color); color: var(--text-main); }

    .app-container {
      display: flex;
      gap: 20px;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* 左侧控制台 */
    .control-panel {
      flex: 1;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.1);
      border: 1px solid var(--border-color);
      max-height: 90vh;
      overflow-y: auto;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--bg-color);
    }

    .panel-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--primary);
    }

    .btn-quick-paste {
      background-color: #8b5cf6;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-quick-paste:hover { background-color: #7c3aed; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--text-main); }
    .form-control {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .form-control:focus { border-color: var(--primary); }

    .product-row {
      background-color: #fff5f8;
      border: 1px dashed var(--border-color);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .product-row-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; font-weight: bold; color: var(--primary); }
    .btn-remove { color: #ef4444; cursor: pointer; border: none; background: none; font-size: 12px; }

    .btn-add {
      width: 100%;
      padding: 6px;
      background: #fdf2f8;
      border: 1px dashed var(--primary);
      color: var(--primary);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .btn-primary {
      width: 100%;
      padding: 10px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    /* 右侧面单预览（100% 还原你原本截图的设计与尺寸） */
    .preview-panel {
      width: 440px;
      background: #2b2b2b;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
    }

    .awb-card {
      width: 100%;
      background: #ffffff;
      padding: 20px 22px 15px 22px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 560px;
      box-sizing: border-box;
    }

    /* AWB 顶部 Logo 与 Order List 标题 */
    .awb-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .awb-logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .awb-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }
    .awb-title {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 26px;
      font-weight: bold;
      color: #000;
      letter-spacing: 0.5px;
    }
    #barcode {
      width: 130px;
      height: 38px;
    }

    .awb-divider-thick {
      border-top: 2px solid #000;
      margin-bottom: 12px;
    }

    /* AWB 字段表达与对齐（USER NAME, ORDER ID, SHIPP CHANNEL, STORE） */
    .awb-info-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
    }
    .awb-info-table td {
      padding: 3px 0;
      font-size: 13px;
      font-weight: 800;
      color: #000;
      vertical-align: top;
      font-family: Arial, sans-serif;
    }
    .awb-info-table .lbl {
      width: 110px;
      letter-spacing: 0.2px;
    }
    .awb-info-table .colon {
      width: 15px;
      text-align: center;
    }
    .awb-info-table .val {
      word-break: break-all;
    }

    .awb-divider-dashed {
      border-top: 1px dashed #777;
      margin: 8px 0 12px 0;
    }

    /* 商品列表样式（带 📦 框） */
    .awb-product-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 8px;
      position: relative;
    }
    .awb-product-title {
      font-size: 13px;
      font-weight: 800;
      color: #000;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .awb-product-sub {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #475569;
      font-weight: 600;
    }
    .awb-product-qty {
      font-size: 14px;
      font-weight: 900;
      color: #0f172a;
    }

    /* 留言与备注 */
    .awb-note-section {
      margin-top: 6px;
    }

    /* 页脚机打字体与淡灰色 */
    .awb-footer {
      text-align: center;
      margin-top: 25px;
      padding-top: 8px;
      border-top: 1px dashed #e2e8f0;
    }
    .awb-footer-text {
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.4;
      text-transform: capitalize;
    }

    /* 弹窗 Modal 样式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      width: 480px;
      max-width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .modal-title { font-size: 15px; font-weight: bold; color: #111827; }
    .modal-close { cursor: pointer; font-size: 20px; font-weight: bold; color: #9ca3af; }
    .modal-textarea {
      width: 100%;
      height: 170px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      resize: vertical;
      margin-bottom: 12px;
    }

    @media print {
      body { background: white; padding: 0; }
      .control-panel, .modal-overlay { display: none !important; }
      .app-container { display: block; margin: 0; }
      .preview-panel { width: 100%; background: white; padding: 0; }
      .awb-card { border: none; box-shadow: none; width: 100%; padding: 0; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 左侧：录入控制台 -->
    <div class="control-panel">
      <div class="panel-header">
        <div class="panel-title">📦 COD 面单录入</div>
        <button class="btn-quick-paste" onclick="openPasteModal()">📋 快捷粘贴抓取</button>
      </div>

      <div class="form-group">
        <label>USER NAME (买家名)</label>
        <input type="text" id="buyerInput" class="form-control" value="ssvo10dp9e">
      </div>

      <div class="form-group">
        <label>ORDER ID (订单号)</label>
        <input type="text" id="orderInput" class="form-control" value="261014HN714REB">
      </div>

      <div class="form-group">
        <label>SHIPP CHANNEL</label>
        <input type="text" id="channelInput" class="form-control" value="COD">
      </div>

      <div class="form-group">
        <label>STORE (店铺)</label>
        <input type="text" id="storeInput" class="form-control" value="The MoChii Shop@Shopee">
      </div>

      <div class="form-group">
        <label>BUYER MESSAGE</label>
        <input type="text" id="msgInput" class="form-control" value="-">
      </div>

      <div class="form-group">
        <label>INTERNAL NOTE</label>
        <input type="text" id="noteInput" class="form-control" value="-">
      </div>

      <div class="form-group">
        <label>商品清单 Product List</label>
        <div id="productContainer">
          <div class="product-row">
            <div class="product-row-header">
              <span>商品 #1</span>
            </div>
            <input type="text" class="form-control prod-title" value="[Live Play] Handmade Gelang Tangan" style="margin-bottom:4px;">
            <input type="text" class="form-control prod-var" value="Premium-10" style="margin-bottom:4px;" placeholder="Variation">
            <input type="text" class="form-control prod-qty" value="x1" placeholder="Quantity">
          </div>
          <div class="product-row">
            <div class="product-row-header">
              <span>商品 #2</span>
              <button class="btn-remove" onclick="this.parentElement.parentElement.remove()">删除</button>
            </div>
            <input type="text" class="form-control prod-title" value="[NOT FOR SALE] Free Gift Zone" style="margin-bottom:4px;">
            <input type="text" class="form-control prod-var" value="Premium Pro-Max" style="margin-bottom:4px;" placeholder="Variation">
            <input type="text" class="form-control prod-qty" value="x1" placeholder="Quantity">
          </div>
        </div>
        <button class="btn-add" onclick="addProductRow()">+ 增加商品行</button>
      </div>

      <button class="btn-primary" onclick="renderAWB()">🔄 更新面单预览</button>
      <button class="btn-primary" onclick="window.print()" style="background-color: #10b981; margin-top: 8px;">🖨️ 打印面单 AWB</button>
    </div>

    <!-- 右侧：AWB 预览（完全忠于你截图的样式与排版） -->
    <div class="preview-panel">
      <div class="awb-card" id="awbCard">
        <div>
          <!-- 页眉：Logo + Order List 标题 + 条形码 -->
          <div class="awb-header">
            <div class="awb-logo-group">
              <img src="../logo.jpg" alt="Logo" class="awb-logo" onerror="this.src='https://via.placeholder.com/40?text=Mochii'">
              <span class="awb-title">Order List</span>
            </div>
            <svg id="barcode"></svg>
          </div>

          <div class="awb-divider-thick"></div>

          <!-- 订单基本信息 -->
          <table class="awb-info-table">
            <tr>
              <td class="lbl">USER NAME</td>
              <td class="colon">:</td>
              <td class="val" id="awbBuyer">ssvo10dp9e</td>
            </tr>
            <tr>
              <td class="lbl">ORDER ID</td>
              <td class="colon">:</td>
              <td class="val" id="awbOrder">261014HN714REB</td>
            </tr>
            <tr>
              <td class="lbl">SHIPP CHANNEL</td>
              <td class="colon">:</td>
              <td class="val" id="awbChannel">COD</td>
            </tr>
            <tr>
              <td class="lbl">STORE</td>
              <td class="colon">:</td>
              <td class="val" id="awbStore">The MoChii Shop@Shopee</td>
            </tr>
          </table>

          <div class="awb-divider-dashed"></div>

          <!-- 商品列表区 -->
          <div id="awbProducts">
            <!-- 动态生成 -->
          </div>

          <div class="awb-divider-dashed"></div>

          <!-- 留言与备注区 -->
          <table class="awb-info-table awb-note-section">
            <tr>
              <td class="lbl">BUYER MESSAGE</td>
              <td class="colon">:</td>
              <td class="val" id="awbMsg">-</td>
            </tr>
            <tr>
              <td class="lbl">INTERNAL NOTE</td>
              <td class="colon">:</td>
              <td class="val" id="awbNote">-</td>
            </tr>
          </table>
        </div>

        <!-- 强制两排居中微灰页脚 -->
        <div class="awb-footer">
          <div class="awb-footer-text">Generated By The Mochii Shop System</div>
          <div class="awb-footer-text" id="awbTimestamp">18/10/2026 17:46</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 快捷粘贴弹窗 -->
  <div class="modal-overlay" id="pasteModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">📋 粘贴 Shopee 订单文本</span>
        <span class="modal-close" onclick="closePasteModal()">&times;</span>
      </div>
      <p style="font-size:12px; color:#6b7280; margin:0 0 10px 0;">在 Shopee 订单页面全选/复制内容后粘贴在下方：</p>
      <textarea id="pasteTextarea" class="modal-textarea" placeholder="在此按下 Ctrl+V 粘贴文本..."></textarea>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button onclick="closePasteModal()" style="padding:6px 12px; border:1px solid #ccc; background:#fff; border-radius:6px; cursor:pointer; font-size:12px;">取消</button>
        <button onclick="processPastedText()" style="padding:6px 12px; background:var(--primary); color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px;">⚡ 智能解析填入</button>
      </div>
    </div>
  </div>

  <script>
    function updateBarcode(orderId) {
      if(!orderId) orderId = "261014HN714REB";
      try {
        JsBarcode("#barcode", orderId, {
          format: "CODE128",
          lineColor: "#000",
          width: 1.2,
          height: 35,
          displayValue: false
        });
      } catch(e) { console.log(e); }
    }

    function addProductRow(title = '', variation = '', qty = 'x1') {
      const container = document.getElementById('productContainer');
      const count = container.children.length + 1;
      const div = document.createElement('div');
      div.className = 'product-row';
      div.innerHTML = `
        <div class="product-row-header">
          <span>商品 #${count}</span>
          <button class="btn-remove" onclick="this.parentElement.parentElement.remove()">删除</button>
        </div>
        <input type="text" class="form-control prod-title" value="${title}" style="margin-bottom:4px;" placeholder="Product Title">
        <input type="text" class="form-control prod-var" value="${variation}" style="margin-bottom:4px;" placeholder="Variation">
        <input type="text" class="form-control prod-qty" value="${qty}" placeholder="Quantity">
      `;
      container.appendChild(div);
    }

    function renderAWB() {
      document.getElementById('awbBuyer').innerText = document.getElementById('buyerInput').value || '-';
      const orderNo = document.getElementById('orderInput').value || '-';
      document.getElementById('awbOrder').innerText = orderNo;
      document.getElementById('awbChannel').innerText = document.getElementById('channelInput').value || 'COD';
      document.getElementById('awbStore').innerText = document.getElementById('storeInput').value || 'The MoChii Shop@Shopee';
      document.getElementById('awbMsg').innerText = document.getElementById('msgInput').value || '-';
      document.getElementById('awbNote').innerText = document.getElementById('noteInput').value || '-';

      updateBarcode(orderNo);

      // 渲染商品列表
      const prodContainer = document.getElementById('awbProducts');
      prodContainer.innerHTML = '';

      const titles = document.querySelectorAll('.prod-title');
      const vars = document.querySelectorAll('.prod-var');
      const qtys = document.querySelectorAll('.prod-qty');

      titles.forEach((el, i) => {
        const titleVal = el.value.trim();
        const varVal = vars[i] ? vars[i].value.trim() : '';
        const qtyVal = qtys[i] ? qtys[i].value.trim() : 'x1';

        if(titleVal) {
          const box = document.createElement('div');
          box.className = 'awb-product-box';
          box.innerHTML = `
            <div class="awb-product-title">📦 Product: ${titleVal}</div>
            <div class="awb-product-sub">
              <span>Variation: ${varVal || '-'}</span>
              <span class="awb-product-qty">${qtyVal.startsWith('x') ? qtyVal : 'x' + qtyVal}</span>
            </div>
          `;
          prodContainer.appendChild(box);
        }
      });

      // 动态时间戳 (如: 18/10/2026 17:46)
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('awbTimestamp').innerText = `${day}/${month}/${year} ${hours}:${mins}`;
    }

    function openPasteModal() {
      document.getElementById('pasteModal').style.display = 'flex';
      document.getElementById('pasteTextarea').value = '';
      document.getElementById('pasteTextarea').focus();
    }

    function closePasteModal() {
      document.getElementById('pasteModal').style.display = 'none';
    }

    function processPastedText() {
      const rawText = document.getElementById('pasteTextarea').value;
      if (!rawText || rawText.trim() === '') {
        alert('请先粘贴内容！');
        return;
      }

      // 1. 抓取订单号
      const orderMatch = rawText.match(/订单编号\s*([A-Z0-9]+)/i) || rawText.match(/Order\s*SN\s*([A-Z0-9]+)/i);
      if (orderMatch) document.getElementById('orderInput').value = orderMatch[1].trim();

      // 2. 抓取买家名
      const buyerMatch = rawText.match(/([a-zA-Z0-9_\.]+)\s*订单编号/) || rawText.match(/([a-zA-Z0-9_\.]+)\s*Order\s*SN/);
      if (buyerMatch) document.getElementById('buyerInput').value = buyerMatch[1].trim();

      // 3. 抓取商品与规格变体
      const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      let productsFound = [];
      let currentTitle = '';
      let currentVar = '';
      let currentQty = 'x1';

      lines.forEach(line => {
        if (line.includes('Handmade') || line.includes('Gelang') || line.includes('[Live') || line.includes('NOT FOR SALE') || line.includes('Free Gift')) {
          if (currentTitle) {
            productsFound.push({ title: currentTitle, variation: currentVar, qty: currentQty });
            currentVar = '';
            currentQty = 'x1';
          }
          currentTitle = line.replace(/预购|礼品|现货/g, '').trim();
        } else if (line.startsWith('规格:') || line.startsWith('规格：') || line.startsWith('Variation:')) {
          currentVar = line.replace(/规格[:：]|Variation:/g, '').trim();
        } else if (line.match(/^x\d+\$/)) {
          currentQty = line;
        }
      });

      if (currentTitle) {
        productsFound.push({ title: currentTitle, variation: currentVar, qty: currentQty });
      }

      if (productsFound.length > 0) {
        const container = document.getElementById('productContainer');
        container.innerHTML = '';
        productsFound.forEach(p => addProductRow(p.title, p.variation, p.qty));
      }

      closePasteModal();
      renderAWB();
    }

    window.onload = function() {
      renderAWB();
    };
  </script>
</body>
</html>
