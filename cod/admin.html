<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mochii Shop - 商品分类可视化管理后台</title>
  <style>
    :root {
      --primary: #ec4899;
      --primary-hover: #db2777;
      --bg-color: #fce7f3;
      --border-color: #fbcfe8;
      --card-bg: #ffffff;
      --text-main: #374151;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 20px; background-color: var(--bg-color); color: var(--text-main); }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      max-width: 900px;
      margin: 0 auto;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.15);
      border: 1px solid var(--border-color);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--bg-color);
    }

    h2 { margin: 0; color: var(--primary); font-size: 18px; }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }

    .btn-add-main {
      background: #8b5cf6;
      margin-bottom: 15px;
    }
    .btn-add-main:hover { background: #7c3aed; }

    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }

    .btn-sm { padding: 4px 8px; font-size: 11px; }

    /* 分类卡片区域 */
    .catalog-item {
      background: #fff5f8;
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .catalog-item-header {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }

    .input-main-title {
      flex: 1;
      font-weight: bold;
      font-size: 13px;
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 5px;
    }

    .var-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      padding-left: 10px;
    }

    .var-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
    }

    .var-chip input {
      border: none;
      outline: none;
      font-size: 12px;
      width: 100px;
      background: transparent;
    }

    .btn-del-chip {
      color: #9ca3af;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      line-height: 1;
    }
    .btn-del-chip:hover { color: #ef4444; }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 2px solid var(--bg-color);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2>📦 商品分类与规格可视化管理后台</h2>
      <button class="btn" onclick="saveAndDownload()">💾 保存并下载 catalog.json</button>
    </div>

    <p style="font-size:12px; color:#6b7280; margin-bottom:15px;">
      你可以通过下方界面直接修改商品分类或规格变体，修改完成后点击右上角的“保存并下载”，直接替换 GitHub 仓库里的 <code>catalog.json</code> 即可！
    </p>

    <button class="btn btn-add-main" onclick="addMainCategory()">➕ 添加新商品主分类</button>

    <div id="catalogContainer">
      <!-- 动态生成的分类列表 -->
    </div>

    <div class="actions-bar">
      <span style="font-size:12px; color:#9ca3af;">修改完成后请记得替换 GitHub 中的 admin/cod/catalog.json</span>
      <button class="btn" onclick="saveAndDownload()">💾 保存并下载 catalog.json</button>
    </div>
  </div>

  <script>
    let rawData = {
      channels: ["COD", "Cash Payment at Physical Stores", "Dispatched By System(Virtual Goods)", "Own Fleet (SPX)", "Pre-Order"],
      quantities: ["x1", "x2", "x3", "x4", "x5", "x6", "x7", "x8", "x9", "x10"],
      catalog: {}
    };

    // 页面加载时抓取当前的 catalog.json
    window.onload = function() {
      fetch('./catalog.json')
        .then(res => res.json())
        .then(data => {
          rawData = data;
          renderCatalogUI();
        })
        .catch(err => {
          alert('无法自动加载同目录下的 catalog.json，请确认文件路径是否正确。');
        });
    };

    // 渲染主 UI 列表
    function renderCatalogUI() {
      const container = document.getElementById('catalogContainer');
      container.innerHTML = '';

      Object.keys(rawData.catalog).forEach((mainTitle, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'catalog-item';
        
        let varsHTML = '';
        rawData.catalog[mainTitle].forEach((varItem, varIndex) => {
          varsHTML += `
            <div class="var-chip">
              <input type="text" value="${varItem}" onchange="updateVar('${mainTitle}', ${varIndex}, this.value)">
              <span class="btn-del-chip" title="删除此规格" onclick="deleteVar('${mainTitle}', ${varIndex})">&times;</span>
            </div>
          `;
        });

        itemDiv.innerHTML = `
          <div class="catalog-item-header">
            <span style="font-size:12px; font-weight:bold; color:var(--primary);">#${index + 1}</span>
            <input type="text" class="input-main-title" value="${mainTitle}" onchange="updateMainTitle('${mainTitle}', this.value)">
            <button class="btn btn-sm" onclick="addVar('${mainTitle}')">+ 增加规格</button>
            <button class="btn btn-sm btn-danger" onclick="deleteMainCategory('${mainTitle}')">🗑️ 删除分类</button>
          </div>
          <div class="var-list">
            ${varsHTML}
          </div>
        `;

        container.appendChild(itemDiv);
      });
    }

    // 更新主分类名称
    function updateMainTitle(oldTitle, newTitle) {
      newTitle = newTitle.trim();
      if (!newTitle || oldTitle === newTitle) return;
      
      const varList = rawData.catalog[oldTitle];
      delete rawData.catalog[oldTitle];
      rawData.catalog[newTitle] = varList;
      renderCatalogUI();
    }

    // 更新规格名称
    function updateVar(mainTitle, varIndex, newVarName) {
      if (rawData.catalog[mainTitle]) {
        rawData.catalog[mainTitle][varIndex] = newVarName.trim();
      }
    }

    // 添加新的主分类
    function addMainCategory() {
      const newCategoryName = prompt("请输入新的商品主分类名称：");
      if (newCategoryName && newCategoryName.trim()) {
        const title = newCategoryName.trim();
        if (rawData.catalog[title]) {
          alert("该商品分类已存在！");
          return;
        }
        rawData.catalog[title] = ["默认规格"];
        renderCatalogUI();
      }
    }

    // 删除主分类
    function deleteMainCategory(mainTitle) {
      if (confirm(`确定要删除分类【${mainTitle}】及其所有规格吗？`)) {
        delete rawData.catalog[mainTitle];
        renderCatalogUI();
      }
    }

    // 为分类添加规格
    function addVar(mainTitle) {
      if (rawData.catalog[mainTitle]) {
        rawData.catalog[mainTitle].push("新规格");
        renderCatalogUI();
      }
    }

    // 删除具体规格
    function deleteVar(mainTitle, varIndex) {
      if (rawData.catalog[mainTitle]) {
        rawData.catalog[mainTitle].splice(varIndex, 1);
        renderCatalogUI();
      }
    }

    // 导出并下载格式化好的 JSON 文件
    function saveAndDownload() {
      const jsonStr = JSON.stringify(rawData, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'catalog.json';
      a.click();
    }
  </script>
</body>
</html>
