<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mochii Shop - 商品分类可视化管理后台</title>
  <style>
    :root {
      --primary: #ec4899;
      --primary-hover: #db2777;
      --bg-color: #fce7f3;
      --border-color: #fbcfe8;
      --card-bg: #ffffff;
      --text-main: #374151;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 20px; background-color: var(--bg-color); color: var(--text-main); }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      max-width: 900px;
      margin: 0 auto;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.15);
      border: 1px solid var(--border-color);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--bg-color);
    }

    h2 { margin: 0; color: var(--primary); font-size: 18px; }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }

    .btn-add-main {
      background: #8b5cf6;
      margin-bottom: 15px;
    }
    .btn-add-main:hover { background: #7c3aed; }

    .btn-gear {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-gear:hover { background: #e5e7eb; border-color: var(--primary); }

    .btn-move {
      background: #8b5cf6;
      color: white;
      padding: 3px 7px;
      font-size: 11px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-move:hover { background: #7c3aed; }

    .btn-save-item {
      background: #10b981;
      color: white;
      padding: 3px 8px;
      font-size: 11px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-save-item:hover { background: #059669; }

    .btn-cancel-item {
      background: #9ca3af;
      color: white;
      padding: 3px 8px;
      font-size: 11px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-cancel-item:hover { background: #6b7280; }

    .btn-danger { background: #ef4444; color: white; border: none; }
    .btn-danger:hover { background: #dc2626; }

    .btn-sm { padding: 4px 8px; font-size: 11px; border-radius: 5px; cursor: pointer; }

    /* 分类卡片区域 */
    .catalog-item {
      background: #fff5f8;
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .catalog-item.editing-mode {
      background: #f0f9ff;
      border: 1px dashed #0284c7;
    }

    .catalog-item-header {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }

    .input-main-title {
      flex: 1;
      font-weight: bold;
      font-size: 13px;
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 5px;
    }

    .var-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      padding-left: 10px;
    }

    .var-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
    }

    .var-chip input {
      border: none;
      outline: none;
      font-size: 12px;
      width: 100px;
      background: transparent;
    }

    .btn-del-chip {
      color: #9ca3af;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      line-height: 1;
    }
    .btn-del-chip:hover { color: #ef4444; }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 2px solid var(--bg-color);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2>📦 商品分类与规格可视化管理后台</h2>
      <button class="btn" onclick="saveAndDownload()">💾 保存并下载 catalog.json</button>
    </div>

    <p style="font-size:12px; color:#6b7280; margin-bottom:15px;">
      点击商品分类右侧的 ⚙️ 按钮可开启该分类的“上移/下移排序”与“删除分类”模式。修改完成后请点击“💾 保存并下载”，
      替换 GitHub 仓库里的 <code>catalog.json</code> 即可！
      <br>
      <p style="font-size:12px; color:#6b7280;">admin/cod/catalog.json  </p>
    </p>

    <button class="btn btn-add-main" onclick="addMainCategory()">➕ 添加新商品主分类</button>

    <div id="catalogContainer">
      <!-- 动态生成的分类列表 -->
    </div>

    <div class="actions-bar">
      <span style="font-size:12px; color:#9ca3af;">修改完成后请记得替换 GitHub 中的 admin/cod/catalog.json</span>
      <button class="btn" onclick="saveAndDownload()">💾 保存并下载 catalog.json</button>
    </div>
  </div>

  <script>
    let rawData = {
      channels: ["COD", "Cash Payment at Physical Stores", "Dispatched By System(Virtual Goods)", "Own Fleet (SPX)", "Pre-Order"],
      quantities: ["x1", "x2", "x3", "x4", "x5", "x6", "x7", "x8", "x9", "x10"],
      catalog: {}
    };

    let editingCategoryIndex = null; // 记录当前哪一行正在开启齿轮编辑模式
    let tempCatalogBackup = null;   // 备份数据用于“取消”功能还原

    // 页面加载时抓取当前的 catalog.json
    window.onload = function() {
      fetch('./catalog.json')
        .then(res => res.json())
        .then(data => {
          rawData = data;
          renderCatalogUI();
        })
        .catch(err => {
          alert('无法自动加载同目录下的 catalog.json，请确认文件路径是否正确。');
        });
    };

    // 渲染主 UI 列表
    function renderCatalogUI() {
      const container = document.getElementById('catalogContainer');
      container.innerHTML = '';

      const keys = Object.keys(rawData.catalog);

      keys.forEach((mainTitle, index) => {
        const isEditing = (editingCategoryIndex === index);
        const itemDiv = document.createElement('div');
        itemDiv.className = `catalog-item ${isEditing ? 'editing-mode' : ''}`;
        
        let varsHTML = '';
        rawData.catalog[mainTitle].forEach((varItem, varIndex) => {
          varsHTML += `
            <div class="var-chip">
              <input type="text" value="${varItem}" onchange="updateVar('${mainTitle}', ${varIndex}, this.value)">
              <span class="btn-del-chip" title="删除此规格" onclick="deleteVar('${mainTitle}', ${varIndex})">&times;</span>
            </div>
          `;
        });

        // 按钮布局逻辑：默认显示 [+ 增加规格] 和 [⚙️ 排序与编辑]
        // 开启齿轮后展开 [▲ 上移] [▼ 下移] [🗑️ 删除分类] [确定保存] [取消]
        let controlControlsHTML = '';
        if (isEditing) {
          controlControlsHTML = `
            <button class="btn-move" title="向上移动" onclick="moveCategory(${index}, -1)" ${index === 0 ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>▲ 上移</button>
            <button class="btn-move" title="向下移动" onclick="moveCategory(${index}, 1)" ${index === keys.length - 1 ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>▼ 下移</button>
            <button class="btn btn-sm btn-danger" onclick="deleteMainCategory('${mainTitle}')">🗑️ 删除分类</button>
            <button class="btn-save-item" onclick="saveCategoryEdit()">确定保存</button>
            <button class="btn-cancel-item" onclick="cancelCategoryEdit()">取消</button>
          `;
        } else {
          controlControlsHTML = `
            <button class="btn btn-sm" onclick="addVar('${mainTitle}')" style="background:#8b5cf6; color:white;">+ 增加规格</button>
            <button class="btn-gear" onclick="openCategoryEdit(${index})" title="开启排序与设置模式">⚙️ 排序与编辑</button>
          `;
        }

        itemDiv.innerHTML = `
          <div class="catalog-item-header">
            <span style="font-size:12px; font-weight:bold; color:${isEditing ? '#0284c7' : 'var(--primary)'}; width:24px;">#${index + 1}</span>
            <input type="text" class="input-main-title" value="${mainTitle}" onchange="updateMainTitle('${mainTitle}', this.value)">
            ${controlControlsHTML}
          </div>
          <div class="var-list">
            ${varsHTML}
          </div>
        `;

        container.appendChild(itemDiv);
      });
    }

    // 开启齿轮编辑/排序模式
    function openCategoryEdit(index) {
      editingCategoryIndex = index;
      tempCatalogBackup = JSON.parse(JSON.stringify(rawData.catalog)); // 备份原数据
      renderCatalogUI();
    }

    // 确定保存编辑/排序
    function saveCategoryEdit() {
      editingCategoryIndex = null;
      tempCatalogBackup = null;
      renderCatalogUI();
    }

    // 取消编辑/排序，恢复旧数据
    function cancelCategoryEdit() {
      if (tempCatalogBackup) {
        rawData.catalog = JSON.parse(JSON.stringify(tempCatalogBackup));
      }
      editingCategoryIndex = null;
      tempCatalogBackup = null;
      renderCatalogUI();
    }

    // 移动商品主分类位置（上移/下移）
    function moveCategory(index, direction) {
      const entries = Object.entries(rawData.catalog);
      const targetIndex = index + direction;

      if (targetIndex < 0 || targetIndex >= entries.length) return;

      // 交换位置
      const temp = entries[index];
      entries[index] = entries[targetIndex];
      entries[targetIndex] = temp;

      // 保持当前编辑焦点跟随移动
      editingCategoryIndex = targetIndex;

      // 重构 rawData.catalog 保证 key 的顺序保持一致
      const newCatalog = {};
      entries.forEach(([key, val]) => {
        newCatalog[key] = val;
      });

      rawData.catalog = newCatalog;
      renderCatalogUI();
    }

    // 更新主分类名称
    function updateMainTitle(oldTitle, newTitle) {
      newTitle = newTitle.trim();
      if (!newTitle || oldTitle === newTitle) return;
      
      const entries = Object.entries(rawData.catalog);
      const newCatalog = {};

      entries.forEach(([key, val]) => {
        if (key === oldTitle) {
          newCatalog[newTitle] = val;
        } else {
          newCatalog[key] = val;
        }
      });

      rawData.catalog = newCatalog;
      renderCatalogUI();
    }

    // 更新规格名称
    function updateVar(mainTitle, varIndex, newVarName) {
      if (rawData.catalog[mainTitle]) {
        rawData.catalog[mainTitle][varIndex] = newVarName.trim();
      }
    }

    // 添加新的主分类
    function addMainCategory() {
      const newCategoryName = prompt("请输入新的商品主分类名称：");
      if (newCategoryName && newCategoryName.trim()) {
        const title = newCategoryName.trim();
        if (rawData.catalog[title]) {
          alert("该商品分类已存在！");
          return;
        }
        rawData.catalog[title] = ["默认规格"];
        renderCatalogUI();
      }
    }

    // 删除主分类
    function deleteMainCategory(mainTitle) {
      if (confirm(`确定要删除分类【${mainTitle}】及其所有规格吗？`)) {
        delete rawData.catalog[mainTitle];
        editingCategoryIndex = null;
        tempCatalogBackup = null;
        renderCatalogUI();
      }
    }

    // 为分类添加规格
    function addVar(mainTitle) {
      if (rawData.catalog[mainTitle]) {
        rawData.catalog[mainTitle].push("新规格");
        renderCatalogUI();
      }
    }

    // 删除具体规格
    function deleteVar(mainTitle, varIndex) {
      if (rawData.catalog[mainTitle]) {
        rawData.catalog[mainTitle].splice(varIndex, 1);
        renderCatalogUI();
      }
    }

    // 导出并下载格式化好的 JSON 文件
    function saveAndDownload() {
      const jsonStr = JSON.stringify(rawData, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'catalog.json';
      a.click();
    }
  </script>
</body>
</html>
