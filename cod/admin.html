<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>The Mochii Shop - 数据管理后台</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #fce7f3; color: #374151; }
    .card { background: white; padding: 20px; border-radius: 10px; max-width: 800px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #ec4899; }
    textarea { width: 100%; height: 380px; font-family: monospace; font-size: 13px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
    button { background: #ec4899; color: white; border: none; padding: 10px 18px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background: #db2777; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📦 GitHub 资料库数据管理</h2>
    <p style="font-size:12px; color:#6b7280;">在下方修改 JSON 内容后点击“下载更新后的 catalog.json”，然后替换 admin/cod/catalog.json 即可实时同步！</p>
    <textarea id="jsonData"></textarea>
    <br>
    <button onclick="downloadJSON()">💾 下载更新后的 catalog.json</button>
  </div>

  <script>
    fetch('./catalog.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('jsonData').value = JSON.stringify(data, null, 2);
      })
      .catch(() => alert('无法读取 catalog.json，请检查文件是否存在'));

    function downloadJSON() {
      const text = document.getElementById('jsonData').value;
      try {
        JSON.parse(text);
        const blob = new Blob([text], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'catalog.json';
        a.click();
      } catch (e) {
        alert('⚠️ JSON 格式有误，请检查语法！');
      }
    }
  </script>
</body>
</html>
