<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../logo.png">
  <title>兑换审核 · 会员系统 Admin</title>
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/theme.js"></script>
  <style>
    .tabs { flex-wrap: wrap; }
    .tabs button .cnt { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: #e11d48; color: #fff; font-size: .7rem; }
    .tabs button .cnt.zero { background: var(--line2); }
    .addr-box { background: var(--soft2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: .88rem; line-height: 1.6; margin-top: 8px; }
    .ship-form { background: var(--blue-bg); border: 1px solid #bae6fd; border-radius: 12px; padding: 14px; margin-top: 10px; }
    .ship-form .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 10px; }
    .ship-form .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 10px; }
    @media (max-width: 640px) { .ship-form .grid3, .ship-form .grid4 { grid-template-columns: 1fr 1fr; } }
    .photos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .photos img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
    .photos .ph-wrap { position: relative; }
    .photos .ph-wrap button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: none; background: #dc2626; color: #fff; font-size: .7rem; cursor: pointer; }
    .kind { font-size: .7rem; }
    .tag-blue { background: var(--blue-bg2); color: var(--blue-tx); }
    .problem { background: var(--orange-bg); border: 1px solid #fdba74; color: var(--orange-tx); border-radius: 10px; padding: 8px 12px; font-size: .85rem; margin-top: 8px; }
    .rno { font-size: .72rem; color: var(--muted); flex-shrink: 0; }
    .mode-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 8px; font-size: .86rem; }
    .mode-row label { display: inline-flex; gap: 6px; align-items: center; margin: 0; }
    .mode-row input { width: auto; margin: 0; }
    .prize-alert { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--rose-bg); border: 1px solid #fda4af; color: var(--rose-tx);
      border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; text-decoration: none; font-size: .9rem; }
    .prize-alert:hover { background: var(--rose-bg2); }
    .prize-alert b { font-size: .95rem; }
    .prize-alert .go { margin-left: auto; font-weight: 700; white-space: nowrap; }
    /* 📦 寄送方式 */
    .dlv-box { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; background: var(--soft2); }
    .dlv-box .mode-row { margin-top: 0; }
    .dlv-sep { margin-top: 8px; display: grid; gap: 6px; }
    .dlv-opt { display: flex !important; gap: 8px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 0 !important; background: var(--card); cursor: pointer; font-size: .86rem; }
    .dlv-opt input { width: auto; margin: 3px 0 0; }
    .dlv-opt.off { opacity: .5; cursor: not-allowed; }
    .dlv-opt .a { color: var(--muted); font-size: .8rem; line-height: 1.5; }
    .dlv-opt:has(input:checked) { border-color: #db2777; }
    .dlv-new { border: 1px dashed var(--line2); border-radius: 10px; padding: 10px; }
    .dlv-new .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 10px; }
    @media (max-width: 640px) { .dlv-new .grid3 { grid-template-columns: 1fr 1fr; } }
    .wait-addr { background: var(--amber-bg); border: 1px solid #fcd34d; color: var(--amber-tx); border-radius: 10px; padding: 8px 12px; font-size: .86rem; margin-top: 8px; }
    .new-order { background: var(--green-bg); border: 1px solid #86efac; color: var(--green-tx); border-radius: 10px; padding: 8px 12px; font-size: .86rem; margin-top: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="gate" class="gate"><div class="gate-card"><p>载入中…</p></div></div>

  <div id="app" class="hidden">
    <header id="adminHeader"></header>

    <div class="container">
      <div class="page-head">
        <div>
          <h2>兑换审核</h2>
          <p class="muted">批准后才扣积分。优惠券自动带入券码；实体奖品批准后到「待发货」填物流资料。每月抽奖的中奖奖品在「🏆 中奖奖品」处理。</p>
        </div>
        <button id="reloadBtn" class="btn btn-ghost">🔄 重新整理</button>
      </div>

      <!-- 🏆 中奖奖品有要处理的才显示 -->
      <a id="prizeAlert" class="prize-alert hidden" href="prizes.html"></a>

      <div class="tabs" id="tabs">
        <button data-tab="pending" class="active">待审核</button>
        <button data-tab="toShip">待发货</button>
        <button data-tab="shipped">已发货</button>
        <button data-tab="done">已完成</button>
        <button data-tab="closed">已拒绝 / 取消</button>
      </div>

      <input id="search" placeholder="🔍 搜索兑换编号（例如 #A1B2C3）、会员名称或奖品" style="margin-bottom:12px">
      <div id="panel"><p class="empty">载入中…</p></div>

      <details class="panel" style="margin-top:20px">
        <summary style="cursor:pointer;font-weight:700">🔗 运输公司查询链接</summary>
        <p class="meta" style="margin:10px 0">填物流资料时，输入单号就会自动生成查询链接，<code>{no}</code> 会换成追踪单号。第一次请用真实单号测试链接能不能打开，不对的话在这里改。</p>
        <div class="grid2">
          <label>SPX Express <input id="tplSpx"></label>
          <label>J&amp;T Express <input id="tplJnt"></label>
        </div>
        <div class="actions"><button class="btn btn-primary" id="tplSave">保存</button></div>
        <p id="tplMsg" class="msg"></p>
      </details>

    </div>
  </div>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import {
      collection, query, where, getDocs, getDoc, doc, limit, setDoc, updateDoc,
      writeBatch, serverTimestamp, increment, orderBy
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import {
      requireAdmin, renderAdminNav, esc, toDate, fmtDate, computeBalance, compressImage,
      fmtPhone, waLink, CARRIERS, DEFAULT_TRACK_TPL, refreshRedeemBadge, redeemCode, logAdmin, readyWinners,
      normalizePhone, isValidPhone
    } from "./js/admin-common.js";
    import { noteBoxHTML, readNoteBox, setNoteBox, noteFields, noteFromDoc, noteBadge, loadNoteSets, bindNoteBoxes } from "./js/note-i18n.js";

    const $ = id => document.getElementById(id);
    renderAdminNav("redeem");

    let all = [];
    const members = {};   // uid → 会员资料
    const rewardCodes = {};   // 奖品 ID → 共用优惠码（多组轮替）
    const rewardInfo = {};    // 奖品 ID → { perMember, roundSince }
    const ledgers = {};   // uid → 积分流水
    let tab = "pending";
    // 从总览点进来时网址会带分页，例如 #toShip
    { const h = location.hash.slice(1);
      if (h && document.querySelector(`#tabs button[data-tab="${h}"]`)) {
        tab = h;
        document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("active", x.dataset.tab === tab));
      } }
    let trackTpl = { ...DEFAULT_TRACK_TPL };
    let adminEmail = "";
    const shipPhotos = {};   // 兑换 ID → 待上传的包裹照片

    const isGift = r => r.kind === "gift";
    // 🧪 测试兑换：批准时选的；测试的不扣库存、不用掉券码库、不算进数据
    const isTest = r => r.test === true;
    const isInternal = uid => !!(members[uid] && members[uid].internal && members[uid].internal.on);
    const TABS = {
      pending: r => r.status === "pending",
      toShip:  r => isGift(r) && (r.status === "approved" || r.status === "problem"),
      shipped: r => isGift(r) && r.status === "shipped",
      done:    r => r.status === "completed" || (!isGift(r) && r.status === "approved"),
      closed:  r => r.status === "rejected" || r.status === "cancelled",
    };
    const EMPTY = {
      pending: "目前没有待审核的兑换 🎉", toShip: "没有要发货的奖品 📦", shipped: "没有运送中的包裹",
      done: "还没有完成的兑换", closed: "没有记录",
    };

    $("tabs").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      tab = b.dataset.tab;
      document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("active", x === b));
      render();
    });

    // 🏆 中奖奖品：会员已领取（待审核）+ 待发货
    async function loadPrizeAlert() {
      try {
        const [s, ready] = await Promise.all([
          getDocs(query(collection(db, "prizeWins"), where("status", "in", ["claimed", "approved"]))),
          readyWinners().catch(() => []),
        ]);
        const list = s.docs.map(d => d.data());
        const a = list.filter(p => p.status === "claimed").length, b = list.length - a, r = ready.length;
        const parts = [r && `${r} 位得奖者已绑定，等你发奖`, a && `${a} 笔会员已领取，待审核`, b && `${b} 笔待发货`].filter(Boolean);
        $("prizeAlert").innerHTML = `<b>🏆 中奖奖品</b><span>${parts.join(" · ")}</span><span class="go">去处理 ➔</span>`;
        $("prizeAlert").classList.toggle("hidden", !parts.length);
      } catch (e) { console.warn("prize alert", e); }
    }

    async function load() {
      loadPrizeAlert();
      $("panel").innerHTML = `<p class="empty">载入中…</p>`;
      const [snap, secS] = await Promise.all([
        getDocs(collection(db, "redemptions")),
        getDocs(collection(db, "rewardSecrets")).catch(() => ({ docs: [] })),
      ]);
      secS.docs.forEach(d => {
        const x = d.data();
        vouchers[d.id] = x.voucher || null;
        rewardCodes[d.id] = Array.isArray(x.couponCodes) && x.couponCodes.length ? x.couponCodes : (x.couponCode ? [x.couponCode] : []);
      });
      try {
        (await getDocs(collection(db, "rewards"))).docs.forEach(d => {
          const x = d.data();
          rewardInfo[d.id] = { perMember: typeof x.perMember === "number" ? x.perMember : null, roundSince: toDate(x.roundSince) };
        });
      } catch (e) { console.warn("rewards", e); }
      all = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .map(r => ({ ...r, createdAt: toDate(r.createdAt), decidedAt: toDate(r.decidedAt) }));

      const recent = all.filter(r => !TABS.closed(r) && !TABS.done(r))
        .concat(all.filter(r => TABS.closed(r) || TABS.done(r))
          .sort((a, b) => (b.decidedAt || b.createdAt || 0) - (a.decidedAt || a.createdAt || 0)).slice(0, 150));
      await Promise.all([...new Set(recent.map(r => r.uid))].map(async uid => {
        if (members[uid]) return;
        const s = await getDoc(doc(db, "members", uid));
        members[uid] = s.exists() ? s.data() : { name: "(资料不存在)" };
      }));
      // 🛒 随单寄送的待发货：看会员有没有新订单（批准之后下的）
      const waitOrder = all.filter(r => TABS.toShip(r) && deliveryOf(r) === "withOrder");
      await Promise.all([...new Set(waitOrder.map(r => r.uid))].map(async uid => {
        try {
          const s = await getDocs(query(collection(db, "orders"), where("uid", "==", uid)));
          let best = null;
          s.docs.forEach(d => { const at = toDate(d.data().orderTime); if (at && (!best || at > best.at)) best = { no: d.id, at }; });
          if (best) latestOrder[uid] = best;
        } catch (e) { console.warn("orders", e); }
      }));
      await Promise.all([...new Set(all.filter(TABS.pending).map(r => r.uid))].map(async uid => {
        const s = await getDocs(query(collection(db, "pointsLedger"), where("uid", "==", uid)));
        ledgers[uid] = s.docs.map(d => d.data());
      }));
      render();
      refreshRedeemBadge();
    }

    // ---------- 共用显示 ----------
    const kindTag = r => isGift(r) ? '<span class="tag tag-blue kind">🎁 实体</span>' : '<span class="tag kind">🎫 优惠券</span>';
    const addrText = a => a ? `${a.name}\n${a.phone}\n${a.line1}${a.line2 ? ", " + a.line2 : ""}\n${a.postcode} ${a.city}, ${a.state}\n${a.country || "Malaysia"}` : "";
    // ---------- 📦 寄送方式：随单寄送（预设）/ 单独寄出 ----------
    const MY_STATES = ["Johor", "Kedah", "Kelantan", "Melaka", "Negeri Sembilan", "Pahang", "Perak", "Perlis", "Pulau Pinang",
      "Sabah", "Sarawak", "Selangor", "Terengganu", "W.P. Kuala Lumpur", "W.P. Labuan", "W.P. Putrajaya"];
    const deliveryOf = r => r.delivery === "withOrder" || r.delivery === "separate" ? r.delivery : (r.address ? "separate" : "withOrder");
    const dlvTag = r => deliveryOf(r) === "separate" ? '<span class="tag tag-blue">🚚 单独寄出</span>' : '<span class="tag tag-pink">📦 随单寄送</span>';
    const oneLine = a => `${esc(a.name)} · ${esc(fmtPhone(a.phone))}<br>${esc(a.line1)}${a.line2 ? ", " + esc(a.line2) : ""}, ${esc(a.postcode)} ${esc(a.city)}, ${esc(a.state)}`;
    const latestOrder = {};   // uid → 最新一张订单 { no, at }
    // edit = true：待发货里「更改寄送方式」用（多保存 / 取消按钮）
    function dlvBox(r, edit = false) {
      const id = esc(r.id), book = (members[r.uid] || {}).addresses || [];
      const dv = edit ? (deliveryOf(r) === "separate" ? "withOrder" : "separate") : deliveryOf(r);
      const first = r.address && !r.addrPending ? "cur" : book.length ? "book:0" : "ask";
      const opt = (v, title, body, off) => `<label class="dlv-opt${off ? " off" : ""}"><input type="radio" name="am_${id}" value="${v}" ${v === first && !off ? "checked" : ""} ${off ? "disabled" : ""}>
        <div><b>${title}</b>${body ? `<div class="a">${body}</div>` : ""}</div></label>`;
      return `
        <div class="dlv-box" data-dlvbox>
          <div class="mode-row"><span class="meta">寄送方式：</span>
            <label><input type="radio" name="dlv_${id}" value="withOrder" ${dv === "withOrder" ? "checked" : ""}> 📦 随单寄送</label>
            <label><input type="radio" name="dlv_${id}" value="separate" ${dv === "separate" ? "checked" : ""}> 🚚 单独寄出</label>
          </div>
          <div class="dlv-sep ${dv === "separate" ? "" : "hidden"}">
            ${r.address ? opt("cur", "使用这一笔现在的地址", oneLine(r.address)) : ""}
            ${opt("book:0", "① 使用会员的默认地址", book[0] ? oneLine(book[0]) : "会员还没有存地址", !book[0])}
            ${book.slice(1).map((a, i) => opt("book:" + (i + 1), "会员存的其他地址", oneLine(a))).join("")}
            ${opt("new", "② 使用新地址（你来填，只用在这一笔）", "")}
            <div class="dlv-new hidden">
              <div class="grid2"><label>收件人 <input data-a="name" maxlength="60" value="${esc((members[r.uid] || {}).name || "")}"></label>
                <label>电话 <input data-a="phone" value="${esc((members[r.uid] || {}).phone || "")}" placeholder="012-345 6789"></label></div>
              <label>地址 <input data-a="line1" maxlength="120"></label>
              <label>地址第 2 行（选填） <input data-a="line2" maxlength="120"></label>
              <div class="grid3"><label>邮编 <input data-a="postcode" maxlength="5" inputmode="numeric"></label>
                <label>城市 <input data-a="city" maxlength="60"></label>
                <label>州属 <select data-a="state"><option value="">请选择</option>${MY_STATES.map(x => `<option>${esc(x)}</option>`).join("")}</select></label></div>
            </div>
            ${opt("ask", "③ 请会员填写", "会员的铃铛和首页会提醒他填；填好之前不能发货")}
          </div>
          ${edit ? `<div class="actions"><button class="btn btn-primary" data-act="saveDlv">💾 保存寄送方式</button>
            <button class="btn btn-ghost" data-act="cancelDlv">取消</button></div>` : ""}
        </div>`;
    }
    // 读取寄送方式 → 要写进兑换的栏位，或 { error }
    function readDlv(item, r) {
      const id = CSS.escape(r.id);
      const dv = (item.querySelector(`input[name="dlv_${id}"]:checked`) || {}).value || "withOrder";
      if (dv === "withOrder") return { delivery: "withOrder", addrPending: false };
      const m = (item.querySelector(`input[name="am_${id}"]:checked`) || {}).value;
      if (!m) return { error: "请选择收货地址的方式" };
      if (m === "ask") return { delivery: "separate", addrPending: true, addrRequestedAt: serverTimestamp() };
      if (m === "cur") return { delivery: "separate", addrPending: false };
      if (m.startsWith("book:")) {
        const a = ((members[r.uid] || {}).addresses || [])[+m.slice(5)];
        return a ? { delivery: "separate", addrPending: false, address: a } : { error: "找不到这个地址" };
      }
      const v = k => ((item.querySelector(`.dlv-new [data-a="${k}"]`) || {}).value || "").trim();
      const a = { name: v("name").slice(0, 60), phone: normalizePhone(v("phone")), line1: v("line1").slice(0, 120), line2: v("line2").slice(0, 120),
        postcode: v("postcode"), city: v("city").slice(0, 60), state: v("state"), country: "Malaysia" };
      if (!a.name) return { error: "请填写收件人" };
      if (!isValidPhone(a.phone)) return { error: "电话号码格式不对" };
      if (!a.line1) return { error: "请填写地址" };
      if (!/^\d{5}$/.test(a.postcode)) return { error: "邮编要 5 位数字" };
      if (!a.city) return { error: "请填写城市" };
      if (!a.state) return { error: "请选择州属" };
      return { delivery: "separate", addrPending: false, address: a };
    }
    const dlvLabel = f => f.delivery === "withOrder" ? "随单寄送" : f.addrPending ? "单独寄出（请会员填地址）" : "单独寄出";

    function addrBox(r) {
      const a = r.address;
      if (!a) return "";
      return `
        <div class="addr-box">
          📍 <b>${esc(a.name)}</b> · ${esc(fmtPhone(a.phone))}<br>
          ${esc(a.line1)}${a.line2 ? ", " + esc(a.line2) : ""}<br>${esc(a.postcode)} ${esc(a.city)}, ${esc(a.state)}
          ${r.addressUpdatedAt ? `<div class="meta">会员于 ${fmtDate(toDate(r.addressUpdatedAt), true)} 修改过地址</div>` : ""}
          <div class="actions" style="margin-top:6px">
            <button class="btn btn-ghost" data-act="copyAddr">📋 复制地址</button>
            <a class="btn btn-ghost" href="${esc(waLink(a.phone, `Hi ${a.name}, ini The Mochii Shop 💕 berkenaan ganjaran ${r.rewardName}`))}" target="_blank">💬 WhatsApp</a>
          </div>
        </div>`;
    }
    function shipInfo(r) {
      const s = r.shipping || {};
      if (s.withOrder) return `
        <div class="addr-box">📦 <b>已随订单一起寄出</b>${s.orderNo ? ` · 订单 <code>${esc(s.orderNo)}</code>` : ""}
          <div class="meta">发货 ${fmtDate(toDate(r.shippedAt), true)}${s.by ? " · " + esc(s.by) : ""}</div>
          ${s.note ? `<div class="meta">留言：${noteBadge(s.note, s.noteI18n)}</div>` : ""}</div>`;
      return `
        <div class="addr-box">
          🚚 <b>${esc(s.carrierName || "")}</b> · <code style="word-break:break-all">${esc(s.trackingNo || "")}</code>
          ${s.trackingUrl ? `<div class="meta" style="word-break:break-all"><a href="${esc(s.trackingUrl)}" target="_blank">🔗 ${esc(s.trackingUrl)}</a></div>` : ""}
          <div class="meta">发货 ${fmtDate(toDate(r.shippedAt), true)}${s.weightKg ? ` · ${esc(s.weightKg)} kg` : ""}${s.dims && s.dims.l ? ` · ${esc(s.dims.l)}×${esc(s.dims.w)}×${esc(s.dims.h)} cm` : ""}${s.by ? " · " + esc(s.by) : ""}</div>
          ${s.note ? `<div class="meta">留言：${noteBadge(s.note, s.noteI18n)}</div>` : ""}
          ${(s.photos || []).length ? `<div class="photos">${s.photos.map(p => `<img src="${esc(p)}">`).join("")}</div>` : ""}
        </div>`;
    }
    // 🔒 优惠券奖品对应平台上哪一张券（编号、到期日）
    const vouchers = {};
    function voucherLine(r) {
      const v = !isGift(r) && vouchers[r.rewardId];
      if (!v) return "";
      const end = toDate(v.endAt), P = { shopee: "Shopee", tiktok: "TikTok" }[v.platform] || "其他";
      const expired = end && end <= new Date();
      return `<div class="meta">🔒 ${P}${v.name ? ` · <code>${esc(v.name)}</code>` : ""}${end ? ` · ${expired ? '<span class="tag tag-bad">平台券已过期</span>' : "到期 " + fmtDate(end)}` : ""}${v.note ? " · " + esc(v.note) : ""}</div>`;
    }
    function head(r, extra = "") {
      const m = members[r.uid] || {};
      return `
        <div class="item-head">
          <div style="min-width:0;flex:1">
            <div class="item-title">${kindTag(r)} ${isTest(r) ? '<span class="tag tag-warn">🧪 测试</span> ' : ""}${esc(r.rewardName)} · ${r.cost} 分 ${extra}</div>
            <div class="meta"><a href="member.html?uid=${encodeURIComponent(r.uid)}">${esc(m.name || "")}</a>${isInternal(r.uid) ? ' <span class="tag tag-pink">🏷️ 内部会员</span>' : ""} · ${esc(m.email || "")} · 申请于 ${fmtDate(r.createdAt, true)}${r.decidedAt ? " · 批准/处理 " + fmtDate(r.decidedAt, true) : ""}</div>
          </div>
          <code class="rno">${redeemCode(r.id)}</code>
        </div>${voucherLine(r)}`;
    }

    // 待发货：依寄送方式显示
    function toShipBody(r) {
      const change = `<button class="btn btn-ghost" data-act="changeDlv">🔁 改为${deliveryOf(r) === "separate" ? "随单寄送" : "单独寄出"}</button>`;
      if (deliveryOf(r) === "withOrder") {
        const lo = latestOrder[r.uid];
        const fresh = lo && r.decidedAt && lo.at > r.decidedAt;
        return `
          ${fresh ? `<div class="new-order">🛒 有新订单 <code>${esc(lo.no)}</code>（${fmtDate(lo.at, true)}），可以一起寄</div>`
                  : `<div class="meta" style="margin-top:6px">📦 等会员下一张订单，一起打包</div>`}
          <div class="ship-form">
            <b>📦 随单寄出</b>
            <div class="grid2" style="margin-top:8px">
              <label>一起寄的订单编号（选填） <input data-f="orderNo" value="${esc(fresh ? lo.no : "")}" autocomplete="off"></label>
            </div>
            <label style="margin-bottom:4px">给会员的留言（选填）</label>
            ${noteBoxHTML({ group: "ship", cls: "nt-ship", placeholder: "例如：已放在你的包裹里 🎁" })}
            <div class="actions">
              <button class="btn btn-ok" data-act="shipWithOrder">📦 标记已随单寄出</button>
              ${change}
              <button class="btn btn-bad" data-act="cancel">取消并退回积分</button>
            </div>
          </div>`;
      }
      if (r.addrPending) return `
          <div class="wait-addr">⏳ 等会员填写收货地址（${r.addrRequestedAt ? fmtDate(toDate(r.addrRequestedAt), true) + " 已通知" : "已通知"}）· 填好前不能发货</div>
          <div class="actions">
            <button class="btn btn-ghost" data-act="pickAddr">📍 改由我来选 / 填地址</button>
            ${change}
            <button class="btn btn-bad" data-act="cancel">取消并退回积分</button>
          </div>`;
      return `
          ${r.addressUpdatedAt && !r.addrPending && r.addrRequestedAt ? `<div class="new-order">✅ 地址已填，可以发货</div>` : ""}
          ${addrBox(r)}
          <div class="actions" style="margin-top:6px">${change}<button class="btn btn-ghost" data-act="pickAddr">📍 更换地址</button></div>
          ${shipForm(r)}`;
    }

    // ---------- 发货表单 ----------
    function shipForm(r) {
      const s = r.shipping || {};
      const carrier = s.carrier || "spx";
      const photos = shipPhotos[r.id] || s.photos || [];
      shipPhotos[r.id] = photos;
      return `
        <div class="ship-form">
          <b>${r.status === "problem" ? "🔁 重新发货" : "🚚 填写物流资料"}</b>
          <div class="grid3" style="margin-top:10px">
            <label>运输公司
              <select data-f="carrier">
                ${CARRIERS.map(c => `<option value="${c.id}" ${c.id === carrier ? "selected" : ""}>${c.label}</option>`).join("")}
              </select>
            </label>
            <label class="other-name ${carrier === "other" ? "" : "hidden"}">公司名称 <input data-f="carrierName" value="${esc(carrier === "other" ? s.carrierName || "" : "")}" placeholder="例如 Pos Laju"></label>
            <label>追踪单号 <input data-f="trackingNo" value="${esc(s.trackingNo || "")}" autocomplete="off"></label>
          </div>
          <label>查询链接（输入单号后自动生成，可以改） <input data-f="trackingUrl" value="${esc(s.trackingUrl || "")}" placeholder="https://…"></label>
          <div class="grid4">
            <label>重量 kg <input data-f="weightKg" type="number" step="0.01" min="0" value="${esc(s.weightKg || "")}"></label>
            <label>长 cm <input data-f="l" type="number" step="0.1" min="0" value="${esc((s.dims || {}).l || "")}"></label>
            <label>宽 cm <input data-f="w" type="number" step="0.1" min="0" value="${esc((s.dims || {}).w || "")}"></label>
            <label>高 cm <input data-f="h" type="number" step="0.1" min="0" value="${esc((s.dims || {}).h || "")}"></label>
          </div>
          <label>包裹照片（最多 3 张，选填） <input type="file" accept="image/*" multiple data-f="photos"></label>
          <div class="photos">${photos.map((p, i) => `<span class="ph-wrap"><img src="${esc(p)}"><button type="button" data-delphoto="${i}">✕</button></span>`).join("")}</div>
          <label style="margin-bottom:4px">给会员的留言（选填）</label>
          ${noteBoxHTML({ group: "ship", cls: "nt-ship", value: noteFromDoc(s.note, s.noteI18n), placeholder: "例如：已加送一个小礼物 🎁" })}
          <div class="actions">
            <button class="btn btn-ok" data-act="ship">📦 标记已发货</button>
            <button class="btn btn-bad" data-act="cancel">取消并退回积分</button>
          </div>
        </div>`;
    }

    function render() {
      // 分页数字
      document.querySelectorAll("#tabs button").forEach(b => {
        const n = all.filter(TABS[b.dataset.tab]).length;
        const urgent = b.dataset.tab === "pending" || b.dataset.tab === "toShip";
        b.innerHTML = b.textContent.replace(/\s*\d+$/, "") + (urgent || n ? ` <span class="cnt ${urgent && n ? "" : "zero"}">${n}</span>` : "");
      });

      const q = $("search").value.trim().toLowerCase().replace(/^#/, "");
      let list = all.filter(TABS[tab]);
      if (q) list = all.filter(r => r.id.toLowerCase().startsWith(q)
        || (r.rewardName || "").toLowerCase().includes(q)
        || ((members[r.uid] || {}).name || "").toLowerCase().includes(q));
      if (tab === "pending" || tab === "toShip") list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      else list.sort((a, b) => (toDate(b.completedAt) || toDate(b.shippedAt) || b.decidedAt || b.createdAt || 0)
                             - (toDate(a.completedAt) || toDate(a.shippedAt) || a.decidedAt || a.createdAt || 0));
      if (tab === "done" || tab === "closed") list = list.slice(0, 100);

      $("panel").innerHTML = list.length ? list.map(r => {
        let body = "";
        if (tab === "pending") {
          const bal = computeBalance(ledgers[r.uid] || [], all.filter(x => x.uid === r.uid), r.id);
          body = `
            <div class="meta">会员可用积分：<b>${bal.spendable}</b>
              ${bal.spendable >= r.cost ? '<span class="tag tag-ok">足够</span>' : '<span class="tag tag-bad">不足</span>'}
              ${bal.reserved ? ` · 其他审核中 ${bal.reserved} 分` : ""}${bal.pending ? ` · 待确认 ${bal.pending} 分` : ""}</div>
            ${limitWarn(r)}
            ${isGift(r) ? dlvBox(r) : ""}
            <div class="mode-row">
              <span class="meta">这一笔是：</span>
              <label><input type="radio" name="mode_${esc(r.id)}" value="real" checked> ✅ 真实兑换</label>
              <label><input type="radio" name="mode_${esc(r.id)}" value="test"> 🧪 测试（不扣库存、不用券码库、不算进数据）</label>
            </div>
            <div class="actions">
              ${noteBoxHTML({ group: "review", cls: "nt-review", placeholder: "备注（选填，会员看得到）" })}
              <button class="btn btn-ok" data-act="approve">✔ 批准</button>
              <button class="btn btn-bad" data-act="reject">✕ 拒绝</button>
            </div>`;
        } else if (tab === "toShip") {
          body = `
            ${r.status === "problem" ? `<div class="problem">⚠️ 配送异常${r.problemNote ? "：" + esc(r.problemNote) : ""}（${fmtDate(toDate(r.problemAt), true)}）</div>` : ""}
            ${r.note ? `<div class="meta">审核备注：${noteBadge(r.note, r.noteI18n)}</div>` : ""}
            ${toShipBody(r)}`;
        } else if (tab === "shipped") {
          if (r.shipping && r.shipping.withOrder) {
            body = `${shipInfo(r)}
            <div class="actions"><button class="btn btn-ok" data-act="complete">✔ 手动标记完成</button></div>`;
            return `<div class="item" data-id="${esc(r.id)}">${head(r, dlvTag(r))}${body}</div>`;
          }
          const autoAt = toDate(r.shippedAt) ? new Date(toDate(r.shippedAt).getTime() + 14 * 86400000) : null;
          body = `
            ${shipInfo(r)}${addrBox(r)}
            <div class="meta">会员还没确认收货${autoAt ? `，${fmtDate(autoAt)} 会自动完成` : ""}</div>
            <div class="actions">
              <button class="btn btn-ghost" data-act="problem">⚠️ 标记配送异常</button>
              <button class="btn btn-ghost" data-act="reopen">✏️ 修改物流资料</button>
              <button class="btn btn-ok" data-act="complete">✔ 手动标记完成</button>
            </div>`;
        } else if (tab === "done") {
          const rc = r.receipt || {};
          body = `
            ${r.couponCode ? `<div class="meta">券码：<code>${esc(r.couponCode)}</code></div>` : ""}
            ${isGift(r) ? shipInfo(r) : ""}
            ${isGift(r) ? `<div class="addr-box">✅ ${r.autoCompleted ? "自动完成" : r.adminCompleted ? "管理员标记完成" : "会员确认收货"} · ${fmtDate(toDate(r.completedAt), true)}
              ${rc.comment ? `<div>「${esc(rc.comment)}」</div>` : ""}
              ${rc.photo ? `<div class="photos"><img src="${esc(rc.photo)}" style="width:120px;height:120px"></div>` : ""}</div>` : ""}
            ${r.note ? `<div class="meta">备注：${noteBadge(r.note, r.noteI18n)}</div>` : ""}`;
        } else {
          body = `
            <div class="meta">${r.status === "rejected" ? "已拒绝" : r.adminCancelled ? "管理员取消（积分已退回）" : "会员自己取消"}
              ${r.cancelledAt ? " · " + fmtDate(toDate(r.cancelledAt), true) : ""}</div>
            ${r.note ? `<div class="meta">备注：${noteBadge(r.note, r.noteI18n)}</div>` : ""}
            ${r.cancelNote ? `<div class="meta">取消原因：${esc(r.cancelNote)}</div>` : ""}`;
        }
        const testBtn = tab === "pending" || tab === "closed" ? ""
          : `<div class="actions" style="margin-top:6px"><button class="btn btn-ghost" data-act="toggleTest">${isTest(r) ? "改为 ✅ 真实兑换" : "改为 🧪 测试"}</button></div>`;
        return `<div class="item" data-id="${esc(r.id)}">${head(r, isGift(r) && tab !== "pending" ? dlvTag(r) : "")}${body}${testBtn}</div>`;
      }).join("") : `<p class="empty">${EMPTY[tab]}</p>`;
    }

    // ---------- 🔁 每位会员限兑次数 ----------
    // 这一期（换新码之后）这位会员已经兑换几次：不算这一笔、拒绝和取消的
    function roundCount(r) {
      const since = (rewardInfo[r.rewardId] || {}).roundSince;
      return all.filter(x => x.id !== r.id && x.uid === r.uid && x.rewardId === r.rewardId
        && !["rejected", "cancelled"].includes(x.status) && (!since || !x.createdAt || x.createdAt >= since)).length;
    }
    function limitWarn(r) {
      const max = (rewardInfo[r.rewardId] || {}).perMember;
      if (typeof max !== "number") return "";
      const n = roundCount(r);
      return n >= max
        ? `<div class="meta"><span class="tag tag-bad">⚠️ 这位会员本期已兑换 ${n} 次（上限 ${max} 次），建议拒绝</span></div>`
        : `<div class="meta">本期第 ${n + 1} 次兑换（上限 ${max} 次）</div>`;
    }

    // ---------- 批准 / 拒绝 ----------
    async function approve(r, note, test, dv) {
      const rewardSnap = await getDoc(doc(db, "rewards", r.rewardId));
      const reward = rewardSnap.exists() ? rewardSnap.data() : null;

      const bal = computeBalance(ledgers[r.uid] || [], all.filter(x => x.uid === r.uid), r.id);
      if (bal.spendable < r.cost &&
          !confirm(`会员可用积分只有 ${bal.spendable}，不足 ${r.cost} 分。仍要批准吗？（会员积分会变成负数）`)) return false;
      if (!test && reward && typeof reward.stock === "number" && reward.stock <= 0 &&
          !confirm("这个奖品的库存已经是 0，仍要批准吗？")) return false;

      // 优惠券：共用优惠码（存在只有管理员能读的 rewardSecrets）；没有就从券码库取一组
      let couponCode = null, fromPool = false;
      if (reward && reward.type === "coupon") {
        const secret = await getDoc(doc(db, "rewardSecrets", r.rewardId));
        const sx = secret.exists() ? secret.data() : {};
        const codes = Array.isArray(sx.couponCodes) && sx.couponCodes.length ? sx.couponCodes
          : [sx.couponCode || reward.couponCode].filter(Boolean);
        if (codes.length) {
          // 🔁 多组共用码：给这位会员还没拿过的下一组
          const got = new Set(all.filter(x => x.id !== r.id && x.uid === r.uid && x.rewardId === r.rewardId && x.couponCode
            && !["rejected", "cancelled"].includes(x.status)).map(x => x.couponCode));
          couponCode = codes.find(c => !got.has(c));
          if (!couponCode) {
            alert(`这位会员已经拿过这个奖品全部 ${codes.length} 组优惠码（${codes.join("、")}），再给同一组在平台上会用不了。\n\n请按「拒绝」退回积分，或到「商城奖品」加一组新的优惠码。`);
            return false;
          }
        } else if (test) {
          couponCode = "TEST-" + r.id.slice(0, 6).toUpperCase();   // 测试：不用掉券码库
        } else {
          const cs = await getDocs(query(collection(db, "coupons"),
            where("rewardId", "==", r.rewardId), where("used", "==", false), limit(1)));
          if (cs.empty) {
            alert("这个优惠券奖品还没设定优惠码，券码库也用完了。请先到「商城奖品」设定优惠码。");
            return false;
          }
          couponCode = cs.docs[0].id;
          fromPool = true;
        }
      }

      const batch = writeBatch(db);
      const update = { status: "approved", decidedAt: serverTimestamp() };
      if (test) update.test = true;
      const nf = noteFields(note);
      if (nf.note) Object.assign(update, nf);
      if (couponCode) update.couponCode = couponCode;
      if (dv) Object.assign(update, dv);   // 📦 实体奖品的寄送方式（和地址）
      batch.update(doc(db, "redemptions", r.id), update);
      batch.set(doc(collection(db, "pointsLedger")), {
        uid: r.uid, delta: -r.cost, reason: "兑换：" + r.rewardName, orderNo: null,
        redemptionId: r.id, availableAt: serverTimestamp(), createdAt: serverTimestamp()
      });
      if (fromPool) {
        batch.update(doc(db, "coupons", couponCode), {
          used: true, usedBy: r.uid, redemptionId: r.id, usedAt: serverTimestamp()
        });
      }
      if (!test && reward && typeof reward.stock === "number") {
        batch.update(doc(db, "rewards", r.rewardId), { stock: increment(-1) });
      }
      await batch.commit();
      return true;
    }

    async function reject(r, note) {
      if (!confirm(`拒绝「${r.rewardName}」的兑换申请？积分不会被扣除。`)) return false;
      const update = { status: "rejected", decidedAt: serverTimestamp() };
      const nf = noteFields(note);
      if (nf.note) Object.assign(update, nf);
      await updateDoc(doc(db, "redemptions", r.id), update);
      return true;
    }

    // ---------- 已批准后取消：退回积分、加回库存 ----------
    async function cancelApproved(r) {
      const why = prompt(`取消「${r.rewardName}」并退回 ${r.cost} 分给会员？\n\n原因（会员看得到，选填，例如：缺货）：`, "");
      if (why === null) return false;
      const rewardSnap = await getDoc(doc(db, "rewards", r.rewardId));
      const reward = rewardSnap.exists() ? rewardSnap.data() : null;
      const batch = writeBatch(db);
      batch.update(doc(db, "redemptions", r.id), {
        status: "cancelled", adminCancelled: true, cancelledAt: serverTimestamp(), cancelNote: why.trim(), cancelledBy: adminEmail
      });
      batch.set(doc(collection(db, "pointsLedger")), {
        uid: r.uid, delta: r.cost, reason: "兑换取消退回：" + r.rewardName, orderNo: null,
        redemptionId: r.id, availableAt: serverTimestamp(), createdAt: serverTimestamp()
      });
      if (!r.test && reward && typeof reward.stock === "number") batch.update(doc(db, "rewards", r.rewardId), { stock: increment(1) });
      await batch.commit();
      return true;
    }

    // ---------- 发货 ----------
    function readShip(item) {
      const v = f => (item.querySelector(`[data-f="${f}"]`) || {}).value || "";
      const carrier = v("carrier");
      const c = CARRIERS.find(x => x.id === carrier) || CARRIERS[0];
      const num = x => x === "" ? null : Number(x);
      return {
        carrier,
        carrierName: carrier === "other" ? v("carrierName").trim() : c.name,
        trackingNo: v("trackingNo").trim(),
        trackingUrl: v("trackingUrl").trim(),
        weightKg: num(v("weightKg")),
        dims: { l: num(v("l")), w: num(v("w")), h: num(v("h")) },
        ...noteFields(readNoteBox(item.querySelector(".nt-ship"))),
      };
    }

    $("search").addEventListener("input", () => render());

    // 输入单号 / 换运输公司时，自动生成查询链接
    function autoUrl(item) {
      const s = readShip(item);
      const tpl = s.carrier === "other" ? "" : (trackTpl[s.carrier] || "");
      if (tpl && s.trackingNo) item.querySelector('[data-f="trackingUrl"]').value = tpl.replace("{no}", encodeURIComponent(s.trackingNo));
    }
    $("panel").addEventListener("input", e => {
      const item = e.target.closest(".item");
      if (item && e.target.dataset.f === "trackingNo") autoUrl(item);
    });
    $("panel").addEventListener("change", async e => {
      const item = e.target.closest(".item");
      if (!item) return;
      // 📦 寄送方式 / 地址选项
      const box = e.target.closest("[data-dlvbox]");
      if (box && e.target.name && e.target.name.startsWith("dlv_")) {
        box.querySelector(".dlv-sep").classList.toggle("hidden", e.target.value !== "separate");
        return;
      }
      if (box && e.target.name && e.target.name.startsWith("am_")) {
        box.querySelector(".dlv-new").classList.toggle("hidden", e.target.value !== "new");
        return;
      }
      const f = e.target.dataset.f;
      if (f === "carrier") {
        item.querySelector(".other-name").classList.toggle("hidden", e.target.value !== "other");
        if (e.target.value === "other") item.querySelector('[data-f="trackingUrl"]').value = "";
        autoUrl(item);
      }
      if (f === "photos") {
        const id = item.dataset.id;
        const list = shipPhotos[id] || [];
        for (const file of [...e.target.files].slice(0, 3 - list.length)) {
          let url = await compressImage(file, 640);
          if (url.length > 220000) url = await compressImage(file, 420);
          list.push(url);
        }
        shipPhotos[id] = list;
        const keep = readShip(item);
        render();
        restoreShip(id, keep);
      }
    });
    // 重新画面后把正在填的资料放回去
    function restoreShip(id, s) {
      const item = document.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
      if (!item) return;
      const set = (f, v) => { const el = item.querySelector(`[data-f="${f}"]`); if (el && v != null) el.value = v; };
      set("carrier", s.carrier); set("carrierName", s.carrier === "other" ? s.carrierName : "");
      set("trackingNo", s.trackingNo); set("trackingUrl", s.trackingUrl); set("weightKg", s.weightKg ?? "");
      set("l", s.dims.l ?? ""); set("w", s.dims.w ?? ""); set("h", s.dims.h ?? "");
      setNoteBox(item.querySelector(".nt-ship"), noteFromDoc(s.note, s.noteI18n));
      const on = item.querySelector(".other-name");
      if (on) on.classList.toggle("hidden", s.carrier !== "other");
    }

    $("panel").addEventListener("click", async e => {
      const item = e.target.closest(".item");
      if (!item) return;
      const r = all.find(x => x.id === item.dataset.id);
      if (!r) return;

      const del = e.target.dataset.delphoto;
      if (del !== undefined) {
        const keep = readShip(item);
        shipPhotos[r.id].splice(+del, 1);
        render(); restoreShip(r.id, keep);
        return;
      }
      const act = e.target.dataset.act;
      if (!act) return;

      if (act === "copyAddr") {
        try { await navigator.clipboard.writeText(addrText(r.address)); e.target.textContent = "已复制 ✓"; }
        catch { prompt("请手动复制：", addrText(r.address)); }
        return;
      }
      if (act === "changeDlv" || act === "pickAddr") {
        if (item.querySelector("[data-dlvbox]")) return;
        const box = document.createElement("div");
        box.innerHTML = dlvBox(act === "pickAddr" ? { ...r, delivery: "withOrder" } : r, true);
        // 「更换地址」：寄送方式固定为单独寄出
        (item.querySelector(".ship-form") || item.lastElementChild).before(box.firstElementChild);
        return;
      }
      if (act === "cancelDlv") { item.querySelector("[data-dlvbox]").remove(); return; }
      if (act === "reopen") {
        // 已发货 → 回到待发货修改（状态维持已发货，只是在这里重新填）
        tab = "toShip";
        r._reopen = true;
        r.status = "approved";
        document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("active", x.dataset.tab === "toShip"));
        render();
        return;
      }

      const buttons = item.querySelectorAll("button");
      buttons.forEach(b => b.disabled = true);
      try {
        let ok = true;
        if (act === "approve") {
          const mode = item.querySelector(`input[name="mode_${CSS.escape(r.id)}"]:checked`);
          const dv = isGift(r) ? readDlv(item, r) : null;
          if (dv && dv.error) { alert(dv.error); ok = false; }
          else ok = await approve(r, readNoteBox(item.querySelector(".nt-review")), !!mode && mode.value === "test", dv);
          if (ok && dv) logAdmin("redeem", `寄送方式：${(members[r.uid] || {}).name || "会员"} 的「${r.rewardName}」→ ${dlvLabel(dv)}`, "redeem.html#toShip");
        }
        if (act === "saveDlv") {
          const dv = readDlv(item, r);
          if (dv.error) { alert(dv.error); ok = false; }
          else {
            await updateDoc(doc(db, "redemptions", r.id), dv);
            logAdmin("redeem", `更改寄送方式：${(members[r.uid] || {}).name || "会员"} 的「${r.rewardName}」→ ${dlvLabel(dv)}`, "redeem.html#toShip");
          }
        }
        if (act === "shipWithOrder") {
          const v = f => ((item.querySelector(`[data-f="${f}"]`) || {}).value || "").trim();
          if (!confirm("标记这个奖品已随订单一起寄出？")) ok = false;
          else await updateDoc(doc(db, "redemptions", r.id), {
            status: "shipped", shippedAt: serverTimestamp(),
            shipping: { withOrder: true, orderNo: v("orderNo").replace(/\s/g, "").toUpperCase().slice(0, 40), ...noteFields(readNoteBox(item.querySelector(".nt-ship"))), by: adminEmail },
            problemNote: null,
          });
        }
        if (act === "toggleTest") {
          // 批准后改为测试 / 真实：库存跟着调整
          const toTest = !isTest(r);
          if (!confirm(toTest ? "改为 🧪 测试？库存会加回 1，这笔不算进数据。" : "改为 ✅ 真实兑换？库存会扣 1。")) ok = false;
          else {
            const rs = await getDoc(doc(db, "rewards", r.rewardId));
            const batch = writeBatch(db);
            batch.update(doc(db, "redemptions", r.id), { test: toTest });
            if (rs.exists() && typeof rs.data().stock === "number" && r.status !== "cancelled" && r.status !== "rejected") {
              batch.update(doc(db, "rewards", r.rewardId), { stock: increment(toTest ? 1 : -1) });
            }
            await batch.commit();
          }
        }
        if (act === "reject") ok = await reject(r, readNoteBox(item.querySelector(".nt-review")));
        if (act === "cancel") ok = await cancelApproved(r);
        if (act === "ship") {
          const s = readShip(item);
          if (!s.carrierName) { alert("请填写运输公司名称"); ok = false; }
          else if (!s.trackingNo) { alert("请填写追踪单号"); ok = false; }
          else if (s.trackingUrl && !/^https:\/\//i.test(s.trackingUrl)) { alert("查询链接要以 https:// 开头"); ok = false; }
          else {
            await updateDoc(doc(db, "redemptions", r.id), {
              status: "shipped",
              shippedAt: serverTimestamp(),
              shipping: { ...s, photos: shipPhotos[r.id] || [], by: adminEmail },
              problemNote: null,
            });
            delete shipPhotos[r.id];
          }
        }
        if (act === "problem") {
          const why = prompt("配送异常的原因（会员看得到，例如：地址不完整、包裹被退回）：", "");
          if (why === null) ok = false;
          else await updateDoc(doc(db, "redemptions", r.id), { status: "problem", problemAt: serverTimestamp(), problemNote: why.trim() });
        }
        if (act === "complete") {
          if (!confirm("手动标记这笔兑换已完成？")) ok = false;
          else await updateDoc(doc(db, "redemptions", r.id), { status: "completed", completedAt: serverTimestamp(), adminCompleted: true });
        }
        const LOG = { approve: "批准兑换", reject: "拒绝兑换", cancel: "取消兑换并退回积分", ship: "兑换已发货", shipWithOrder: "兑换已随单寄出",
          problem: "标记配送异常", complete: "标记兑换完成", toggleTest: isTest(r) ? "改为真实兑换" : "改为测试兑换" };
        if (ok && LOG[act]) logAdmin("redeem", `${LOG[act]}：${(members[r.uid] || {}).name || "会员"} 的「${r.rewardName}」${redeemCode(r.id)}`, "redeem.html");
        if (ok) await load();
        else buttons.forEach(b => b.disabled = false);
      } catch (err) {
        alert("操作失败：" + err.message);
        buttons.forEach(b => b.disabled = false);
      }
    });

    // ---------- 查询链接模板 ----------
    $("tplSave").addEventListener("click", async () => {
      trackTpl = { spx: $("tplSpx").value.trim(), jnt: $("tplJnt").value.trim() };
      try {
        await setDoc(doc(db, "settings", "shipping"), { trackTpl, updatedAt: serverTimestamp() }, { merge: true });
        logAdmin("settings", "修改了运输公司查询链接", "redeem.html");
        $("tplMsg").textContent = "已保存 ✅"; $("tplMsg").className = "msg ok";
      } catch (err) { $("tplMsg").textContent = "保存失败：" + err.message; $("tplMsg").className = "msg err"; }
    });

    $("reloadBtn").addEventListener("click", () => load());

    requireAdmin(async user => {
      adminEmail = user.email || "";
      try {
        const s = await getDoc(doc(db, "settings", "shipping"));
        if (s.exists() && s.data().trackTpl) trackTpl = { ...trackTpl, ...s.data().trackTpl };
      } catch (e) {}
      $("tplSpx").value = trackTpl.spx || "";
      $("tplJnt").value = trackTpl.jnt || "";
      bindNoteBoxes();
      await loadNoteSets();
      load().catch(e => { $("panel").innerHTML = `<p class="empty">载入失败：${esc(e.message)}</p>`; });
    });
  </script>
</body>
</html>
