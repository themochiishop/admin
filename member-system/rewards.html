<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../logo.png">
  <title>奖品管理 · 会员系统 Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="gate" class="gate"><div class="gate-card"><p>载入中…</p></div></div>

  <div id="app" class="hidden">
    <header id="adminHeader"></header>

    <div class="container">
      <div class="page-head">
        <div>
          <h2>奖品管理</h2>
          <p class="muted">新增 / 编辑奖品、上下架，以及补充优惠券码</p>
        </div>
        <button id="newBtn" class="btn btn-primary">＋ 新增奖品</button>
      </div>

      <!-- 编辑表单 -->
      <div id="formPanel" class="panel hidden">
        <h3 id="formTitle">新增奖品</h3>
        <form id="rewardForm">
          <input type="hidden" id="rid">
          <label>奖品名称
            <input id="rname" required maxlength="60" placeholder="例如：RM5 优惠券 / Mochii 手链一条">
          </label>
          <label>说明（会员看得到）
            <textarea id="rdesc" rows="2" maxlength="200" placeholder="例如：Shopee 店铺优惠券，满 RM30 可用，有效期 30 天"></textarea>
          </label>
          <label>商品图片（选填，会员兑换页会显示）
  <input type="file" id="rimage" accept="image/*">
</label>
<div id="rimageBox" class="hidden actions" style="margin:-4px 0 12px">
  <img id="rpreview" style="width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid #e2e8f0">
  <button type="button" class="btn btn-ghost" id="rimageRemove">移除图片</button>
</div>
          <div class="grid2">
            <label>所需积分
              <input type="number" id="rcost" required min="1" step="1">
            </label>
            <label>类型
              <select id="rtype">
                <option value="coupon">🎫 优惠券（批准时自动分配券码）</option>
                <option value="gift">🎁 实体奖品（你手动寄出）</option>
              </select>
            </label>
            <label>库存（留空 = 不限）
              <input type="number" id="rstock" min="0" step="1">
            </label>
            <label>商城分类
              <select id="rcat"></select>
            </label>
            <label>排序（数字小的排前面）
              <input type="number" id="rsort" step="1" value="10">
            </label>
          </div>
                    <div id="couponBox" class="panel" style="background:#f8fafc;padding:14px;margin-bottom:12px">
            <label>优惠码格式
              <select id="rcformat"></select>
            </label>
            <label>优惠码
              <div style="display:flex;align-items:center;margin-top:4px">
                <span id="rcprefix" style="padding:9px 11px;background:#e2e8f0;border:1px solid #cbd5e1;border-right:none;border-radius:8px 0 0 8px;color:#64748b;font-weight:700"></span>
                <input id="rcsuffix" style="margin:0;text-transform:uppercase" autocomplete="off">
              </div>
              <small class="muted" id="rchint"></small>
            </label>
            <p class="meta">完整优惠码：<b id="rcfull">-</b>（所有兑换者共用这个码）</p>
          </div>
          <label class="inline"><input type="checkbox" id="ractive" checked> 上架（会员看得到）</label>
          <div class="actions">
            <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
            <button type="button" class="btn btn-ghost" id="cancelBtn">取消</button>
          </div>
          <p class="muted" style="font-size:.8rem;margin-top:8px">
            ⚠️ 修改名称或积分后，会员已提交但还没审核的申请仍按旧资料处理；新申请会用新资料。
          </p>
          <p id="formMsg" class="msg"></p>
        </form>
      </div>

      <div id="list"><p class="empty">载入中…</p></div>
    </div>
  </div>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import {
      collection, getDocs, doc, addDoc, updateDoc, setDoc, writeBatch, serverTimestamp, deleteField
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import { requireAdmin, renderAdminNav, esc, COUPON_FORMATS, SHOP_CATS, catOf } from "./js/admin-common.js";
    const $ = id => document.getElementById(id);
    renderAdminNav("rewards");

    let rewards = [];
    let coupons = {};   // code → 资料
    
    // ---------- 优惠码格式 ----------
    $("rcformat").innerHTML = COUPON_FORMATS.map(f => `<option value="${f.id}">${f.label}</option>`).join("");
    function fmtOf(id) { return COUPON_FORMATS.find(f => f.id === id) || COUPON_FORMATS[0]; }

    function updateCouponUI() {
      const f = fmtOf($("rcformat").value);
      $("couponBox").classList.toggle("hidden", $("rtype").value !== "coupon");
      $("rcprefix").textContent = f.prefix;
      $("rcprefix").style.display = f.prefix ? "" : "none";
      $("rcsuffix").style.borderRadius = f.prefix ? "0 8px 8px 0" : "8px";
      $("rcsuffix").maxLength = f.maxLen;
      $("rcsuffix").value = $("rcsuffix").value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, f.maxLen);
      $("rchint").textContent = `请输入英文字 A-Z、数字 0-9，${f.minLen}–${f.maxLen} 个字（不包括前缀）`;
      $("rcfull").textContent = $("rcsuffix").value ? f.prefix + $("rcsuffix").value : "-";
    }
    $("rtype").addEventListener("change", updateCouponUI);
    $("rcformat").addEventListener("change", updateCouponUI);
    $("rcsuffix").addEventListener("input", updateCouponUI);
    let currentImage = null;   // 目前表单里的图片

// 把图片缩到最长边 max 像素，转成小档案
function compressImage(file, max = 480) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      let url = c.toDataURL("image/webp", 0.8);
      if (!url.startsWith("data:image/webp")) url = c.toDataURL("image/jpeg", 0.82);
      URL.revokeObjectURL(img.src);
      resolve(url);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function showPreview(url) {
  $("rimageBox").classList.toggle("hidden", !url);
  if (url) $("rpreview").src = url;
}

$("rimage").addEventListener("change", async () => {
  const file = $("rimage").files[0];
  if (!file) return;
  let url = await compressImage(file, 480);
  if (url.length > 300000) url = await compressImage(file, 320); // 太大再缩一次
  currentImage = url;
  showPreview(url);
});

$("rimageRemove").addEventListener("click", () => {
  currentImage = null;
  $("rimage").value = "";
  showPreview(null);
});

    // 🔒 共用优惠码存在 rewardSecrets（只有管理员能读），不放在会员读得到的奖品资料里
    async function load() {
      const [rs, cs, ss] = await Promise.all([
        getDocs(collection(db, "rewards")),
        getDocs(collection(db, "coupons")),
        getDocs(collection(db, "rewardSecrets"))
      ]);
      const secrets = {};
      ss.docs.forEach(d => secrets[d.id] = d.data());

      // 旧资料：优惠码还在奖品资料里的，自动搬过去
      const legacy = rs.docs.filter(d => d.data().couponCode);
      if (legacy.length) {
        const batch = writeBatch(db);
        legacy.forEach(d => {
          if (!secrets[d.id] || !secrets[d.id].couponCode) {
            secrets[d.id] = { couponCode: d.data().couponCode };
            batch.set(doc(db, "rewardSecrets", d.id), { couponCode: d.data().couponCode, updatedAt: serverTimestamp() });
          }
          batch.update(doc(db, "rewards", d.id), { couponCode: deleteField() });
        });
        await batch.commit();
        console.info("已把 " + legacy.length + " 个奖品的优惠码移到 rewardSecrets");
      }

      rewards = rs.docs.map(d => ({ id: d.id, ...d.data(), couponCode: (secrets[d.id] || {}).couponCode || null }))
        .sort((a, b) => (a.sortOrder ?? 999) - (b.sortOrder ?? 999) || a.cost - b.cost);
      coupons = {};
      cs.docs.forEach(d => coupons[d.id] = d.data());
      render();
    }

    function couponStats(rewardId) {
      let total = 0, unused = 0;
      Object.values(coupons).forEach(c => {
        if (c.rewardId !== rewardId) return;
        total++;
        if (!c.used) unused++;
      });
      return { total, unused };
    }

    function render() {
      $("list").innerHTML = rewards.length ? rewards.map(r => {
        const isCoupon = r.type === "coupon";
        const cs = isCoupon ? couponStats(r.id) : null;
        return `
          <div class="item" data-id="${esc(r.id)}">
          <div class="item-head">
  ${r.image ? `<img src="${esc(r.image)}" style="width:56px;height:56px;object-fit:cover;border-radius:8px">` : ""}
  <div style="flex:1">
                <div class="item-title">${isCoupon ? "🎫" : "🎁"} ${esc(r.name)} · ${r.cost} 分
                  ${r.active ? '<span class="tag tag-ok">上架中</span>' : '<span class="tag">已下架</span>'}
                </div>
                ${r.description ? `<div class="meta">${esc(r.description)}</div>` : ""}
                <div class="meta">
                  ${(SHOP_CATS.find(c => c.id === catOf(r)) || {}).label || ""} · 库存：${typeof r.stock === "number" ? r.stock : "不限"} · 排序 ${r.sortOrder ?? "-"}
                                   ${isCoupon && r.couponCode ? ` · 优惠码：<b>${esc(r.couponCode)}</b>（共用）` : ""}
                  ${isCoupon && !r.couponCode ? ` · 券码：<b>${cs.unused}</b> 组可用 / 共 ${cs.total} 组
                    ${cs.unused === 0 ? '<span class="tag tag-bad">需补充</span>' : cs.unused < 5 ? '<span class="tag tag-warn">快用完</span>' : ""}` : ""}
                </div>
              </div>
            </div>
            <div class="actions">
              <button class="btn btn-ghost" data-act="edit">编辑</button>
              <button class="btn btn-ghost" data-act="toggle">${r.active ? "下架" : "上架"}</button>
              ${isCoupon && !r.couponCode ? `<button class="btn btn-ghost" data-act="codes">＋ 补充券码</button>` : ""}            </div>
            ${isCoupon ? `
              <div class="codes-box hidden" style="margin-top:10px">
                <label>每行一组券码（从 Shopee / TikTok 后台复制）
                  <textarea rows="5" class="codes-input" placeholder="MOCHII5A1B2&#10;MOCHII5C3D4"></textarea>
                </label>
                <button class="btn btn-primary" data-act="saveCodes">加入券码库</button>
                <p class="msg codes-msg"></p>
              </div>` : ""}
          </div>`;
      }).join("") : `<p class="empty">还没有奖品，按右上角「新增奖品」开始</p>`;
    }

    function openForm(r) {
      $("formPanel").classList.remove("hidden");
      $("formTitle").textContent = r ? "编辑奖品" : "新增奖品";
      $("rid").value = r ? r.id : "";
      $("rname").value = r ? r.name : "";
      $("rdesc").value = r ? (r.description || "") : "";
      $("rcost").value = r ? r.cost : "";
      $("rtype").value = r ? r.type : "coupon";
      $("rstock").value = r && typeof r.stock === "number" ? r.stock : "";
      $("rsort").value = r ? (r.sortOrder ?? 10) : 10;
      $("rcat").innerHTML = SHOP_CATS.map(c => `<option value="${c.id}">${c.label}</option>`).join("");
      $("rcat").value = r ? catOf(r) : "coupon";
      $("ractive").checked = r ? !!r.active : true;
            const cf = fmtOf(r && r.couponFormat);
      $("rcformat").value = cf.id;
      $("rcsuffix").value = r && r.couponCode ? r.couponCode.slice(cf.prefix.length) : "";
      updateCouponUI();
      currentImage = r ? (r.image || null) : null;
$("rimage").value = "";
showPreview(currentImage);
      $("formMsg").textContent = "";
      $("formPanel").scrollIntoView({ behavior: "smooth" });
    }

    $("newBtn").addEventListener("click", () => openForm(null));
    $("cancelBtn").addEventListener("click", () => $("formPanel").classList.add("hidden"));

    $("rewardForm").addEventListener("submit", async e => {
      e.preventDefault();
      const stockText = $("rstock").value.trim();
      const data = {
        name: $("rname").value.trim(),
        description: $("rdesc").value.trim(),
        cost: parseInt($("rcost").value, 10),
        type: $("rtype").value,
        stock: stockText === "" ? null : parseInt(stockText, 10),
        sortOrder: parseInt($("rsort").value, 10) || 0,
        category: $("rcat").value,
        active: $("ractive").checked,
        image: currentImage,
        updatedAt: serverTimestamp()
      };
      if (!data.name || !(data.cost > 0)) {
        $("formMsg").textContent = "请填写名称和正确的积分";
        $("formMsg").className = "msg err";
        return;
      }
            if (data.type === "coupon") {
        const f = fmtOf($("rcformat").value);
        const suffix = $("rcsuffix").value.trim().toUpperCase();
        if (suffix && !new RegExp(`^[A-Z0-9]{${f.minLen},${f.maxLen}}$`).test(suffix)) {
          $("formMsg").textContent = `优惠码只能用 A-Z、0-9，${f.minLen}–${f.maxLen} 个字（不包括前缀）`;
          $("formMsg").className = "msg err";
          return;
        }
        data.couponFormat = f.id;
      }
      // 优惠码另存（会员读不到）
      const code = data.type === "coupon" && $("rcsuffix").value.trim()
        ? fmtOf($("rcformat").value).prefix + $("rcsuffix").value.trim().toUpperCase() : null;
      $("saveBtn").disabled = true;
      try {
        const id = $("rid").value;
        let rid = id;
        if (id) await updateDoc(doc(db, "rewards", id), { ...data, couponCode: deleteField() });
        else rid = (await addDoc(collection(db, "rewards"), { ...data, createdAt: serverTimestamp() })).id;
        await setDoc(doc(db, "rewardSecrets", rid), { couponCode: code, updatedAt: serverTimestamp() });
        $("formPanel").classList.add("hidden");
        await load();
      } catch (err) {
        $("formMsg").textContent = "保存失败：" + err.message;
        $("formMsg").className = "msg err";
      } finally {
        $("saveBtn").disabled = false;
      }
    });

    $("list").addEventListener("click", async e => {
      const act = e.target.dataset.act;
      if (!act) return;
      const item = e.target.closest(".item");
      const r = rewards.find(x => x.id === item.dataset.id);
      if (!r) return;

      if (act === "edit") openForm(r);

      if (act === "toggle") {
        e.target.disabled = true;
        try {
          await updateDoc(doc(db, "rewards", r.id), { active: !r.active, updatedAt: serverTimestamp() });
          await load();
        } catch (err) { alert("失败：" + err.message); e.target.disabled = false; }
      }

      if (act === "codes") item.querySelector(".codes-box").classList.toggle("hidden");

      if (act === "saveCodes") {
        const msg = item.querySelector(".codes-msg");
        const lines = item.querySelector(".codes-input").value
          .split(/\r?\n/).map(s => s.trim()).filter(Boolean);
        const fresh = [], skipped = [];
        new Set(lines).forEach(code => {
          if (code.includes("/") || coupons[code]) skipped.push(code); else fresh.push(code);
        });
        if (!fresh.length) {
          msg.textContent = "没有新券码可加入" + (skipped.length ? `（${skipped.length} 组已存在或格式不对）` : "");
          msg.className = "msg codes-msg err";
          return;
        }
        e.target.disabled = true;
        try {
          for (let i = 0; i < fresh.length; i += 400) {
            const batch = writeBatch(db);
            fresh.slice(i, i + 400).forEach(code => batch.set(doc(db, "coupons", code), {
              rewardId: r.id, used: false, createdAt: serverTimestamp()
            }));
            await batch.commit();
          }
          await load();
          alert(`已加入 ${fresh.length} 组券码` + (skipped.length ? `，跳过 ${skipped.length} 组（已存在或含有 /）` : ""));
        } catch (err) {
          msg.textContent = "加入失败：" + err.message;
          msg.className = "msg codes-msg err";
          e.target.disabled = false;
        }
      }
    });

    requireAdmin(() => load().catch(e => {
      $("list").innerHTML = `<p class="empty">载入失败：${esc(e.message)}</p>`;
    }));
  </script>
</body>
</html>
