<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../logo.png">
  <title>中奖奖品 · 会员系统 Admin</title>
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/theme.js"></script>
  <style>
    .tabs { flex-wrap: wrap; }
    .tabs button .cnt { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: #e11d48; color: #fff; font-size: .7rem; }
    .tabs button .cnt.zero { background: var(--line2); }
    .step-h { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink); margin: 18px 0 10px; }
    .step-h:first-child { margin-top: 0; }
    .step-h .n { width: 22px; height: 22px; border-radius: 50%; background: #db2777; color: #fff; font-size: .75rem; display: inline-flex; align-items: center; justify-content: center; }
    .periods { display: flex; gap: 6px; flex-wrap: wrap; }
    .periods button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line2); background: var(--card); cursor: pointer; font-weight: 600; color: var(--text2); font-size: .85rem; }
    .periods button.on { background: var(--navy); color: #fff; border-color: #0f172a; }
    .prize-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .prize-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); cursor: pointer; font-size: .85rem; color: var(--ink); text-align: left; }
    .prize-chip:hover { border-color: #db2777; }
    .prize-chip.on { border-color: #db2777; background: var(--pink-bg); box-shadow: 0 0 0 2px rgba(219,39,119,.15); }
    .pthumb { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; background: var(--soft); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.1rem; }
    .wtable { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .wtable th, .wtable td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--soft); vertical-align: middle; }
    .wtable th { color: var(--muted); font-weight: 600; font-size: .78rem; border-top: none; }
    .wtable td.act { text-align: right; white-space: nowrap; }
    .wtable .btn { padding: 5px 10px; font-size: .8rem; }
    @media (max-width: 640px) {
      .wtable thead { display: none; }
      .wtable tr { display: block; border-top: 1px solid var(--line); padding: 8px 0; }
      .wtable td { display: block; border: none; padding: 2px 0; }
      .wtable td.act { text-align: left; padding-top: 6px; }
    }
    .mpick { position: relative; }
    .mres { position: absolute; left: 0; right: 0; top: 100%; z-index: 5; background: var(--card); border: 1px solid var(--line2); border-radius: 8px; margin-top: 2px; max-height: 260px; overflow-y: auto; box-shadow: 0 8px 20px rgba(0,0,0,.08); }
    .mres button { display: block; width: 100%; text-align: left; padding: 8px 12px; border: none; background: none; cursor: pointer; font-size: .86rem; color: var(--ink); border-top: 1px solid var(--soft); }
    .mres button:first-child { border-top: none; }
    .mres button:hover { background: var(--pink-bg); }
    .chosen { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #bbf7d0; background: var(--green-bg); border-radius: 10px; margin-top: 4px; font-size: .88rem; }
    .chosen .x { margin-left: auto; }
    .dlv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
    @media (max-width: 600px) { .dlv { grid-template-columns: 1fr; } }
    .dlv label { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; margin: 0; background: var(--card); color: var(--ink); }
    .dlv label:has(input:checked) { border-color: #db2777; background: var(--pink-bg); }
    .dlv input { width: auto; margin: 3px 0 0; }
    .dlv b { display: block; font-size: .92rem; }
    .dlv span { font-size: .8rem; color: var(--muted); }
    .dlv.bad label { border-color: #fca5a5; }
    .req { color: #dc2626; }
    .ship-form { background: var(--blue-bg); border: 1px solid #bae6fd; border-radius: 12px; padding: 14px; margin-top: 10px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 10px; }
    @media (max-width: 640px) { .grid3 { grid-template-columns: 1fr 1fr; } }
    .addr-box { background: var(--soft2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: .88rem; line-height: 1.6; margin-top: 8px; }
    .photos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .photos img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
    .photos .ph-wrap { position: relative; }
    .photos .ph-wrap button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: none; background: #dc2626; color: #fff; font-size: .7rem; cursor: pointer; }
    .note-row { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
    .note-row select { flex: 1 1 220px; margin: 0; }
    .note-row .btn { flex-shrink: 0; }
    .note-mgr { background: var(--soft2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 8px 0 12px; }
    .note-mgr h4 { font-size: .9rem; color: var(--ink); margin: 0 0 8px; }
    .note-mgr .nm-fixed .ntm-btn { display: none; }
    .note-mgr .nm-lbl { display: block; font-size: .8rem; color: var(--text2); margin-top: 6px; }
    .addr-edit { background: var(--card); border: 1px solid #fbcfe8; border-radius: 10px; padding: 12px; margin-top: 8px; }
    .addr-edit .grid3 { margin-top: 0; }
    .deadline.soon { color: #dc2626; font-weight: 700; }
    .ready-box { background: var(--orange-bg); border: 1px solid #fdba74; border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
    .ready-box b.h { color: var(--orange-tx); }
    .ready-box ul { list-style: none; margin-top: 8px; }
    .ready-box li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid #fed7aa; font-size: .88rem; }
    .ready-box li:first-child { border-top: none; }
    .ready-done { margin-top: 8px; font-size: .84rem; }
    .ready-done summary { cursor: pointer; color: var(--muted); }
    .ready-box.only-done { background: var(--soft2); border-color: var(--line); }
    .ready-box .btn { padding: 6px 10px; font-size: .8rem; }
    .ready-box li .btn { margin-left: auto; padding: 5px 12px; font-size: .8rem; }
    .rno { font-size: .72rem; color: var(--muted); flex-shrink: 0; align-self: flex-start; }
    .tag-blue { background: var(--blue-bg2); color: var(--blue-tx); }
    .item-row { display: flex; gap: 12px; align-items: flex-start; }
    .item-row .pthumb { width: 52px; height: 52px; }
    /* ===== 后台会员系统模板1：左边列表、右边详情（手机：先列表，点了全屏看详情）===== */
    .add-panel > summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; color: var(--ink); list-style: none; display: flex; align-items: center; gap: 8px; }
    .add-panel > summary::-webkit-details-marker { display: none; }
    .add-panel > summary::after { content: "展开 ▾"; margin-left: auto; font-size: .8rem; color: var(--muted); font-weight: 600; }
    .add-panel[open] > summary::after { content: "收起 ▴"; }
    .add-panel[open] > summary { margin-bottom: 12px; }
    .pz-split { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; align-items: start; }
    .pz-list { background: var(--card); border: 1px solid var(--line); border-radius: 12px; max-height: calc(100vh - 140px); overflow-y: auto; position: sticky; top: 16px; }
    .pz-row { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--soft); background: transparent; cursor: pointer; color: var(--ink); font-size: .86rem; }
    .pz-row:hover { background: var(--soft2); }
    .pz-row.on { background: var(--pink-bg); box-shadow: inset 3px 0 0 #db2777; }
    .pz-row .pthumb { width: 38px; height: 38px; }
    .pz-row .t { flex: 1; min-width: 0; }
    .pz-row .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pz-row .t small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pz-row .r { text-align: right; flex-shrink: 0; font-size: .72rem; color: var(--muted); }
    .pz-detail .item { margin: 0; }
    .pz-back { display: none; }
    .bundle-box { background: var(--blue-bg); border: 1px solid var(--blue-bg2); border-radius: 10px; padding: 10px 12px; margin-top: 8px; font-size: .86rem; }
    .bundle-box ul { list-style: none; margin: 6px 0 0; }
    .bundle-box li { padding: 3px 0; }
    .mg-list { margin: 8px 0 0; display: grid; gap: 6px; }
    .mg-list label { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 400; cursor: pointer; }
    .mg-list label.off { opacity: .5; cursor: not-allowed; }
    .mg-list code { font-size: .78rem; }
    .merge-box { background: var(--amber-bg); border: 1px solid var(--amber-bg2); border-radius: 10px; padding: 10px 12px; margin-top: 8px; font-size: .86rem; color: var(--ink); }
    .merge-box label { margin: 8px 0 0; }
    @media (max-width: 899px) {
      .pz-split { grid-template-columns: 1fr; }
      .pz-list { position: static; max-height: none; }
      .pz-split .pz-detail { display: none; }
      .pz-split.show-detail .pz-list, .pz-split.show-detail ~ .list-tools { display: none; }
      .pz-split.show-detail .pz-detail { display: block; }
      .pz-back { display: inline-flex; margin-bottom: 10px; }
    }
  </style>
</head>
<body>
  <div id="gate" class="gate"><div class="gate-card"><p>载入中…</p></div></div>

  <div id="app" class="hidden">
    <header id="adminHeader"></header>

    <div class="container">
      <div class="page-head">
        <div>
          <h2>🏆 中奖奖品</h2>
          <p class="muted">从「每月抽奖」读取奖品和中奖名单，发给会员。会员在「我的兑换」上方看到领取提醒，按领取后进入待审核。</p>
        </div>
        <button id="reloadBtn" class="btn btn-ghost">🔄 重新整理</button>
      </div>

      <!-- ⏳ 得奖者已注册并绑定中奖订单，还没发奖（放在最上面，一眼看到） -->
      <div id="readyBox" class="ready-box hidden"></div>

      <!-- ➕ 添加中奖（平常收起来，按了才展开，页面不会太长） -->
      <details class="panel add-panel" id="addPanel">
        <summary>➕ 添加中奖</summary>

        <div class="step-h"><span class="n">1</span> 选择抽奖期数</div>
        <div class="periods" id="periods"><span class="muted">载入中…</span></div>
        <p class="msg err" id="drawErr"></p>

        <div id="drawBox" class="hidden">
          <div class="step-h"><span class="n">2</span> 中奖名单（自动对应会员）</div>
          <p class="meta" style="margin:-4px 0 8px">先用订单编号找会员，找不到再用平台用户名找。按「选这位」会自动填好下面的表格。</p>
          <div id="winners"></div>

          <div class="step-h" style="margin-top:22px"><span class="n">3</span> 或者直接选奖品</div>
          <div class="prize-chips" id="prizeChips"></div>
        </div>

        <form id="addForm" autocomplete="off" novalidate style="margin-top:22px">
          <div class="step-h"><span class="n">4</span> 中奖资料</div>
          <div class="grid2">
            <label>奖品名称 <span class="req">*</span><input id="fPrize" maxlength="100" placeholder="选上面的奖品，或自己输入"></label>
            <label>期数 <input id="fMonth" maxlength="40" placeholder="例如 October 2026"></label>
          </div>
          <div class="grid2">
            <label>中奖订单编号（「🎁 领奖追踪」靠它自动对应） <input id="fOrderNo" class="mono" maxlength="40" placeholder="按「选这位」会自动填好"></label>
            <label>领取期限（超过还没领取，系统会自动作废） <input id="fDeadline" type="date"></label>
          </div>

          <label>会员 <span class="req">*</span>
            <div class="mpick">
              <input id="fMember" placeholder="🔍 搜索会员名称、电邮或平台用户名">
              <div class="mres hidden" id="mRes"></div>
            </div>
            <div id="chosen"></div>
            <div id="mergeBox"></div>
          </label>

          <div style="margin-bottom:12px">
            <div style="font-size:.85rem;color:var(--text2)">配送方式 <span class="req">*</span></div>
            <div class="dlv" id="dlv">
              <label><input type="radio" name="dlv" value="withOrder">
                <div><b>📦 奖品随单发送（一般选这个）</b><span>跟会员下一张订单同包寄出，顺便鼓励再下单</span></div></label>
              <label><input type="radio" name="dlv" value="separate">
                <div><b>🚚 奖品单独包裹寄出</b><span>只在奖品太大、放不进订单包裹时选；会员领取时要填地址</span></div></label>
            </div>
          </div>

          <div class="ship-form" id="addShip" data-key="__add">
            <b>🚚 运单号（选填，之后也可以补）</b>
            <div class="grid3" style="margin-top:10px">
              <label>运输公司
                <select data-f="carrier"></select>
              </label>
              <label class="other-name hidden">公司名称 <input data-f="carrierName" placeholder="例如 Pos Laju"></label>
              <label>运单号 <input data-f="trackingNo"></label>
            </div>
            <label>查询链接（输入运单号后自动生成，可以改） <input data-f="trackingUrl" placeholder="https://…"></label>
            <label style="margin-bottom:0">发货图片（最多 3 张，选填） <input type="file" accept="image/*" multiple data-f="photos"></label>
            <div class="photos"></div>
          </div>

          <label style="margin-top:12px;margin-bottom:4px">给会员的留言（选填，选好配送方式会自动带入默认留言）</label>
          <div id="fNoteBox"></div>
          <div class="note-mgr hidden" id="noteMgr">
            <h4>默认留言（选配送方式时自动带入）</h4>
            <p class="meta" style="margin:-4px 0 6px">中文必填，EN / BM 选填（留空的语言，会员会看到中文）</p>
            <div class="nm-fixed"><b class="nm-lbl">📦 随单发送</b><div id="nmWith"></div></div>
            <div class="nm-fixed"><b class="nm-lbl">🚚 单独包裹寄出</b><div id="nmSep"></div></div>
            <h4 style="margin-top:10px">其他留言</h4>
            <div id="nmList"></div>
            <div class="actions" style="margin-top:4px">
              <button type="button" class="btn btn-ghost" id="nmAdd">➕ 添加一条</button>
              <button type="button" class="btn btn-primary" id="nmSave">💾 保存留言菜单</button>
              <button type="button" class="btn btn-ghost" id="nmClose">关闭</button>
            </div>
            <p class="msg" id="nmMsg"></p>
          </div>
          <div class="actions">
            <button type="submit" class="btn btn-primary" id="addBtn">💾 保存并通知会员</button>
            <button type="button" class="btn btn-ghost" id="resetBtn">清空</button>
          </div>
          <p class="msg" id="addMsg"></p>
        </form>
      </details>

      <!-- 📋 中奖记录 -->
      <div class="tabs" id="tabs">
        <button data-tab="unclaimed" class="active">待领取</button>
        <button data-tab="claimed">待审核</button>
        <button data-tab="approved">待发货</button>
        <button data-tab="shipped">已发货</button>
        <button data-tab="completed">已完成</button>
        <button data-tab="cancelled">已取消</button>
      </div>
      <input id="search" placeholder="🔍 搜索编号、会员名称、奖品或期数" style="margin-bottom:12px">
      <div class="pz-split" id="split">
        <div class="pz-list" id="rows"><p class="empty">载入中…</p></div>
        <div class="pz-detail">
          <button type="button" class="btn btn-ghost pz-back" id="backBtn">← 返回列表</button>
          <div id="panel"><p class="empty">👈 选择左边的中奖记录</p></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import {
      collection, getDocs, getDoc, doc, addDoc, updateDoc, setDoc, serverTimestamp, deleteField, deleteDoc, writeBatch
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";
    import {
      requireAdmin, renderAdminNav, esc, toDate, fmtDate, fmtPhone, waLink, platformTag, normalizePhone, isValidPhone,
      normalizeUsername, readyWinners, dismissedWinners, CARRIERS, DEFAULT_TRACK_TPL, loadCarriers, carrierOptions, redeemCode, refreshPrizeBadge, logAdmin, compressImage
    } from "./js/admin-common.js";
    import { noteBoxHTML, readNoteBox, setNoteBox, noteFields, noteBadge, normNote, noteFromDoc, setSet, setManager,
      bindNoteBoxes, rowHTML, readRow, bindRowList } from "./js/note-i18n.js";
    import { previewSend, confirmSimple } from "./js/send-tools.js";

    // 每月抽奖的资料库（和 www.themochiishop.com/monthly-draw/ 同一个，只读）
    const drawApp = initializeApp({
      apiKey: "AIzaSyDJrsKAjWqz0AmjEtBzz4CeswiskdQqASw",
      authDomain: "admin-status-c3bdb.firebaseapp.com",
      databaseURL: "https://admin-status-c3bdb-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "admin-status-c3bdb",
    }, "draw");
    const rtdb = getDatabase(drawApp);

    const $ = id => document.getElementById(id);
    renderAdminNav("prizes");

    const DLV = { withOrder: "📦 随单发送", separate: "🚚 单独包裹" };
    const PRIZE_CLAIM_DAYS = 30;          // 领取期限（和 prize-watch.gs 的 MS_PRIZE_CLAIM_DAYS 一致）
    const PRIZE_AUTO_COMPLETE_DAYS = 14;  // 发货后自动完成（和 prize-watch.gs 一致）
    const MY_STATES = ["Johor", "Kedah", "Kelantan", "Melaka", "Negeri Sembilan", "Pahang", "Perak", "Perlis", "Pulau Pinang",
      "Sabah", "Sarawak", "Selangor", "Terengganu", "W.P. Kuala Lumpur", "W.P. Labuan", "W.P. Putrajaya"];
    const p2 = n => String(n).padStart(2, "0");
    const ymd = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
    const endOfDay = str => { const [y, m, d] = String(str).split("-").map(Number); return y ? new Date(y, m - 1, d, 23, 59, 59) : null; };
    const plusDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); x.setHours(23, 59, 59, 0); return x; };
    // 领取期限：有设定就用设定的，没有就是添加日 + 30 天
    const deadlineOf = w => toDate(w.expiresAt) || (toDate(w.createdAt) ? plusDays(toDate(w.createdAt), PRIZE_CLAIM_DAYS) : null);
    const ST = { unclaimed: "待领取", claimed: "待审核", approved: "待发货", shipped: "已发货", completed: "已完成", cancelled: "已取消" };
    const ST_TAG = { unclaimed: "tag-pink", claimed: "tag-warn", approved: "tag-blue", shipped: "tag-blue", completed: "tag-ok", cancelled: "" };
    // ❌ 取消原因（预设三语，可以再改）；cancelReason 存代号，cancelNote / cancelNoteI18n 是会员看到的文字
    const CANCEL_REASONS = {
      expired: { label: "⏰ 兑换已逾期", note: { zh: "兑换已逾期，奖品已作废", en: "The claim period has passed, so this prize has been voided.", ms: "Tempoh tuntutan telah tamat, jadi hadiah ini telah dibatalkan." } },
      lost:    { label: "📵 联系不上",   note: { zh: "多次联系不上你，奖品已作废", en: "We couldn't reach you after several tries, so this prize has been voided.", ms: "Kami tidak dapat menghubungi anda selepas beberapa kali cubaan, jadi hadiah ini telah dibatalkan." } },
      other:   { label: "✏️ 其他原因",   note: { zh: "", en: "", ms: "" } },
    };
    const MAX_IMG = 180000;   // 奖品图太大就不存（Firestore 单笔上限 1MB）

    let adminEmail = "";
    let trackTpl = { ...DEFAULT_TRACK_TPL };
    let members = {};            // uid → 会员资料
    let bindings = [];           // { uid, platform, username }
    let wins = [];               // prizeWins
    let periods = [], draw = null, drawId = "", drawMonth = "";
    let pick = { uid: "", image: "", winnerName: "", orderNo: "" };
    let tab = "unclaimed";
    // 从总览点进来时网址会带分页，例如 #toShip
    { const h = location.hash.slice(1);
      if (h && document.querySelector(`#tabs button[data-tab="${h}"]`)) {
        tab = h;
        document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("active", x.dataset.tab === tab));
      } }

    // ---------- 共用 ----------
    const isImg = s => typeof s === "string" && /^(data:image\/|https:\/\/)/.test(s);
    const thumbHTML = img => img ? `<img class="pthumb" src="${esc(img)}" alt="">` : `<span class="pthumb">🎁</span>`;
    const carrierOpts = sel => carrierOptions(sel);
    const memberLine = uid => {
      const m = members[uid] || {};
      const bs = bindings.filter(b => b.uid === uid);
      return `<b>${esc(m.name || "(没有名字)")}</b> · ${esc(m.email || "")}${bs.length ? " · " + bs.map(b => `${platformTag(b.platform)} ${esc(b.username)}`).join(" ") : ""}`;
    };
    const splitPrize = p => {   // 「奖品 x2」→ 名称 + 数量（和公开页一样）
      let name = String(p.n || "").trim(), q = Number(p.q) || 0;
      if (!q) { const m = name.match(/^(.*?)\s*[x×]\s*(\d+)\s*$/i); if (m && m[1]) { name = m[1]; q = Number(m[2]); } }
      return { name, q };
    };
    const normName = s => String(s || "").trim().replace(/\s*[x×]\s*\d+\s*$/i, "").toLowerCase();

    function readShip(root) {
      const v = f => ((root.querySelector(`[data-f="${f}"]`) || {}).value || "").trim();
      const carrier = v("carrier") || "spx";
      const c = CARRIERS.find(x => x.id === carrier) || CARRIERS[0];
      return { carrier, carrierName: carrier === "other" ? v("carrierName") : c.name, trackingNo: v("trackingNo"), trackingUrl: v("trackingUrl") };
    }
    function autoUrl(root) {
      const s = readShip(root);
      const tpl = s.carrier === "other" ? "" : (trackTpl[s.carrier] || "");
      if (tpl && s.trackingNo) root.querySelector('[data-f="trackingUrl"]').value = tpl.replace("{no}", encodeURIComponent(s.trackingNo));
    }
    function shipError(s, need) {
      if (need && !s.trackingNo) return "请填写运单号";
      if (s.trackingNo && !s.carrierName) return "请填写运输公司名称";
      if (s.trackingUrl && !/^https:\/\//i.test(s.trackingUrl)) return "查询链接要以 https:// 开头";
      return "";
    }
    // 📷 发货图片：表单 key（中奖 ID，新增表单用 __add）→ 还没保存的图片
    const shipPhotos = {};
    const MAX_PHOTOS = 3;
    function photosHTML(key) {
      return (shipPhotos[key] || []).map((p, i) =>
        `<span class="ph-wrap"><img src="${esc(p)}" alt=""><button type="button" data-delphoto="${i}" title="删除">✕</button></span>`).join("");
    }
    function drawPhotos(box) { box.querySelector(".photos").innerHTML = photosHTML(box.dataset.key); }

    // 运单表单的互动（新增表单和列表共用）
    function bindShipEvents(root) {
      root.addEventListener("click", e => {
        const del = e.target.closest("[data-delphoto]");
        if (!del) return;
        const box = del.closest(".ship-form");
        (shipPhotos[box.dataset.key] || []).splice(+del.dataset.delphoto, 1);
        drawPhotos(box);
      });
      root.addEventListener("change", async e => {
        const box = e.target.closest(".ship-form");
        if (!box || e.target.dataset.f !== "photos") return;
        const key = box.dataset.key;
        const list = shipPhotos[key] = shipPhotos[key] || [];
        const files = [...e.target.files];
        if (files.length > MAX_PHOTOS - list.length) alert(`发货图片最多 ${MAX_PHOTOS} 张`);
        for (const file of files.slice(0, MAX_PHOTOS - list.length)) {
          let url = await compressImage(file, 640);
          if (url.length > 220000) url = await compressImage(file, 420);
          list.push(url);
        }
        e.target.value = "";
        drawPhotos(box);
      });
      root.addEventListener("input", e => {
        const box = e.target.closest(".ship-form");
        if (box && e.target.dataset.f === "trackingNo") autoUrl(box);
      });
      root.addEventListener("change", e => {
        const box = e.target.closest(".ship-form");
        if (!box || e.target.dataset.f !== "carrier") return;
        box.querySelector(".other-name").classList.toggle("hidden", e.target.value !== "other");
        if (e.target.value === "other") box.querySelector('[data-f="trackingUrl"]').value = "";
        autoUrl(box);
      });
    }

    // ---------- 载入 ----------
    async function loadMembers() {
      const [mS, bS] = await Promise.all([getDocs(collection(db, "members")), getDocs(collection(db, "bindings"))]);
      members = {};
      mS.docs.forEach(d => { members[d.id] = d.data(); });
      bindings = bS.docs.map(d => d.data()).filter(b => b.uid && b.username);
    }
    async function loadWins() {
      const s = await getDocs(collection(db, "prizeWins"));
      wins = s.docs.map(d => ({ id: d.id, ...d.data() }));
      renderList();
      if (draw) renderWinners();
      refreshPrizeBadge();
      loadReady();
    }
    async function loadPeriods() {
      try {
        const v = (await get(ref(rtdb, "homepage/drawIndex"))).val();
        periods = (Array.isArray(v) ? v : Object.values(v || {})).filter(x => x && x.id && typeof x.month === "string" && x.month.trim());
        $("drawErr").textContent = "";
      } catch (e) {
        periods = [];
        $("drawErr").textContent = "读不到每月抽奖资料：" + e.message + "（仍然可以手动输入奖品）";
      }
      $("periods").innerHTML = periods.length
        ? periods.map(p => `<button type="button" data-id="${esc(p.id)}" class="${p.id === drawId ? "on" : ""}">${esc(p.month)}</button>`).join("")
        : `<span class="muted">还没有抽奖期数</span>`;
    }
    async function selectPeriod(id) {
      drawId = id;
      const p = periods.find(x => x.id === id);
      drawMonth = p ? p.month.trim() : "";
      $("fMonth").value = drawMonth;
      document.querySelectorAll("#periods button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
      $("drawBox").classList.remove("hidden");
      $("winners").innerHTML = `<p class="meta">载入中…</p>`;
      $("prizeChips").innerHTML = "";
      try { draw = (await get(ref(rtdb, "homepage/drawData/" + id))).val() || {}; }
      catch (e) { draw = {}; $("winners").innerHTML = `<p class="msg err">载入失败：${esc(e.message)}</p>`; return; }
      renderPrizes();
      await renderWinners();
    }

    // ---------- 奖品清单 ----------
    function prizeItems() {
      if (!draw) return [];
      let items = Array.isArray(draw.prizeItems) ? draw.prizeItems : Object.values(draw.prizeItems || {});
      items = items.filter(x => x && typeof x.n === "string" && x.n.trim())
        .map(x => ({ ...splitPrize(x), img: isImg(x.i) ? x.i : "" }));
      if (!items.length) items = String(draw.prizes || "").split(/\n+/).map(s => s.trim()).filter(Boolean).map(n => ({ ...splitPrize({ n }), img: "" }));
      return items;
    }
    function imageFor(name) {
      const hit = prizeItems().find(p => normName(p.name) === normName(name));
      return hit ? hit.img : "";
    }
    function renderPrizes() {
      const items = prizeItems();
      $("prizeChips").innerHTML = items.length ? items.map((p, i) => `
        <button type="button" class="prize-chip" data-i="${i}">${thumbHTML(p.img)}<span>${esc(p.name)}${p.q > 1 ? ` <span class="muted">×${p.q}</span>` : ""}</span></button>`).join("")
        : `<span class="muted">这一期没有奖品清单</span>`;
    }
    $("prizeChips").addEventListener("click", e => {
      const b = e.target.closest(".prize-chip");
      if (!b) return;
      const p = prizeItems()[+b.dataset.i];
      document.querySelectorAll(".prize-chip").forEach(x => x.classList.toggle("on", x === b));
      $("fPrize").value = p.name;
      pick.image = p.img;
      pick.winnerName = ""; pick.orderNo = ""; $("fOrderNo").value = "";
      $("fMember").focus();
    });

    // ---------- 中奖名单 + 自动找会员 ----------
    function parseRows(text) {
      const rows = [];
      String(text || "").split(/\n+/).map(l => l.trim()).filter(Boolean).forEach(l => {
        const c = l.split(/\s*\|\s*|\t+/).map(x => x.trim());
        const low = c.join(" ").toLowerCase();
        if (/winner/.test(low) && /(prize|order)/.test(low)) return;
        if (c.length === 1) rows.push({ prize: "", winner: c[0], order: "" });
        else rows.push({ prize: c[0], winner: c[1] || "", order: c[2] || "" });
      });
      return rows;
    }
    const orderCache = {};
    async function uidByOrder(no) {
      no = String(no || "").replace(/\s/g, "").toUpperCase();
      if (!no || no.includes("*")) return "";
      if (orderCache[no] !== undefined) return orderCache[no];
      try { const s = await getDoc(doc(db, "orders", no)); orderCache[no] = s.exists() ? (s.data().uid || "") : ""; }
      catch (e) { orderCache[no] = ""; }
      return orderCache[no];
    }
    function uidByName(name) {
      const u = normalizeUsername(name);
      const hits = [...new Set(bindings.filter(b => b.username === u).map(b => b.uid))];
      return hits.length === 1 ? hits[0] : "";
    }
    let winRows = [];
    async function renderWinners() {
      let groups = [draw.w1, draw.w2, draw.w3].map(parseRows).filter(g => g.length);
      if (!groups.length && draw.winners) groups = [parseRows(draw.winners)];
      const rows = groups.flat();
      // 一行有几个名字（逗号分开）就拆成几行
      winRows = [];
      for (const r of rows) {
        const names = String(r.winner).split(/[,，、;；]/).map(x => x.trim()).filter(Boolean);
        if (names.length > 1) names.forEach(n => winRows.push({ prize: r.prize, winner: n, order: "" }));
        else winRows.push(r);
      }
      for (const r of winRows) {
        r.uid = (await uidByOrder(r.order)) || uidByName(r.winner);
        r.how = r.uid ? (orderCache[String(r.order).replace(/\s/g, "").toUpperCase()] ? "订单" : "用户名") : "";
        r.done = r.uid && wins.some(w => w.status !== "cancelled" && w.uid === r.uid && w.drawId === drawId && normName(w.prizeName) === normName(r.prize));
      }
      $("winners").innerHTML = winRows.length ? `
        <table class="wtable">
          <thead><tr><th>奖品</th><th>中奖者</th><th>订单编号</th><th>会员</th><th></th></tr></thead>
          <tbody>${winRows.map((r, i) => `
            <tr>
              <td>${esc(r.prize || "—")}</td>
              <td>${esc(r.winner || "—")}</td>
              <td><code>${esc(r.order || "—")}</code></td>
              <td>${r.uid ? `✅ ${esc((members[r.uid] || {}).name || "")} <span class="muted">（按${r.how}）</span>` : '<span class="muted">⚠️ 找不到会员，可以下面手动搜索</span>'}</td>
              <td class="act">${r.done ? '<span class="tag tag-ok">已添加</span>' : `<button type="button" class="btn ${r.uid ? "btn-primary" : "btn-ghost"}" data-row="${i}">选这位</button>`}</td>
            </tr>`).join("")}</tbody>
        </table>` : `<p class="meta">这一期还没有中奖名单。</p>`;
    }
    // ---------- ⏳ 已绑定、等你发奖的得奖者 ----------
    let ready = [];
    let dismissed = {};
    async function loadReady() {
      try { [ready, dismissed] = await Promise.all([readyWinners(), dismissedWinners()]); }
      catch (e) { console.warn("ready", e); ready = []; }
      const dl = Object.entries(dismissed).sort((a, b) => (toDate(b[1].at) || 0) - (toDate(a[1].at) || 0));
      $("readyBox").innerHTML = (ready.length ? `
        <b class="h">⏳ ${ready.length} 位得奖者已注册并绑定中奖订单，等你设定配送方式</b>
        <ul>${ready.map((r, i) => `<li>
          <span>🏆 <b>${esc(r.prize || "—")}</b> · ${esc(r.month)}</span>
          <span>👤 ${esc((members[r.uid] || {}).name || r.winner)} <code>${esc(r.order)}</code></span>
          <span style="margin-left:auto;display:flex;gap:6px">
            <button type="button" class="btn btn-ghost" data-dismiss="${i}" title="例如之前已经在「领奖追踪」寄出">✓ 已处理，不用再提醒</button>
            <button type="button" class="btn btn-primary" data-ready="${i}">选这位</button>
          </span></li>`).join("")}</ul>` : "")
        + (dl.length ? `<details class="ready-done"><summary>已标记「不用再提醒」的 ${dl.length} 笔</summary>
            <ul>${dl.map(([no, x]) => `<li><span>🏆 ${esc(x.prize || "—")} · ${esc(x.month || "")}</span>
              <span>👤 ${esc(x.winner || "")} <code>${esc(no)}</code></span>
              <span class="muted" style="font-size:.78rem">${toDate(x.at) ? fmtDate(toDate(x.at), true) : ""}${x.by ? " · " + esc(x.by) : ""}</span>
              <button type="button" class="btn btn-ghost" data-undismiss="${esc(no)}" style="margin-left:auto">↩️ 恢复提醒</button></li>`).join("")}</ul></details>` : "");
      $("readyBox").classList.toggle("hidden", !ready.length && !dl.length);
      $("readyBox").classList.toggle("only-done", !ready.length);
    }
    $("readyBox").addEventListener("click", async e => {
      // ✓ 已处理：以后不再提醒（存在 adminSettings/prizeReady）
      const d = e.target.closest("[data-dismiss]");
      if (d) {
        const r = ready[+d.dataset.dismiss];
        if (!confirm(`「${r.prize || "这个奖品"}」（${r.month} · ${r.order}）已经处理过了，不用再提醒？\n\n• 会员的「中奖记录」会补上一笔「✅ 已完成 · 之前已寄出」，不会响铃铛\n• 之后可以在下面「恢复提醒」`)) return;
        d.disabled = true;
        try {
          // 在会员的中奖记录补一笔「已完成」（legacy：前台铃铛不通知）
          const name = splitPrize({ n: r.prize || "" }).name || r.prize || "每月抽奖奖品";
          const w = await addDoc(collection(db, "prizeWins"), {
            uid: r.uid, prizeName: name.slice(0, 100), prizeImage: "", drawId: r.drawId || "", drawMonth: (r.month || "").slice(0, 40),
            winnerName: r.winner || "", orderNo: r.order, delivery: "withOrder", note: "之前已寄出",
            status: "completed", completedAt: serverTimestamp(), adminCompleted: true, legacy: true,
            createdAt: serverTimestamp(), createdBy: adminEmail,
          });
          await setDoc(doc(db, "adminSettings", "prizeReady"), { dismissed: { [r.order]: {
            prize: r.prize || "", month: r.month || "", winner: (members[r.uid] || {}).name || r.winner || "",
            uid: r.uid || "", winId: w.id, by: adminEmail, at: serverTimestamp() } } }, { merge: true });
          logAdmin("prize", `标记已处理（不用再提醒）：${r.prize || ""} · ${r.month} · ${r.order}`, "prizes.html");
          await Promise.all([loadReady(), loadWins()]);
          refreshPrizeBadge();
        } catch (err) { alert("失败：" + err.message); d.disabled = false; }
        return;
      }
      const u = e.target.closest("[data-undismiss]");
      if (u) {
        u.disabled = true;
        try {
          const x = dismissed[u.dataset.undismiss] || {};
          if (x.winId) await deleteDoc(doc(db, "prizeWins", x.winId)).catch(() => {});   // 删掉补上的「已完成」记录
          await updateDoc(doc(db, "adminSettings", "prizeReady"), { ["dismissed." + u.dataset.undismiss]: deleteField() });
          logAdmin("prize", `恢复提醒：${u.dataset.undismiss}`, "prizes.html");
          await Promise.all([loadReady(), loadWins()]);
        } catch (err) { alert("失败：" + err.message); u.disabled = false; }
        return;
      }
      const b = e.target.closest("[data-ready]");
      if (!b) return;
      const r = ready[+b.dataset.ready];
      if (drawId !== r.drawId) await selectPeriod(r.drawId);   // 换到那一期（带出奖品图）
      $("fPrize").value = splitPrize({ n: r.prize }).name;
      pick.image = imageFor(r.prize);
      pick.winnerName = r.winner; pick.orderNo = r.order; $("fOrderNo").value = r.order;
      $("fMonth").value = r.month;
      document.querySelectorAll(".prize-chip").forEach(x => x.classList.remove("on"));
      chooseMember(r.uid);
      $("addPanel").open = true;
      $("addForm").scrollIntoView({ behavior: "smooth", block: "start" });
    });

    $("winners").addEventListener("click", e => {
      const b = e.target.closest("[data-row]");
      if (!b) return;
      const r = winRows[+b.dataset.row];
      $("fPrize").value = splitPrize({ n: r.prize }).name;
      pick.image = imageFor(r.prize);
      pick.winnerName = r.winner; pick.orderNo = r.order; $("fOrderNo").value = r.order || "";
      document.querySelectorAll(".prize-chip").forEach(x => x.classList.remove("on"));
      if (r.uid) chooseMember(r.uid);
      else { chooseMember(""); $("fMember").value = r.winner; searchMembers(); $("fMember").focus(); }
      $("addPanel").open = true;
      $("addForm").scrollIntoView({ behavior: "smooth", block: "start" });
    });

    // ---------- 搜索会员 ----------
    function searchMembers() {
      const q = $("fMember").value.trim().toLowerCase().replace(/^@/, "");
      if (!q) { $("mRes").classList.add("hidden"); return; }
      const hits = Object.entries(members).filter(([uid, m]) =>
        (m.name || "").toLowerCase().includes(q) || (m.email || "").toLowerCase().includes(q)
        || bindings.some(b => b.uid === uid && b.username.includes(q))).slice(0, 12);
      $("mRes").innerHTML = hits.length
        ? hits.map(([uid]) => `<button type="button" data-uid="${esc(uid)}">${memberLine(uid)}</button>`).join("")
        : `<div class="meta" style="padding:10px 12px">找不到符合的会员</div>`;
      $("mRes").classList.remove("hidden");
    }
    function chooseMember(uid) {
      pick.uid = uid;
      $("mRes").classList.add("hidden");
      $("fMember").value = "";
      $("fMember").classList.toggle("hidden", !!uid);
      $("chosen").innerHTML = uid ? `<div class="chosen">👤 <div>${memberLine(uid)}</div>
        <button type="button" class="btn btn-ghost x" id="unpick">换一位</button></div>` : "";
      renderMergeBox();
    }
    // 🔗 合并：这位会员还有没寄出的中奖奖品 → 可以合并一起寄（共用配送方式、运单号，一次处理）
    const OPEN_ST = ["unclaimed", "claimed", "approved"];
    const openWinsOf = uid => wins.filter(w => w.uid === uid && OPEN_ST.includes(w.status));
    function renderMergeBox() {
      const list = pick.uid ? openWinsOf(pick.uid) : [];
      if (!list.length) { $("mergeBox").innerHTML = ""; return; }
      const dl = list[0].delivery;
      $("mergeBox").innerHTML = `<div class="merge-box">⚠️ 这位会员还有 <b>${list.length}</b> 个奖品还没寄出：
        <ul style="margin:4px 0 0 18px">${list.map(w => `<li>${esc(w.prizeName)} · ${ST[w.status]} · ${DLV[w.delivery] || ""}${w.drawMonth ? " · " + esc(w.drawMonth) : ""}</li>`).join("")}</ul>
        <label class="inline"><input type="checkbox" id="fMerge" checked> 🔗 合并一起寄出（配送方式跟着改成「${DLV[dl]}」，之后发货、运单号一次处理）</label></div>`;
      const sync = () => {
        if (!$("fMerge").checked) return;
        const r = document.querySelector(`input[name="dlv"][value="${dl}"]`);
        if (r && !r.checked) { r.checked = true; $("dlv").dispatchEvent(new Event("change", { bubbles: true })); }
      };
      $("fMerge").addEventListener("change", sync);
      sync();
    }
    $("fMember").addEventListener("input", searchMembers);
    $("fMember").addEventListener("focus", searchMembers);
    $("mRes").addEventListener("click", e => { const b = e.target.closest("[data-uid]"); if (b) chooseMember(b.dataset.uid); });
    $("chosen").addEventListener("click", e => { if (e.target.id === "unpick") { chooseMember(""); $("fMember").focus(); } });
    document.addEventListener("click", e => { if (!e.target.closest(".mpick")) $("mRes").classList.add("hidden"); });

    // ---------- 保存 ----------
    $("addShip").querySelector('[data-f="carrier"]').innerHTML = carrierOpts("spx");
    bindShipEvents($("addShip"));
    // ---------- 💬 留言菜单（存在 settings/prizeNotes） ----------
    const DEFAULT_NOTES = {
      withOrder: { zh: "恭喜！奖品会和你的下一张订单一起寄出", en: "Congratulations! Your prize will be shipped together with your next order.", ms: "Tahniah! Hadiah anda akan dihantar bersama pesanan anda yang seterusnya." },
      separate: { zh: "恭喜！奖品将会单独寄出", en: "Congratulations! Your prize will be shipped separately.", ms: "Tahniah! Hadiah anda akan dihantar secara berasingan." },
      list: [],
    };
    let notes = { ...DEFAULT_NOTES };
    $("fNoteBox").innerHTML = noteBoxHTML({ group: "prize", placeholder: "留言内容（会员看得到，可以直接修改）" });
    bindNoteBoxes();
    const fillNoteSel = () => setSet("prize", [notes.withOrder, notes.separate, ...notes.list]);
    // 旧资料是纯中文字符串：如果刚好是旧的默认句子，自动补上翻译
    const upgrade = (x, def) => { const v = normNote(x); return v.zh && v.zh === def.zh && !v.en && !v.ms ? { ...def } : v; };
    async function loadNotes() {
      try {
        const s = await getDoc(doc(db, "settings", "prizeNotes"));
        if (s.exists()) {
          const d = s.data();
          const w = upgrade(d.withOrder, DEFAULT_NOTES.withOrder), p = upgrade(d.separate, DEFAULT_NOTES.separate);
          notes = {
            withOrder: w.zh ? w : DEFAULT_NOTES.withOrder,
            separate: p.zh ? p : DEFAULT_NOTES.separate,
            list: Array.isArray(d.list) ? d.list.map(normNote).filter(x => x.zh) : [],
          };
        }
      } catch (e) { console.warn("prizeNotes", e); }
      fillNoteSel();
    }
    // 选配送方式：留言是空的、或还是另一种的默认留言 → 换成这一种的默认留言
    $("dlv").addEventListener("change", () => {
      $("dlv").classList.remove("bad");
      const dlv = (document.querySelector('input[name="dlv"]:checked') || {}).value;
      const cur = readNoteBox($("fNoteBox")).zh;
      if (dlv && (!cur || cur === notes.withOrder.zh || cur === notes.separate.zh)) setNoteBox($("fNoteBox"), notes[dlv] || "");
    });

    // 管理留言菜单（⚙️ 按钮打开）
    const nmMsg = (t, ty) => { $("nmMsg").textContent = t; $("nmMsg").className = "msg" + (ty ? " " + ty : ""); };
    bindRowList($("nmList"));
    setManager("prize", () => {
      $("nmWith").innerHTML = rowHTML(notes.withOrder); $("nmSep").innerHTML = rowHTML(notes.separate);

    }
    async function doMerge(w, item) {
      const ids = [...item.querySelectorAll("[data-mg]:checked")].map(x => x.dataset.mg);
      const picked = mergeCandidates(w).filter(x => ids.includes(x.id) && x.delivery === w.delivery);
      if (!picked.length) { alert("请至少勾选一件"); return; }
      // 组编号：这件已有的组 → 勾选里已有的组 → 这件的 ID
      const target = w.bundleId || (picked.find(x => x.bundleId) || {}).bundleId || w.id;
      const set = new Map([[w.id, w]]);
      picked.forEach(x => {
        set.set(x.id, x);
        // 勾选的这件如果在别的组里，那一组还没寄出的也一起并进来，免得原本的组被拆散
        if (x.bundleId && x.bundleId !== target)
          wins.filter(y => y.bundleId === x.bundleId && y.uid === w.uid && OPEN_ST.includes(y.status) && y.delivery === w.delivery)
            .forEach(y => set.set(y.id, y));
      });
      // 这件原本所在组的其他成员 bundleId 不变，本来就是 target
      const todo = [...set.values()].filter(x => x.bundleId !== target);
      if (!todo.length) { alert("这几件已经在同一组了"); return; }
      const total = new Set([...wins.filter(x => x.bundleId === target && x.status !== "cancelled").map(x => x.id), ...set.keys()]).size;
      if (!await previewSend({ title: "合并寄出", to: (members[w.uid] || {}).name || "会员", okText: "🔗 确认合并",
        rows: [...[...set.values()].map((x, i) => [i ? "" : "奖品", `${x.prizeName} · ${redeemCode(x.id)}`]), ["合并后", `这一组共 ${total} 件`]]
          .map(([k, v]) => [k || "　", v]) })) return;
      item.querySelectorAll("button").forEach(b => b.disabled = true);
      try {
        const b = writeBatch(db);
        todo.forEach(x => b.update(doc(db, "prizeWins", x.id), { bundleId: target }));
        await b.commit();
        logAdmin("prize", `合并寄出：${(members[w.uid] || {}).name || "会员"} 的 ${total} 件奖品（${[...set.values()].map(x => redeemCode(x.id)).join("、")}）`, "prizes.html");
        await loadWins();
      } catch (err) {
        alert("合并失败：" + err.message);
        item.querySelectorAll("button").forEach(b => b.disabled = false);
      }
    }

    function renderList() {
      document.querySelectorAll("#tabs button").forEach(b => {
        const n = wins.filter(w => w.status === b.dataset.tab).length;
        const urgent = b.dataset.tab === "claimed" || b.dataset.tab === "approved";
        b.innerHTML = b.textContent.replace(/\s*\d+$/, "") + (urgent || n ? ` <span class="cnt ${urgent && n ? "" : "zero"}">${n}</span>` : "");
      });
      const q = $("search").value.trim().toLowerCase().replace(/^#/, "");
      let list = q
        ? wins.filter(w => w.id.toLowerCase().startsWith(q) || (w.prizeName || "").toLowerCase().includes(q)
            || (w.drawMonth || "").toLowerCase().includes(q) || ((members[w.uid] || {}).name || "").toLowerCase().includes(q))
        : wins.filter(w => w.status === tab);
      const at = w => toDate(w.completedAt) || toDate(w.shippedAt) || toDate(w.approvedAt) || toDate(w.claimedAt) || toDate(w.createdAt) || 0;
      list.sort((a, b) => ["claimed", "approved"].includes(tab) ? at(a) - at(b) : at(b) - at(a));
      list = list.slice(0, 150);

      // 左边：精简列表；右边：选中那一笔的完整资料和操作
      if (!list.some(w => w.id === selId)) selId = list[0] ? list[0].id : "";
      $("rows").innerHTML = list.length ? list.map(w => {
        const m = members[w.uid] || {};
        const end = w.status === "unclaimed" ? deadlineOf(w) : null;
        const soon = end && (end - Date.now()) / 86400000 <= 7;
        return `<button type="button" class="pz-row${w.id === selId ? " on" : ""}" data-sel="${esc(w.id)}">
          ${thumbHTML(w.prizeImage)}
          <span class="t"><b>${esc(w.prizeName)}</b><small>${esc(m.name || "(资料不存在)")}${w.drawMonth ? " · " + esc(w.drawMonth) : ""}</small></span>
          <span class="r"><span class="tag ${ST_TAG[w.status] || ""}">${ST[w.status] || w.status}</span><br>
            ${w.bundleId ? "🔗 " : ""}${soon ? "⚠️ " : ""}${w.delivery === "separate" ? "🚚" : "📦"} ${redeemCode(w.id)}</span>
        </button>`;
      }).join("") : `<p class="empty">${q ? "找不到符合的记录" : "没有记录"}</p>`;
      const sel = list.filter(w => w.id === selId);
      $("panel").innerHTML = sel.length ? sel.map(w => {
        const m = members[w.uid] || {};
        let body = "";
        const cancelBtn = `<button class="btn btn-bad" data-act="cancel">取消这个中奖</button>`;
        const switchBtn = `<button class="btn btn-ghost" data-act="switchDlv">🔁 改为${DLV[w.delivery === "separate" ? "withOrder" : "separate"]}</button>`
          + `<button class="btn btn-ghost" data-act="editNote">✏️ 修改留言</button>`
          + mergeBtnHTML(w);
        if (w.status === "unclaimed") {
          const end = deadlineOf(w);
          const left = end ? Math.ceil((end - Date.now()) / 86400000) : null;
          body = `<div class="meta deadline${left !== null && left <= 7 ? " soon" : ""}">⏰ 领取期限 ${end ? fmtDate(end) : "-"}${left !== null ? `（${left > 0 ? "剩 " + left + " 天" : "已过期，系统会自动作废"}）` : ""}</div>
            ${shipForm(w, `<button class="btn btn-ghost" data-act="saveShip">💾 保存运单号</button>${cancelBtn}`)}
            <div class="actions">${switchBtn}<button class="btn btn-ghost" data-act="extend">⏰ 延长 ${PRIZE_CLAIM_DAYS} 天</button></div>`;
        } else if (w.status === "claimed") {
          body = `${addrBox(w)}<div class="actions" style="margin-top:6px">${switchBtn}</div>
            ${shipForm(w, `<button class="btn btn-ok" data-act="approve">✔ 审核通过（稍后发货）</button>
              <button class="btn btn-primary" data-act="ship">🚚 通过并标记已发货</button>${cancelBtn}`)}`;
        } else if (w.status === "approved") {
          body = `${addrBox(w)}<div class="actions" style="margin-top:6px">${switchBtn}</div>${shipForm(w, `<button class="btn btn-primary" data-act="ship">🚚 标记已发货</button>${cancelBtn}`)}`;
        } else if (w.status === "shipped") {
          body = `${shipInfo(w)}${addrBox(w)}
            <div class="meta">会员还没按「确认收到」${toDate(w.shippedAt) ? `，${fmtDate(plusDays(toDate(w.shippedAt), PRIZE_AUTO_COMPLETE_DAYS))} 会自动完成` : ""}</div>
            <div class="actions">
              <button class="btn btn-ghost" data-act="editShip">✏️ 修改运单号</button>
              <button class="btn btn-ghost" data-act="editNote">✏️ 修改留言</button>
              <button class="btn btn-ok" data-act="complete">✔ 手动标记完成</button>
            </div>`;
        } else if (w.status === "completed") {
          body = `${shipInfo(w)}<div class="meta">✅ ${w.adminCompleted ? "管理员标记完成" : w.autoCompleted ? "发货 " + PRIZE_AUTO_COMPLETE_DAYS + " 天后自动完成" : "会员确认收到"} · ${fmtDate(toDate(w.completedAt), true)}</div>`;
        } else {
          const rs = CANCEL_REASONS[w.cancelReason];
          body = `<div class="meta">${w.autoExpired ? "⏰ 超过领取期限，系统自动作废" : rs && w.cancelReason !== "other" ? rs.label : "已取消"} ${fmtDate(toDate(w.cancelledAt), true)}${w.cancelNote && !w.autoExpired ? " · 原因：" + noteBadge(w.cancelNote, w.cancelNoteI18n) : ""}</div>
            <div class="actions"><button class="btn btn-ghost" data-act="reopen">↩️ 恢复为待领取（再给 ${PRIZE_CLAIM_DAYS} 天）</button></div>`;
        }
        return `
          <div class="item" data-id="${esc(w.id)}">
            <div class="item-head">
              <div class="item-row" style="flex:1;min-width:0">
                ${thumbHTML(w.prizeImage)}
                <div style="min-width:0">
                  <div class="item-title">${esc(w.prizeName)} <span class="tag ${ST_TAG[w.status] || ""}">${ST[w.status] || w.status}</span>
                    <span class="tag tag-blue">${DLV[w.delivery] || ""}</span></div>
                  <div class="meta"><a href="member.html?uid=${encodeURIComponent(w.uid)}">${esc(m.name || "(资料不存在)")}</a> · ${esc(m.email || "")}
                    ${w.drawMonth ? " · 🏆 " + esc(w.drawMonth) : ""}${w.winnerName ? " · 名单：" + esc(w.winnerName) : ""}${w.orderNo ? ` · <code>${esc(w.orderNo)}</code>` : ""}</div>
                  <div class="meta">添加 ${fmtDate(toDate(w.createdAt), true)}${w.claimedAt ? " · 领取 " + fmtDate(toDate(w.claimedAt), true) : ""}${w.note ? " · 留言：" + noteBadge(w.note, w.noteI18n) : ""}</div>
                </div>
              </div>
              <code class="rno">${redeemCode(w.id)}</code>
            </div>
            ${bundleHTML(w)}
            ${body}
          </div>`;
      }).join("") : `<p class="empty">👈 选择左边的中奖记录</p>`;
    }
    let selId = "";
    $("rows").addEventListener("click", e => {
      const b = e.target.closest("[data-sel]");
      if (!b) return;
      selId = b.dataset.sel;
      renderList();
      $("split").classList.add("show-detail");
      if (window.matchMedia("(max-width: 899px)").matches) window.scrollTo({ top: $("split").offsetTop - 70, behavior: "smooth" });
    });
    $("backBtn").addEventListener("click", () => $("split").classList.remove("show-detail"));
    bindShipEvents($("panel"));
    $("panel").addEventListener("change", e => {
      const r = e.target.closest('.inline-box[data-mode="cancel"] input[type="radio"]');
      if (!r) return;
      const bx = r.closest(".inline-box");
      setNoteBox(bx, CANCEL_REASONS[r.value].note);
      bx.querySelector('[data-nt="zh"]').focus();
    });

    $("panel").addEventListener("click", async e => {
      const copy = e.target.closest("[data-copy]");
      if (copy) {
        try { await navigator.clipboard.writeText(copy.dataset.copy); copy.textContent = "已复制 ✓"; }
        catch { prompt("请手动复制：", copy.dataset.copy); }
        return;
      }
      const act = e.target.dataset.act;
      const item = e.target.closest(".item");
      if (!act || !item) return;
      const w = wins.find(x => x.id === item.dataset.id);
      if (!w) return;
      if (act === "editShip") {   // 已发货 → 显示表单修改（状态不变）
        shipPhotos[w.id] = ((w.shipping || {}).photos || []).slice();
        e.target.closest(".actions").outerHTML = shipForm(w, `<button class="btn btn-ghost" data-act="saveShip">💾 保存运单号</button>`);
        return;
      }
      if (act === "editAddr") {
        if (!item.querySelector(".addr-edit")) e.target.closest(".actions, .addr-box").insertAdjacentHTML("afterend", addrEditHTML(w));
        return;
      }
      if (act === "cancelAddr") { item.querySelector(".addr-edit").remove(); return; }
      if (act === "closeBox") { item.querySelector(".inline-box").remove(); return; }
      if (act === "editNote") { openBox(item, e.target, noteEditHTML(w, "note")); return; }
      if (act === "switchDlv") { openBox(item, e.target, noteEditHTML(w, "dlv")); return; }
      if (act === "cancel") { openBox(item, e.target, cancelBoxHTML(w)); return; }
      if (act === "merge") { openBox(item, e.target, mergeBoxHTML(w)); return; }
      if (act === "doMerge") { await doMerge(w, item); return; }
      const box = item.querySelector(".ship-form");
      const ship = box ? readShip(box) : null;
      let upd = null;
      if (act === "saveAddr") {
        const r = readAddr(item);
        if (r.error) { alert(r.error); return; }
        upd = { address: r.address, addressUpdatedAt: serverTimestamp(), addressUpdatedBy: adminEmail };
      }
      if (act === "extend") {
        const base = new Date(Math.max(Date.now(), (deadlineOf(w) || new Date()).getTime()));
        const next = plusDays(base, PRIZE_CLAIM_DAYS);
        if (!confirm(`把领取期限延长到 ${fmtDate(next)}？`)) return;
        upd = { expiresAt: next };
      }
      if (act === "reopen") {
        const next = plusDays(new Date(), PRIZE_CLAIM_DAYS);
        if (!confirm(`恢复为「待领取」，领取期限到 ${fmtDate(next)}？会员那边会再次看到领取按钮。`)) return;
        upd = { status: "unclaimed", expiresAt: next, autoExpired: false, cancelNote: "", cancelNoteI18n: null, cancelReason: null, reopenedAt: serverTimestamp(), reopenedBy: adminEmail };
      }
      if (act === "saveShip") {
        const err = shipError(ship, false);
        if (err) { alert(err); return; }
        const photos = shipPhotos[w.id] || [];
        upd = { shipping: ship.trackingNo || photos.length ? { ...ship, photos, by: adminEmail } : null };
      }
      if (act === "saveNote" || act === "saveDlv") {
        upd = noteFields(readNoteBox(item.querySelector(".inline-box")));
        if (act === "saveDlv") upd.delivery = w.delivery === "separate" ? "withOrder" : "separate";
      }
      if (act === "approve") upd = { status: "approved", approvedAt: serverTimestamp() };
      if (act === "unbundle") {
        if (!await confirmSimple(`把「${w.prizeName}」从合并的一组拆开，单独处理？`)) return;
        upd = { bundleId: null };
      }
      if (act === "ship") {
        const err = shipError(ship, true);
        if (err) { alert(err); return; }
        upd = { status: "shipped", shippedAt: serverTimestamp(), shipping: { ...ship, photos: shipPhotos[w.id] || [], by: adminEmail } };
        if (w.status === "claimed") upd.approvedAt = serverTimestamp();
      }
      if (act === "complete") {
        if (!await confirmSimple("手动标记这个奖品已完成？")) return;
        upd = { status: "completed", completedAt: serverTimestamp(), adminCompleted: true };
      }
      if (act === "confirmCancel") {
        const bx = item.querySelector(".inline-box");
        const reason = (bx.querySelector('input[type="radio"]:checked') || {}).value;
        if (!reason) { alert("请选择取消原因"); return; }
        const n = noteFields(readNoteBox(bx));
        if (reason === "other" && !n.note) { alert("请填写取消原因"); return; }
        upd = { status: "cancelled", cancelledAt: serverTimestamp(), cancelReason: reason,
          cancelNote: n.note || "", cancelNoteI18n: n.noteI18n, cancelledBy: adminEmail };
      }
      if (!upd) return;
      // 📤 会员看得到的操作：先预览再送出
      const who = (members[w.uid] || {}).name || "会员";
      const shipRows = s => s ? [["运输公司", s.carrierName], ["运单号", s.trackingNo], ["查询链接", s.trackingUrl]] : [];
      const PV = {
        saveShip: () => upd.shipping ? { title: "更新运单号", rows: [["奖品", w.prizeName], ...shipRows(upd.shipping)] } : null,
        ship: () => ({ title: "标记已发货", okText: "🚚 确认已发货", rows: [["奖品", w.prizeName], ...shipRows(upd.shipping)] }),
        saveNote: () => ({ title: "修改给会员的留言", rows: [["奖品", w.prizeName]], note: noteFromDoc(upd.note, upd.noteI18n) }),
        saveDlv: () => ({ title: "更改配送方式", rows: [["奖品", w.prizeName], ["配送方式", `${DLV[w.delivery]} → ${DLV[upd.delivery]}`]], note: noteFromDoc(upd.note, upd.noteI18n) }),
        confirmCancel: () => ({ title: "取消中奖奖品", danger: true, okText: "确认取消", rows: [["奖品", w.prizeName], ["原因", (CANCEL_REASONS[upd.cancelReason] || {}).label]],
          note: noteFromDoc(upd.cancelNote, upd.cancelNoteI18n), noteLabel: "会员看到的取消原因" }),
      };
      const pv = PV[act] && PV[act]();
      if (pv && !await previewSend({ to: who, ...pv })) return;
      if (act === "approve" && !await confirmSimple(`审核通过「${w.prizeName}」？会员那边会显示「待发货」。`)) return;
      // 🔗 合并的一组：这些操作一起套用到同组还没完成的奖品（各自的状态要符合）
      const GROUP_OK = { ship: ["claimed", "approved"], saveShip: ["unclaimed", "claimed", "approved", "shipped"],
        saveDlv: ["unclaimed", "claimed", "approved"], approve: ["claimed"], complete: ["shipped"] };
      const others = GROUP_OK[act] ? groupOf(w).filter(x => x.id !== w.id && GROUP_OK[act].includes(x.status)) : [];
      if (others.length && !confirm(`同一组还有 ${others.length} 件（${others.map(x => x.prizeName).join("、")}）也一起处理？\n\n按「取消」= 只处理这一件`)) others.length = 0;
      item.querySelectorAll("button").forEach(b => b.disabled = true);
      try {
        if (others.length) {
          const b = writeBatch(db);
          b.update(doc(db, "prizeWins", w.id), upd);
          others.forEach(x => {
            const u = { ...upd };
            if (act === "ship") { if (x.status === "claimed") u.approvedAt = serverTimestamp(); else delete u.approvedAt; }
            if (act === "saveDlv") { delete u.note; delete u.noteI18n; }   // 留言各自保留
            b.update(doc(db, "prizeWins", x.id), u);
          });
          await b.commit();
        } else
        await updateDoc(doc(db, "prizeWins", w.id), upd);
        const LOG = { saveAddr: "修改中奖奖品收货地址", extend: "延长领取期限", reopen: "恢复为待领取", saveShip: "更新运单号",
          saveDlv: "更改配送方式", saveNote: "修改中奖留言", unbundle: "拆开合并寄出", approve: "批准中奖奖品", ship: "中奖奖品已发货", complete: "标记中奖奖品完成", confirmCancel: "取消中奖奖品" };
        if (LOG[act]) logAdmin("prize", `${LOG[act]}：${(members[w.uid] || {}).name || "会员"} 的「${w.prizeName}」${redeemCode(w.id)}`, "prizes.html");
        delete shipPhotos[w.id];
        await loadWins();
      } catch (err) {
        alert("操作失败：" + err.message);
        item.querySelectorAll("button").forEach(b => b.disabled = false);
      }
    });

    $("periods").addEventListener("click", e => { const b = e.target.closest("[data-id]"); if (b) selectPeriod(b.dataset.id); });
    $("reloadBtn").addEventListener("click", async () => {
      await Promise.all([loadMembers(), loadPeriods()]);
      await loadWins();
      if (drawId) selectPeriod(drawId);
    });

    requireAdmin(async user => {
      adminEmail = user.email || "";
      trackTpl = await loadCarriers();
      $("addShip").querySelector('[data-f="carrier"]').innerHTML = carrierOpts("spx");
      try {
        $("fDeadline").value = ymd(plusDays(new Date(), PRIZE_CLAIM_DAYS));
        await Promise.all([loadMembers(), loadPeriods(), loadNotes()]);
        await loadWins();
        const uid = new URLSearchParams(location.search).get("uid");   // 从会员详情页过来
        if (uid && members[uid]) chooseMember(uid);
        if (periods.length) selectPeriod(periods[0].id);
      } catch (e) {
        $("panel").innerHTML = `<p class="empty">载入失败：${esc(e.message)}</p>`;
      }
    });
  </script>
</body>
</html>
