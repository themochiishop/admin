<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../logo.png">
  <title>总览 · 会员系统 Admin</title>
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/theme.js"></script>
  <style>
    .container { max-width: 1240px; margin-top: 18px; margin-bottom: 18px; }
    .ov-head { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 12px; }
    .ov-head h2 { font-size: 1.2rem; color: var(--ink); }
    .ov-head p { color: var(--muted); font-size: .8rem; margin-top: 1px; }
    .ov-head .right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: .78rem; color: var(--faint); }
    .qbtn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 8px; font-size: .8rem; font-weight: 600;
      background: var(--card); border: 1px solid var(--line); color: var(--ink); }
    .qbtn:hover { border-color: #db2777; color: #db2777; }
    #reloadBtn { padding: 6px 10px; font-size: .8rem; }
    #updated { margin-right: 4px; }

    /* ===== 便当盒 ===== */
    .bento {
      display: grid; gap: 12px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-areas:
        "todo  todo  mem    pts"
        "todo  todo  tier   tier"
        "month stock recent recent"
        "bday  sys   recent recent";
    }
    .t-todo { grid-area: todo; } .t-mem { grid-area: mem; } .t-pts { grid-area: pts; }
    .t-tier { grid-area: tier; } .t-month { grid-area: month; } .t-stock { grid-area: stock; }
    .t-recent { grid-area: recent; } .t-bday { grid-area: bday; } .t-sys { grid-area: sys; }

    /* 电脑：整页刚好一个画面，不用上下滑；格子里的清单太长才在格子里滚动 */
    @media (min-width: 1180px) and (min-height: 600px) {
      body.has-side #app { height: 100vh; }
      .container { height: 100vh; margin: 0 auto; padding-top: 16px; padding-bottom: 16px; display: flex; flex-direction: column; }
      .bento { flex: 1; min-height: 0; grid-template-rows: repeat(4, minmax(0, 1fr)); }
      .tile { overflow: hidden; }
      .scroll { overflow-y: auto; min-height: 0; flex: 1; margin-right: -8px; padding-right: 8px; }
    }
    @media (max-width: 1179px) {
      .bento {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-areas: "todo todo" "mem pts" "tier tier" "month stock" "recent recent" "bday sys";
      }
    }
    @media (max-width: 559px) {
      .bento { grid-template-columns: minmax(0, 1fr); gap: 10px;
        grid-template-areas: "todo" "mem" "pts" "tier" "month" "stock" "recent" "bday" "sys"; }
      .ov-head .right { width: 100%; }
    }

    .tile {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
      display: flex; flex-direction: column; min-width: 0; min-height: 0; color: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    a.tile:hover { border-color: var(--line2); box-shadow: 0 6px 16px var(--shadow); }
    .tile-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .76rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; flex-shrink: 0; }
    .tile-h .go { font-weight: 600; color: var(--faint); font-size: .74rem; white-space: nowrap; }
    a.tile:hover .tile-h .go { color: #db2777; }
    .big { font-size: 1.65rem; font-weight: 800; color: var(--ink); line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
    .big small { font-size: .78rem; font-weight: 600; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
    .sub { font-size: .78rem; color: var(--muted); margin-top: 4px; line-height: 1.5; }
    .sub b { color: var(--ink); font-variant-numeric: tabular-nums; }
    .up { color: #16a34a; font-weight: 700; }
    .down { color: #dc2626; font-weight: 700; }
    .loading { color: var(--faint); }
    .row-big { display: flex; align-items: baseline; gap: 8px; flex-shrink: 0; }

    /* 待处理 */
    .t-todo { padding: 14px 16px; }
    .t-todo.busy { background: linear-gradient(160deg, var(--pink-bg2) 0%, var(--card) 60%); border-color: #f9a8d4; }
    .t-todo.clear { background: linear-gradient(160deg, var(--green-bg2) 0%, var(--card) 60%); border-color: #86efac; }
    :root[data-theme="dark"] .t-todo.busy { border-color: rgba(244,114,182,.5); }
    :root[data-theme="dark"] .t-todo.clear { border-color: rgba(74,222,128,.4); }
    .todo-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-shrink: 0; }
    .todo-top .big { font-size: 2.2rem; }
    .t-todo.busy .todo-top .big { color: #db2777; }
    .t-todo.clear .todo-top .big { color: #16a34a; }
    .todo-top .lbl { font-size: .86rem; color: var(--text2); font-weight: 600; }
    .todo-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
    @media (max-width: 559px) { .todo-list { grid-template-columns: 1fr; } }
    .todo-row {
      display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 10px;
      background: var(--card); border: 1px solid var(--line); color: var(--ink); font-size: .84rem;
    }
    .todo-row:hover { border-color: #db2777; }
    .todo-row .ic { font-size: 1rem; width: 20px; text-align: center; }
    .todo-row .tx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .todo-row .n { font-weight: 800; font-size: .95rem; min-width: 28px; text-align: center; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--faint); font-variant-numeric: tabular-nums; }
    .todo-row.has .n { background: #e11d48; color: #fff; }
    .todo-row:not(.has) { color: var(--faint); }
    .todo-row.pack { border-style: dashed; border-color: #db2777; color: var(--text2); }
    .todo-row.pack.has .n { background: #db2777; }
    .todo-done { font-size: .82rem; color: var(--green-tx); font-weight: 600; grid-column: 1 / -1; margin-top: 2px; }

    /* 等级分布 */
    .tier-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--soft); gap: 2px; flex-shrink: 0; margin-top: 4px; }
    .tier-bar span { display: block; height: 100%; min-width: 3px; }
    .tier-legend { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
    @media (max-width: 559px) { .tier-legend { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .tier-legend div { font-size: .72rem; color: var(--muted); min-width: 0; }
    .tier-legend b { display: block; font-size: 1.05rem; color: var(--ink); font-variant-numeric: tabular-nums; }
    .tier-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }

    /* 清单 */
    .list { list-style: none; display: flex; flex-direction: column; }
    .list li { display: flex; align-items: center; gap: 8px; font-size: .8rem; padding: 5px 0; border-top: 1px solid var(--soft); min-width: 0; }
    .list li:first-child { border-top: 0; }
    .list .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
    .list .rt { color: var(--faint); font-size: .72rem; white-space: nowrap; }
    .list a { color: var(--ink); }
    .list a:hover { color: #db2777; }
    .t-recent .list li { padding: 7px 0; }
    .t-recent .ic { width: 20px; text-align: center; flex-shrink: 0; }
    .none { color: var(--faint); font-size: .8rem; padding: 4px 0; }
    .chips { display: inline-flex; gap: 4px; }
    .chips button { font: inherit; font-size: .72rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; }
    .chips button.on { background: #db2777; border-color: #db2777; color: #fff; }
    .list .q { color: var(--muted); }
    .list .by { color: var(--faint); font-size: .72rem; }

    /* 系统：俱乐部 + 邮件提醒 */
    .sys-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; }
    .sys-row + .sys-row { border-top: 1px solid var(--soft); }
    .club-state { display: flex; align-items: center; gap: 8px; font-size: .92rem; font-weight: 800; color: var(--ink); }
    .club-state .lamp { width: 10px; height: 10px; border-radius: 50%; background: var(--line2); box-shadow: 0 0 0 3px var(--soft); }
    .club-state.on .lamp { background: #16a34a; box-shadow: 0 0 0 3px var(--green-bg2); }
    .club-state.off .lamp { background: #dc2626; box-shadow: 0 0 0 3px var(--red-bg2); }
    .sys-row .btn { padding: 5px 10px; font-size: .76rem; }
    .sys-k { font-size: .74rem; color: var(--muted); }
    .sys-v { font-size: .86rem; font-weight: 700; color: var(--ink); }
    .sys-row a.go2 { font-size: .76rem; font-weight: 600; }

    .err-box { background: var(--red-bg); border: 1px solid #fecaca; color: var(--red-tx); border-radius: 12px; padding: 8px 12px; margin-bottom: 10px; font-size: .85rem; flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="gate" class="gate"><div class="gate-card"><p>载入中…</p></div></div>

  <div id="app" class="hidden">
    <header id="adminHeader"></header>

    <div class="container">
      <div class="ov-head">
        <div>
          <h2 id="hello">📊 总览</h2>
          <p>先看「待处理」，再看会员和积分的变化。点任何一格都会跳到对应的页面。</p>
        </div>
        <div class="right">
          <a class="qbtn" href="announcements.html">📢 发公告</a>
          <a class="qbtn" href="rewards.html">🛍️ 新增奖品</a>
          <a class="qbtn" href="feed.html">✨ 发 Feed</a>
          <a class="qbtn" href="home.html">🏠 首页设定</a>
          <span id="updated"></span>
          <button id="reloadBtn" class="btn btn-ghost" title="重新整理">🔄</button>
        </div>
      </div>

      <div id="errBox" class="err-box hidden"></div>
      <div id="ciStockBox"></div>

      <div class="bento">
        <!-- 🔔 待处理 -->
        <section class="tile t-todo" id="tTodo">
          <div class="tile-h"><span>🔔 待处理</span></div>
          <div class="todo-top"><span class="big" id="todoTotal">–</span><span class="lbl" id="todoLbl">件事要处理</span></div>
          <div class="todo-list scroll" id="todoList"></div>
        </section>

        <!-- 👥 会员 -->
        <a class="tile t-mem" href="members.html">
          <div class="tile-h"><span>👥 会员</span><span class="go">会员列表 →</span></div>
          <div class="big" id="memTotal">–</div>
          <div class="sub" id="memSub"><span class="loading">载入中…</span></div>
        </a>

        <!-- 💰 积分 -->
        <a class="tile t-pts" href="members.html">
          <div class="tile-h"><span>💰 流通中的可用积分</span></div>
          <div class="big" id="ptsTotal">–</div>
          <div class="sub" id="ptsSub"><span class="loading">载入中…</span></div>
        </a>

        <!-- 🏅 等级分布 -->
        <a class="tile t-tier" href="members.html">
          <div class="tile-h"><span>🏅 等级分布</span><span class="go" id="tierNote"></span></div>
          <div class="tier-bar" id="tierBar"></div>
          <div class="tier-legend" id="tierLegend"></div>
        </a>

        <!-- 🛍️ 本月兑换 -->
        <a class="tile t-month" href="redeem.html#done">
          <div class="tile-h"><span>🛍️ 本月兑换</span><span class="go">→</span></div>
          <div class="big" id="monthCount">–</div>
          <div class="sub" id="monthSub"><span class="loading">载入中…</span></div>
        </a>

        <!-- 🎫 券码与库存 -->
        <a class="tile t-stock" href="rewards.html">
          <div class="tile-h"><span>🎫 券码与库存</span><span class="go">商城奖品 →</span></div>
          <div id="stockBig" class="row-big"></div>
          <ul class="list scroll" id="stockList"><li class="none">载入中…</li></ul>
        </a>

        <!-- 🕒 最近动态 -->
        <section class="tile t-recent">
          <div class="tile-h"><span>🕒 最近动态</span>
            <span class="chips" id="recentChips">
              <button data-f="all" class="on">全部</button><button data-f="member">会员</button><button data-f="feed">Feed</button><button data-f="admin">管理员</button>
            </span></div>
          <ul class="list scroll" id="recentList"><li class="none">载入中…</li></ul>
        </section>

        <!-- 🎂 本月寿星 -->
        <a class="tile t-bday" href="members.html">
          <div class="tile-h"><span id="bdayTitle">🎂 本月寿星</span></div>
          <div class="big" id="bdayCount">–</div>
          <ul class="list scroll" id="bdayList"></ul>
        </a>

        <!-- ⚙️ 系统：俱乐部 + 邮件提醒 -->
        <section class="tile t-sys">
          <div class="tile-h"><span>⚙️ 系统</span></div>
          <div class="scroll">
          <div class="sys-row">
            <div><div class="sys-k">会员俱乐部</div><div class="club-state" id="clubState"><span class="lamp"></span><span id="clubText">读取中…</span></div></div>
            <button class="btn btn-ghost" id="clubBtn" type="button">切换</button>
          </div>
          <div class="sys-row">
            <div><div class="sys-k">📧 邮件提醒</div><div class="sys-v" id="notifyCount">–</div><div class="sys-k" id="notifySub"></div></div>
            <a class="go2" href="notify.html">设定 →</a>
          </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { can } from "/js/admin-guard.js";
    import { ciStockState, ciStockBannerHTML, bindCiStockBanner, refreshCiStockBadge } from "./js/ci-stock.js";   // 🏅 签到达人礼物库存提醒
    import {
      requireAdmin, renderAdminNav, esc, toDate, fmtDate, computeBalance, TIER_LABELS, readyWinners, openReportCount, NM_ACTIONABLE
    } from "./js/admin-common.js";
    import {
      collection, getDocs, getDoc, doc, query, where, onSnapshot, orderBy, limit, getCountFromServer
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const $ = id => document.getElementById(id);
    renderAdminNav("overview");

    const TIERS = [
      { key: "mochii",  color: "#f9a8d4" },
      { key: "silver",  color: "#94a3b8" },
      { key: "gold",    color: "#f59e0b" },
      { key: "diamond", color: "#38bdf8" },
      { key: "black",   color: "#1e293b" },
    ];
    // 和 notify.html 的 EVENTS 一致（预设开或关）
    const NOTIFY_DEFAULTS = { newMember: true, redemption: true, prize: true, feedPending: true, address: false, problemStale: false, newBinding: false };

    const num = n => Number(n || 0).toLocaleString("en-US");
    const DONE_STATUSES = ["approved", "shipped", "completed", "problem"];

    function ago(d) {
      if (!d) return "";
      const s = (Date.now() - d.getTime()) / 1000;
      if (s < 60) return "刚刚";
      if (s < 3600) return Math.floor(s / 60) + " 分钟前";
      if (s < 86400) return Math.floor(s / 3600) + " 小时前";
      if (s < 172800) return "昨天";
      if (s < 7 * 86400) return Math.floor(s / 86400) + " 天前";
      return fmtDate(d);
    }
    const monthStart = (offset = 0) => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth() + offset, 1); };

    // ---------- 🔔 待处理 ----------
    const todo = {
      rPending: { ic: "🎁", t: "兑换待审核", href: "redeem.html#pending", n: null },
      rShip:    { ic: "📦", t: "兑换待发货", href: "redeem.html#toShip", n: null },
      pClaimed: { ic: "🏆", t: "中奖待审核", href: "prizes.html#claimed", n: null },
      pShip:    { ic: "🚚", t: "中奖待发货", href: "prizes.html#approved", n: null },
      feed:     { ic: "⏳", t: "Feed 投稿待审核", href: "feed.html#pending", n: null },
      reports:  { ic: "🚩", t: "Feed 检举待处理", href: "feed.html#reports", n: null },
      ready:    { ic: "🔗", t: "得奖者已绑定，待发奖", href: "prizes.html", n: null },
      nm:       { ic: "🎉", t: "新会员奖励待处理", href: "newmember.html#review", n: null },
    };
    function renderTodo() {
      const rows = Object.values(todo);
      const total = rows.reduce((s, r) => s + (r.n || 0), 0);
      const loaded = rows.filter(r => r.n !== null).length;
      $("todoTotal").textContent = loaded ? total : "–";
      $("todoLbl").textContent = total ? "件事要处理" : (loaded === rows.length ? "全部处理完了" : "件事要处理");
      $("tTodo").classList.toggle("busy", total > 0);
      $("tTodo").classList.toggle("clear", loaded === rows.length && total === 0);
      $("todoList").innerHTML = rows.map(r => `
        <a class="todo-row ${r.n ? "has" : ""}" href="${r.href}">
          <span class="ic">${r.ic}</span>
          <span class="tx">${r.t}</span>
          <span class="n">${r.n === null ? "…" : r.n}</span>
        </a>`).join("") +
        (loaded === rows.length && !total ? `<div class="todo-done" style="grid-column:1/-1">✓ 目前没有要处理的事，休息一下 ☕</div>` : "") +
        // 🧺 随单寄出的东西：和上面「待发货」有重叠，所以不算进总数；只是捷径到打包清单
        (packN !== null ? `<a class="todo-row pack ${packN ? "has" : ""}" href="../pack/#all" title="打包时扫单号会自动列出；这里是所有还没寄的（含还没下单的会员）">
          <span class="ic">🧺</span><span class="tx">待随单寄出（打包清单）</span><span class="n">${packN}</span></a>` : "");
    }
    let packN = null;   // null = 没有「🧺 打包清单」权限 → 不显示
    async function loadPackCount(redemptions, wins) {
      if (!can(window.msAccess, "pack")) return;
      const red = redemptions.filter(r => r.uid && r.kind === "gift" && r.newMember !== true && r.status === "approved"
        && (r.delivery || (r.address ? "separate" : "withOrder")) === "withOrder").length;
      const ci = redemptions.filter(r => r.uid && r.ciGift === true && r.status === "pending" && (r.delivery || "withOrder") === "withOrder").length;
      const pw = wins.filter(w => w.uid && w.delivery !== "separate" && (w.status === "claimed" || w.status === "approved")).length;
      const cnt = q => getCountFromServer(q).then(x => x.data().count).catch(() => 0);
      const [sg, nm] = await Promise.all([
        cnt(query(collection(db, "smallGifts"), where("status", "==", "pending"))),
        cnt(query(collection(db, "newMemberRewards"), where("status", "in", ["ready_to_pack", "packed"]))),
      ]);
      packN = red + ci + pw + sg + nm;
      renderTodo();
    }

    // ---------- 主要资料 ----------
    async function load() {
      $("errBox").classList.add("hidden");
      const [mS, bS, lS, rS, wS, fS, rwS, cS, sS, nS] = await Promise.all([
        getDocs(collection(db, "members")),
        getDocs(collection(db, "bindings")),
        getDocs(collection(db, "pointsLedger")),
        getDocs(collection(db, "redemptions")),
        getDocs(collection(db, "prizeWins")),
        getDocs(query(collection(db, "feedPosts"), where("status", "==", "pending"))),
        getDocs(collection(db, "rewards")),
        getDocs(collection(db, "coupons")),
        getDocs(collection(db, "rewardSecrets")),
        getDoc(doc(db, "adminSettings", "notify")).catch(() => null),
      ]);

      const members = {};
      mS.docs.forEach(d => members[d.id] = { uid: d.id, ...d.data() });
      const nameOf = uid => (members[uid] || {}).name || "会员";
      const isInternal = uid => !!(members[uid] && members[uid].internal && members[uid].internal.on);
      const redemptions = rS.docs.map(d => ({ id: d.id, ...d.data() }));
      const wins = wS.docs.map(d => ({ id: d.id, ...d.data() }));

      // 待处理
      // 🎉 迎新礼的兑换在「新会员奖励」处理，不算在兑换审核
      todo.rPending.n = redemptions.filter(r => r.newMember !== true && r.status === "pending").length;
      todo.rShip.n = redemptions.filter(r => r.newMember !== true && r.kind === "gift" && (r.status === "approved" || r.status === "problem")).length;
      todo.pClaimed.n = wins.filter(w => w.status === "claimed").length;
      todo.pShip.n = wins.filter(w => w.status === "approved").length;
      todo.feed.n = fS.size;
      todo.reports.n = await openReportCount();
      // 没有「新会员奖励」权限、或还没更新规则时当作 0
      todo.nm.n = await getCountFromServer(query(collection(db, "newMemberRewards"), where("status", "in", NM_ACTIONABLE)))
        .then(s => s.data().count).catch(() => 0);
      renderTodo();
      loadPackCount(redemptions, wins);   // 🧺 不等它

      // 会员（统计不算内部会员）
      const real = Object.values(members).filter(m => !isInternal(m.uid));
      const boundUids = new Set(bS.docs.map(d => d.data().uid));
      const bound = real.filter(m => boundUids.has(m.uid)).length;
      const thisMonth = monthStart(0), lastMonth = monthStart(-1);
      const newThis = real.filter(m => (toDate(m.createdAt) || 0) >= thisMonth).length;
      const newLast = real.filter(m => { const d = toDate(m.createdAt); return d && d >= lastMonth && d < thisMonth; }).length;
      const nInternal = Object.keys(members).length - real.length;
      $("memTotal").innerHTML = `${num(real.length)}<small>人</small>`;
      $("memSub").innerHTML = `本月新增 <b>+${newThis}</b>${newLast ? `（上月 ${newLast}）` : ""}<br>
        已绑定 <b>${real.length ? Math.round(bound / real.length * 100) : 0}%</b>（${bound} 人）${nInternal ? ` · 内部 ${nInternal}` : ""}`;

      // 积分
      const ledgers = {}, redByUid = {};
      lS.docs.forEach(d => { const x = d.data(); (ledgers[x.uid] = ledgers[x.uid] || []).push(x); });
      redemptions.forEach(r => (redByUid[r.uid] = redByUid[r.uid] || []).push(r));
      let spendable = 0, pending = 0, negative = 0;
      real.forEach(m => {
        const b = computeBalance(ledgers[m.uid] || [], redByUid[m.uid] || []);
        spendable += b.spendable; pending += b.pending;
        if (b.spendable < 0) negative++;
      });
      $("ptsTotal").innerHTML = `${num(spendable)}<small>分</small>`;
      $("ptsSub").innerHTML = `待确认 <b>${num(pending)}</b> 分（14 天后入账）${negative ? `<br><span class="down">${negative} 位会员积分是负数</span>` : ""}`;

      // 等级分布
      const tierCount = {};
      real.forEach(m => { const t = TIERS.some(x => x.key === m.tier) ? m.tier : "mochii"; tierCount[t] = (tierCount[t] || 0) + 1; });
      const tTotal = real.length || 1;
      $("tierBar").innerHTML = TIERS.filter(t => tierCount[t.key])
        .map(t => `<span style="flex:${tierCount[t.key]};background:${t.color}" title="${esc(TIER_LABELS[t.key])}：${tierCount[t.key]}"></span>`).join("");
      $("tierLegend").innerHTML = TIERS.map(t => `
        <div><b>${tierCount[t.key] || 0}</b><i style="background:${t.color}"></i>${esc(TIER_LABELS[t.key])}
          <span class="muted">${Math.round((tierCount[t.key] || 0) / tTotal * 100)}%</span></div>`).join("");
      $("tierNote").textContent = "不含内部会员";

      // 本月兑换（不算测试兑换）
      const decided = redemptions.filter(r => !r.test && DONE_STATUSES.includes(r.status));
      const inRange = (r, a, b) => { const d = toDate(r.decidedAt) || toDate(r.createdAt); return d && d >= a && (!b || d < b); };
      const mThis = decided.filter(r => inRange(r, thisMonth));
      const mLast = decided.filter(r => inRange(r, lastMonth, thisMonth));
      const ptsThis = mThis.reduce((s, r) => s + (r.cost || 0), 0);
      const top = {};
      mThis.forEach(r => top[r.rewardName || "?"] = (top[r.rewardName || "?"] || 0) + 1);
      const topName = Object.entries(top).sort((a, b) => b[1] - a[1])[0];
      const diff = mThis.length - mLast.length;
      $("monthCount").innerHTML = `${mThis.length}<small>笔</small>`;
      $("monthSub").innerHTML = `用掉 <b>${num(ptsThis)}</b> 分 · 上月 ${mLast.length} 笔
        ${mLast.length || mThis.length ? `<span class="${diff >= 0 ? "up" : "down"}">${diff >= 0 ? "↑" : "↓"}${Math.abs(diff)}</span>` : ""}
        ${topName ? `<br>最热门：<b>${esc(topName[0])}</b>` : ""}`;

      // 券码与库存：上架中的奖品
      const secrets = {};
      sS.docs.forEach(d => secrets[d.id] = d.data());
      const pool = {};
      cS.docs.forEach(d => { const c = d.data(); if (!c.used) pool[c.rewardId] = (pool[c.rewardId] || 0) + 1; });
      const warn = [];
      const used = {};
      redemptions.forEach(x => { if (x.kind === "coupon" && !x.test && ["approved", "completed"].includes(x.status)) used[x.rewardId] = (used[x.rewardId] || 0) + 1; });
      rwS.docs.forEach(d => {
        const r = { id: d.id, ...d.data() };
        if (!r.active) return;
        // 🔒 平台优惠券：7 天内到期 / 已过期 / 平台数量快用完
        const v = (secrets[r.id] || {}).voucher;
        if (r.type === "coupon" && v) {
          const end = toDate(v.endAt);
          if (end) {
            const days = (end - Date.now()) / 86400000;
            if (days <= 7) warn.push({ name: r.name, left: Math.max(0, Math.ceil(days)), text: days <= 0 ? "平台券已过期" : `平台券 ${Math.ceil(days)} 天后到期`, bad: days <= 0 });
          }
          if (typeof v.limit === "number" && v.limit - (used[r.id] || 0) <= 5) {
            const left = v.limit - (used[r.id] || 0);
            warn.push({ name: r.name, left: Math.max(0, left), text: left <= 0 ? "平台券数量用完" : `平台券剩 ${left} 张`, bad: left <= 0 });
          }
        }
        if (r.type === "coupon" && !(secrets[r.id] || {}).couponCode) {
          const left = pool[r.id] || 0;
          if (left < 5) warn.push({ name: r.name, left, unit: "组券码", bad: left === 0 });
        } else if (typeof r.stock === "number" && r.stock <= 3) {
          warn.push({ name: r.name, left: r.stock, unit: "件库存", bad: r.stock <= 0 });
        }
      });
      warn.sort((a, b) => a.left - b.left);
      const activeN = rwS.docs.filter(d => d.data().active).length;
      $("stockBig").innerHTML = warn.length
        ? `<span class="big" style="color:#dc2626">${warn.length}</span><span class="sub">个快用完</span>`
        : `<span class="big" style="color:#16a34a">✓</span><span class="sub">${activeN} 个上架奖品，都够用</span>`;
      $("stockList").innerHTML = warn.map(w => `
          <li><span class="nm">${esc(w.name)}</span><span class="tag ${w.bad ? "tag-bad" : "tag-warn"}">${w.text ? esc(w.text) : `剩 ${w.left} ${w.unit}`}</span></li>`).join("");

      // 最近动态：会员、Feed、管理员三类（Feed 和管理员记录另外读取，慢一点出现）
      const ev = [];
      const add = (cat, d, ic, html) => { if (d) ev.push({ cat, d, ic, html }); };
      const mLink = (uid, name) => `<a href="member.html?uid=${encodeURIComponent(uid)}"><b>${esc(name)}</b></a>`;
      Object.values(members).forEach(m => add("member", toDate(m.createdAt), "🆕", `${mLink(m.uid, m.name || "新会员")} 注册成为会员`));
      redemptions.filter(r => !r.test).forEach(r => {
        add("member", toDate(r.createdAt), "🎁", `${mLink(r.uid, nameOf(r.uid))} <a href="redeem.html${r.status === "pending" ? "#pending" : ""}">兑换 ${esc(r.rewardName || "")}（${r.cost || 0} 分）</a>`);
        add("member", toDate(r.addressUpdatedAt), "📦", `${mLink(r.uid, nameOf(r.uid))} <a href="redeem.html">修改了兑换 ${esc(r.rewardName || "")} 的收货地址</a>`);
        add("member", toDate(r.receivedAt), "✅", `${mLink(r.uid, nameOf(r.uid))} <a href="redeem.html#done">确认收到 ${esc(r.rewardName || "")}</a>`);
      });
      wins.forEach(w => {
        add("member", toDate(w.claimedAt), "🏆", `${mLink(w.uid, nameOf(w.uid))} <a href="prizes.html${w.status === "claimed" ? "#claimed" : ""}">领取了 ${esc(w.prizeName || "中奖奖品")}</a>`);
        if (!w.addressUpdatedBy) add("member", toDate(w.addressUpdatedAt), "📦", `${mLink(w.uid, nameOf(w.uid))} <a href="prizes.html">修改了 ${esc(w.prizeName || "中奖奖品")} 的收货地址</a>`);
        if (!w.adminCompleted) add("member", toDate(w.completedAt), "✅", `${mLink(w.uid, nameOf(w.uid))} <a href="prizes.html#completed">确认收到 ${esc(w.prizeName || "中奖奖品")}</a>`);
      });
      bS.docs.forEach(d => {
        const b = d.data();
        if (b.verifyOrder === "admin") return;   // 管理员代绑的算在「管理员」
        add("member", toDate(b.createdAt), "🔗", `${mLink(b.uid, nameOf(b.uid))} 绑定了 ${b.platform === "shopee" ? "Shopee" : "TikTok"} 账号 ${esc(b.username || "")}`);
      });
      recent = ev;
      renderRecent();
      loadRecentExtra(nameOf);

      // 本月寿星（生日格式 YYYY-MM-DD）
      const now = new Date(), mm = now.getMonth() + 1, dd = now.getDate();
      const bdays = Object.values(members).map(m => {
        const x = String(m.birthday || "").match(/^\d{4}-(\d{2})-(\d{2})/);
        return x && +x[1] === mm ? { m, day: +x[2] } : null;
      }).filter(Boolean).sort((a, b) => a.day - b.day);
      $("bdayTitle").textContent = `🎂 ${mm} 月寿星`;
      $("bdayCount").innerHTML = `${bdays.length}<small>人</small>`;
      $("bdayList").innerHTML = bdays.length
        ? bdays.map(b => `<li><span class="nm">${b.day === dd ? "🎉 " : ""}${esc(b.m.name || "会员")}</span><span class="rt">${b.day === dd ? "今天" : `${mm}/${b.day}`}</span></li>`).join("")
        : `<li class="none">这个月没有寿星</li>`;

      // 邮件提醒
      const cfg = nS && nS.exists() ? nS.data() : {};
      const evs = cfg.events || {};
      const onN = Object.keys(NOTIFY_DEFAULTS).filter(k => evs[k] ?? NOTIFY_DEFAULTS[k]).length;
      const emails = (cfg.emails || []).length;
      $("notifyCount").textContent = `${onN} / ${Object.keys(NOTIFY_DEFAULTS).length} 项开启`;
      $("notifySub").innerHTML = emails
        ? `寄到 <b>${emails}</b> 个邮箱 · ${cfg.mode === "daily" ? "每天汇总一次" : "马上寄出"}`
        : `<span class="down">还没设定收件邮箱</span>`;

      const t = new Date();
      $("updated").textContent = `更新 ${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;

      // 得奖者已绑定、还没发奖（要读抽奖网站，比较慢，放最后）
      todo.ready.n = null; renderTodo();
      readyWinners().then(list => { todo.ready.n = list.length; renderTodo(); })
        .catch(e => { console.warn("readyWinners", e); todo.ready.n = 0; renderTodo(); });
    }

    // ---------- 🕒 最近动态 ----------
    let recent = [], extra = [], recentFilter = "all", logNote = "";
    const ICON_ADMIN = { redeem: "🎁", prize: "🏆", member: "👤", points: "➕", feed: "📰", content: "📝", settings: "⚙️" };
    function renderRecent() {
      const list = [...recent, ...extra].filter(e => recentFilter === "all" || e.cat === recentFilter).sort((a, b) => b.d - a.d).slice(0, 40);
      let html = list.map(e => `<li><span class="ic">${e.ic}</span><span class="nm">${e.html}</span><span class="rt">${ago(e.d)}</span></li>`).join("");
      if (logNote && (recentFilter === "admin" || recentFilter === "all")) html += `<li class="none">${logNote}</li>`;
      $("recentList").innerHTML = html || `<li class="none">还没有动态</li>`;
    }
    $("recentChips").addEventListener("click", e => {
      const b = e.target.closest("button[data-f]");
      if (!b) return;
      recentFilter = b.dataset.f;
      document.querySelectorAll("#recentChips button").forEach(x => x.classList.toggle("on", x === b));
      renderRecent();
    });

    // Feed（最近 15 篇帖子 + 每篇最新 5 条回复）和管理员操作记录
    async function loadRecentExtra(nameOf) {
      const out = [];
      const short = s => { s = String(s || "").replace(/\s+/g, " ").trim(); return s.length > 30 ? s.slice(0, 30) + "…" : s; };
      try {
        const ps = await getDocs(query(collection(db, "feedPosts"), orderBy("createdAt", "desc"), limit(15)));
        const posts = ps.docs.map(d => ({ id: d.id, ...d.data() }));
        posts.forEach(p => {
          const who = esc(p.authorName || nameOf(p.authorUid));
          const st = p.status === "pending" ? "，等你审核" : p.status === "rejected" ? "（已退回）" : "";
          out.push({ cat: "feed", d: toDate(p.createdAt), ic: "📰",
            html: `<a href="feed.html#post=${encodeURIComponent(p.id)}"><b>${who}</b> 发了帖子${st}</a>` });
        });
        const cs = await Promise.all(posts.map(p =>
          getDocs(query(collection(db, "feedPosts", p.id, "comments"), orderBy("createdAt", "desc"), limit(5))).catch(() => null)));
        cs.forEach((snap, i) => snap && snap.docs.forEach(d => {
          const c = d.data(), p = posts[i];
          out.push({ cat: "feed", d: toDate(c.createdAt), ic: "💬",
            html: `<a href="feed.html#post=${encodeURIComponent(p.id)}&c=${encodeURIComponent(d.id)}"><b>${esc(c.authorName || nameOf(c.authorUid))}</b> 回复了 ${esc(p.authorName || "")} 的帖子 <span class="q">「${esc(short(c.text))}」</span></a>` });
        }));
      } catch (e) { console.warn("recent feed", e); }
      try {
        const rs = await getDocs(query(collection(db, "feedReports"), where("status", "==", "open")));
        rs.docs.forEach(d => {
          const r = d.data();
          out.push({ cat: "feed", d: toDate(r.createdAt), ic: "🚩",
            html: `<a href="feed.html#reports"><b>${esc(nameOf(r.reporterUid))}</b> 检举了一${r.kind === "post" ? "篇帖子" : "条留言"} <span class="q">「${esc(short(r.text))}」</span></a>` });
        });
      } catch (e) { /* 还没加 feedReports 规则 */ }
      logNote = "";
      try {
        const ls = await getDocs(query(collection(db, "adminLog"), orderBy("at", "desc"), limit(40)));
        ls.docs.forEach(d => {
          const l = d.data();
          const who = esc(l.byName || String(l.by || "").split("@")[0] || "管理员");
          const body = `<b>${who}</b> ${esc(l.text || "")}`;
          out.push({ cat: "admin", d: toDate(l.at), ic: ICON_ADMIN[l.type] || "🛠️",
            html: (l.link ? `<a href="${esc(l.link)}">${body}</a>` : body) + ` <span class="by">· 管理员</span>` });
        });
      } catch (e) {
        console.warn("adminLog", e);
        logNote = "管理员操作记录还没开启：请先更新 Firestore 规则（adminLog）";
      }
      extra = out.filter(x => x.d);
      renderRecent();
    }

    // ---------- 俱乐部开关（和侧边栏同一个开关） ----------
    function watchClub() {
      onSnapshot(doc(db, "settings", "club"), s => {
        const open = s.exists() && s.data().open === true;
        $("clubState").className = "club-state " + (open ? "on" : "off");
        $("clubText").textContent = open ? "开放中" : "维修中";
        $("clubState").title = open ? "会员可以注册、登录和兑换" : "会员看到「正在装修俱乐部」，无法登录";
        $("clubBtn").textContent = open ? "关闭" : "开放";
      });
      $("clubBtn").addEventListener("click", () => $("clubSwitch").click());
    }

    // 🏅 签到达人礼物库存剩 20 / 10：最上面一条黄色提醒（有「商城」权限的人才看得到、才能按）
    async function loadCiStock() {
      const a = window.msAccess;
      if (!can(a, "member.shop")) return;
      const st = await ciStockState();
      $("ciStockBox").innerHTML = ciStockBannerHTML(st);
      bindCiStockBanner($("ciStockBox"), st, () => { loadCiStock(); refreshCiStockBadge(); });
    }
    function run() {
      loadCiStock();
      $("reloadBtn").disabled = true;
      load().catch(e => {
        $("errBox").textContent = "载入失败：" + e.message;
        $("errBox").classList.remove("hidden");
      }).finally(() => { $("reloadBtn").disabled = false; });
    }
    $("reloadBtn").addEventListener("click", run);

    renderTodo();
    requireAdmin(user => {
      const h = new Date().getHours();
      const hi = h < 5 ? "夜深了" : h < 12 ? "早安" : h < 18 ? "午安" : "晚上好";
      $("hello").textContent = `📊 总览 · ${hi}${user.displayName ? "，" + user.displayName : ""}`;
      watchClub();
      run();
    });
  </script>
</body>
</html>
