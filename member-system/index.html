<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../logo.png">
  <title>总览 · 会员系统 Admin</title>
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .container { max-width: 1120px; }
    .ov-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .ov-head h2 { font-size: 1.4rem; color: #0f172a; }
    .ov-head p { color: #64748b; font-size: .85rem; margin-top: 2px; }
    .ov-head .right { display: flex; align-items: center; gap: 10px; font-size: .8rem; color: #94a3b8; }

    /* ===== 便当盒 ===== */
    .bento {
      display: grid; gap: 14px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-areas:
        "todo  todo  mem    pts"
        "todo  todo  tier   tier"
        "month stock recent recent"
        "bday  club  recent recent"
        "quick quick quick  notify";
    }
    .t-todo { grid-area: todo; } .t-mem { grid-area: mem; } .t-pts { grid-area: pts; }
    .t-tier { grid-area: tier; } .t-month { grid-area: month; } .t-stock { grid-area: stock; }
    .t-recent { grid-area: recent; } .t-bday { grid-area: bday; } .t-club { grid-area: club; }
    .t-quick { grid-area: quick; } .t-notify { grid-area: notify; }
    @media (max-width: 1179px) {
      .bento {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-areas:
          "todo  todo" "mem pts" "tier tier" "month stock" "recent recent" "bday club" "notify quick";
      }
    }
    @media (max-width: 559px) {
      .bento { grid-template-columns: minmax(0, 1fr); gap: 12px;
        grid-template-areas: "todo" "mem" "pts" "tier" "month" "stock" "recent" "bday" "club" "notify" "quick"; }
    }

    .tile {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px 18px;
      display: flex; flex-direction: column; min-width: 0; color: inherit;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    a.tile:hover { border-color: #cbd5e1; box-shadow: 0 8px 18px rgba(15,23,42,.06); transform: translateY(-2px); }
    .tile-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .8rem; font-weight: 700; color: #64748b; margin-bottom: 10px; }
    .tile-h .go { font-weight: 600; color: #94a3b8; font-size: .78rem; white-space: nowrap; }
    a.tile:hover .tile-h .go { color: #db2777; }
    .big { font-size: 2rem; font-weight: 800; color: #0f172a; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
    .big small { font-size: .85rem; font-weight: 600; color: #64748b; margin-left: 4px; letter-spacing: 0; }
    .sub { font-size: .82rem; color: #64748b; margin-top: 6px; line-height: 1.55; }
    .sub b { color: #0f172a; font-variant-numeric: tabular-nums; }
    .up { color: #16a34a; font-weight: 700; }
    .down { color: #dc2626; font-weight: 700; }
    .loading { color: #cbd5e1; }

    /* 待处理 */
    .t-todo { padding: 18px 20px; }
    .t-todo.busy { background: linear-gradient(160deg, #fdf2f8 0%, #fff 55%); border-color: #f9a8d4; }
    .t-todo.clear { background: linear-gradient(160deg, #f0fdf4 0%, #fff 55%); border-color: #bbf7d0; }
    .todo-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
    .todo-top .big { font-size: 2.6rem; }
    .t-todo.busy .todo-top .big { color: #db2777; }
    .t-todo.clear .todo-top .big { color: #16a34a; }
    .todo-top .lbl { font-size: .9rem; color: #475569; font-weight: 600; }
    .todo-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 559px) { .todo-list { grid-template-columns: 1fr; } }
    .todo-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
      background: #fff; border: 1px solid #e2e8f0; color: #0f172a; font-size: .86rem;
    }
    .todo-row:hover { border-color: #db2777; }
    .todo-row .ic { font-size: 1.05rem; width: 22px; text-align: center; }
    .todo-row .tx { flex: 1; min-width: 0; }
    .todo-row .tx small { display: block; color: #94a3b8; font-size: .72rem; }
    .todo-row .n { font-weight: 800; font-size: 1.05rem; min-width: 30px; text-align: center; padding: 2px 8px; border-radius: 999px; background: #f1f5f9; color: #94a3b8; font-variant-numeric: tabular-nums; }
    .todo-row.has .n { background: #e11d48; color: #fff; }
    .todo-row:not(.has) { color: #94a3b8; }
    .todo-done { margin-top: 12px; font-size: .85rem; color: #15803d; font-weight: 600; }

    /* 等级分布 */
    .tier-bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: #f1f5f9; gap: 2px; }
    .tier-bar span { display: block; height: 100%; min-width: 3px; }
    .tier-legend { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
    @media (max-width: 559px) { .tier-legend { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .tier-legend div { font-size: .74rem; color: #64748b; min-width: 0; }
    .tier-legend b { display: block; font-size: 1.1rem; color: #0f172a; font-variant-numeric: tabular-nums; }
    .tier-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }

    /* 清单 */
    .list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
    .list li { display: flex; align-items: center; gap: 8px; font-size: .84rem; padding: 6px 0; border-top: 1px solid #f1f5f9; min-width: 0; }
    .list li:first-child { border-top: 0; }
    .list .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #0f172a; }
    .list .rt { color: #94a3b8; font-size: .76rem; white-space: nowrap; }
    .list a { color: #0f172a; }
    .list a:hover { color: #db2777; }
    .t-recent .list li { padding: 8px 0; }
    .t-recent .ic { width: 22px; text-align: center; flex-shrink: 0; }
    .none { color: #94a3b8; font-size: .84rem; padding: 6px 0; }

    /* 俱乐部 */
    .club-state { display: flex; align-items: center; gap: 10px; font-size: 1.05rem; font-weight: 800; color: #0f172a; }
    .club-state .lamp { width: 12px; height: 12px; border-radius: 50%; background: #cbd5e1; box-shadow: 0 0 0 4px #f1f5f9; }
    .club-state.on .lamp { background: #16a34a; box-shadow: 0 0 0 4px #dcfce7; }
    .club-state.off .lamp { background: #dc2626; box-shadow: 0 0 0 4px #fee2e2; }
    .tile .btn { align-self: flex-start; margin-top: auto; }
    .t-club .btn { margin-top: 12px; }

    /* 快捷 */
    .quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    @media (max-width: 1179px) { .quick { grid-template-columns: 1fr 1fr; } }
    .quick a {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      padding: 12px 6px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0;
      color: #0f172a; font-size: .82rem; font-weight: 600; text-align: center;
    }
    .quick a span { font-size: 1.25rem; }
    .quick a:hover { border-color: #db2777; background: #fdf2f8; }

    .err-box { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-size: .88rem; }
  </style>
</head>
<body>
  <div id="gate" class="gate"><div class="gate-card"><p>载入中…</p></div></div>

  <div id="app" class="hidden">
    <header id="adminHeader"></header>

    <div class="container">
      <div class="ov-head">
        <div>
          <h2 id="hello">📊 总览</h2>
          <p>先看「待处理」，再看会员和积分的变化。点任何一格都会跳到对应的页面。</p>
        </div>
        <div class="right">
          <span id="updated"></span>
          <button id="reloadBtn" class="btn btn-ghost">🔄 重新整理</button>
        </div>
      </div>

      <div id="errBox" class="err-box hidden"></div>

      <div class="bento">
        <!-- 🔔 待处理 -->
        <section class="tile t-todo" id="tTodo">
          <div class="tile-h"><span>🔔 待处理</span></div>
          <div class="todo-top"><span class="big" id="todoTotal">–</span><span class="lbl" id="todoLbl">件事要处理</span></div>
          <div class="todo-list" id="todoList"></div>
        </section>

        <!-- 👥 会员 -->
        <a class="tile t-mem" href="members.html">
          <div class="tile-h"><span>👥 会员</span><span class="go">会员列表 →</span></div>
          <div class="big" id="memTotal">–</div>
          <div class="sub" id="memSub"><span class="loading">载入中…</span></div>
        </a>

        <!-- 💰 积分 -->
        <a class="tile t-pts" href="members.html">
          <div class="tile-h"><span>💰 流通中的可用积分</span></div>
          <div class="big" id="ptsTotal">–</div>
          <div class="sub" id="ptsSub"><span class="loading">载入中…</span></div>
        </a>

        <!-- 🏅 等级分布 -->
        <a class="tile t-tier" href="members.html">
          <div class="tile-h"><span>🏅 等级分布</span><span class="go" id="tierNote"></span></div>
          <div class="tier-bar" id="tierBar"></div>
          <div class="tier-legend" id="tierLegend"></div>
        </a>

        <!-- 🛍️ 本月兑换 -->
        <a class="tile t-month" href="redeem.html#done">
          <div class="tile-h"><span>🛍️ 本月兑换</span><span class="go">→</span></div>
          <div class="big" id="monthCount">–</div>
          <div class="sub" id="monthSub"><span class="loading">载入中…</span></div>
        </a>

        <!-- 🎫 库存提醒 -->
        <a class="tile t-stock" href="rewards.html">
          <div class="tile-h"><span>🎫 券码与库存</span><span class="go">商城奖品 →</span></div>
          <div id="stockBody"><span class="none">载入中…</span></div>
        </a>

        <!-- 🕒 最近动态 -->
        <section class="tile t-recent">
          <div class="tile-h"><span>🕒 最近动态</span></div>
          <ul class="list" id="recentList"><li class="none">载入中…</li></ul>
        </section>

        <!-- 🎂 本月寿星 -->
        <a class="tile t-bday" href="members.html">
          <div class="tile-h"><span id="bdayTitle">🎂 本月寿星</span></div>
          <div class="big" id="bdayCount">–</div>
          <ul class="list" id="bdayList"></ul>
        </a>

        <!-- 🟢 俱乐部 -->
        <section class="tile t-club">
          <div class="tile-h"><span>🏠 会员俱乐部</span></div>
          <div class="club-state" id="clubState"><span class="lamp"></span><span id="clubText">读取中…</span></div>
          <div class="sub" id="clubSub"></div>
          <button class="btn btn-ghost" id="clubBtn" type="button">切换</button>
        </section>

        <!-- ⚡ 快捷 -->
        <section class="tile t-quick">
          <div class="tile-h"><span>⚡ 快捷操作</span></div>
          <div class="quick">
            <a href="announcements.html"><span>📢</span>发公告</a>
            <a href="rewards.html"><span>🛍️</span>新增奖品</a>
            <a href="feed.html"><span>✨</span>发 Feed</a>
            <a href="home.html"><span>🏠</span>首页设定</a>
          </div>
        </section>

        <!-- 📧 邮件提醒 -->
        <a class="tile t-notify" href="notify.html">
          <div class="tile-h"><span>📧 邮件提醒</span><span class="go">设定 →</span></div>
          <div class="big" id="notifyCount">–</div>
          <div class="sub" id="notifySub"></div>
        </a>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import {
      requireAdmin, renderAdminNav, esc, toDate, fmtDate, computeBalance, TIER_LABELS, readyWinners
    } from "./js/admin-common.js";
    import {
      collection, getDocs, getDoc, doc, query, where, onSnapshot
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const $ = id => document.getElementById(id);
    renderAdminNav("overview");

    const TIERS = [
      { key: "mochii",  color: "#f9a8d4" },
      { key: "silver",  color: "#94a3b8" },
      { key: "gold",    color: "#f59e0b" },
      { key: "diamond", color: "#38bdf8" },
      { key: "black",   color: "#0f172a" },
    ];
    // 和 notify.html 的 EVENTS 一致（预设开或关）
    const NOTIFY_DEFAULTS = { newMember: true, redemption: true, prize: true, feedPending: true, address: false, problemStale: false, newBinding: false };

    const num = n => Number(n || 0).toLocaleString("en-US");
    const DONE_STATUSES = ["approved", "shipped", "completed", "problem"];

    function ago(d) {
      if (!d) return "";
      const s = (Date.now() - d.getTime()) / 1000;
      if (s < 60) return "刚刚";
      if (s < 3600) return Math.floor(s / 60) + " 分钟前";
      if (s < 86400) return Math.floor(s / 3600) + " 小时前";
      if (s < 172800) return "昨天";
      if (s < 7 * 86400) return Math.floor(s / 86400) + " 天前";
      return fmtDate(d);
    }
    const monthStart = (offset = 0) => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth() + offset, 1); };

    // ---------- 🔔 待处理 ----------
    const todo = {
      rPending: { ic: "🎁", t: "兑换待审核", href: "redeem.html#pending", n: null },
      rShip:    { ic: "📦", t: "兑换待发货", href: "redeem.html#toShip", n: null },
      pClaimed: { ic: "🏆", t: "中奖待审核", href: "prizes.html#claimed", n: null },
      pShip:    { ic: "🚚", t: "中奖待发货", href: "prizes.html#approved", n: null },
      feed:     { ic: "⏳", t: "Feed 投稿待审核", href: "feed.html#pending", n: null },
      ready:    { ic: "🔗", t: "得奖者已绑定，待发奖", href: "prizes.html", n: null },
    };
    function renderTodo() {
      const rows = Object.values(todo);
      const total = rows.reduce((s, r) => s + (r.n || 0), 0);
      const loaded = rows.filter(r => r.n !== null).length;
      $("todoTotal").textContent = loaded ? total : "–";
      $("todoLbl").textContent = total ? "件事要处理" : (loaded === rows.length ? "全部处理完了" : "件事要处理");
      $("tTodo").classList.toggle("busy", total > 0);
      $("tTodo").classList.toggle("clear", loaded === rows.length && total === 0);
      $("todoList").innerHTML = rows.map(r => `
        <a class="todo-row ${r.n ? "has" : ""}" href="${r.href}">
          <span class="ic">${r.ic}</span>
          <span class="tx">${r.t}</span>
          <span class="n">${r.n === null ? "…" : r.n}</span>
        </a>`).join("") +
        (loaded === rows.length && !total ? `<div class="todo-done" style="grid-column:1/-1">✓ 目前没有要处理的事，休息一下 ☕</div>` : "");
    }

    // ---------- 主要资料 ----------
    async function load() {
      $("errBox").classList.add("hidden");
      const [mS, bS, lS, rS, wS, fS, rwS, cS, sS, nS] = await Promise.all([
        getDocs(collection(db, "members")),
        getDocs(collection(db, "bindings")),
        getDocs(collection(db, "pointsLedger")),
        getDocs(collection(db, "redemptions")),
        getDocs(collection(db, "prizeWins")),
        getDocs(query(collection(db, "feedPosts"), where("status", "==", "pending"))),
        getDocs(collection(db, "rewards")),
        getDocs(collection(db, "coupons")),
        getDocs(collection(db, "rewardSecrets")),
        getDoc(doc(db, "adminSettings", "notify")).catch(() => null),
      ]);

      const members = {};
      mS.docs.forEach(d => members[d.id] = { uid: d.id, ...d.data() });
      const nameOf = uid => (members[uid] || {}).name || "会员";
      const isInternal = uid => !!(members[uid] && members[uid].internal && members[uid].internal.on);
      const redemptions = rS.docs.map(d => ({ id: d.id, ...d.data() }));
      const wins = wS.docs.map(d => ({ id: d.id, ...d.data() }));

      // 待处理
      todo.rPending.n = redemptions.filter(r => r.status === "pending").length;
      todo.rShip.n = redemptions.filter(r => r.kind === "gift" && (r.status === "approved" || r.status === "problem")).length;
      todo.pClaimed.n = wins.filter(w => w.status === "claimed").length;
      todo.pShip.n = wins.filter(w => w.status === "approved").length;
      todo.feed.n = fS.size;
      renderTodo();

      // 会员（统计不算内部会员）
      const real = Object.values(members).filter(m => !isInternal(m.uid));
      const boundUids = new Set(bS.docs.map(d => d.data().uid));
      const bound = real.filter(m => boundUids.has(m.uid)).length;
      const thisMonth = monthStart(0), lastMonth = monthStart(-1);
      const newThis = real.filter(m => (toDate(m.createdAt) || 0) >= thisMonth).length;
      const newLast = real.filter(m => { const d = toDate(m.createdAt); return d && d >= lastMonth && d < thisMonth; }).length;
      const nInternal = Object.keys(members).length - real.length;
      $("memTotal").innerHTML = `${num(real.length)}<small>人</small>`;
      $("memSub").innerHTML = `本月新增 <b>+${newThis}</b>${newLast ? `（上月 ${newLast}）` : ""}<br>
        已绑定 <b>${real.length ? Math.round(bound / real.length * 100) : 0}%</b>（${bound} 人）${nInternal ? ` · 内部 ${nInternal}` : ""}`;

      // 积分
      const ledgers = {}, redByUid = {};
      lS.docs.forEach(d => { const x = d.data(); (ledgers[x.uid] = ledgers[x.uid] || []).push(x); });
      redemptions.forEach(r => (redByUid[r.uid] = redByUid[r.uid] || []).push(r));
      let spendable = 0, pending = 0, negative = 0;
      real.forEach(m => {
        const b = computeBalance(ledgers[m.uid] || [], redByUid[m.uid] || []);
        spendable += b.spendable; pending += b.pending;
        if (b.spendable < 0) negative++;
      });
      $("ptsTotal").innerHTML = `${num(spendable)}<small>分</small>`;
      $("ptsSub").innerHTML = `待确认 <b>${num(pending)}</b> 分（14 天后入账）${negative ? `<br><span class="down">${negative} 位会员积分是负数</span>` : ""}`;

      // 等级分布
      const tierCount = {};
      real.forEach(m => { const t = TIERS.some(x => x.key === m.tier) ? m.tier : "mochii"; tierCount[t] = (tierCount[t] || 0) + 1; });
      const tTotal = real.length || 1;
      $("tierBar").innerHTML = TIERS.filter(t => tierCount[t.key])
        .map(t => `<span style="flex:${tierCount[t.key]};background:${t.color}" title="${esc(TIER_LABELS[t.key])}：${tierCount[t.key]}"></span>`).join("");
      $("tierLegend").innerHTML = TIERS.map(t => `
        <div><b>${tierCount[t.key] || 0}</b><i style="background:${t.color}"></i>${esc(TIER_LABELS[t.key])}
          <span class="muted">${Math.round((tierCount[t.key] || 0) / tTotal * 100)}%</span></div>`).join("");
      $("tierNote").textContent = "不含内部会员";

      // 本月兑换（不算测试兑换）
      const decided = redemptions.filter(r => !r.test && DONE_STATUSES.includes(r.status));
      const inRange = (r, a, b) => { const d = toDate(r.decidedAt) || toDate(r.createdAt); return d && d >= a && (!b || d < b); };
      const mThis = decided.filter(r => inRange(r, thisMonth));
      const mLast = decided.filter(r => inRange(r, lastMonth, thisMonth));
      const ptsThis = mThis.reduce((s, r) => s + (r.cost || 0), 0);
      const top = {};
      mThis.forEach(r => top[r.rewardName || "?"] = (top[r.rewardName || "?"] || 0) + 1);
      const topName = Object.entries(top).sort((a, b) => b[1] - a[1])[0];
      const diff = mThis.length - mLast.length;
      $("monthCount").innerHTML = `${mThis.length}<small>笔</small>`;
      $("monthSub").innerHTML = `用掉 <b>${num(ptsThis)}</b> 分 · 上月 ${mLast.length} 笔
        ${mLast.length || mThis.length ? `<span class="${diff >= 0 ? "up" : "down"}">${diff >= 0 ? "↑" : "↓"}${Math.abs(diff)}</span>` : ""}
        ${topName ? `<br>最热门：<b>${esc(topName[0])}</b>` : ""}`;

      // 券码与库存：上架中的奖品
      const secrets = {};
      sS.docs.forEach(d => secrets[d.id] = d.data());
      const pool = {};
      cS.docs.forEach(d => { const c = d.data(); if (!c.used) pool[c.rewardId] = (pool[c.rewardId] || 0) + 1; });
      const warn = [];
      rwS.docs.forEach(d => {
        const r = { id: d.id, ...d.data() };
        if (!r.active) return;
        if (r.type === "coupon" && !(secrets[r.id] || {}).couponCode) {
          const left = pool[r.id] || 0;
          if (left < 5) warn.push({ name: r.name, left, unit: "组券码", bad: left === 0 });
        } else if (typeof r.stock === "number" && r.stock <= 3) {
          warn.push({ name: r.name, left: r.stock, unit: "件库存", bad: r.stock <= 0 });
        }
      });
      warn.sort((a, b) => a.left - b.left);
      const activeN = rwS.docs.filter(d => d.data().active).length;
      $("stockBody").innerHTML = warn.length ? `
        <div class="big" style="color:#dc2626">${warn.length}<small>个快用完</small></div>
        <ul class="list" style="margin-top:8px">${warn.slice(0, 4).map(w => `
          <li><span class="nm">${esc(w.name)}</span><span class="tag ${w.bad ? "tag-bad" : "tag-warn"}">剩 ${w.left} ${w.unit}</span></li>`).join("")}</ul>`
        : `<div class="big" style="color:#16a34a">✓</div><div class="sub">${activeN} 个上架奖品，券码和库存都够用</div>`;

      // 最近动态
      const ev = [];
      Object.values(members).forEach(m => { const d = toDate(m.createdAt); if (d) ev.push({ d, ic: "🆕", html: `<a href="member.html?uid=${encodeURIComponent(m.uid)}"><b>${esc(m.name || "新会员")}</b> 注册成为会员</a>` }); });
      redemptions.forEach(r => { const d = toDate(r.createdAt); if (d && !r.test) ev.push({ d, ic: "🎁", html: `<a href="redeem.html${r.status === "pending" ? "#pending" : ""}"><b>${esc(nameOf(r.uid))}</b> 兑换 ${esc(r.rewardName || "")}（${r.cost || 0} 分）</a>` }); });
      wins.forEach(w => { const d = toDate(w.claimedAt); if (d) ev.push({ d, ic: "🏆", html: `<a href="prizes.html${w.status === "claimed" ? "#claimed" : ""}"><b>${esc(nameOf(w.uid))}</b> 领取了 ${esc(w.prizeName || "中奖奖品")}</a>` }); });
      fS.docs.forEach(d => { const p = d.data(), at = toDate(p.createdAt); if (at) ev.push({ d: at, ic: "📰", html: `<a href="feed.html#pending"><b>${esc(p.authorName || nameOf(p.authorUid))}</b> 发了帖子，等你审核</a>` }); });
      ev.sort((a, b) => b.d - a.d);
      $("recentList").innerHTML = ev.length
        ? ev.slice(0, 8).map(e => `<li><span class="ic">${e.ic}</span><span class="nm">${e.html}</span><span class="rt">${ago(e.d)}</span></li>`).join("")
        : `<li class="none">还没有动态</li>`;

      // 本月寿星（生日格式 YYYY-MM-DD）
      const now = new Date(), mm = now.getMonth() + 1, dd = now.getDate();
      const bdays = Object.values(members).map(m => {
        const x = String(m.birthday || "").match(/^\d{4}-(\d{2})-(\d{2})/);
        return x && +x[1] === mm ? { m, day: +x[2] } : null;
      }).filter(Boolean).sort((a, b) => a.day - b.day);
      $("bdayTitle").textContent = `🎂 ${mm} 月寿星`;
      $("bdayCount").innerHTML = `${bdays.length}<small>人</small>`;
      $("bdayList").innerHTML = bdays.length
        ? bdays.slice(0, 4).map(b => `<li><span class="nm">${b.day === dd ? "🎉 " : ""}${esc(b.m.name || "会员")}</span><span class="rt">${b.day === dd ? "今天" : `${mm}/${b.day}`}</span></li>`).join("")
          + (bdays.length > 4 ? `<li class="none">还有 ${bdays.length - 4} 位…</li>` : "")
        : `<li class="none">这个月没有寿星</li>`;

      // 邮件提醒
      const cfg = nS && nS.exists() ? nS.data() : {};
      const evs = cfg.events || {};
      const onN = Object.keys(NOTIFY_DEFAULTS).filter(k => evs[k] ?? NOTIFY_DEFAULTS[k]).length;
      const emails = (cfg.emails || []).length;
      $("notifyCount").innerHTML = `${onN}<small>/ ${Object.keys(NOTIFY_DEFAULTS).length} 项开启</small>`;
      $("notifySub").innerHTML = emails
        ? `寄到 <b>${emails}</b> 个邮箱 · ${cfg.mode === "daily" ? "每天汇总一次" : "马上寄出"}`
        : `<span class="down">还没设定收件邮箱</span>`;

      const t = new Date();
      $("updated").textContent = `更新于 ${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;

      // 得奖者已绑定、还没发奖（要读抽奖网站，比较慢，放最后）
      todo.ready.n = null; renderTodo();
      readyWinners().then(list => { todo.ready.n = list.length; renderTodo(); })
        .catch(e => { console.warn("readyWinners", e); todo.ready.n = 0; renderTodo(); });
    }

    // ---------- 俱乐部开关（和侧边栏同一个开关） ----------
    function watchClub() {
      onSnapshot(doc(db, "settings", "club"), s => {
        const open = s.exists() && s.data().open === true;
        $("clubState").className = "club-state " + (open ? "on" : "off");
        $("clubText").textContent = open ? "开放中" : "维修中";
        $("clubSub").textContent = open ? "会员可以注册、登录和兑换。" : "会员看到「正在装修俱乐部」，无法登录。";
        $("clubBtn").textContent = open ? "关闭俱乐部" : "开放俱乐部";
      });
      $("clubBtn").addEventListener("click", () => $("clubSwitch").click());
    }

    function run() {
      $("reloadBtn").disabled = true;
      load().catch(e => {
        $("errBox").textContent = "载入失败：" + e.message;
        $("errBox").classList.remove("hidden");
      }).finally(() => { $("reloadBtn").disabled = false; });
    }
    $("reloadBtn").addEventListener("click", run);

    renderTodo();
    requireAdmin(user => {
      const h = new Date().getHours();
      const hi = h < 5 ? "夜深了" : h < 12 ? "早安" : h < 18 ? "午安" : "晚上好";
      $("hello").textContent = `📊 总览 · ${hi}${user.displayName ? "，" + user.displayName.split(" ")[0] : ""}`;
      watchClub();
      run();
    });
  </script>
</body>
</html>
