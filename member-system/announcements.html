<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../logo.png">
  <title>会员公告 · 会员系统 Admin</title>
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/theme.js"></script>
  <style>
    .ann-body { white-space: pre-line; color: #334155; font-size: .9rem; margin-top: 6px; }
    .lang-box { background: var(--soft2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .lang-box summary { cursor: pointer; font-size: .88rem; color: var(--text2); font-weight: 600; }
    .lang-box[open] summary { margin-bottom: 12px; }
    .preview { background: #0b1020; color: #e8ecf8; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; display: flex; gap: 10px; }
    .preview .t { font-weight: 600; font-size: .9rem; }
    .preview .d { font-size: .82rem; opacity: .85; white-space: pre-line; }
    .preview .l { font-size: .8rem; color: #ff6fae; font-weight: 700; margin-top: 4px; }
    .preview .tm { font-size: .74rem; color: #8b95b2; margin-top: 2px; }
  </style>
</head>
<body>
  <div id="gate" class="gate"><div class="gate-card"><p>载入中…</p></div></div>

  <div id="app" class="hidden">
    <header id="adminHeader"></header>

    <div class="container">
      <div class="page-head">
        <div>
          <h2>📢 会员公告</h2>
          <p class="muted">发出后，所有会员的 🔔 铃铛马上收到（新品、直播预告、限时兑换等）。公告在铃铛里显示 60 天。</p>
        </div>
      </div>

      <div class="panel">
        <h3>发新公告</h3>
        <form id="annForm">
          <div style="font-size:.85rem;color:var(--text2);margin-bottom:6px">发送对象</div>
          <div class="actions" style="margin:0 0 10px">
            <label class="inline" style="margin:0"><input type="radio" name="aTo" value="all" checked> 👥 全部会员</label>
            <label class="inline" style="margin:0"><input type="radio" name="aTo" value="some"> 🎯 指定会员（可多选 / 只发给自己测试）</label>
          </div>
          <div id="aPickBox" class="hidden" style="margin-bottom:12px"><div id="aPicker"></div></div>
          <label>标题
            <input id="aTitle" required maxlength="60" placeholder="例如：今晚 8 点直播抽奖 🎡">
          </label>
          <label>内容
            <textarea id="aBody" rows="3" maxlength="400" placeholder="例如：新款手链上架！直播间下单再送双倍积分"></textarea>
          </label>
          <label>点开后去哪里（选填）
            <select id="aLinkType">
              <option value="">不加链接</option>
              <option value="shop.html">🛍️ 兑换商城</option>
              <option value="rewards.html">🧾 兑换记录</option>
              <option value="account.html">💎 会员等级</option>
              <option value="points.html">📊 积分明细</option>
              <option value="profile.html">👤 个人资料</option>
              <option value="custom">其他网址（https://…）</option>
            </select>
          </label>
          <label id="aLinkBox" class="hidden">网址
            <input id="aLink" type="url" placeholder="https://www.themochiishop.com/live-stream/">
          </label>

          <details class="lang-box">
            <summary>🌐 英文 / 马来文版本（选填）</summary>
            <p class="muted" style="font-size:.8rem;margin-bottom:10px">没填的话，所有会员都看到上面那一版。有填的话，选英文或马来文的会员会看到对应版本；中文会员看上面那一版。</p>
            <div class="grid2">
              <label>English 标题 <input id="enTitle" maxlength="60"></label>
              <label>Bahasa Melayu 标题 <input id="msTitle" maxlength="60"></label>
              <label>English 内容 <textarea id="enBody" rows="3" maxlength="400"></textarea></label>
              <label>Bahasa Melayu 内容 <textarea id="msBody" rows="3" maxlength="400"></textarea></label>
            </div>
          </details>

          <p class="muted" style="font-size:.8rem;margin-bottom:6px">会员铃铛里看起来像这样：</p>
          <div class="preview">
            <span>📢</span>
            <div>
              <div class="t" id="pvTitle">（标题）</div>
              <div class="d" id="pvBody"></div>
              <div class="l hidden" id="pvLink">查看 ➔</div>
              <div class="tm">刚刚</div>
            </div>
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-primary" id="sendBtn">📢 发给所有会员</button>
          </div>
          <p id="formMsg" class="msg"></p>
        </form>
      </div>

      <div class="page-head" style="margin-top:8px">
        <div><h2 style="font-size:1.1rem">已发出的公告</h2><p class="muted" style="font-size:.8rem">🎯 = 只发给指定会员</p></div>
      </div>
      <div id="list"><p class="empty">载入中…</p></div>
    </div>
  </div>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import {
      collection, getDocs, doc, addDoc, deleteDoc, query, orderBy, limit, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import { requireAdmin, renderAdminNav, logAdmin, esc, toDate, fmtDate } from "./js/admin-common.js";
    import { previewSend, memberPicker, loadMemberIndex } from "./js/send-tools.js";

    const $ = id => document.getElementById(id);
    renderAdminNav("announce");

    const SHOW_DAYS = 60; // 和会员前台 common.js 的 ANNOUNCE_DAYS 一致

    function setMsg(text, type) {
      $("formMsg").textContent = text;
      $("formMsg").className = "msg" + (type ? " " + type : "");
    }

    function linkValue() {
      const v = $("aLinkType").value;
      return v === "custom" ? $("aLink").value.trim() : v;
    }

    function preview() {
      $("pvTitle").textContent = $("aTitle").value.trim() || "（标题）";
      $("pvBody").textContent = $("aBody").value.trim();
      $("pvLink").classList.toggle("hidden", !linkValue());
    }
    ["aTitle", "aBody", "aLink"].forEach(id => $(id).addEventListener("input", preview));
    $("aLinkType").addEventListener("change", () => {
      $("aLinkBox").classList.toggle("hidden", $("aLinkType").value !== "custom");
      $("aLink").required = $("aLinkType").value === "custom";
      preview();
    });

    // 🎯 发送对象：全部会员（announcements）或指定会员（memberMessages，只有收件人读得到）
    const picker = memberPicker($("aPicker"), { onChange: () => paintTo() });
    const toSome = () => document.querySelector('input[name="aTo"]:checked').value === "some";
    function paintTo() {
      $("aPickBox").classList.toggle("hidden", !toSome());
      const n = picker.get().length;
      $("sendBtn").textContent = toSome() ? `🎯 发给 ${n} 位会员` : "📢 发给所有会员";
    }
    document.querySelectorAll('input[name="aTo"]').forEach(r => r.addEventListener("change", paintTo));

    function linkLabel(l) {
      const opt = [...$("aLinkType").options].find(o => o.value === l);
      return opt ? opt.textContent : l;
    }

    async function load() {
      const [snap, mSnap] = await Promise.all([
        getDocs(query(collection(db, "announcements"), orderBy("createdAt", "desc"), limit(50))),
        getDocs(query(collection(db, "memberMessages"), orderBy("createdAt", "desc"), limit(50))).catch(() => ({ docs: [] })),
      ]);
      const rows = [...snap.docs.map(d => ({ id: d.id, col: "announcements", ...d.data() })),
        ...mSnap.docs.map(d => ({ id: d.id, col: "memberMessages", ...d.data() }))]
        .sort((a, b) => (toDate(b.createdAt) || 0) - (toDate(a.createdAt) || 0));
      const idx = rows.some(a => a.col === "memberMessages") ? await loadMemberIndex().catch(() => null) : null;
      const toNames = a => (a.uids || []).map(u => idx && idx.members[u] ? idx.members[u].name || "(没有名字)" : u.slice(0, 6)).join("、");
      const cutoff = new Date(Date.now() - SHOW_DAYS * 86400000);
      $("list").innerHTML = rows.length ? rows.map(a => {
        const at = toDate(a.createdAt);
        const live = at && at >= cutoff;
        const langs = Object.keys(a.i18n || {}).map(k => k === "en" ? "EN" : k === "ms" ? "BM" : k);
        return `
          <div class="item">
            <div class="item-head">
              <div>
                <div class="item-title">${a.col === "memberMessages" ? "🎯" : "📢"} ${esc(a.title)}</div>
                ${a.col === "memberMessages" ? `<div class="meta">发给 ${(a.uids || []).length} 位：${esc(toNames(a))}</div>` : ""}
                <div class="meta">${fmtDate(at, true)} · ${esc(a.by || "")}
                  ${langs.length ? " · 另有 " + langs.join(" / ") + " 版" : ""}
                  ${a.link ? " · 链接：" + esc(linkLabel(a.link)) : ""}</div>
              </div>
              <div>${live ? '<span class="tag tag-ok">铃铛显示中</span>' : '<span class="tag">已超过 60 天</span>'}</div>
            </div>
            ${a.body ? `<div class="ann-body">${esc(a.body)}</div>` : ""}
            <div class="actions">
              <button class="btn btn-ghost owner-only" data-del="${esc(a.id)}" data-col="${a.col}">🗑 删除（会员铃铛也会消失）</button>
            </div>
          </div>`;
      }).join("") : `<p class="empty">还没有公告</p>`;

      $("list").querySelectorAll("[data-del]").forEach(btn => btn.addEventListener("click", async () => {
        if (!window.ownerOnly || !window.ownerOnly()) return; // 只有店主可以删除
        if (!confirm("删除这则公告？会员的铃铛里也会消失。")) return;
        btn.disabled = true;
        try { await deleteDoc(doc(db, btn.dataset.col || "announcements", btn.dataset.del)); logAdmin("content", "删除了一则会员公告", "announcements.html"); await load(); }
        catch (err) { alert("删除失败：" + err.message); btn.disabled = false; }
      }));
    }

    requireAdmin(async user => {
      try { await load(); }
      catch (e) { $("list").innerHTML = `<p class="empty">载入失败：${esc(e.message)}</p>`; }

      $("annForm").addEventListener("submit", async e => {
        e.preventDefault();
        const title = $("aTitle").value.trim();
        const body = $("aBody").value.trim();
        const link = linkValue();
        if (!title) { setMsg("请填写标题", "err"); return; }
        if ($("aLinkType").value === "custom" && !/^https:\/\//i.test(link)) { setMsg("网址要以 https:// 开头", "err"); return; }

        const i18n = {};
        [["en", "enTitle", "enBody"], ["ms", "msTitle", "msBody"]].forEach(([k, ti, bo]) => {
          const tt = $(ti).value.trim(), bb = $(bo).value.trim();
          if (tt || bb) i18n[k] = { title: tt || title, body: bb || body };
        });

        const some = toSome(), uids = picker.get();
        if (some && !uids.length) { setMsg("请选择至少一位会员", "err"); return; }
        if (some && uids.length > 300) { setMsg("一次最多发给 300 位会员", "err"); return; }
        const big = t => `【${t.title || title}】${t.body || body ? "\n" + (t.body || body) : ""}`;
        if (!await previewSend({ title: some ? "发公告给指定会员" : "发公告给所有会员",
          to: some ? `${uids.length} 位：${picker.names()}` : "所有会员",
          rows: [["链接", link ? linkLabel(link) : ""]],
          note: { zh: big({}), en: i18n.en ? big(i18n.en) : "", ms: i18n.ms ? big(i18n.ms) : "" },
          noteLabel: "会员铃铛里看到的公告", warn: "发出后会员的铃铛马上会响。", okText: "📢 确认发出" })) return;
        $("sendBtn").disabled = true;
        try {
          await addDoc(collection(db, some ? "memberMessages" : "announcements"), {
            ...(some ? { uids } : {}),
            title, body, link, i18n,
            by: user.email || "",
            createdAt: serverTimestamp()
          });
          $("annForm").reset();
          picker.clear(); paintTo();
          $("aLinkBox").classList.add("hidden");
          preview();
          setMsg("已发出 ✅", "ok");
          logAdmin("content", `${some ? `发出指定会员公告（${uids.length} 位）` : "发出会员公告"}：${title}`, "announcements.html");
          await load();
        } catch (err) {
          setMsg("发送失败：" + err.message, "err");
        } finally {
          $("sendBtn").disabled = false;
        }
      });
    });
  </script>
</body>
</html>
