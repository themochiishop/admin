<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../logo.png">
  <title>会员管理 · 会员系统 Admin</title>
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/theme.js"></script>
  <style>
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .stat-box .n { font-size: 1.6rem; font-weight: 800; color: var(--ink); }
    .stat-box .l { font-size: .8rem; color: var(--muted); }
    .table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--soft); white-space: nowrap; }
    th { background: var(--soft2); color: var(--text2); font-weight: 600; cursor: pointer; user-select: none; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: var(--pink-bg); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .toolbar input { flex: 1; min-width: 220px; margin: 0; }
    .wa-link { color: var(--green-tx); font-weight: 600; }
    .wa-link:hover { text-decoration: underline; }
    /* 5 栏：会员（绑定账号为主）｜等级｜积分｜联系｜加入 */
    td { white-space: normal; vertical-align: top; }
    .m-acc { font-weight: 800; color: var(--ink); font-size: .95rem; line-height: 1.5; }
    .m-acc2 { font-size: .82rem; color: var(--text2); line-height: 1.5; }
    .m-sm { font-size: .76rem; color: var(--muted); margin-top: 2px; line-height: 1.45; }
    .m-pts { font-weight: 800; font-size: 1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
    .toolbar select { margin: 0; width: auto; }
    @media (max-width: 760px) {
      /* 手机：每位会员一张卡片，不用左右滑 */
      .table-wrap { background: none; border: 0; overflow: visible; }
      table thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tbody tr { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
      td { border: 0; padding: 0; }
      td.c-mem { grid-column: 1; } td.c-pts { grid-column: 2; grid-row: 1; text-align: right; }
      td.c-tier, td.c-contact, td.c-join { grid-column: 1 / -1; }
      td.c-tier .m-sm, td.c-join .m-sm { display: inline; margin-left: 6px; }
    }
  </style>
</head>
<body>
  <div id="gate" class="gate"><div class="gate-card"><p>载入中…</p></div></div>

  <div id="app" class="hidden">
    <header id="adminHeader"></header>

    <div class="container">
      <div class="page-head">
        <div>
          <h2>会员管理</h2>
          <p class="muted">点一行查看会员详情、手动调整积分、管理绑定</p>
        </div>
        <button id="exportBtn" class="btn btn-ghost">⬇ 导出 CSV</button>
      </div>

      <div class="stats-row">
        <div class="stat-box"><div class="n" id="sMembers">-</div><div class="l">会员总数</div></div>
        <div class="stat-box"><div class="n" id="sBound">-</div><div class="l">已绑定账号的会员</div></div>
        <div class="stat-box"><div class="n" id="sAvail">-</div><div class="l">流通中的可用积分</div></div>
        <div class="stat-box"><div class="n" id="sPending">-</div><div class="l">待确认积分</div></div>
      </div>

      <div class="toolbar">
        <input id="search" placeholder="🔍 搜索绑定账号、称呼、手机或电子邮件">
        <select id="sortSel" title="排序">
          <option value="createdAt:-1">加入日期（新 → 旧）</option>
          <option value="createdAt:1">加入日期（旧 → 新）</option>
          <option value="spendable:-1">可用积分（多 → 少）</option>
          <option value="spend12m:-1">近一年消费（多 → 少）</option>
          <option value="tierRank:-1">等级（高 → 低）</option>
          <option value="acct:1">绑定账号（A → Z）</option>
          <option value="name:1">称呼（A → Z）</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-sort="acct">会员（绑定账号 · 称呼）</th>
              <th data-sort="tierRank">等级</th>
              <th data-sort="spendable" class="num">积分</th>
              <th data-sort="phone">联系</th>
              <th data-sort="createdAt">加入</th>
            </tr>
          </thead>
          <tbody id="rows"><tr><td colspan="5" class="empty">载入中…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import {
      requireAdmin, renderAdminNav, esc, toDate, fmtDate, computeBalance, balOf, platformTag,
      TIER_LABELS, TIER_ORDER, fmtPhone, waLink, tierHTML
  } from "./js/admin-common.js";

    const $ = id => document.getElementById(id);
    renderAdminNav("members");

    let rows = [];
    let sortKey = "createdAt", sortDir = -1;

    async function load() {
      const [mS, bS] = await Promise.all([
        getDocs(collection(db, "members")),
        getDocs(collection(db, "bindings")),
      ]);
      // 💰 积分引擎存好的余额（members.bal）；有会员还没有才读全部积分记录、兑换
      const [lS, rS] = mS.docs.some(d => !balOf(d.data()))
        ? await Promise.all([getDocs(collection(db, "pointsLedger")), getDocs(collection(db, "redemptions"))])
        : [null, null];

      const byUid = (snap, withId) => {
        const m = {};
        if (snap) snap.docs.forEach(d => {
          const x = withId ? { id: d.id, ...d.data() } : d.data();
          (m[x.uid] = m[x.uid] || []).push(x);
        });
        return m;
      };
      const bindings = byUid(bS), ledgers = byUid(lS), redemptions = byUid(rS, true);

      rows = mS.docs.map(d => {
        const m = d.data();
        const bal = balOf(m) || computeBalance(ledgers[d.id] || [], redemptions[d.id] || []);
        return {
          uid: d.id,
          name: m.name || "",
          email: m.email || "",
          phone: m.phone || "",
          waOptIn: !!m.waOptIn,
          birthday: m.birthday || "",
          tier: m.tier || "mochii",
          tierRank: TIER_ORDER[m.tier] || 0,
          spend12m: Number(m.spend12m || 0),
          createdAt: toDate(m.createdAt),
          bindings: bindings[d.id] || [],
          spendable: bal.spendable,
          pending: bal.pending,
          internal: !!(m.internal && m.internal.on),
          acct: String(((bindings[d.id] || [])[0] || {}).username || "~").toLowerCase(),   // 排序用：第一个绑定账号（没绑定排最后）
        };
      });

      // 统计不算内部会员
      const real = rows.filter(r => !r.internal);
      const nInternal = rows.length - real.length;
      $("sMembers").textContent = real.length.toLocaleString() + (nInternal ? `（另有内部 ${nInternal}）` : "");
      $("sBound").textContent = real.filter(r => r.bindings.length).length.toLocaleString();
      $("sAvail").textContent = real.reduce((s, r) => s + r.spendable, 0).toLocaleString();
      $("sPending").textContent = real.reduce((s, r) => s + r.pending, 0).toLocaleString();
      render();
    }

    function filtered() {
      const q = $("search").value.trim().toLowerCase();
      const qd = q.replace(/\D/g, "");
      let list = rows;
      if (q) {
        list = rows.filter(r =>
          r.name.toLowerCase().includes(q) ||
          r.email.toLowerCase().includes(q) ||
          (qd.length >= 3 && r.phone.replace(/\D/g, "").includes(qd.replace(/^0/, ""))) ||
          r.bindings.some(b => String(b.username || "").toLowerCase().includes(q)));
      }
      return [...list].sort((a, b) => {
        const x = a[sortKey] ?? "", y = b[sortKey] ?? "";
        return (x > y ? 1 : x < y ? -1 : 0) * sortDir;
      });
    }

    // 一位会员一行：绑定账号（直播间看到的名字）放最前面，称呼放下面
    const acctHTML = b => `${platformTag(b.platform)} @${esc(b.username)}${b.verifyOrder === "admin" ? ' <span class="muted" title="管理员代绑">🛠</span>' : ""}`;
    function render() {
      const list = filtered();
      $("rows").innerHTML = list.length ? list.map(r => `
        <tr data-uid="${esc(r.uid)}">
          <td class="c-mem">${r.bindings.length
              ? `<div class="m-acc">${acctHTML(r.bindings[0])}</div>${r.bindings.slice(1).map(b => `<div class="m-acc2">${acctHTML(b)}</div>`).join("")}`
              : `<div class="m-acc">${esc(r.name || "(未填称呼)")}</div><div class="m-sm">⚠️ 未绑定账号</div>`}
            ${r.bindings.length || r.internal ? `<div class="m-sm">${r.bindings.length ? "称呼 " + esc(r.name || "-") : ""}${r.internal ? ` <span class="tag tag-pink" title="内部会员">🏷️ 内部</span>` : ""}</div>` : ""}</td>
          <td class="c-tier">${tierHTML(r.tier)}<div class="m-sm">近一年 RM ${r.spend12m.toFixed(2)}</div></td>
          <td class="c-pts num"><span class="m-pts">${r.spendable.toLocaleString()}</span> <span class="muted">分</span>${r.pending ? `<div class="m-sm">待确认 ${r.pending.toLocaleString()}</div>` : ""}</td>
          <td class="c-contact">${r.phone
            ? `<a href="${waLink(r.phone)}" target="_blank" class="wa-link" title="打开 WhatsApp">💬 ${esc(fmtPhone(r.phone))}</a>${r.waOptIn ? ' <span class="tag tag-ok" title="同意接收优惠通知">📣</span>' : ""}`
            : '<span class="muted">-</span>'}<div class="m-sm">${esc(r.email)}</div></td>
          <td class="c-join">${fmtDate(r.createdAt)}${r.birthday ? `<div class="m-sm">🎂 ${esc(r.birthday)}</div>` : ""}</td>
        </tr>`).join("") : `<tr><td colspan="5" class="empty">没有符合的会员</td></tr>`;
    }

    $("search").addEventListener("input", render);

    // 排序：上方选单；按表头也可以（再按一次反过来）
    $("sortSel").addEventListener("change", () => { const [k, d] = $("sortSel").value.split(":"); sortKey = k; sortDir = Number(d); render(); });
    document.querySelectorAll("th[data-sort]").forEach(th => {
      th.addEventListener("click", () => {
        const k = th.dataset.sort;
        if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = ["acct", "name"].includes(k) ? 1 : -1; }
        const o = [...$("sortSel").options].find(x => x.value === `${sortKey}:${sortDir}`);
        $("sortSel").value = o ? o.value : $("sortSel").value;
        render();
      });
    });

    $("rows").addEventListener("click", e => {
      const tr = e.target.closest("tr[data-uid]");
      if (tr) location.href = "member.html?uid=" + encodeURIComponent(tr.dataset.uid);
    });

    $("exportBtn").addEventListener("click", () => {
      const head = ["UID", "称呼", "等级", "近一年消费", "WhatsApp", "同意接收优惠", "电子邮件", "绑定账号", "可用积分", "待确认积分", "生日", "加入日期"];
      const csvCell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const lines = [head.map(csvCell).join(",")].concat(filtered().map(r => [
        r.uid, r.name, (TIER_LABELS[r.tier] || r.tier).replace(/^[^\w\u4e00-\u9fff]+\s*/, ""), r.spend12m.toFixed(2), r.phone, r.waOptIn ? "是" : "否", r.email,
        r.bindings.map(b => b.platform + ":" + b.username).join(" / "),
        r.spendable, r.pending, r.birthday, fmtDate(r.createdAt)
      ].map(csvCell).join(",")));
      const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `mochii-members-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    });

    requireAdmin(() => load().catch(e => {
      $("rows").innerHTML = `<tr><td colspan="5" class="empty">载入失败：${esc(e.message)}</td></tr>`;
    }));
  </script>
</body>
</html>
